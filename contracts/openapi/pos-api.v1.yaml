    PaymentsConfirmManualRequest:
      type: object
      required:
      - bankReference
      - receivedAmount
      additionalProperties: false
      description: Тело POST /payments/{id}/confirm-manual (08 §4.9.3, §8). Поля acceptMismatch и reason удалены — в теле → 400 VALIDATION_FAILED.
      properties:
        bankReference:
          type: string
          minLength: 1
          maxLength: 64
          description: Референс / номер из выписки BAKAI Business (обязателен).
          example: BK-77123
        receivedAmount:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Подтверждённая сумма по выписке; ≠ amount → 200 с manual_confirm и warnings[PAYMENT_AMOUNT_MISMATCH].
        receivedAt:
          type: string
          format: date-time
          example: '2026-10-18T09:20:00Z'
        comment:
          type: string
          maxLength: 200
          example: выписка 09:20
    PaymentsCreateRequest:
      type: object
      required:
      - customerId
      - method
      additionalProperties: false
      description: |
        Тело POST /payments (08 §4.9.1). Сумму платежа формирует сервер: из allocation[] (allocationMode=explicit) или из amountRequested (allocationMode=fifo — распределение FIFO по сроку / решает 1С, Q-177). amountRequested не может превышать receivable.balance (иначе 422 VALIDATION_FAILED, rule exceeds_balance; переплата/аванс — Q-012). Клиент не указан или «Розничный покупатель» → 422 CUSTOMER_NOT_IDENTIFIED; снимок долга старше 60 мин и 1С недоступна → 422 RECEIVABLES_STALE (fail-closed, POS-063).
      properties:
        customerId:
          type: string
          format: uuid
        method:
          allOf:
          - $ref: '#/components/schemas/PaymentMethod'
          description: Только cash или qr_bakai; credit → 400 VALIDATION_FAILED (08 §4.9.1).
        allocation:
          type: array
          nullable: true
          maxItems: 500
          description: Явное распределение по документам 1С; null — FIFO (решение 1С, ядро §22.8).
          items:
            $ref: '#/components/schemas/PaymentsAllocationInput'
        amountRequested:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Сумма оплаты долга при распределении FIFO; только для платежа по долгу (не по заказу).
        allocationMode:
          type: string
          enum:
          - explicit
          - fifo
          description: Режим распределения (08 §4.9.1).
        receivedAmount:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Полученные наличные (для расчёта сдачи changeAmount); только method=cash.
        comment:
          type: string
          maxLength: 200
    PaymentsGetResponse:
      description: 'Ответ GET /payments/{id}: Payment + allowedActions (08 §4.9.2).'
      allOf:
      - $ref: '#/components/schemas/Payment'
      - type: object
        required:
        - allowedActions
        properties:
          allowedActions:
            type: array
            items:
              $ref: '#/components/schemas/PaymentsAllowedAction'
    PaymentsQrWebhookAck:
