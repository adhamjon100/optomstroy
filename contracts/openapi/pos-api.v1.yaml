        Сальдо и детализация — только из 1С, с asOf (D-24); backend долг не вычисляет. documents[] — только ?include=documents со step-up. Клиент source=pos, ещё не созданный в 1С (onecStatus ≠ confirmed): 200 с balance: null, asOf: null и reason: not_in_onec (08 §4.11.5) — снимка нет, прочие суммы не передаются (B-AR-06). Клиент 1С, по которому снимка долга ещё нет: 200 с balance: null, overdueAmount: null, asOf: null, isStale: true без reason (08 §3.7 «Уточнения», DEBT-009 — «Нет данных из 1С», не 0 сом).
