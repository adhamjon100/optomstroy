      summary: 1С забирает исходящие документы POS
      description: '08 §4.21.2; 05 §6.3, §6.4, §10.1 (ONEC-063); ядро §22.1. Зеркало POST /pos/v1/orders|payments|customers|returns. Отдаёт элементы onec_outbox в статусе pending и переводит их в sending с арендой leaseUntil = now + 10 мин; без ack по истечении аренды → pending; cancelled не выдаются. Порядок FIFO по created_at; зависимые элементы (платёж после заказа, заказ после нового клиента) не выдаются раньше родителя. Повторный GET до ack возвращает те же элементы тому же токену. Отмена заказа — kind=order, operation=cancel. Ошибки: 400 VALIDATION_FAILED (limit, неизвестный kinds). Аудит не пишется (аренда фиксируется в onec_outbox). Префикс /integrations/onec/* (08 §4.21 «Общее», ядро §16 п.5, §17.4): только вариант C-2 (ONEC_INBOUND_ENABLED=true; иначе 404 NOT_FOUND на всех путях префикса); статус ПРЕДВАРИТЕЛЬНО (Q-031, Q-010, Q-011). Аутентификация — непрозрачный технический токен роли integration (таблица integration_tokens; выпуск и отзыв — скриптом bin/issue_integration_token, срок 180 дней); пользовательский JWT → 403 FORBIDDEN; integration-токен на других путях → 403. allowlist IP магазина обязателен при статическом IP (Q-030). X-Device-Id, X-App-Version, X-Platform не требуются. Тело ≤ 10 MB, иначе 413. Ошибки префикса: 401 UNAUTHENTICATED; 403 FORBIDDEN; 404 NOT_FOUND (C-2 выключен); 409 VERSION_CONFLICT, SYNC_ALREADY_RUNNING; 413 PAYLOAD_TOO_LARGE. Неудачная аутентификация — аудит integration.auth_failed. Cache-Control: no-store.'
      security:
      - integrationToken: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IntegrationsOnecNode'
      - $ref: '#/components/parameters/IntegrationsOnecExtensionVersion'
      - name: kinds
