  /images/{sha}/{size}:
    get:
      operationId: catalog_images_get
      tags:
      - catalog
      summary: Файл изображения (через pos-proxy)
      description: 'Контент-адресуемое фото WebP: sha — SHA-256 исходника (64 hex), size ∈ thumb (160), card (400), full (1200) (D-30). В R1 — без Bearer (URL непредсказуем, данные не ПДн; 08 §2.2, §3.15, 11 SEC-013). Отдаётся Caddy из images/{sha}/{size}.webp; pos-api — только fallback-генерация размера. Rate limit — на уровне Caddy, не API. Коды 08 §2.4 не применяются; 404 — не problem+json. Подписанные URL (?exp=&sig=) — R2, в контракт R1 не входят. Заголовки X-Device-Id, X-App-Version, X-Platform не требуются: проверку выполняет не pos-api, а pos-proxy, и ответ VALIDATION_FAILED здесь невозможен (08 §4.4.7).'
      security: []
      parameters:
      - name: sha
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: size
        in: path
        required: true
        schema:
          type: string
          enum:
          - thumb
          - card
          - full
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Изображение WebP.
          headers:
            Cache-Control:
              description: Неизменяемый контент-адресуемый ресурс (08 §2.8).
              schema:
                type: string
                example: public, max-age=31536000, immutable
            ETag:
              description: '"<sha>-<size>" (08 §4.4.7).'
              schema:
                type: string
                example: '"<sha>-thumb"'
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: If-None-Match совпал с ETag; тела нет.
          headers:
            ETag:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/CatalogImageNotFound'
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
  /integrations/onec/changes:
    post:
      tags:
      - integrations
      operationId: integrations_onec_changes_push
      summary: 1С приносит пакет изменений плана обмена «POS»
      description: '08 §4.21.1; 05 §6.3, §6.4, §10.1 (ONEC-061); ядро §18.1. Зеркало GET /pos/v1/changes. Успешный ответ — только 202 (подтверждение приёма = ack): номер проверен, пакет и запись sync_runs сохранены в одной транзакции; итог применения — в sync_runs/sync_errors по runId. Идемпотентность по (node, messageNumber) относительно последнего принятого номера last, заголовок Idempotency-Key не используется: = last → 202 accepted:false, прежний runId, Idempotent-Replayed: true; < last → 409 VERSION_CONFLICT (rule message_stale, lastMessageNumber); > last (в т. ч. с пропуском) → 202. Применение — воркер по возрастанию messageNumber (upsert по onec_ref). Ошибки: 400 VALIDATION_FAILED (схема; > 1000 объектов; элемент без data и без type: ObjectDeletion); 409 VERSION_CONFLICT (message_stale); 413 (> 10 MB); 500 INTERNAL / 503 — пакет не принят (1С повторит без снятия регистрации). Аудит: sync.prices.applied / sync.stock.applied, sync.run.finished / sync.run.failed (пишет воркер). Префикс /integrations/onec/* (08 §4.21 «Общее», ядро §16 п.5, §17.4): только вариант C-2 (ONEC_INBOUND_ENABLED=true; иначе 404 NOT_FOUND на всех путях префикса); статус ПРЕДВАРИТЕЛЬНО (Q-031, Q-010, Q-011). Аутентификация — непрозрачный технический токен роли integration (таблица integration_tokens; выпуск и отзыв — скриптом bin/issue_integration_token, срок 180 дней); пользовательский JWT → 403 FORBIDDEN; integration-токен на других путях → 403. allowlist IP магазина обязателен при статическом IP (Q-030). X-Device-Id, X-App-Version, X-Platform не требуются. Тело ≤ 10 MB, иначе 413. Ошибки префикса: 401 UNAUTHENTICATED; 403 FORBIDDEN; 404 NOT_FOUND (C-2 выключен); 409 VERSION_CONFLICT, SYNC_ALREADY_RUNNING; 413 PAYLOAD_TOO_LARGE. Неудачная аутентификация — аудит integration.auth_failed. Cache-Control: no-store.'
      security:
      - integrationToken: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IntegrationsOnecNode'
      - $ref: '#/components/parameters/IntegrationsOnecExtensionVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsOnecChangesRequest'
      responses:
        '202':
          description: Пакет принят (или повтор того же номера с accepted:false).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsOnecChangesAccepted'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '500':
          $ref: '#/components/responses/InternalError'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - sync.exchange
      x-roles:
      - integration
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-INTEGRATION
      x-feature-flag: ONEC_INBOUND_ENABLED
      x-status: proposed
