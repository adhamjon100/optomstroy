          x-roles:
          - seller
          - cashier
          - senior_seller
          - admin
          - owner
        onecRef:
          type: string
          format: uuid
          nullable: true
          x-roles:
          - seller
          - cashier
          - senior_seller
          - admin
          - owner
        syncedAt:
          type: string
          format: date-time
          nullable: true
