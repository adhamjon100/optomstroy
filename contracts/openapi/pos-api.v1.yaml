          - $ref: '#/components/schemas/PhoneMasked'
          x-roles:
          - seller
        phones:
          type: array
          items:
            $ref: '#/components/schemas/CustomerPhone'
          x-roles:
          - cashier
          - senior_seller
          - admin
          - owner
          - customer
        inn:
          type: string
          x-roles:
          - cashier
          - senior_seller
          - admin
          - owner
          - customer
        priceList:
          $ref: '#/components/schemas/PriceListRef'
        discountPercent:
          $ref: '#/components/schemas/Percent'
        creditAllowed:
          type: boolean
        hasDebt:
          type: boolean
        isOverdue:
          type: boolean
        receivable:
          allOf:
          - $ref: '#/components/schemas/ReceivableSummary'
          x-roles:
          - cashier
          - senior_seller
          - admin
          - owner
          - customer
        ordersCount:
          type: integer
          minimum: 0
        lastOrderAt:
          type: string
          format: date-time
          nullable: true
        discounts:
          allOf:
          - $ref: '#/components/schemas/CustomersDiscountsResponse'
          description: 'Только при include=discounts и праве discount.rules.read (customer — своя карточка): тот же состав, что ответ GET /customers/{id}/discounts (08 §4.11.6, SCR-35) — B-AR-06, предложение владельцу 08 §3.7.'
