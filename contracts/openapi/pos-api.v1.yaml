# =====================================================================================
# ФАЙЛ СОБРАН АВТОМАТИЧЕСКИ — НЕ РЕДАКТИРОВАТЬ ВРУЧНУЮ.
# Источник: contracts/openapi/parts/*.yaml; сборщик: scripts/build_openapi.py (RM-B-003).
# Правила частей и решения авторов — contracts/openapi/NOTES.md и комментарии в шапках частей.
# Части: 00_root.yaml, 10_auth.yaml, 20_catalog.yaml, 30_cart_orders.yaml, 40_payments_pos_returns.yaml, 50_customers.yaml, 60_sync_admin_ops.yaml
# =====================================================================================
openapi: 3.0.3
info:
  title: Optomstroy POS API
  version: 1.2.0
  description: |
    REST/JSON API pos-api (NestJS) для pos-app (Flutter: Android, Windows, iOS) — сотрудники и (R1, ядро §24.2) клиенты-покупатели, а также входящий обмен 1С (вариант C-2) и вебхук банка (только QR_PROVIDER=bakai, R2). Ошибки — RFC 9457 application/problem+json с машинным полем code (закрытый перечень 08 §2.4). Деньги — строки с 2 знаками + currency KGS; количества — строки с точностью единицы (≤ 3 знаков); время — UTC ISO-8601 с суффиксом Z; идентификаторы — UUID в нижнем регистре. Клиент никогда не передаёт цены, суммы и итоги (08 §2.14). Права проверяются сервером (deny by default).
  contact:
    name: Optomstroy POS team
servers:
- url: https://api.{domain}/api/v1
  description: production (домен — плейсхолдер <домен>, ядро §16 п.1, Q-032)
  variables:
    domain:
      default: <домен>
      description: домен заказчика (Q-032)
- url: https://api-test.{domain}/api/v1
  description: test (домен — плейсхолдер <домен>, Q-032)
  variables:
    domain:
      default: <домен>
      description: домен заказчика (Q-032)
security:
- bearerAuth: []
tags:
- name: auth
  description: 'Вход по OTP, refresh, сессии, step-up, unlock (08 §4.1). Модуль D-06: auth.'
  x-module: auth
- name: registration
  description: 'Регистрация по registration_token, привязка к клиенту 1С (08 §4.2). Модуль D-06: registration.'
  x-module: registration
- name: me
  description: 'Профиль, настройки, PIN, биометрия, согласия — /me* (08 §4.3). Модуль D-06: profile.'
  x-module: profile
- name: catalog
  description: 'Категории, товары, варианты, справочники, изображения, офлайн-выгрузка (08 §4.4, §4.24). Модуль D-06: catalog.'
  x-module: catalog
- name: search
  description: 'Поиск товаров, штрихкодов, подсказки, поиск клиентов (08 §4.5). Модуль D-06: catalog (+search).'
  x-module: catalog
- name: inventory
  description: 'Остатки и пакетная проверка доступности (08 §4.6). Модуль D-06: catalog (+inventory).'
  x-module: catalog
- name: cart
  description: 'Активная и отложенные корзины, скидка, checkout-preview (08 §4.7). Модуль D-06: cart.'
  x-module: cart
- name: orders
  description: 'Заказы, отмена, печатные формы, платежи заказа, привязка к 1С (08 §4.8). Модуль D-06: orders.'
  x-module: orders
- name: payments
  description: 'Платежи, ручное подтверждение QR, аннулирование, вебхук банка (08 §4.9, §6). Модуль D-06: payments.'
  x-module: payments
- name: pos
  description: 'Дашборд кассира /pos/dashboard (08 §4.10). Модуль D-06: payments (11 §4.3 №39).'
  x-module: payments
- name: customers
  description: 'Клиенты, история, долг, скидки клиента, привязки (08 §4.11). Модуль D-06: customers.'
  x-module: customers
- name: receivables
  description: 'Просроченные долги (08 §4.12.1). Модуль D-06: customers (+receivables).'
  x-module: customers
- name: discounts
  description: 'Правила скидок и потолок роли (08 §4.12.2). Модуль D-06: customers (+discounts).'
  x-module: customers
- name: favorites
  description: 'Избранные товары и клиенты (08 §4.13). Модуль D-06: customers (+favorites).'
  x-module: customers
- name: transactions
  description: 'Журнал операций, read-model (08 §4.14). Модуль D-06: transactions.'
  x-module: transactions
- name: returns
  description: 'Заявки на возврат (08 §4.15). Модуль D-06: returns.'
  x-module: returns
- name: notifications
  description: 'Центр in-app уведомлений (08 §4.16). Модуль D-06: notifications.'
  x-module: notifications
- name: sync
  description: 'Статус синхронизации, ручной запуск, очередь outbox (08 §4.17). Модуль D-06: sync.'
  x-module: sync
- name: admin
  description: 'Пользователи, роли, приглашения, лимиты скидок, настройки, аудит, отчёты (08 §4.18). Модуль D-06: admin.'
  x-module: admin
- name: health
  description: 'Liveness/readiness и /openapi.json (08 §4.19). Модуль D-06: health.'
  x-module: health
- name: integrations
  description: 'Входящий обмен 1С /integrations/onec/* (вариант C-2, 08 §4.21) и push-DLR SMSPro (08 §4.22). Модули D-06: sync, auth.'
  x-module: sync
- name: settings
  description: 'Публичные настройки и флаги функций /settings/public (08 §4.23). Модуль D-06: admin (settings).'
  x-module: admin
paths:
  /admin/audit-logs:
    get:
      tags:
      - admin
      operationId: admin_audit_logs_list
      summary: Журнал аудита
      description: '08 §4.18.7; D-36; ядро §19.2, §19.4, §20.2 п.15; API-118, API-134. audit.read (admin, owner). admin видит строки без финансовых before/after значений (маскируются, например after.amount="***" для payment.*; 11 SEC-083), owner — полностью. from и to обязательны, период ≤ 366 дней. chainOk=false — нарушение хэш-цепочки prev_hash/row_hash (строка подсвечивается на SCR-47). Ответ — Page<AuditRow>. Ошибки: 400 VALIDATION_FAILED (from/to обязательны, limit, cursor, result вне enum); 401; 403 FORBIDDEN; 422 VALIDATION_FAILED (rule date_range — период > 366 дней или from > to). Само чтение аудита пишется в аудит (audit.viewed). Все операции модуля admin — permission по 08 §9 / 11 §4.4; изменения — аудит с before/after (08 §4.18). Cache-Control: no-store.'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: entityType
        in: query
        required: false
        description: Тип объекта аудита (audit_logs.entity_type).
        schema:
          type: string
          maxLength: 64
      - name: entityId
        in: query
        required: false
        description: Идентификатор объекта аудита.
        schema:
          type: string
          maxLength: 64
      - name: actorId
        in: query
        required: false
        description: Пользователь-актор (users.id).
        schema:
          type: string
          format: uuid
      - name: action
        in: query
        required: false
        description: Префикс имени события аудита (словарь 11 §7.2), например payment.
        schema:
          type: string
          maxLength: 100
          example: payment.
      - name: from
        in: query
        required: true
        description: Начало периода (UTC), обязательно; период ≤ 366 дней (rule date_range).
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: true
        description: Конец периода (UTC), обязательно.
        schema:
          type: string
          format: date-time
      - name: result
        in: query
        required: false
        description: Результат операции — значения CHECK audit_logs.result (07 §6.1.1).
        schema:
          type: string
          enum:
          - ok
          - denied
          - error
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page<AuditRow>.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AuditRow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - audit.read
      x-roles:
      - admin
      - owner
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-ADMIN
  /admin/discount-limits:
    get:
      tags:
      - admin
      operationId: admin_discount_limits_get
      summary: Лимиты ручной скидки по ролям
      description: '08 §4.18.5. settings.app.read (admin, owner). Значения — [НЕ ПОДТВЕРЖДЕНО: Q-015]. Ошибки: 401; 403 FORBIDDEN. Все операции модуля admin — permission по 08 §9 / 11 §4.4; изменения — аудит с before/after (08 §4.18). Cache-Control: no-store.'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: AdminDiscountLimits.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDiscountLimits'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - settings.app.read
      x-roles:
      - admin
      - owner
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-ADMIN
    put:
      tags:
      - admin
      operationId: admin_discount_limits_update
      summary: Изменить лимиты ручной скидки по ролям (полная замена)
      description: '08 §4.18.5. settings.discount_limits.update — только admin, step-up (operation settings.discount_limits.update). Значения должны совпадать с «Правилами продаж» 1С, иначе 1С отклонит заказ (R7 §4.3). Повтор того же тела → 200 без изменений. Ошибки: 400 VALIDATION_FAILED (percent_range); 401; 403 FORBIDDEN, STEP_UP_REQUIRED; 409 VERSION_CONFLICT; 422 VALIDATION_FAILED. Аудит discount.limits_changed (before/after) [D-36]. Все операции модуля admin — permission по 08 §9 / 11 §4.4; изменения — аудит с before/after (08 §4.18). Cache-Control: no-store.'
      security:
      - bearerAuth: []
        stepUpToken: []
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminDiscountLimitsUpdateRequest'
      responses:
        '200':
          description: AdminDiscountLimits (с updatedAt, updatedBy).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminDiscountLimits'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - settings.discount_limits.update
      x-roles:
      - admin
      x-step-up: true
      x-step-up-operation:
      - settings.discount_limits.update
      x-idempotent: true
      x-rate-limit-group: RL-ADMIN
  /admin/invitations:
    get:
      tags:
      - admin
      operationId: admin_invitations_list
      summary: Приглашения сотрудников
      description: '08 §4.18.4. users.read (admin, owner). Ответ — Page<Invitation>. Ошибки: 400 VALIDATION_FAILED (limit, cursor); 401; 403 FORBIDDEN. Все операции модуля admin — permission по 08 §9 / 11 §4.4; изменения — аудит с before/after (08 §4.18). Cache-Control: no-store.'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Cursor'
      responses:
        '200':
          description: Page<Invitation>.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - users.read
      x-roles:
      - admin
      - owner
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-ADMIN
    post:
      tags:
      - admin
      operationId: admin_invitations_create
      summary: Создать приглашение сотрудника по телефону и ролям
      description: '08 §4.18.4; D-07; ядро §24.2 (сотрудники не регистрируются сами; «супер-админ» = admin, Q-303); 11 SEC-136. invitations.manage — только admin, step-up (operation invitations.manage). Эквивалент POST /admin/users без создания пользователя. Если телефон уже принадлежит аккаунту pending_activation — приглашение применяется сразу: аккаунт → active, kind=staff с ролями приглашения, приглашение status=accepted, ответ 201 содержит appliedToUserId. Номер действующего customer — 409 PHONE_ALREADY_REGISTERED (reason: customer_account; 08 §4.18.4 п. 2, 11 SEC-136 п. 4, Q-312). expiresAt по умолчанию — 30 дней (Q-141). Ошибки: 400 VALIDATION_FAILED (схема, idempotency_key_required); 401; 403 FORBIDDEN (reason: owner_role_reserved; reason: role_not_invitable — роль вне seller, cashier, senior_seller), STEP_UP_REQUIRED; 409 PHONE_ALREADY_REGISTERED (активный staff — роли меняются через PUT /admin/users/{id}/roles; reason: customer_account — номер действующего customer), IDEMPOTENCY_IN_PROGRESS; 422 VALIDATION_FAILED (rule max_items — больше одной роли; rule required — нет fullName), IDEMPOTENCY_KEY_REUSED. Аудит invitation.created (+ user.activated, user.role_changed при немедленном применении). Все операции модуля admin — permission по 08 §9 / 11 §4.4; изменения — аудит с before/after (08 §4.18). Cache-Control: no-store.'
      security:
      - bearerAuth: []
        stepUpToken: []
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminInvitationsCreateRequest'
      responses:
        '201':
          description: 'Приглашение создано: Invitation.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - invitations.manage
      x-roles:
      - admin
      x-step-up: true
      x-step-up-operation:
      - invitations.manage
      x-idempotent: required
      x-rate-limit-group: RL-ADMIN
  /admin/invitations/{id}:
    delete:
      tags:
      - admin
      operationId: admin_invitations_revoke
      summary: Отозвать приглашение
      description: '08 §4.18.4; ядро §17.4. invitations.manage — только admin, step-up (operation invitations.manage). DELETE идемпотентен: повтор → 204. Ошибки: 401; 403 FORBIDDEN, STEP_UP_REQUIRED; 404 NOT_FOUND. Аудит invitation.revoked. Все операции модуля admin — permission по 08 §9 / 11 §4.4; изменения — аудит с before/after (08 §4.18). Cache-Control: no-store.'
      security:
      - bearerAuth: []
        stepUpToken: []
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/StepUpToken'
      - $ref: '#/components/parameters/IdPath'
      responses:
        '204':
          description: Приглашение отозвано.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - invitations.manage
      x-roles:
      - admin
      x-step-up: true
      x-step-up-operation:
      - invitations.manage
      x-idempotent: false
      x-rate-limit-group: RL-ADMIN
  /admin/reports/qr-reconciliation:
    get:
      tags:
      - admin
      operationId: admin_reports_qr_reconciliation_get
      summary: 'Отчёт: сверка QR-оплат'
      description: '08 §4.18.8; ядро §22.2, §22.13 п.3, §24.4; R7 §3.3. reports.qr_reconciliation.read (admin, owner). Основа ежедневной сверки QR с выпиской: подтверждения от провайдера (при QR_PROVIDER=onec — подтверждение от 1С, ядро §24.4) и ручные подтверждения; платежи manual_confirm с reviewReason и bankAmount. Ответ R1 — только application/json; данные — по POS (source: pos). Ошибки: 400 VALIDATION_FAILED; 401; 403 FORBIDDEN (нет права; format=csv в R1); 422 VALIDATION_FAILED (rule date_range — период > 366 дней). Аудит report.viewed (name, period) — финансовые данные [D-36]. Все операции модуля admin — permission по 08 §9 / 11 §4.4; изменения — аудит с before/after (08 §4.18). Cache-Control: no-store.'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: from
        in: query
        required: false
        description: Начало периода (UTC); период ≤ 366 дней (rule date_range).
        schema:
          type: string
          format: date-time
      - name: to
        in: query
        required: false
        description: Конец периода (UTC).
        schema:
          type: string
          format: date-time
      - name: status
        in: query
        required: false
        description: Фильтр строк сверки (08 §4.18.8).
        schema:
          type: string
          enum:
          - all
          - unmatched
          - manual
          default: all
      - name: format
        in: query
        required: false
