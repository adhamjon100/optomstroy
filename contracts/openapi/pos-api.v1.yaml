          type: array
          items:
            type: string
          x-roles:
          - cashier
          - senior_seller
          - admin
          - owner
          - customer
        contacts:
          type: array
          items:
            $ref: '#/components/schemas/CustomerContact'
          x-roles:
          - cashier
          - senior_seller
          - admin
          - owner
          - customer
        links:
          type: array
          items:
            $ref: '#/components/schemas/CustomerLink'
          x-roles:
          - admin
          - owner
          - customer
        isFavorite:
          type: boolean
          x-roles:
          - cashier
          - senior_seller
          - admin
          - owner
        source:
          allOf:
          - $ref: '#/components/schemas/CustomerSource'
          x-roles:
          - seller
          - cashier
          - senior_seller
          - admin
          - owner
        onecStatus:
          allOf:
