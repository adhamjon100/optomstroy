      - $ref: '#/components/parameters/Cursor'
      - name: sort
        in: query
        required: false
        description: Сортировка (08 §4.14.1); неизвестное значение → 400 VALIDATION_FAILED rule sort_field.
        schema:
          type: string
          enum:
          - occurredAt:desc
          - amount:desc
          default: occurredAt:desc
      responses:
        '200':
          description: Page<Transaction> + summary по фильтру (только transactions.read.all).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/Transaction'
                    summary:
                      allOf:
                      - $ref: '#/components/schemas/TransactionsSummary'
                      x-roles:
                      - cashier
                      - senior_seller
                      - admin
                      - owner
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /transactions/{id}:
    get:
      operationId: transactions_get
      tags:
      - transactions
      summary: Транзакция и связанные документы
      description: |
        08 §4.14.2 (SCR-37). Права transactions.read.all (cashier, senior_seller, admin, owner) или transactions.read.own (seller — по своим заказам); блок audit[] — только audit.read. related[] заполнен полностью (заказ, платёж, заявка на возврат, документ 1С). Аудит: audit.viewed — при непустом audit[] (чтение журнала аудита, 11 SEC-073); иначе не пишется. Ошибки: 404 NOT_FOUND (чужая для seller); общие (08 §4).
      x-permissions:
      - transactions.read.own
      - transactions.read.all
      - audit.read
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Transaction с полным related[] + audit[] (только audit.read).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransactionsDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
components:
  schemas:
    AdminDiscountLimits:
      type: object
