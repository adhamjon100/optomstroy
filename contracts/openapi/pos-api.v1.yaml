      description: |
        Клиент — НАДМНОЖЕСТВО полей (08 §3.7). Сервер сериализует по allowlist роли (field-level, ASVS 8.2.3): поля, не разрешённые роли, ОТСУТСТВУЮТ (а не null). Разрешённые роли поля — расширение x-roles; отсутствие x-roles — поле видят все роли. Строгие представления по ролям — CustomerViewSeller, CustomerViewCashier, CustomerViewAdmin, CustomerViewSelf. В списках (GET /customers, /search/customers, /favorites/customers, Cart.customer, Order.customer) receivable не отдаётся — только флаги hasDebt/isOverdue.
