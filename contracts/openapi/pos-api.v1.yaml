          type: string
          format: uuid
          nullable: true
        customer:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/RegistrationMatchedCustomer'
        nextStep:
          type: string
          enum:
          - confirm_or_reject
          - wait_admin
          - confirmed
          - none
