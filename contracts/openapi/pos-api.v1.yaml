      summary: Вебхук банка о зачислении — только QR_PROVIDER=bakai (R2; контракт банка НЕ ПОДТВЕРЖДЁН, Q-014)
      description: |
        08 §4.9.5, §6. Маршрут регистрируется только при QR_PROVIDER=bakai (R2, ядро §24.4) и QR_WEBHOOK_ENABLED=true (ядро §17.7; 13 RM-F-014); при QR_PROVIDER=onec (основной R1) и none → 404 NOT_FOUND, оплату подтверждает 1С (§6.1) или кассир (POST /payments/{id}/confirm-manual). Вызывает только банк: пользовательских ролей нет, Authorization: Bearer не используется; аутентификация — подпись тела X-Signature = HMAC-SHA256(secret, timestamp + "." + rawBody) + X-Timestamp (±5 мин) — ИЛИ mTLS, ИЛИ Basic/API-key + allowlist IP, по возможностям банка (секрет — QR_WEBHOOK_SECRET_FILE). Провал подписи → 401 WEBHOOK_SIGNATURE_INVALID (минимальное тело); IP вне QR_WEBHOOK_ALLOWED_IPS → 403 FORBIDDEN (обязательная проверка в pos-api, ядро §18.2 п.13); 429 RATE_LIMITED; 5xx — только при недоступной БД (банк повторит). Бизнес-расхождения ошибкой не являются: 200, платёж → manual_confirm с reviewReason (amount_mismatch, unknown_reference, late_payment) или запись сверки. Идемпотентность — по (reference, eventId) в payment_webhook_events: повтор → 200 без побочных эффектов (заголовок Idempotency-Key не применяется). Ответ всегда быстрый (≤ 2 с), обработка — в фоне. Тело — ПРЕДПОЛОЖЕНИЕ для проектирования. Аудит payment.webhook_rejected / payment.webhook_received / payment.received (confirmationKind=webhook).
      security:
      - webhookSignature: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-feature-flag: QR_PROVIDER=bakai
      x-status: proposed
      x-rate-limit-group: RL-WEBHOOK
      parameters:
      - name: X-Timestamp
        in: header
        required: false
        description: 'Метка времени подписи (вариант (а) 08 §6, допуск ±5 мин — защита от replay). [НЕ ПОДТВЕРЖДЕНО: контракт банка, Q-014]'
        schema:
          type: string
          maxLength: 64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentsQrWebhookEvent'
      responses:
        '200':
          description: Принято (идемпотентно), включая неизвестный референс и расхождение суммы.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsQrWebhookAck'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /payments/{id}:
    get:
      tags:
      - payments
      operationId: payments_get
      summary: Платёж (с допустимыми действиями; опрос статуса QR)
      description: |
        08 §4.9.2. payment.read.all (cashier, senior_seller, owner) — любой платёж; payment.read.own — seller (платёж своего заказа, без externalRef) и customer (свой платёж). admin → 403 FORBIDDEN (11 §4.4, SEC-036). Чужой платёж при payment.read.own → 404 NOT_FOUND. Поле qr сериализуется только при payment.qr.show (08 §3.15). refreshStatus=true — для qr_shown/qr_expired синхронно опросить провайдера QR: при QR_PROVIDER=onec — метод 1С GET /pos/v1/payments/{externalId}/status (таймаут ONEC_SYNC_CHECK_TIMEOUT_MS; при недоступности 1С — текущее состояние + warnings[STALE_DATA], ядро §24.4); при bakai (R2) — [НЕ ПОДТВЕРЖДЕНО: Q-014]. Для qr_shown клиент опрашивает каждые 3 с до expiresAt либо long-polling ?wait=25 (сервер держит запрос до N с и отвечает при смене статуса; необходимость — Q-167). Cache-Control: no-store. Аудит не пишется.
      security:
      - bearerAuth: []
      x-permissions:
      - payment.read.all
      - payment.read.own
      x-roles:
      - seller
      - cashier
      - senior_seller
      - owner
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - name: refreshStatus
        in: query
        required: false
        description: true — для qr_shown/qr_expired синхронно опросить провайдера QR (08 §4.9.2, §6.1).
        schema:
          type: boolean
          default: false
      - name: wait
        in: query
        required: false
        description: 'Long-polling, секунды 1…25 (ядро §17.4; Q-167): не более одного ожидающего запроса на платёж и пользователя; вне диапазона → 400 VALIDATION_FAILED.'
        schema:
          type: integer
          minimum: 1
          maximum: 25
