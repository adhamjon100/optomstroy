      type: object
      required:
      - status
      - apiVersion
      - serverTime
      description: 'GET /health (08 §4.19.1): только это, без версий компонентов.'
      properties:
        status:
          type: string
          enum:
          - ok
        apiVersion:
          type: string
          example: '1.0'
        serverTime:
          type: string
          format: date-time
    HealthReadiness:
      type: object
      required:
      - status
      - checks
      description: GET /health/ready 200 (08 §4.19.1).
      properties:
        status:
          type: string
          enum:
          - ok
          - degraded
        checks:
          type: object
          properties:
            db:
              type: string
              example: ok
            worker:
              type: string
              example: ok
            onec:
              type: object
              properties:
                status:
                  type: string
                  enum:
                  - ok
                  - unreachable
                  - degraded
                reasons:
                  type: array
                  items:
                    type: string
                    enum:
                    - consecutive_errors
                    - manual_orders_sla
                    - price_list_config
                    - inbound_silent
                    - api_incompatible
                  description: consecutive_errors — consecutiveErrors ≥ 3 у сущности; manual_orders_sla — заказ фазы 0 старше MANUAL_ORDER_SLA_MIN; price_list_config — роль без вида цены; inbound_silent — в C-2 нет ping дольше 2× периода; api_incompatible — несовместимая версия API расширения (сущности paused).
            sync:
              type: object
              properties:
                stockAgeSec:
                  type: integer
                  minimum: 0
                stale:
                  type: boolean
            sms:
              type: string
              enum:
              - ok
              - circuit_open
    HealthReadinessFailed:
      type: object
      required:
      - status
      description: GET /health/ready 503 — не problem+json (08 §4.19.1).
      properties:
        status:
          type: string
          enum:
          - failed
