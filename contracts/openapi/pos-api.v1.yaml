        overrideRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleCode'
        rowVersion:
          type: integer
          minimum: 0
        updatedAt:
          type: string
          format: date-time
          nullable: true
        updatedBy:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/UserRef'
    AdminDiscountLimitsByRole:
      type: object
      required:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      additionalProperties: false
      description: 'Лимит ручной скидки по ролям (role_discount_limits; значения — [НЕ ПОДТВЕРЖДЕНО: Q-015], 08 §4.18.5).'
      properties:
        seller:
          $ref: '#/components/schemas/Percent'
        cashier:
          $ref: '#/components/schemas/Percent'
        senior_seller:
          $ref: '#/components/schemas/Percent'
        admin:
          $ref: '#/components/schemas/Percent'
        owner:
          $ref: '#/components/schemas/Percent'
    AdminDiscountLimitsUpdateRequest:
      type: object
      required:
      - limits
      - overrideRoles
      - rowVersion
      additionalProperties: false
      description: 'Тело PUT /admin/discount-limits (08 §4.18.5): полная замена по rowVersion.'
      properties:
        limits:
          $ref: '#/components/schemas/AdminDiscountLimitsByRole'
        overrideRoles:
          type: array
          maxItems: 7
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCode'
          description: 'Роли, подтверждающие скидку сверх лимита (пример 08: senior_seller, admin).'
        rowVersion:
          type: integer
          minimum: 0
    AdminEmergencyLoginCode:
