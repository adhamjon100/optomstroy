  /integrations/onec/outbox/{outboxId}/ack:
    post:
      tags:
      - integrations
      operationId: integrations_onec_outbox_ack
      summary: 1С подтверждает или отклоняет документ из outbox
      description: '08 §4.21.3; 05 §10.1 (ONEC-063), SYNC-045, ONEC-039; ядро §22.1. result=confirmed → onec_outbox.status=sent (confirmed — только после чтения документа через /changes или /order-status), заказ получает onec_ref/номер/дату; recalculated=true + totals → orders.onec_total, totalsDiffer и уведомление автора; result=rejected → failed + orders.status=submit_failed + уведомление sync_error; result=retry → pending с attempts+1 и nextAttemptAt по графику 1, 2, 5, 15, 60 мин (далее каждые 60 мин); при исчерпании OUTBOX_MAX_ATTEMPTS (20) или OUTBOX_MAX_AGE_HOURS (24) → dead + алерт; POS_E_DUPLICATE по тому же externalId — как confirmed → sent. Идемпотентность: повтор ack с тем же result для элемента в финальном статусе → 200 без изменений; ack с другим onecRef для элемента не в sending/pending → 409 VERSION_CONFLICT + запись sync_errors. Ошибки: 400 VALIDATION_FAILED (схема); 404 NOT_FOUND (неизвестный outboxId); 409 VERSION_CONFLICT (противоречивый ack); 422 VALIDATION_FAILED (confirmed без onecRef/onecNumber; recalculated=true без totals). Аудит outbox.confirmed / outbox.rejected, outbox.dead; для return_request — также return.status_changed. Префикс /integrations/onec/* (08 §4.21 «Общее», ядро §16 п.5, §17.4): только вариант C-2 (ONEC_INBOUND_ENABLED=true; иначе 404 NOT_FOUND на всех путях префикса); статус ПРЕДВАРИТЕЛЬНО (Q-031, Q-010, Q-011). Аутентификация — непрозрачный технический токен роли integration (таблица integration_tokens; выпуск и отзыв — скриптом bin/issue_integration_token, срок 180 дней); пользовательский JWT → 403 FORBIDDEN; integration-токен на других путях → 403. allowlist IP магазина обязателен при статическом IP (Q-030). X-Device-Id, X-App-Version, X-Platform не требуются. Тело ≤ 10 MB, иначе 413. Ошибки префикса: 401 UNAUTHENTICATED; 403 FORBIDDEN; 404 NOT_FOUND (C-2 выключен); 409 VERSION_CONFLICT, SYNC_ALREADY_RUNNING; 413 PAYLOAD_TOO_LARGE. Неудачная аутентификация — аудит integration.auth_failed. Cache-Control: no-store.'
      security:
      - integrationToken: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IntegrationsOnecNode'
      - $ref: '#/components/parameters/IntegrationsOnecExtensionVersion'
      - name: outboxId
        in: path
        required: true
        description: Идентификатор элемента очереди onec_outbox.id (в 1С ключом не является; ключ — externalId, 08 §2.7).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsOnecOutboxAckRequest'
      responses:
        '200':
          description: Новый статус элемента outbox.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsOnecOutboxAckResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - sync.exchange
      x-roles:
      - integration
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-INTEGRATION
      x-feature-flag: ONEC_INBOUND_ENABLED
      x-status: proposed
  /integrations/onec/ping:
    get:
      tags:
      - integrations
      operationId: integrations_onec_ping
      summary: Проверка токена, часов и совместимости версий
      description: '08 §4.21.5; 05 §10.1 (ONEC-064), SYNC-064, ONEC-095; ядро §22.8. 1С сообщает своё состояние query-параметрами (без ПДн; неизвестные параметры игнорируются); backend обновляет sync_node_state, сверяет совместимость apiVersion (при несовместимости сущности paused, /health/ready → degraded) и возвращает serverTime для контроля расхождения часов (пакеты с generatedAt, отличающимся более чем на 5 мин, принимаются с предупреждением в sync_errors). В C-2 заменяет GET /pos/v1/health для /health/ready. Ошибки: 401 UNAUTHENTICATED / 403 FORBIDDEN при неверном токене (аудит integration.auth_failed); успешный вызов не аудируется. Префикс /integrations/onec/* (08 §4.21 «Общее», ядро §16 п.5, §17.4): только вариант C-2 (ONEC_INBOUND_ENABLED=true; иначе 404 NOT_FOUND на всех путях префикса); статус ПРЕДВАРИТЕЛЬНО (Q-031, Q-010, Q-011). Аутентификация — непрозрачный технический токен роли integration (таблица integration_tokens; выпуск и отзыв — скриптом bin/issue_integration_token, срок 180 дней); пользовательский JWT → 403 FORBIDDEN; integration-токен на других путях → 403. allowlist IP магазина обязателен при статическом IP (Q-030). X-Device-Id, X-App-Version, X-Platform не требуются. Тело ≤ 10 MB, иначе 413. Ошибки префикса: 401 UNAUTHENTICATED; 403 FORBIDDEN; 404 NOT_FOUND (C-2 выключен); 409 VERSION_CONFLICT, SYNC_ALREADY_RUNNING; 413 PAYLOAD_TOO_LARGE. Неудачная аутентификация — аудит integration.auth_failed. Cache-Control: no-store.'
      security:
      - integrationToken: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IntegrationsOnecNode'
      - $ref: '#/components/parameters/IntegrationsOnecExtensionVersion'
      - name: extensionVersion
        in: query
        required: false
        description: Версия расширения onec-extension.
        schema:
          type: string
          maxLength: 50
      - name: apiVersion
        in: query
        required: false
        description: Версия API расширения (сверка совместимости, 05 ONEC-095).
        schema:
          type: string
          maxLength: 20
      - name: platformVersion
        in: query
        required: false
        description: Версия платформы 1С.
        schema:
          type: string
          maxLength: 50
      - name: configVersion
        in: query
        required: false
        description: Версия конфигурации 1С.
        schema:
          type: string
          maxLength: 50
      - name: serverTime
        in: query
        required: false
        description: Время сервера 1С (UTC).
        schema:
          type: string
          format: date-time
      - name: registrationBacklog
        in: query
        required: false
        description: Число незарегистрированных к отправке изменений плана обмена.
        schema:
          type: integer
          minimum: 0
      - name: lastMessageNumber
        in: query
        required: false
        description: Последний отправленный 1С номер сообщения.
        schema:
          type: integer
          format: int64
          minimum: 0
      responses:
        '200':
          description: Состояние backend для узла обмена.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsOnecPingResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - sync.exchange
      x-roles:
      - integration
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-INTEGRATION
      x-feature-flag: ONEC_INBOUND_ENABLED
      x-status: proposed
  /integrations/onec/snapshots/{entity}:
    post:
      tags:
      - integrations
      operationId: integrations_onec_snapshots_push
      summary: 1С присылает страницу полного среза остатков, цен или долгов
      description: '08 §4.21.6; 05 §10.1 (ONEC-062), SYNC-014…016; ядро §17.4. Зеркало полной выгрузки (fetchAll/reconcile) для C-2: срез применяется атомарно после последней страницы; неполный срез не меняет текущий снимок; не все страницы за 30 мин → прогон partial, прежний снимок сохраняется. Идемпотентность по (entity, snapshotAt, page): повтор страницы → 200 с тем же результатом без повторного учёта. Ошибки: 400 VALIDATION_FAILED (схема, entity вне stock|prices|receivables); 409 VERSION_CONFLICT (страница среза старше уже применённого snapshotAt); 413 (> 10 MB); 422 VALIDATION_FAILED (страница вне 1…pages; snapshotAt в будущем более чем на 5 мин). Аудит в audit_logs не пишется; прогон — sync_runs (source=inbound), ошибки строк — sync_errors. Префикс /integrations/onec/* (08 §4.21 «Общее», ядро §16 п.5, §17.4): только вариант C-2 (ONEC_INBOUND_ENABLED=true; иначе 404 NOT_FOUND на всех путях префикса); статус ПРЕДВАРИТЕЛЬНО (Q-031, Q-010, Q-011). Аутентификация — непрозрачный технический токен роли integration (таблица integration_tokens; выпуск и отзыв — скриптом bin/issue_integration_token, срок 180 дней); пользовательский JWT → 403 FORBIDDEN; integration-токен на других путях → 403. allowlist IP магазина обязателен при статическом IP (Q-030). X-Device-Id, X-App-Version, X-Platform не требуются. Тело ≤ 10 MB, иначе 413. Ошибки префикса: 401 UNAUTHENTICATED; 403 FORBIDDEN; 404 NOT_FOUND (C-2 выключен); 409 VERSION_CONFLICT, SYNC_ALREADY_RUNNING; 413 PAYLOAD_TOO_LARGE. Неудачная аутентификация — аудит integration.auth_failed. Cache-Control: no-store.'
      security:
      - integrationToken: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/IntegrationsOnecNode'
      - $ref: '#/components/parameters/IntegrationsOnecExtensionVersion'
      - name: entity
        in: path
        required: true
        description: Сущность среза (подмножество sync_entity 07 §6.1, 08 §4.21.6); иное → VALIDATION_FAILED.
        schema:
          type: string
          enum:
          - stock
          - prices
          - receivables
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationsOnecSnapshotRequest'
      responses:
        '200':
          description: 'Страница принята; на последней странице — applied: true и counts.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationsOnecSnapshotResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - sync.exchange
      x-roles:
      - integration
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-INTEGRATION
      x-feature-flag: ONEC_INBOUND_ENABLED
      x-status: proposed
  /integrations/smspro/dlr:
    post:
      tags:
      - integrations
      operationId: integrations_smspro_dlr_receive
      summary: Отчёт о доставке SMS от SMSPro (push-DLR)
      description: '08 §4.22.1; ядро §17.4, §17.7; 09 §6.5; 11 SEC-013, SEC-026. Опционально (could): по умолчанию SMSPRO_DLR_MODE=poll — маршрут отвечает 404; push включается SMSPRO_DLR_MODE=push (09 §6.11 фиксирует объём R1 «только poll» — режим push остаётся выключенным, пока не включён флагом). Без access JWT: только IP-allowlist SMSPRO_DLR_ALLOWED_IPS (пустой список → 404). Тело — application/xml (исключение из правила application/json только для этого маршрута) формата 09 §6.5: report/dr[] с id и phone/report/sendTime/rcvTime; подписи у push-запроса нет. Ответ — 200 с пустым телом за ≤ 1 с; обработка в фоне (pg-boss); неизвестные dr/id игнорируются (метрика sms_dlr_unknown_id_total); повтор отчёта по тому же dr/id не меняет sms_outbox повторно. Ответ провайдеру — без деталей. Ошибки: 403 FORBIDDEN (IP вне allowlist); 404 NOT_FOUND (push выключен); 413 PAYLOAD_TOO_LARGE (> 1 MB); 415 UNSUPPORTED_MEDIA_TYPE. Аудит в audit_logs не пишется (технический канал; без номеров телефонов в логах).'
      security: []
      parameters:
      - $ref: '#/components/parameters/RequestId'
      requestBody:
        required: true
        content:
          application/xml:
            schema:
              $ref: '#/components/schemas/IntegrationsSmsproDlrReport'
      responses:
        '200':
          description: Отчёт принят (пустое тело).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '413':
          $ref: '#/components/responses/PayloadTooLarge'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-PUBLIC-IP
      x-feature-flag: SMSPRO_DLR_MODE=push
