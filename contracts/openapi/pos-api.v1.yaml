      description: |
        08 §4.9.6 (путь — ядро §19.2): квитанция о принятом платеже в счёт долга (orderId = null) — клиент, сумма, способ, allocation[], принял, дата/время, «Нефискальный документ» (D-26, PAY-043); PdfRenderer, вид документа payment_receipt. Право: order.documents.print И доступ к платежу (payment.read.all / payment.read.own; 11 §4.3.1); по 11 §4.4 — cashier, senior_seller, owner; customer, admin, seller → 403 FORBIDDEN. Нет платежа или чужой при payment.read.own → 404. Платёж не received → 409 PAYMENT_STATE_INVALID (ядро §19.4); платёж с orderId ≠ null → 409 PAYMENT_STATE_INVALID (reason: order_payment — печатать чек заказа GET /orders/{id}/documents/receipt.pdf). Условный элемент вместе с POST /payments: при DEBT_PAYMENTS_FROM_POS=false квитанция не выдаётся (08 §10, 13 RM-G-013). Cache-Control: private, no-cache + ETag (SHA-256 содержимого) — исключение из правила /payments* (08 §2.8). Аудит не пишется; факт рендера — print_jobs.
