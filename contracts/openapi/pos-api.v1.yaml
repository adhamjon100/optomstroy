      properties:
        refreshToken:
          type: string
          minLength: 1
          maxLength: 256
          description: 'Непрозрачный refresh: 32 байта CSPRNG в base64url (43 символа) (08 §2.2).'
    AuthRegistrationRequired:
      type: object
      required:
      - status
      - registrationToken
      description: Ветка registration_required — номер без аккаунта и без действующего приглашения; форма клиента (08 §4.1.2; имя — 08 §8).
      properties:
        status:
          type: string
          enum:
          - registration_required
        registrationToken:
          type: string
          description: JWT 15 мин, purpose=register; клиент хранит только в памяти (08 §2.2).
        registrationExpiresIn:
          type: integer
          example: 900
        phoneMasked:
          $ref: '#/components/schemas/PhoneMasked'
    AuthSessionList:
      type: object
      required:
      - items
      description: 200 GET /auth/sessions — без пагинации, ≤ 5 устройств (08 §4.1.6).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Session'
    AuthSessionPatchRequest:
      type: object
      required:
      - deviceName
      additionalProperties: false
      description: PATCH /auth/sessions/{sessionId} — только отображаемое имя устройства (08 §4.1.6).
      properties:
        deviceName:
          type: string
          minLength: 1
          maxLength: 60
          pattern: ^[^\x00-\x1F\x7F]+$
          example: Касса-2 (Windows)
    AuthStepUpRequest:
      type: object
      required:
      - method
      - operation
      additionalProperties: false
      description: |
        Тело POST /auth/step-up (08 §4.1.7). method=pin — с pin; method=otp — шаг 1 без challengeId/code (→ 202), шаг 2 с challengeId и code (→ 200). В R1 только pin и otp (ядро §19.3); bio+pin / bio+otp и biometricAssertion — R2.
      properties:
        method:
          type: string
          enum:
          - pin
          - otp
          description: Подмножество step_up_method 07 для R1 (biometric — R2, ядро §19.3).
        pin:
          type: string
          pattern: ^\d{4,6}$
          description: PIN приложения, 4–6 цифр (только method=pin).
        challengeId:
          type: string
          format: uuid
          description: Только method=otp, шаг 2.
        code:
          type: string
          pattern: ^\d{6}$
          description: Только method=otp, шаг 2.
        operation:
          $ref: '#/components/schemas/StepUpOperation'
      example:
        method: pin
        pin: '482913'
        operation: payment.qr.confirm_manual
    AuthStepUpToken:
      type: object
      required:
      - stepUpToken
      - expiresAt
      - method
      - scope
      description: '200 POST /auth/step-up (08 §4.1.7): токен многоразовый 15 мин в области scope.'
      properties:
        stepUpToken:
          type: string
        expiresAt:
          type: string
          format: date-time
        method:
          type: string
          enum:
          - pin
          - otp
        scope:
          type: array
          description: Коды permissions 11 §4.3 области, выведенной сервером из operation (ядро §18.2 п.6).
          items:
            $ref: '#/components/schemas/PermissionCode'
    AuthTokenPair:
      type: object
      required:
      - accessToken
      - accessExpiresIn
      - refreshToken
      - refreshExpiresAt
      - sid
      description: 200 POST /auth/refresh (08 §4.1.3).
      properties:
        accessToken:
          type: string
        accessExpiresIn:
          type: integer
          example: 900
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        sid:
          type: string
          format: uuid
        permissionsVersion:
          type: integer
          minimum: 0
          example: 8
    AuthUnlockRequest:
      type: object
      required:
      - refreshToken
      additionalProperties: false
      description: Тело POST /auth/unlock (08 §4.1.8). Без method — pin.
      properties:
        method:
          type: string
          enum:
          - pin
          - biometric
          default: pin
          description: biometric — только Android/iOS (не Windows), refreshToken = расшифрованный biometric_refresh.
        refreshToken:
          type: string
          minLength: 1
          maxLength: 256
          description: Refresh (или biometric_refresh при method=biometric).
        pin:
          type: string
          pattern: ^\d{4,6}$
          description: Обязателен при method=pin.
        biometricInvalidated:
          type: boolean
          description: 'true — ключ биометрии недоступен: сервер отзывает биометрическую семью устройства и выключает biometricsEnabled (только с method=pin).'
      example:
        method: pin
        refreshToken: b64url…
        pin: '482913'
    AuthUnlockResponse:
      type: object
      required:
      - accessToken
      - accessExpiresIn
      - refreshToken
      - refreshExpiresAt
      - sid
      description: 200 POST /auth/unlock (08 §4.1.8).
      properties:
        accessToken:
          type: string
        accessExpiresIn:
          type: integer
          example: 900
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        sid:
          type: string
          format: uuid
        amr:
          type: array
          items:
            type: string
            enum:
            - sms
            - bio
            - pin
          example:
          - sms
          - pin
        permissionsVersion:
          type: integer
          minimum: 0
          example: 8
