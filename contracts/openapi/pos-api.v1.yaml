        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: документ оформлен вручную в 1С
    OrdersPaymentCreateRequest:
      type: object
      required:
      - method
      additionalProperties: false
      description: |
        POST /orders/{id}/payments (08 §4.8.6). Сумму платежа клиент не передаёт (amount = totalToPay − paidAmount). Варианты: { method: cash, receivedAmount, comment } / { method: qr_bakai, reissueQr: true } / { method: qr_bakai, manualOnly: true }. method=credit → 409 ORDER_STATE_INVALID (payment_method_mismatch).
      properties:
        method:
          $ref: '#/components/schemas/PaymentMethod'
        receivedAmount:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Только для cash — получено от покупателя (для сдачи); < amount → 422 received_less_than_due.
        comment:
          type: string
          maxLength: 200
        reissueQr:
          type: boolean
          default: false
          description: «Обновить QR» на том же payment_id (ядро §19.2, §24.4).
        manualOnly:
          type: boolean
          default: false
          description: 'Запасной путь: QR без автоматического подтверждения, далее confirm-manual.'
    OrdersPaymentOrderState:
      type: object
      required:
      - paidAmount
      - isPaid
