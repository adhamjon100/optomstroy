    Notification:
      type: object
      required:
      - id
      - kind
      - title
      - createdAt
      - severity
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/NotificationKind'
        title:
          type: string
        body:
          type: string
        payload:
          type: object
          additionalProperties: true
          properties:
            orderId:
              type: string
              format: uuid
            target:
              type: string
              nullable: true
              enum:
              - sessions
              - profile
              - customer_link
              - update
              - cart_parked
              - null
              description: |
                Цель перехода для kind=system (ядро §19.2); null — без перехода. cart_parked — истечение отложенной корзины, переход SCR-44 → SCR-23 по cartId (08 §3.13 «Ключи Notification.payload»; 02 §8 п. 27; FQ-NOTIF-07; с 1.2.0). Других значений сервер не передаёт: переход уведомлений kind=sync_error строится по kind (SCR-44 → SCR-43), а не по target (08 §3.13; ревью закрытия F, RS-2).
            paymentId:
              type: string
              format: uuid
              description: kind=payment_status (08 §3.13 «Ключи Notification.payload»; FQ-FND-09). С 1.2.0.
            status:
              type: string
              description: |
                Статус объекта уведомления для StatusChip (08 §3.13; FQ-NOTIF-06): kind=order_status — OrderStatus заказа; kind=payment_status — только вместе с task=refund_or_advance: OrderStatus заказа (cancelled — заказ отклонён 1С после получения денег, 10 ORD-035); в остальных уведомлениях payment_status ключа нет — состояние платежа клиент читает GET /payments/{id} по paymentId. Уведомления синхронизации ключ не содержат. Строка: набор зависит от kind, неизвестное значение клиент игнорирует (08 §2.11). С 1.2.0; уточнено по реализации (ревью закрытия F, RS-1).
            cartId:
              type: string
              format: uuid
              description: Уведомления корзины, в т. ч. target=cart_parked (08 §3.13). С 1.2.0.
            entity:
              $ref: '#/components/schemas/SyncEntity'
            runId:
              type: string
              format: uuid
              description: 'Уведомления синхронизации: прогон (08 §3.13). С 1.2.0.'
            task:
              type: string
              description: |
                Задача для получателя: refund_or_advance — «деньги: возврат / аванс» (10 ORD-035; 08 §3.13; FIX-F-09). Набор значений расширяемый — неизвестное значение клиент игнорирует (08 §2.11). С 1.2.0.
            outboxId:
              type: string
              format: uuid
              description: Элемент outbox 1С, к которому относится уведомление (08 §3.13). С 1.2.0.
        createdAt:
          type: string
          format: date-time
        readAt:
          type: string
          format: date-time
          nullable: true
        severity:
          $ref: '#/components/schemas/NotificationSeverity'
    NotificationKind:
      type: string
      enum:
