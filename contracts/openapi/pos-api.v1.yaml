    CustomersCreateRequest:
      type: object
      additionalProperties: false
      required:
      - name
      - customerType
      - phones
      description: |
        Тело POST /customers (08 §4.11.2). customerType обязателен: customers.customer_type NOT NULL без DEFAULT (07 §5.28). forceReason обязателен при forceCreate=true и запрещён при false (rule force_reason_required, ядро §19.2). Телефоны — строки E.164 (в ответе — phones[{value, verified}], 08 §3.7).
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          description: 'ФИО / наименование: 2…150 символов (08 §4.11.2 name ≤ 150; 02 SCR-26 UI-26-004 2–150).'
          example: Тестов Клиент
        customerType:
          $ref: '#/components/schemas/CustomerType'
        phones:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          description: ≥ 1 телефон (08 §4.11.2); phones ≤ 5 (08 §2.14).
          items:
            $ref: '#/components/schemas/PhoneE164'
        inn:
          type: string
          nullable: true
          pattern: ^\d{14}$
          maxLength: 14
          description: 'ИНН КР — 14 цифр [ТИПОВО: ИНН КР; Q-142]; не логируется.'
          example: '12345678901234'
        address:
          type: string
          maxLength: 300
          description: Адрес (необязательно; предзаполняет адрес доставки SCR-21 — тот же предел 300 символов, 02 SCR-21).
        comment:
          type: string
          maxLength: 500
          description: Комментарий (необязательно; ≤ 500 — 02 SCR-26 UI-26-010 [ТИПОВО]).
        priceListId:
          type: string
          format: uuid
          nullable: true
          description: Вид цены (необязательно).
        forceCreate:
          type: boolean
          default: false
          description: Создать несмотря на CUSTOMER_DUPLICATE_SUSPECTED; только customer.create.force (cashier, senior_seller, admin; Q-025).
        forceReason:
          type: string
          nullable: true
          minLength: 5
          maxLength: 200
          description: 'Причина принудительного создания: обязательна при forceCreate=true, запрещена при false (ядро §19.2).'
    CustomersCreditTerms:
      type: object
      required:
      - creditAllowed
      description: Условия отсрочки клиента (08 §4.11.6).
      properties:
        creditAllowed:
          type: boolean
        paymentTermDays:
          type: integer
          minimum: 0
          nullable: true
          example: 14
        creditLimit:
          allOf:
          - $ref: '#/components/schemas/Money'
          type: object
          nullable: true
          description: 'Лимит долга — по праву на суммы долга (08 §4.11.6: «по праву»).'
          x-roles:
          - cashier
          - senior_seller
          - admin
          - owner
          - customer
    CustomersDiscountsResponse:
