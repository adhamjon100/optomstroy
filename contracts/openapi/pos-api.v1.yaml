    Problem:
      type: object
      required:
      - type
      - title
      - status
      - code
      - requestId
      description: |
        RFC 9457 problem+json (08 §2.4, §3.3). type — https://api.<домен>/problems/<code-kebab>; instance — urn:request:<requestId>. errors[] — только VALIDATION_FAILED и бизнес-валидации; conflicts[] — только PRICE_CHANGED/STOCK_INSUFFICIENT/VARIANT_UNAVAILABLE. Стек-трейсы, SQL, имена таблиц — никогда. Прочие поля — по коду ошибки (08 §2.4).
      properties:
        type:
          type: string
          format: uri
          description: URI вида https://api.<домен>/problems/<code-kebab> (например, …/problems/price-changed); может не резолвиться — это идентификатор (08 §2.4).
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        detail:
          type: string
        instance:
          type: string
          example: urn:request:0192f3a1-6c3e-7a1b-9f00-2b7c1d3e4f55
        code:
          $ref: '#/components/schemas/ProblemCode'
        requestId:
          type: string
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ProblemFieldError'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/CartConflict'
        retryAfter:
          type: integer
          minimum: 0
          description: Дублирует заголовок Retry-After.
        attemptsLeft:
          type: integer
          minimum: 0
          description: OTP_INVALID, PIN_INVALID.
        stepUp:
          type: object
          description: 'STEP_UP_REQUIRED: клиент передаёт operation в POST /auth/step-up без изменений (08 §2.12).'
          properties:
            operation:
              $ref: '#/components/schemas/StepUpOperation'
            allowedMethods:
              type: array
              description: В R1 — только pin, otp (ядро §19.3); biometric добавится в R2 аддитивно.
              items:
                type: string
                enum:
                - pin
                - otp
        current:
          type: object
          additionalProperties: true
          description: 'VERSION_CONFLICT: текущее состояние объекта.'
        currentStatus:
          type: string
          description: ORDER_STATE_INVALID / PAYMENT_STATE_INVALID.
        allowedActions:
          type: array
          items:
            type: string
        resource:
          $ref: '#/components/schemas/ProblemResource'
        reason:
          type: string
          description: |
            Машинная причина (cancel_already_requested, possible_duplicate, open_payment_exists, owner_role_reserved, cursor_expired, …). Для 422 PRICE_CHANGED по previewToken — preview_token_invalid, preview_cart_changed, preview_payment_method_changed, preview_total_changed (08 §2.4 «Уточнения … этапа F» п. 1); для 503 ONEC_UNAVAILABLE корзины — catalog_not_loaded (08 §4.7.1 «Уточнения» п. 2). Значения перечислены справочно (с 1.2.0); поле остаётся строкой. Для 401 UNLOCK_REQUIRED (08 §2.4, «Расширения Problem по реализации»; 09 §8.3, §8.8, §6.13): idle_lock — idle-блокировка staff на Windows; refresh_replay — поздний повтор refresh у пользователя с PIN (standard-сессия; пользователю без PIN приходит 401 SESSION_REVOKED с reason refresh_replay и сессия отзывается, 09 §8.3); emergency_code — сессия аварийного кода (первый запрос до разблокировки PIN). Клиент на любое значение показывает SCR-08 и вызывает POST /auth/unlock; неизвестное значение обрабатывается так же (совместимость вперёд). Список — x-unlock-required-reasons.
          x-unlock-required-reasons:
          - idle_lock
          - refresh_replay
          - emergency_code
        until:
          type: string
          format: date-time
          description: '423 PIN_LOCKED: момент снятия блокировки PIN (ISO-8601); до него вход только по OTP (08 §2.4, «Расширения Problem по реализации»; 09 §9.6). Добавлено в 1.1.0.'
        possibleDuplicateOrderId:
          type: string
          format: uuid
        possibleDuplicatePublicNumber:
          type: string
          example: POS-2026-000122
          description: |
            409 ORDER_STATE_INVALID reason=possible_duplicate: номер POS похожего заказа для текста UI-21-029 (08 §4.8.1 «Уточнения POST /orders» п. 4; FQ-CHK-04). Сервер передаёт вместе с possibleDuplicateOrderId; поле необязательное — при его отсутствии клиент получает номер чтением заказа или опускает. Добавлено в 1.2.0.
        possibleDuplicateCreatedAt:
          type: string
          format: date-time
          description: |
            409 ORDER_STATE_INVALID reason=possible_duplicate: момент создания похожего заказа («N минут назад», UI-21-029; 08 §4.8.1 «Уточнения POST /orders» п. 4; FQ-CHK-04). Необязательно (см. possibleDuplicatePublicNumber). Добавлено в 1.2.0.
        previewTotal:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: |
            422 PRICE_CHANGED при несовпадении с previewToken (08 §2.4 «Уточнения кодов ошибок по реализации этапа F» п. 1, §4.8.1 п. 2; FIX-F-03, ADR-100): итог, подписанный в previewToken предпросмотра. Передаётся вместе с total только при reason=preview_total_changed; при preview_token_invalid (токен не прочитан), preview_cart_changed и preview_payment_method_changed полей previewTotal/total нет. conflicts[] при этом пуст, если цены строк не расходятся. Добавлено в 1.2.0; уточнено по реализации (ревью закрытия F, RS-3).
        total:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: |
            422 PRICE_CHANGED при несовпадении с previewToken: итог по текущему серверному пересчёту корзины (08 §2.4 «Уточнения кодов ошибок по реализации этапа F» п. 1; FIX-F-03). Только при reason=preview_total_changed, вместе с previewTotal. Добавлено в 1.2.0.
        openPaymentId:
          type: string
          format: uuid
        limitPercent:
          $ref: '#/components/schemas/Percent'
        requiresRole:
          $ref: '#/components/schemas/RoleCode'
        creditReason:
          $ref: '#/components/schemas/CreditReason'
        limitRemaining:
          $ref: '#/components/schemas/Money'
        overdueAmount:
          $ref: '#/components/schemas/Money'
        asOf:
          type: string
          format: date-time
          nullable: true
          description: Момент снимка долга (CREDIT_*, RECEIVABLES_STALE).
        candidates:
          type: array
          description: 'CUSTOMER_DUPLICATE_SUSPECTED: кандидаты с ограниченным набором полей.'
          items:
            type: object
            additionalProperties: true
        runId:
          type: string
          format: uuid
          description: SYNC_ALREADY_RUNNING.
        minVersion:
          type: string
          description: APP_UPDATE_REQUIRED (дублирует X-Min-App-Version).
        storeUrl:
          type: string
        onec:
          type: object
          description: 'ONEC_REJECTED: ответ 1С без внутренних данных.'
          properties:
            code:
              type: string
            message:
              type: string
    ProblemCode:
      type: string
      description: |
        Машинный код ошибки — ПОЛНЫЙ закрытый перечень 08 §2.4 (ядро §7, §16 п.4, §17.4, §18.2 п.5 + [НОВОЕ ИМЯ] RETURN_QTY_EXCEEDED, WEBHOOK_SIGNATURE_INVALID, QR_UNAVAILABLE). Клиент ветвится только по code и status; неизвестный code обрабатывается как INTERNAL того же HTTP-класса (совместимость вперёд).
      enum:
      - VALIDATION_FAILED
      - OTP_INVALID
      - OTP_EXPIRED
      - OTP_LOCKED
      - OTP_RATE_LIMITED
      - SMS_PROVIDER_ERROR
      - REGISTRATION_TOKEN_INVALID
      - PHONE_ALREADY_REGISTERED
      - UNAUTHENTICATED
      - TOKEN_STALE
      - SESSION_REVOKED
      - DEVICE_MISMATCH
      - STEP_UP_REQUIRED
      - FORBIDDEN
      - VERSION_CONFLICT
      - IDEMPOTENCY_KEY_REUSED
      - IDEMPOTENCY_IN_PROGRESS
      - PRICE_CHANGED
      - STOCK_INSUFFICIENT
      - VARIANT_UNAVAILABLE
      - QTY_NOT_MULTIPLE
      - QTY_BELOW_MIN
      - DISCOUNT_LIMIT_EXCEEDED
      - CREDIT_BLOCKED
      - CREDIT_LIMIT_EXCEEDED
      - RECEIVABLES_STALE
      - ONEC_UNAVAILABLE
      - ONEC_REJECTED
      - ORDER_STATE_INVALID
      - PAYMENT_STATE_INVALID
      - CUSTOMER_LINK_CONFLICT
      - CUSTOMER_DUPLICATE_SUSPECTED
      - SYNC_ALREADY_RUNNING
      - NOT_FOUND
      - RATE_LIMITED
      - INTERNAL
      - APP_UPDATE_REQUIRED
      - PAYLOAD_TOO_LARGE
      - UNSUPPORTED_MEDIA_TYPE
      - METHOD_NOT_ALLOWED
      - CUSTOMER_NOT_IDENTIFIED
      - CART_EMPTY
      - PIN_INVALID
      - PIN_LOCKED
      - UNLOCK_REQUIRED
      - RETURN_QTY_EXCEEDED
      - WEBHOOK_SIGNATURE_INVALID
      - QR_UNAVAILABLE
      - CONSENT_REQUIRED
      - APP_READ_ONLY
