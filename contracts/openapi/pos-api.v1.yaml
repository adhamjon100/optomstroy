        08 §4.1.2; ядро §24.2. Проверка кода (constant-time), атомарное потребление, регистрация устройства, затем ветвление: аккаунт active → authenticated; номер с действующим приглашением → учётная запись сотрудника и authenticated с roleSource=invitation, nextStep=set_pin (без регистрационной формы); нет аккаунта и приглашения → registration_required (регистрация клиента); pending_activation — только при CUSTOMER_SELF_SERVICE=false; blocked → 403 FORBIDDEN. До установки PIN сессия сотрудника по приглашению ограничена (/me*, /auth/*, GET /settings/public; прочее → 403 FORBIDDEN reason pin_not_set). Повторный verify того же кода → 422 OTP_EXPIRED. Ошибки: 400 VALIDATION_FAILED; 403 FORBIDDEN (blocked); 409 DEVICE_MISMATCH (X-Device-Id ≠ устройству челленджа); 422 OTP_INVALID (attemptsLeft), OTP_EXPIRED; 423 OTP_LOCKED (retryAfter); 429 RATE_LIMITED. Rate limit: RL-OTP-VERIFY, RL-PUBLIC-IP. Аудит: auth.otp.verified / auth.otp.failed / auth.login; user.created (вход по приглашению). Кэширование: no-store.
      security: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-feature-flag: CUSTOMER_SELF_SERVICE
      x-rate-limit-group: RL-OTP-VERIFY
