              - unavailable
              - rejected
        validUntil:
          type: string
          format: date-time
        previewToken:
          type: string
          description: |
            Непрозрачный для клиента токен: HMAC от cartRowVersion + итогов + validUntil (5 мин, 08 §3.8); передаётся в POST /orders. Предложение владельцу 08 §3.8 (B-AR-07): включить в подпись onecCheck.at и хэш результата onecCheck, чтобы POST /orders в пределах 60 с (05 SYNC-071) использовал тот же результат /check; клиентский контракт не меняется.
