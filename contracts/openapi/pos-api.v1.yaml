        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - auth
      operationId: auth_session_rename
      summary: Переименовать устройство своей сессии
      description: |
        08 §4.1.6 (путь — ядро §17.4; приоритет could). Тело — только deviceName (1…60, без управляющих символов); иные поля → 400. Чужой sessionId → 404. Повтор с тем же телом → 200. Ошибки: 400 VALIDATION_FAILED; 401; 403; 404 NOT_FOUND. Rate limit: RL-AUTH. Аудит: не пишется. Кэширование: no-store.
