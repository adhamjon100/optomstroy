      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '200':
          description: Payment + allowedActions (08 §4.9.2).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentsGetResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /payments/{id}/confirm-manual:
    post:
      tags:
      - payments
      operationId: payments_confirm_manual
      summary: Ручное подтверждение QR-оплаты кассиром (step-up, аудит)
      description: |
        08 §4.9.3 (D-21): обязательный путь при QR_PROVIDER=none, запасной при QR_PROVIDER=onec (ядро §24.4), разбор платежей manual_confirm. Переходы — только по ядру §22.2 и §23 п.4: из qr_shown — qr_shown → manual_confirm → received в одной транзакции (reviewReason=no_webhook); из manual_confirm — manual_confirm → received. Переход в received — только если receivedAmount = amount; иначе тоже 200: платёж в manual_confirm, reviewReason=amount_mismatch, bankAmount = receivedAmount, warnings[PAYMENT_AMOUNT_MISMATCH], заказ не закрывается (POS-054); выход — повтор с полной суммой (новый Idempotency-Key) или void со step-up. Из qr_expired ручного перехода нет — 409 PAYMENT_STATE_INVALID (reason: qr_expired_reissue_required); received, voided, credit, refunded, cash_pending, qr_pending → 409 PAYMENT_STATE_INVALID. Поля acceptMismatch и reason прежней редакции → 400 VALIDATION_FAILED. Обязателен в R1 независимо от Q-014 и QR_PROVIDER. Аудит payment.manual_qr_confirmed; транзакция manual_qr_confirm. Ключ — только в памяти клиента, после перезапуска автоповтора нет (ядро §22.6). Cache-Control: no-store.
      security:
      - bearerAuth: []
        stepUpToken: []
      x-permissions:
      - payment.qr.confirm_manual
      x-roles:
