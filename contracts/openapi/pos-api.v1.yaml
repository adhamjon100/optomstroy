      - customer
      - nextStep
      description: |
        GET /registration/customer-match и ответы confirm/reject (08 §4.2.2, §4.2.4). nextStep confirm_or_reject — привязка proposed, подтверждённый телефон карточки совпадает с телефоном аккаунта и CUSTOMER_SELF_SERVICE=true; wait_admin — conflict или номер найден как второй контакт ЮЛ.
