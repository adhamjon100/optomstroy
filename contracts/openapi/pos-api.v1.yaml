      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrdersPaymentCreateRequest'
      responses:
        '200':
          description: Payment — действие над существующим открытым платежом (тот же id) + обновлённые order.paidAmount/isPaid.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
