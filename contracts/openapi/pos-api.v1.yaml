            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthUnlockResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '423':
          $ref: '#/components/responses/Locked'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /cart:
    get:
      tags:
      - cart
      operationId: cart_get
      summary: Активная корзина с актуализацией цен и остатков
      description: |
        200: при отсутствии активной корзины сервер создаёт пустую `active` и возвращает её с `items: []` (одна `active` на пользователя). Исключение — 503 ONEC_UNAVAILABLE reason=catalog_not_loaded с Retry-After: 60, если реплика каталога 1С ещё не загружена (нет склада или вида цены по умолчанию; 08 §4.7.1 «Уточнения» п. 2, FIX-F-07; с 1.2.0). Только своя корзина. Для `customer` (R1, ядро §24.2; при CUSTOMER_SELF_SERVICE=true) цены — по виду цены своей `confirmed`-карточки, иначе розничный; остатки — по `customer_stock_display` (08 §3.6). 08 §4.7.1.
      security:
      - bearerAuth: []
      x-permissions:
      - cart.manage.own
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - customer
