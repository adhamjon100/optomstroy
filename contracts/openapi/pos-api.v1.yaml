      x-rate-limit-group: RL-CART
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: revalidate
        in: query
        required: false
        description: Пересчитать цены/остатки по снимку и пометить warnings (по умолчанию true).
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Cart (полная, с warnings[]).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '503':
          description: |
            ONEC_UNAVAILABLE, reason=catalog_not_loaded: реплика каталога 1С не загружена (нет активного склада или вида цены по умолчанию, до первичной загрузки RM-E-011); Retry-After: 60 (08 §4.7.1 «Уточнения» п. 2; FIX-F-07). Остальные маршруты корзины в этом состоянии отвечают так же (ответ default). Добавлено в 1.2.0.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            Retry-After:
              $ref: '#/components/headers/RetryAfter'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/Problem'
        default:
          $ref: '#/components/responses/Problem'
    delete:
      tags:
      - cart
      operationId: cart_clear
      summary: Очистить активную корзину
      description: |
        200 Cart с `items: []`, `status: active`; отложенные корзины не затрагиваются. Повтор для уже пустой корзины → 200 без проверки rowVersion. Ошибки: 409 VERSION_CONFLICT; 400 VALIDATION_FAILED. Аудит `cart.cleared`. 08 §4.7.3.
      security:
      - bearerAuth: []
      x-permissions:
      - cart.manage.own
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-CART
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: rowVersion
        in: query
        required: true
        description: rowVersion активной корзины (оптимистическая блокировка).
        schema:
          type: integer
          minimum: 0
      responses:
        '200':
          description: 'Cart (items: [], status: active).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Cart'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
    patch:
      tags:
      - cart
      operationId: cart_update
