        08 §4.2.1; ядро §19.3, §24.2. Публичный путь (аутентификация — registrationToken в теле). Создаёт клиента-покупателя: роль customer при CUSTOMER_SELF_SERVICE=true (по умолчанию в R1), иначе pending_activation; для customer — поиск карточки 1С по телефону (customer_links). Сотрудники этой операцией не создаются; если приглашение появилось после выдачи registration_token — применяется оно (staff с ролями приглашения, customer_links не создаётся). Шаг «защита входа» обязателен: security.pin можно не передавать только при biometricsEnabled=true на устройстве с биометрией с криптопривязкой (Android class3 / iOS), иначе 400/422 rule login_protection_required. Наличие элемента в consents[] = выданное согласие; personal_data обязательно; biometrics_device — при biometricsEnabled=true; activity_sphere — если передан activitySphere. Повтор с тем же ключом → тот же 201. Скоуп Idempotency-Key здесь — (key, sha256(jti registrationToken), маршрут): пользователя до вызова нет (idempotency_keys.subject_key = reg:<hex>, user_id NULL; B-AR-01). Токены в хранилище идемпотентности не сохраняются (07 §5.56), поэтому повтор выдаёт новую пару токенов для сессии, созданной первым вызовом, на том же устройстве — правило предложено владельцу 08 §2.7 (contracts/openapi/NOTES.md §8). Ошибки: 400 VALIDATION_FAILED (pin_weak, login_protection_required, fullName, birth_year_range, неизвестный activitySphere или consents[].kind, idempotency_key_required); 401 REGISTRATION_TOKEN_INVALID; 409 PHONE_ALREADY_REGISTERED, IDEMPOTENCY_IN_PROGRESS; 422 CONSENT_REQUIRED, IDEMPOTENCY_KEY_REUSED; 429 RATE_LIMITED. Rate limit: RL-PUBLIC-IP. Аудит: user.created (roleSource invitation|self), consent.granted, auth.pin.set. Кэширование: no-store (токены). Статус карточки: ПРЕДВАРИТЕЛЬНО (Q-027, Q-161, Q-165).
      security: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: required
      x-feature-flag: CUSTOMER_SELF_SERVICE
      x-rate-limit-group: RL-PUBLIC-IP
