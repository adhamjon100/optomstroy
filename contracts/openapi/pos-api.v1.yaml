        objectType:
          type: string
          maxLength: 200
          example: Catalog_Номенклатура
        ref:
          type: string
          minLength: 1
          maxLength: 150
          description: 'Ключ объекта (B-AR-05; 05 §6.2 п.1, контракт 1С ObjectDeletion.ref/BarcodeChange.ref): для справочников и документов (Catalog_*, Document_*) — Ref_Key, GUID в нижнем регистре (формат проверяет сервер по objectType; иное → ошибка объекта в sync_errors, пакет не отвергается целиком); для наборов записей регистров (InformationRegister_*, например штрихкоды) — ключ набора, например значение штрихкода. Хранение версий — sync_entity_versions.onec_key (07 §5.54, предложение).'
        dataVersion:
          type: string
          maxLength: 100
          example: AAAAAgAC
        deletionMark:
          type: boolean
        data:
          type: object
          additionalProperties: true
          description: Содержимое объекта по JSON-формату 05 §6.4 (владелец формата — 05).
