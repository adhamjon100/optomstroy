  /auth/step-up:
    post:
      tags:
      - auth
      operationId: auth_step_up
      summary: Получить stepUpToken для критической операции (PIN или OTP)
      description: |
        08 §4.1.7, §2.12; ядро §18.2 п.6, §19.3. operation клиент берёт из 403 STEP_UP_REQUIRED.stepUp.operation без изменений (иное → 400 rule operation). method=pin → 200 со stepUpToken; method=otp без challengeId → 202 (создаёт otp_challenge purpose=step_up), с challengeId и code → 200. Токен многоразовый 15 мин в области scope. В R1 методы bio+pin / bio+otp отклоняются 400 VALIDATION_FAILED (rule method). Ошибки: 400 VALIDATION_FAILED; 401 PIN_INVALID (attemptsLeft; refresh на этот код не выполняется) и общие 401; 403 FORBIDDEN (reason pin_not_set / operation_not_permitted); 422 OTP_INVALID, OTP_EXPIRED; 423 PIN_LOCKED, OTP_LOCKED; 429 OTP_RATE_LIMITED, RATE_LIMITED. Rate limit: RL-PIN, RL-OTP-SEND, RL-OTP-VERIFY. Аудит: auth.step_up.ok / auth.step_up.failed; auth.pin.locked; auth.otp.sent. Кэширование: no-store.
      x-permissions:
      - session.manage.own
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-PIN
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
