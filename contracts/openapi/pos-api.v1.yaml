        confirmedBy:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          type: object
          nullable: true
        confirmedAt:
          type: string
          format: date-time
          nullable: true
        confirmationKind:
          type: string
          enum:
          - webhook
          - manual
          - cash
          - null
          nullable: true
        reviewReason:
          allOf:
          - $ref: '#/components/schemas/ReviewReason'
          type: string
          nullable: true
        bankAmount:
          allOf:
          - $ref: '#/components/schemas/Money'
          type: object
          nullable: true
        voidReason:
          type: string
          nullable: true
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/Warning'
        allocation:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAllocation'
        onec:
          $ref: '#/components/schemas/PaymentOnecInfo'
        idempotencyKey:
          type: string
          format: uuid
        transactionId:
          type: string
          format: uuid
          nullable: true
          description: |
            Транзакция журнала, связанная с платежом, — переход UI-24-008 к SCR-37 (08 §3.10 «Уточнения Payment по реализации»; 02 SCR-24 «Уточнения» п. 5; FQ-FEORD-12). Необязательно: до правки реализации (вместе с SCR-37, этап G) сервер поле не передаёт — клиент переход не показывает. Добавлено в 1.2.0.
        audit:
          $ref: '#/components/schemas/AuditMeta'
