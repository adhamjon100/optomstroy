      description: |
        Коды журнала синхронизации (sync_errors.error_code / onec_outbox.last_error_code), 15 значений; НЕ значения Problem.code (08 §2.4, 07 §6.1.1). QR_PAID_AFTER_VOID — оплата QR после аннулирования платежа (05 §6.7.3, SYNC-078; 07 §5.53 FIX-F-06), добавлен в 1.2.0 вместе с expand CHECK (migrations/0013); сервер пишет этот код. Записи прежних версий с error_code=OTHER и payload.code=QR_PAID_AFTER_VOID остаются допустимыми (миграция 0013 — expand-only, ADR-103).
      enum:
      - DUPLICATE_SUSPECTED
      - OUTBOX_UNCONFIRMED
      - BARCODE_CONFLICT
      - PAYMENT_DOC_VOIDED
      - ORDER_MATCH_AMBIGUOUS
      - NO_WRITE_CHANNEL
      - QR_PAID_AFTER_VOID
      - NOT_FOUND_LOCAL
      - VALIDATION
      - ONEC_REJECTED
      - ONEC_UNAVAILABLE
      - IMAGE_DOWNLOAD
      - HASH_MISMATCH
      - COUNT_MISMATCH
      - OTHER
    SyncMode:
      type: string
      enum:
      - full
      - incremental
      - manual
      - reconcile
    SyncRun:
      type: object
      required:
      - id
      - entity
      - mode
      - trigger
      - status
      properties:
        id:
          type: string
          format: uuid
        entity:
          $ref: '#/components/schemas/SyncEntity'
        mode:
          $ref: '#/components/schemas/SyncMode'
        trigger:
          $ref: '#/components/schemas/SyncTrigger'
        status:
          $ref: '#/components/schemas/SyncRunStatus'
        startedAt:
          type: string
          format: date-time
          nullable: true
        finishedAt:
          type: string
          format: date-time
          nullable: true
        triggeredBy:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          type: object
          nullable: true
        counts:
          $ref: '#/components/schemas/SyncCounts'
        errorSummary:
          type: string
          nullable: true
    SyncRunError:
      type: object
      required:
      - id
      - entity
      - errorCode
      - message
      description: Строка GET /sync/runs/{id}/errors (08 §4.17.2; 07 sync_errors). errorCode — код журнала синхронизации, НЕ Problem.code.
      properties:
        id:
          type: string
          format: uuid
        entity:
          $ref: '#/components/schemas/SyncEntity'
        onecRef:
          type: string
          format: uuid
          nullable: true
        onecCode:
          type: string
          nullable: true
          description: Код объекта в 1С.
        errorCode:
          $ref: '#/components/schemas/SyncErrorCode'
        message:
          type: string
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: Данные объекта без ПДн.
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 'Только чтение: операция «пометить решённой» — R2 (Q-219, ядро §19.2).'
    SyncRunStatus:
      type: string
      enum:
      - queued
      - running
      - success
      - partial
      - failed
    SyncRunsCreateRequest:
      type: object
      required:
      - entity
      - mode
      additionalProperties: false
      description: Тело POST /sync/runs (08 §4.17.2, §8).
      properties:
        entity:
          $ref: '#/components/schemas/SyncEntity'
        mode:
          type: string
          enum:
          - incremental
          - full
          - reconcile
          description: 'Подмножество SyncMode (07 §6.1): значение manual присваивается прогону сервером и в теле не принимается.'
        scope:
          type: object
          nullable: true
          additionalProperties: false
          description: Точечная синхронизация (например, долг клиента перед продажей в долг); null — вся сущность.
          properties:
            customerId:
              type: string
              format: uuid
              nullable: true
            variantIds:
              type: array
              maxItems: 200
              items:
                type: string
                format: uuid
              description: variantIds ≤ 200 (08 §2.14).
    SyncStatus:
      type: object
      required:
      - onecReachable
      - checkedAt
      - overall
      properties:
        onecReachable:
          type: boolean
        checkedAt:
          type: string
          format: date-time
        overall:
          type: string
          enum:
          - ok
          - degraded
          - failed
        entities:
          type: array
          items:
            $ref: '#/components/schemas/SyncEntityStatus'
        outbox:
          type: object
          properties:
            pending:
              type: integer
              minimum: 0
            failed:
              type: integer
              minimum: 0
            dead:
              type: integer
              minimum: 0
        pendingManualOrders:
          type: object
          description: Только полный ответ (sync.runs.read); slaMin = MANUAL_ORDER_SLA_MIN.
          properties:
            count:
              type: integer
              minimum: 0
            oldestAt:
              type: string
              format: date-time
              nullable: true
            slaMin:
              type: integer
              minimum: 0
            overSla:
              type: boolean
    SyncTrigger:
      type: string
      enum:
      - schedule
      - manual
      - retry
      - dependency
    Transaction:
      type: object
      required:
      - id
      - kind
      - number
      - occurredAt
      - amount
      - status
      - related
      properties:
        id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/TransactionKind'
        number:
          type: string
          example: POS-2026-000123 / УТ-0001234
        occurredAt:
          type: string
          format: date-time
        amount:
          $ref: '#/components/schemas/Money'
        sign:
          type: string
          enum:
          - +
          - '-'
        status:
          type: string
          description: Статус связанного документа как есть.
        statusGroup:
          $ref: '#/components/schemas/TransactionStatusGroup'
        customer:
          type: object
          nullable: true
          properties:
            id:
              type: string
              format: uuid
            displayName:
              type: string
        actor:
          $ref: '#/components/schemas/UserRef'
        source:
          $ref: '#/components/schemas/TransactionSource'
        related:
          type: array
          items:
            $ref: '#/components/schemas/TransactionRelated'
    TransactionKind:
      type: string
      enum:
      - order_created
      - order_cancelled
      - payment_received
      - payment_voided
      - refund
      - discount_override
      - credit_sale_approved
      - manual_qr_confirm
      - return_requested
    TransactionRelated:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - order
          - payment
          - return_request
          - onec_document
        id:
          type: string
          format: uuid
          nullable: true
        number:
          type: string
        url:
          type: string
          example: /api/v1/orders/{id}
    TransactionSource:
      type: string
      enum:
      - pos
      - onec
    TransactionStatusGroup:
      type: string
      enum:
      - received
      - pending
      - voided
      - returned
      - onec_error
      description: Группа статуса транзакции для фильтра GET /transactions?status= (ядро §19.2; 08 §3.11).
    TransactionsDetail:
      description: 'Ответ GET /transactions/{id} (08 §4.14.2): Transaction с полным related[] + audit[] (только audit.read).'
      allOf:
      - $ref: '#/components/schemas/Transaction'
      - type: object
        properties:
          audit:
            type: array
            x-roles:
            - admin
            - owner
            description: Записи аудита по транзакции — только audit.read (admin — без финансовых before/after, 11 SEC-083).
            items:
              $ref: '#/components/schemas/AuditRow'
    TransactionsSummary:
      type: object
      required:
      - count
      - sumIn
      - sumOut
      description: Итоги по фильтру GET /transactions (08 §4.14.1); только transactions.read.all.
      properties:
        count:
          type: integer
          minimum: 0
          example: 42
        sumIn:
          $ref: '#/components/schemas/Money'
        sumOut:
          $ref: '#/components/schemas/Money'
    Unit:
      type: object
      required:
      - id
      - name
      - qtyPrecision
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: '796'
        name:
          type: string
          example: шт
        shortName:
          type: string
          example: шт
        qtyPrecision:
          type: integer
          minimum: 0
          maximum: 3
    UserKind:
      type: string
      enum:
      - staff
      - customer
    UserRef:
      type: object
      required:
      - id
      - displayName
      description: Ссылка на пользователя без телефона (минимизация ПДн, 08 §3.5).
      properties:
        id:
          type: string
          format: uuid
        displayName:
          type: string
          example: Продавец 1
        role:
          $ref: '#/components/schemas/RoleCode'
    UserStatus:
      type: string
      enum:
      - pending
      - pending_activation
      - active
      - blocked
      - deleted
    Variant:
      type: object
      required:
      - id
      - productId
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        isDefault:
          type: boolean
        name:
          type: string
          example: Хром, 35 мм
        sku:
          type: string
          example: GR-33281-CH
        attributes:
          type: object
          additionalProperties:
            type: string
        price:
          $ref: '#/components/schemas/Price'
        stock:
          $ref: '#/components/schemas/StockBalance'
        stockByWarehouse:
          type: array
          items:
            $ref: '#/components/schemas/StockBalance'
        barcodes:
          type: array
          items:
            type: string
        images:
          type: array
          items:
            $ref: '#/components/schemas/Image'
        multiplicity:
          allOf:
          - $ref: '#/components/schemas/QuantityValue'
          type: string
          nullable: true
          description: Кратность продажи в базовых единицах; null — не ведётся (Q-021; ядро §19.2).
        sortOrder:
          type: integer
        deletionMark:
          type: boolean
    Warning:
      type: object
      required:
      - code
      - message
      description: 'Предупреждение в warnings[] успешного ответа 200/201/202: операция применена, клиент её не повторяет.'
      properties:
        code:
          $ref: '#/components/schemas/WarningCode'
        message:
          type: string
    WarningCode:
      type: string
      enum:
      - STALE_DATA
      - QR_UNAVAILABLE
      - PAYMENT_AMOUNT_MISMATCH
      description: Коды предупреждений успешного ответа — НЕ входят в ProblemCode (08 §2.4).
  responses:
    BadRequest:
      description: 400 — VALIDATION_FAILED (синтаксис/схема, лишние поля, forbidden_field, limit>200, idempotency_key_required).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Min-App-Version:
          $ref: '#/components/headers/XMinAppVersion'
        X-Recommended-App-Version:
          $ref: '#/components/headers/XRecommendedAppVersion'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    CatalogImageNotFound:
      description: 404 — файла нет; ответ формирует pos-proxy (Caddy), тело — не problem+json; клиент показывает заглушку ProductImage (08 §4.4.7).
    Conflict:
      description: 409 — VERSION_CONFLICT, IDEMPOTENCY_IN_PROGRESS (Retry-After), ORDER_STATE_INVALID, PAYMENT_STATE_INVALID, PHONE_ALREADY_REGISTERED, DEVICE_MISMATCH, CUSTOMER_LINK_CONFLICT, CUSTOMER_DUPLICATE_SUSPECTED, SYNC_ALREADY_RUNNING.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Min-App-Version:
          $ref: '#/components/headers/XMinAppVersion'
        X-Recommended-App-Version:
          $ref: '#/components/headers/XRecommendedAppVersion'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: 403 — FORBIDDEN (нет permission, чужой объект, роль не допускает поле/действие) или STEP_UP_REQUIRED (stepUp.operation, stepUp.allowedMethods).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Min-App-Version:
          $ref: '#/components/headers/XMinAppVersion'
        X-Recommended-App-Version:
          $ref: '#/components/headers/XRecommendedAppVersion'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    InternalError:
      description: '500 — INTERNAL (detail: «Внутренняя ошибка. Код обращения: <requestId>»; без стек-трейсов).'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Locked:
      description: 423 — OTP_LOCKED, PIN_LOCKED (retryAfter — до разблокировки; PIN_LOCKED несёт until — 08 §2.4).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    MethodNotAllowed:
      description: 405 — METHOD_NOT_ALLOWED (метод вне allowlist маршрута; заголовок Allow).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Allow:
          description: Допустимые методы маршрута.
          schema:
            type: string
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: 404 — NOT_FOUND (ресурс отсутствует или недоступен по владению; выключенный маршрут — например, вебхук при QR_PROVIDER≠bakai).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Min-App-Version:
          $ref: '#/components/headers/XMinAppVersion'
        X-Recommended-App-Version:
          $ref: '#/components/headers/XRecommendedAppVersion'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotModified:
      description: 304 Not Modified — If-None-Match совпал с ETag; тела нет (08 §2.8).
      headers:
        ETag:
          $ref: '#/components/headers/ETag'
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
    PayloadTooLarge:
      description: 413 — PAYLOAD_TOO_LARGE (тело > 1 MB; /integrations/onec/* — > 10 MB).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Problem:
      description: Ошибка (RFC 9457 problem+json, поле code — 08 §2.4). Общий ответ для любого HTTP-статуса ошибки.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        Content-Language:
          $ref: '#/components/headers/ContentLanguage'
        X-Min-App-Version:
          $ref: '#/components/headers/XMinAppVersion'
        X-Recommended-App-Version:
          $ref: '#/components/headers/XRecommendedAppVersion'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    ServiceUnavailable:
      description: 503 — SMS_PROVIDER_ERROR, ONEC_UNAVAILABLE, QR_UNAVAILABLE (только bakai, R2), APP_READ_ONLY; Retry-After при наличии.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-Min-App-Version:
          $ref: '#/components/headers/XMinAppVersion'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    TooManyRequests:
      description: 429 — RATE_LIMITED (группа 08 §2.9) или OTP_RATE_LIMITED (RL-OTP-SEND*); Retry-After обязателен.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
        X-RateLimit-Limit:
          $ref: '#/components/headers/XRateLimitLimit'
        X-RateLimit-Remaining:
          $ref: '#/components/headers/XRateLimitRemaining'
        X-RateLimit-Reset:
          $ref: '#/components/headers/XRateLimitReset'
        X-Min-App-Version:
          $ref: '#/components/headers/XMinAppVersion'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: '401 — UNAUTHENTICATED, TOKEN_STALE, SESSION_REVOKED, REGISTRATION_TOKEN_INVALID, PIN_INVALID, UNLOCK_REQUIRED (reason: idle_lock | refresh_replay | emergency_code — 08 §2.4), WEBHOOK_SIGNATURE_INVALID.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Min-App-Version:
          $ref: '#/components/headers/XMinAppVersion'
        X-Recommended-App-Version:
          $ref: '#/components/headers/XRecommendedAppVersion'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnprocessableEntity:
      description: '422 — бизнес-валидация: VALIDATION_FAILED (семантика), OTP_INVALID, OTP_EXPIRED, IDEMPOTENCY_KEY_REUSED, PRICE_CHANGED, STOCK_INSUFFICIENT, VARIANT_UNAVAILABLE, QTY_NOT_MULTIPLE, QTY_BELOW_MIN, DISCOUNT_LIMIT_EXCEEDED, CREDIT_BLOCKED, CREDIT_LIMIT_EXCEEDED, RECEIVABLES_STALE, ONEC_REJECTED, CUSTOMER_NOT_IDENTIFIED, CART_EMPTY, RETURN_QTY_EXCEEDED, CONSENT_REQUIRED.'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Min-App-Version:
          $ref: '#/components/headers/XMinAppVersion'
        X-Recommended-App-Version:
          $ref: '#/components/headers/XRecommendedAppVersion'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UnsupportedMediaType:
      description: 415 — UNSUPPORTED_MEDIA_TYPE (Content-Type ≠ application/json).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    UpgradeRequired:
      description: 426 — APP_UPDATE_REQUIRED (X-App-Version ниже минимальной для X-Platform; проверка до аутентификации; minVersion, storeUrl).
      headers:
        X-Request-Id:
          $ref: '#/components/headers/XRequestId'
        X-Min-App-Version:
          $ref: '#/components/headers/XMinAppVersion'
        X-Recommended-App-Version:
          $ref: '#/components/headers/XRecommendedAppVersion'
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  parameters:
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: Язык title/detail/errors[].message; в R1 локализован только ru (08 §2.13, D-38); неизвестный → ru.
      schema:
        $ref: '#/components/schemas/Locale'
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: Семантическая версия сборки; обязателен с R2, в R1 — мягкий режим (08 §2.11, Q-153). Не применяется к вебхуку и /integrations/onec/*.
      schema:
        type: string
        example: 1.4.2+87
    AuthChallengeIdPath:
      name: challengeId
      in: path
      required: true
      description: Идентификатор otp_challenge из ответа POST /auth/otp/request (08 §4.1.9).
      schema:
        type: string
        format: uuid
    AuthSessionIdPath:
      name: sessionId
      in: path
      required: true
      description: Идентификатор своей сессии (Session.id); чужой или неизвестный → 404 NOT_FOUND (08 §4.1.6).
      schema:
        type: string
        format: uuid
    CartVariantIdPath:
      name: variantId
      in: path
      required: true
      description: UUID варианта товара (строка корзины).
      schema:
        type: string
        format: uuid
    CatalogAttr:
      name: attr
      in: query
      required: false
      description: 'Фильтр по свойствам: attr[<ключ>]=<значение>, не более 10 пар (08 §2.6, §4.4.2); ключ — product_attributes.code (07 §5.18).'
      style: deepObject
      explode: true
      schema:
        type: object
        maxProperties: 10
        additionalProperties:
          type: string
          maxLength: 200
        example:
          color: хром
    CatalogBrand:
      name: brand
      in: query
      required: false
      description: Бренды списком через запятую, ≤ 50 значений (08 §2.6, §4.4.2).
      style: form
      explode: false
      schema:
        type: array
        items:
          type: string
          maxLength: 200
        maxItems: 50
    CatalogCategoryIdQuery:
      name: categoryId
      in: query
      required: false
      description: Категория; по умолчанию включая подкатегории (includeSubcategories=true) (08 §4.4.2).
      schema:
        type: string
        format: uuid
    CatalogFavorite:
      name: favorite
      in: query
      required: false
      description: Только избранные товары пользователя (08 §4.4.2).
      schema:
        type: boolean
    CatalogHasImage:
      name: hasImage
      in: query
      required: false
      description: Только товары с фото (08 §4.4.2).
      schema:
        type: boolean
    CatalogInStock:
      name: inStock
      in: query
      required: false
      description: Только товары с available > 0 на складе запроса (08 §4.4.2).
      schema:
        type: boolean
    CatalogIncludeSubcategories:
      name: includeSubcategories
      in: query
      required: false
      description: Учитывать подкатегории categoryId (08 §4.4.2).
      schema:
        type: boolean
        default: true
    CatalogPriceListIdQuery:
      name: priceListId
      in: query
      required: false
      description: 'Вид цены. Только при catalog.prices.read.all (cashier, senior_seller, admin, owner — 11 §4.4, 08 §9); seller и customer → 403 FORBIDDEN. Для customer вид цены выбирает сервер: соглашение 1С / customers.default_price_list_id (только при customer_links.status=confirmed) → price_lists.is_default → розничный (08 §3.6, ядро §24.2).'
      schema:
        type: string
        format: uuid
    CatalogPriceMax:
      name: priceMax
      in: query
      required: false
      description: Верхняя граница цены, Money-строка (08 §2.6; rule money_format).
      schema:
        $ref: '#/components/schemas/MoneyAmount'
    CatalogPriceMin:
      name: priceMin
      in: query
      required: false
      description: Нижняя граница цены, Money-строка (08 §2.6; rule money_format).
      schema:
        $ref: '#/components/schemas/MoneyAmount'
    CatalogProductsLimit:
      name: limit
      in: query
      required: false
      description: Размер страницы 1…200, по умолчанию 40 (сетка 5×8 макета; 08 §2.5, §4.4.2); > 200 → VALIDATION_FAILED.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 40
    CatalogWarehouseIdQuery:
      name: warehouseId
      in: query
      required: false
      description: Склад для цены/остатка; по умолчанию settings.defaultWarehouseId → warehouses.is_default_for_pos (08 §4.4).
      schema:
        type: string
        format: uuid
    Cursor:
      name: cursor
      in: query
      required: false
      description: Непрозрачный курсор keyset-пагинации (base64url, HMAC) из nextCursor; подделанный → VALIDATION_FAILED rule cursor; при смене sort — rule cursor_sort_mismatch (08 §2.5).
      schema:
        type: string
    CustomersLinkIdPath:
      name: linkId
      in: path
      required: true
      description: UUID привязки customer_links (08 §4.11.7).
      schema:
        type: string
        format: uuid
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: UUID устройства из secure storage; обязателен на всех запросах, кроме /health* и вебхука (08 §2.3); иной формат → VALIDATION_FAILED rule uuid.
      schema:
        type: string
        format: uuid
    From:
      name: from
      in: query
      required: false
      description: Начало периода, ISO-8601 UTC; from ≤ to; период ≤ 366 дней (rule date_range, 08 §2.14).
      schema:
        type: string
        format: date-time
    IdPath:
      name: id
      in: path
      required: true
      description: UUID ресурса (v7, нижний регистр).
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: |
        UUID v4; ОБЯЗАТЕЛЕН для операций единственного перечня 08 §2.7 «Где обязателен» (отсутствие → 400 VALIDATION_FAILED rule idempotency_key_required). Повтор с тем же ключом и телом → тот же ответ + Idempotent-Replayed: true (24 ч); другое тело → 422 IDEMPOTENCY_KEY_REUSED; параллельный повтор → 409 IDEMPOTENCY_IN_PROGRESS + Retry-After: 2. Скоуп ключа — (key, субъект, маршрут): субъект — пользователь access-токена; у публичного POST /registration/complete, где пользователя ещё нет, — SHA-256 от jti registrationToken (B-AR-01; БД — idempotency_keys.subject_key). Операции с шагом после COMMIT (формирование QR: POST /orders, POST /orders/{id}/payments, POST /payments) при повторе возвращают ТЕКУЩЕЕ представление созданного ресурса (по сохранённому идентификатору) с тем же HTTP-статусом и Idempotent-Replayed: true, а не снимок на момент COMMIT — иначе повтор показал бы платёж без QR, выданного после COMMIT (B-AR-04). Правила — предложение владельцу 08 §2.7 (contracts/openapi/NOTES.md §8).
      schema:
        $ref: '#/components/schemas/IdempotencyKeyValue'
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: UUID v4; допускается на любом другом POST/PUT/PATCH (08 §2.7 «Где допускается»), при наличии — та же обработка.
      schema:
        $ref: '#/components/schemas/IdempotencyKeyValue'
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: Значение ETag предыдущего ответа; совпадение → 304 Not Modified без тела (08 §2.8).
      schema:
        type: string
    IntegrationsOnecExtensionVersion:
      name: X-Onec-Extension-Version
      in: header
      required: false
      description: '[НОВОЕ ИМЯ 08 §4.21] Версия расширения onec-extension; пишется в sync_runs.meta.'
      schema:
        type: string
        maxLength: 50
        example: 1.0.3
    IntegrationsOnecNode:
      name: X-Onec-Node
      in: header
      required: false
      description: '[НОВОЕ ИМЯ 08 §4.21] Имя узла плана обмена (для будущих нескольких баз), например POS.'
      schema:
        type: string
        maxLength: 50
        example: POS
    Limit:
      name: limit
      in: query
      required: false
      description: Размер страницы 1…200 (максимум 200 для всех списков, ядро §19.2); по умолчанию 50 (для /catalog/products — 40, для /catalog/sync/{entity} — 200 — задаётся в карточке); > 200 → VALIDATION_FAILED.
      schema:
        type: integer
        minimum: 1
        maximum: 200
        default: 50
    OrdersDocumentCopy:
      name: copy
      in: query
      required: false
      description: Пометка «Копия» на документе.
      schema:
        type: boolean
        default: false
    OrdersDocumentFormat:
      name: format
      in: query
      required: false
      description: Формат бумаги — значения print_jobs.paper 07 (a4 по умолчанию, thermal80).
      schema:
        type: string
        allOf:
        - $ref: '#/components/schemas/PrintPaper'
        default: a4
    Platform:
      name: X-Platform
      in: header
      required: false
      description: Платформа клиента; обязателен с R2, в R1 — мягкий режим (08 §2.11, Q-153); иное значение → VALIDATION_FAILED rule platform.
      schema:
        $ref: '#/components/schemas/DevicePlatform'
    Q:
      name: q
      in: query
      required: false
      description: 'Поиск внутри списка: минимум 2 символа (для штрихкода/артикула — любой) (08 §2.6).'
      schema:
        type: string
        maxLength: 200
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: Сквозной UUID запроса; сервер возвращает эхом, иначе генерирует UUIDv7 (08 §2.3).
      schema:
        type: string
        format: uuid
    Sort:
      name: sort
      in: query
      required: false
      description: Сортировка field:dir через запятую; допустимые поля — в карточке эндпоинта; неизвестное поле → VALIDATION_FAILED rule sort_field; последний ключ — id (08 §2.6).
      schema:
        type: string
        example: price:asc,id:asc
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      description: |
        stepUpToken из POST /auth/step-up для критических операций 08 §2.12. В схеме required: false, потому что на части операций заголовок нужен не во всех ветках (только чужая сессия, только include=documents, только override); там, где карточка 08 называет его обязательным (x-step-up: true без условия в description), запрос без заголовка или с просроченным/чужим токеном получает 403 STEP_UP_REQUIRED (stepUp.operation из x-step-up-operation, allowedMethods) — обязательность выражена этим ответом, а не валидацией схемы (B-AR-16). Клиент получает токен заранее по x-step-up-operation.
      schema:
        type: string
    To:
      name: to
      in: query
      required: false
      description: Конец периода, ISO-8601 UTC (08 §2.6, §2.14).
      schema:
        type: string
        format: date-time
  headers:
    CacheControl:
      description: По умолчанию no-store; явно кэшируемые ресурсы — по 08 §2.8.
      schema:
        type: string
        example: no-store
    ContentLanguage:
      description: Фактический язык сообщений (08 §2.3, §2.13).
      schema:
        $ref: '#/components/schemas/Locale'
    ETag:
      description: Тег версии представления для условных запросов If-None-Match → 304 (08 §2.8).
      schema:
        type: string
    IdempotentReplayed:
      description: |
        true — ответ на повтор по Idempotency-Key (08 §2.7): тело — сохранённый ответ, а для операций с шагом после COMMIT (формирование QR) — текущее представление того же ресурса (B-AR-04; см. параметр Idempotency-Key).
      schema:
        type: boolean
    Location:
      description: URI созданного/принятого ресурса (например, 202 POST /orders, 202 POST /sync/runs).
      schema:
        type: string
    OrdersContentDisposition:
      description: inline; filename="<kind>-<publicNumber>.pdf" (08 §4.8.5).
      schema:
        type: string
        example: inline; filename="invoice-POS-2026-000123.pdf"
    RetryAfter:
      description: Секунды до повтора; при 429, 503 и 409 IDEMPOTENCY_IN_PROGRESS (08 §2.3).
      schema:
        type: integer
        minimum: 0
    XDataAsOf:
      description: Момент снимка данных 1С (onec_snapshot_at, UTC) на /inventory/*, /customers/{id}/receivables, /catalog/products* (08 §2.3).
      schema:
        type: string
        format: date-time
    XMinAppVersion:
      description: Минимальная версия клиента, platform=semver через запятую; на КАЖДОМ ответе, включая ошибки и 426 (ядро §18.2 п.12; 08 §2.11).
      schema:
        type: string
        example: android=1.2.0,windows=1.2.0,ios=1.2.0
    XRateLimitLimit:
      description: 'Информационный: лимит группы (08 §2.9); клиент не обязан читать.'
      schema:
        type: integer
    XRateLimitRemaining:
      description: 'Информационный: остаток запросов в окне (08 §2.9).'
      schema:
        type: integer
    XRateLimitReset:
      description: 'Информационный: секунды до сброса окна (08 §2.9).'
      schema:
        type: integer
    XRecommendedAppVersion:
      description: Рекомендуемая версия клиента (мягкий баннер, D-46), тот же формат; на каждом ответе, если задана (08 §2.11).
      schema:
        type: string
        example: android=1.3.0,windows=1.3.0
    XRequestId:
      description: Сквозной идентификатор запроса; всегда в ответе; = instance в problem+json (08 §2.3).
      schema:
        type: string
        format: uuid
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        Access JWT (EdDSA/ES256, kid; TTL 15 мин для всех ролей; iss=optomstroy-pos, aud=optomstroy-api). Нет/невалиден → 401 UNAUTHENTICATED; отозванная сессия → 401 SESSION_REVOKED; устаревшие права → 401 TOKEN_STALE (08 §2.2).
    integrationToken:
      type: http
      scheme: bearer
      description: |
        Непрозрачный технический токен роли integration (256 бит, только таблица integration_tokens; выпуск — скриптом bin/issue_integration_token). Только для /integrations/onec/*; пользовательский JWT там → 403 FORBIDDEN (08 §4.21).
    stepUpToken:
      type: apiKey
      in: header
      name: X-Step-Up-Token
      description: |
        stepUpToken из POST /auth/step-up (JWT 15 мин, purpose=step_up, привязан к sid и deviceId; многоразовый в своей области scope). Отсутствие/просрочка/чужая область → 403 STEP_UP_REQUIRED (08 §2.12).
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: 'Подпись банка для POST /payments/qr/webhook — только QR_PROVIDER=bakai (R2). [НЕ ПОДТВЕРЖДЕНО: контракт банка, Q-014]'
