      summary: Принять оплату по заказу (наличные, QR, «Обновить QR»)
      description: |
        Для заказов paymentMethod ∈ cash | qr_bakai в статусах submitting, pending_approval, approved, awaiting_payment (ядро §22.5); иначе или isPaid → 409 ORDER_STATE_INVALID. Сумму клиент не передаёт: amount = totalToPay − paidAmount; receivedAmount — только для сдачи наличными. 200 — действие над открытым платежом того же способа (приём наличных по cash_pending; reissueQr или формирование QR на том же id); 201 — новый платёж (в т. ч. смена cash ↔ qr_bakai с автоматическим voided прежнего cash_pending/qr_pending/qr_shown, voidReason=method_changed, без step-up — ядро §23 п.3). QR_PROVIDER=onec: QR — новый запрос к 1С с тем же paymentExternalId; недоступность 1С → не 503, а 200/201 с qr_pending без qr (у перевыпускаемого — прежний статус и QR) + warnings[QR_UNAVAILABLE]; запасной путь — manualOnly: true и confirm-manual. Права по способу: cash — payment.cash.receive (cashier, senior_seller); qr_bakai — payment.qr.show (cashier, senior_seller; seller — свой заказ при оформлении; customer — только qr_bakai по своему неоплаченному заказу и только при QR_PROVIDER=onec, 11 §4.4); admin, owner → 403. method=credit или заказ в долг → 409 ORDER_STATE_INVALID (reason: payment_method_mismatch). Ошибки: 409 ORDER_STATE_INVALID, PAYMENT_STATE_INVALID (reissueQr не из qr_pending/qr_shown/qr_expired; reason: open_payment_exists + openPaymentId — открыт qr_expired/manual_confirm), IDEMPOTENCY_IN_PROGRESS; 422 VALIDATION_FAILED (received_less_than_due), IDEMPOTENCY_KEY_REUSED; 403 FORBIDDEN; 404 NOT_FOUND; 400 VALIDATION_FAILED; 503 QR_UNAVAILABLE — только QR_PROVIDER=bakai (R2), как у POST /payments (B-AR-13). Повтор с тем же Idempotency-Key возвращает текущее представление платежа (с QR, выданным после COMMIT; B-AR-04). Ключ живёт только в памяти — после перезапуска автоповтора нет. 08 §4.8.6; Q-012, Q-014, Q-016.
      security:
      - bearerAuth: []
      x-permissions:
      - payment.cash.receive
      - payment.qr.show
      x-roles:
      - seller
      - cashier
      - senior_seller
