  /returns/{id}/accept:
    post:
      tags:
      - returns
      operationId: returns_accept
      summary: Согласовать заявку на возврат в POS (только RETURNS_FROM_POS_ENABLED=false; step-up)
      description: |
        08 §4.15.6 (ядро §22.11, §23 п.8): submitted → accepted — заявка согласована старшим в POS, когда передача в 1С через outbox выключена (RETURNS_FROM_POS_ENABLED=false, по умолчанию): заявка печатается и оформляется в 1С вручную, completed придёт проекцией документа возврата 1С. При RETURNS_FROM_POS_ENABLED=true accepted ставит только 1С → 409 ORDER_STATE_INVALID (reason: already_in_onec). Не submitted → 409 ORDER_STATE_INVALID (reason: invalid_transition). Только return.approve (senior_seller, admin); cashier, owner, seller, customer → 403 FORBIDDEN. Ошибки также 403 STEP_UP_REQUIRED, 409 VERSION_CONFLICT, 404 NOT_FOUND. Модуль в целом — по returns_enabled (RET-012). Аудит return.status_changed (submitted → accepted, stepUpMethod). Cache-Control: no-store.
