        expiresAt:
          type: string
          format: date-time
        phoneMasked:
          $ref: '#/components/schemas/PhoneMasked'
    AdminInvitationsCreateRequest:
      type: object
      required:
      - phone
      - roles
      additionalProperties: false
      description: Тело POST /admin/invitations (08 §4.18.4).
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        roles:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          items:
            type: string
            enum:
            - seller
            - cashier
            - senior_seller
            - admin
            - owner
