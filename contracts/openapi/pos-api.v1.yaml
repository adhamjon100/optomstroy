      properties:
        id:
          type: string
          format: uuid
        orderId:
          type: string
          format: uuid
          nullable: true
        customerId:
          type: string
          format: uuid
          nullable: true
        method:
          $ref: '#/components/schemas/PaymentMethod'
        status:
          $ref: '#/components/schemas/PaymentStatus'
        amount:
          $ref: '#/components/schemas/Money'
        receivedAmount:
          allOf:
          - $ref: '#/components/schemas/Money'
          type: object
          nullable: true
        changeAmount:
          allOf:
          - $ref: '#/components/schemas/Money'
          type: object
          nullable: true
        qr:
          allOf:
          - $ref: '#/components/schemas/QrInfo'
          type: object
          nullable: true
        externalRef:
          type: string
          nullable: true
