  /auth/unlock:
    post:
      tags:
      - auth
      operationId: auth_unlock
      summary: Разблокировать сессию по PIN или биометрии с криптопривязкой (с ротацией refresh)
      description: |
        08 §4.1.8; ядро §18.2 п.5, §19.3; D-48. Без access JWT: субъект — refreshToken + X-Device-Id, второй фактор — PIN (серверная проверка) или method=biometric (biometric_refresh после системной биометрии; не Windows). Без method — pin. biometricInvalidated=true (с method=pin) отзывает биометрическую семью устройства и выключает Me.security.biometricsEnabled. Сервер устанавливает sessions.unlocked_until = now() + SESSION_IDLE_LOCK_MINUTES. Ротация refresh — по правилам /auth/refresh (окно грации 30 с, reuse-detection). Ошибки: 400 VALIDATION_FAILED; 401 PIN_INVALID (attemptsLeft; клиент не вызывает /auth/refresh), SESSION_REVOKED; 403 FORBIDDEN (reason pin_not_set); 423 PIN_LOCKED; 429 RATE_LIMITED. Rate limit: RL-PIN, RL-AUTH. Аудит: auth.unlock (метод, result, deviceId; без PIN); auth.pin.locked. Кэширование: no-store.
      security: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-PIN
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
