            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthStepUpToken'
        '202':
          description: 'method=otp, шаг 1: код отправлен на номер пользователя (purpose=step_up).'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthOtpChallengeIssued'
        '400':
          $ref: '#/components/responses/BadRequest'
