            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/RegistrationCompleteAuthenticated'
                - $ref: '#/components/schemas/AuthPendingActivation'
                discriminator:
                  propertyName: status
                  mapping:
                    authenticated: '#/components/schemas/RegistrationCompleteAuthenticated'
