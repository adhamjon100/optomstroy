      summary: Создать сотрудника (приглашение по телефону)
      description: '08 §4.18.1; ядро §24.2 (сотрудники не регистрируются сами), 11 §4.3 №50, SEC-033. Создаёт user_invitations (телефон → роли); если пользователь с этим телефоном уже pending_activation — сразу активирует его с ролями приглашения (каноническая операция активации: active, kind=staff; аудит user.activated + user.role_changed). Только admin, step-up (operation users.manage). Персональные лимит скидки и склады в R1 не задаются: discountLimitPercent, warehouseIds в теле → VALIDATION_FAILED rule forbidden_field. Ошибки: 400 VALIDATION_FAILED (схема, forbidden_field, idempotency_key_required); 401; 403 FORBIDDEN (reason: owner_role_reserved — roles содержит owner, 11 SEC-040; reason: role_not_invitable — роль вне seller, cashier, senior_seller, например admin, 08 §4.18.4 «Уточнения» п. 1), STEP_UP_REQUIRED; 409 PHONE_ALREADY_REGISTERED (уже активный пользователь — использовать PUT /admin/users/{id}/roles; reason: customer_account — номер действующего customer, клиент приглашением в сотрудники не переводится, 08 §4.18.4 п. 2, 11 SEC-136 п. 4, Q-312), IDEMPOTENCY_IN_PROGRESS; 422 VALIDATION_FAILED (roles содержит integration — ядро §18.2 п.4; rule max_items — в roles больше одной роли; rule required — нет fullName; 08 §4.18.4 п. 3), IDEMPOTENCY_KEY_REUSED. Аудит user.invited, user.activated (если был pending_activation). Все операции модуля admin — permission по 08 §9 / 11 §4.4; изменения — аудит с before/after (08 §4.18). Cache-Control: no-store. Ответ 201 (08 §4.18.4 «Уточнения» п. 4; ADR-097, контракт 1.1.0): номер pending_activation — AdminUser (активация) и Location /api/v1/admin/users/{id}; номер без учётной записи — строка users заранее не создаётся (её создаёт первый OTP-вход, 07 DATA-102), ответ — Invitation и Location /api/v1/admin/invitations/{id}. Клиент различает ветки по форме ответа (у Invitation нет kind) или по Location.'
      security:
      - bearerAuth: []
        stepUpToken: []
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdempotencyKey'
      - $ref: '#/components/parameters/StepUpToken'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUsersCreateRequest'
      responses:
        '201':
          description: 'Создано (08 §4.18.4 «Уточнения» п. 4): AdminUser — пользователь pending_activation активирован с ролями приглашения; Invitation — номер без учётной записи, создано приглашение (users не создаётся до первого OTP-входа). Location — URI созданного ресурса.'
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Location:
              $ref: '#/components/headers/Location'
          content:
            application/json:
              schema:
                oneOf:
                - $ref: '#/components/schemas/AdminUser'
                - $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        default:
          $ref: '#/components/responses/Problem'
