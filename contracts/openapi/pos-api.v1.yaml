      additionalProperties: false
      description: 'Элемент objects[] пакета (08 §4.21.1; 05 §10.1): изменение — с data; удаление — type: ObjectDeletion без data. Элемент без data и без type: ObjectDeletion → VALIDATION_FAILED. Имена objectType — [ТИПОВО: Q-010].'
      properties:
        type:
