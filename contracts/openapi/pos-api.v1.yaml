  /auth/sessions/{sessionId}:
    delete:
      tags:
      - auth
      operationId: auth_session_revoke
      summary: Отозвать свою сессию (другого устройства — со step-up)
      description: |
        08 §4.1.6; ядро §17.2. Отзыв текущей сессии = logout (без step-up). Отзыв своей сессии на другом устройстве — step-up обязателен (operation session.revoke.other): X-Step-Up-Token обязателен, если sessionId ≠ текущей. Чужой или неизвестный sessionId → 404. Повтор → 204. Access-токены отозванной сессии отклоняются ≤ 60 с. Ошибки: 401; 403 STEP_UP_REQUIRED (другое устройство без токена), FORBIDDEN; 404 NOT_FOUND. Rate limit: RL-AUTH. Аудит: session.revoked (stepUpMethod для другой сессии). Кэширование: no-store.
