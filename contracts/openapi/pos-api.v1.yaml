        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /auth/refresh:
    post:
      tags:
      - auth
      operationId: auth_refresh
      summary: Ротация пары access/refresh
      description: |
        08 §4.1.3, §2.2. Только обычная ротация по непрозрачному refresh (тело); аутентификация — по refresh и X-Device-Id. biometric_refresh здесь не принимается (400 VALIDATION_FAILED rule use_unlock) — только POST /auth/unlock. Поля kind и amr → 400 rule forbidden_field. Окно грации 30 с: повтор с предыдущим refresh возвращает ту же новую пару; позже — reuse → отзыв семьи + аудит session.reuse_detected. Ошибки: 400 VALIDATION_FAILED; 401 SESSION_REVOKED (неизвестен / отозван / просрочен / reuse / чужой deviceId / idle-отзыв), UNLOCK_REQUIRED (staff на Windows без действующего unlocked_until, D-48); 429 RATE_LIMITED. Rate limit: RL-AUTH. Кэширование: no-store (токены).
