      - rowVersion
      additionalProperties: false
      description: POST /cart/discount (08 §4.7.5). override — только при discount.approve.over_limit + X-Step-Up-Token.
      properties:
        percent:
          $ref: '#/components/schemas/Percent'
        ruleId:
          type: string
          format: uuid
          nullable: true
        rowVersion:
          type: integer
          minimum: 0
        override:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/CartOverride'
    CartItem:
      type: object
      required:
      - variantId
      - quantity
      properties:
        variantId:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        productName:
          type: string
        variantName:
          type: string
        sku:
          type: string
        image:
          $ref: '#/components/schemas/Image'
        quantity:
          $ref: '#/components/schemas/Quantity'
        packaging:
          $ref: '#/components/schemas/Packaging'
        unitPrice:
          $ref: '#/components/schemas/Money'
        priceSnapshot:
          $ref: '#/components/schemas/Money'
        lineTotal:
          $ref: '#/components/schemas/Money'
        lineDiscount:
          $ref: '#/components/schemas/Money'
        available:
          type: string
          pattern: ^-?\d{1,11}(\.\d{1,3})?$
          description: Для customer при customer_stock_display=status отсутствует (08 §3.6).
        remainingAvailable:
          allOf:
          - $ref: '#/components/schemas/QuantityValue'
          type: string
          nullable: true
          description: Сколько ещё базовых единиц можно добавить (available − quantity.baseValue, ≥ 0); null — остаток неизвестен, добавление запрещено (ядро §19.2).
        warnings:
          type: array
          items:
            $ref: '#/components/schemas/CartItemWarning'
        addedAt:
          type: string
          format: date-time
    CartItemWarning:
      type: string
      enum:
      - price_changed
      - stock_insufficient
      - variant_unavailable
      - qty_not_multiple
    CartOverride:
      type: object
      required:
      - reason
      additionalProperties: false
      description: 'Подтверждение сверх лимита / при блокировке долга из своей сессии со step-up: причина (08 §4.7.5, §4.8.1).'
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 500
          example: постоянный клиент
    CartParkRequest:
      type: object
      required:
      - rowVersion
      additionalProperties: false
      description: POST /cart/park (08 §4.7.6). name — подпись отложенной корзины (07 carts.name ≤ 80; по умолчанию «Клиент · время»).
      properties:
        name:
          type: string
          maxLength: 80
          example: Иван, доставка завтра
        rowVersion:
          type: integer
          minimum: 0
    CartParkResponse:
      type: object
      required:
      - parked
      - active
      description: Ответ 201 POST /cart/park (08 §4.7.6).
      properties:
        parked:
          allOf:
          - $ref: '#/components/schemas/Cart'
          description: Отложенная корзина (status=parked).
        active:
          allOf:
          - $ref: '#/components/schemas/Cart'
          description: Новая пустая активная корзина.
    CartParkedResumeRequest:
      type: object
      additionalProperties: false
      description: POST /cart/parked/{id}/resume (08 §4.7.6). merge — R2 (ядро §19.2), поля нет.
      properties:
        replaceActive:
          type: boolean
          default: false
          description: true — непустая текущая active паркуется как «Автосохранение <время>»; false — 409 active_not_empty.
    CartParkedSummary:
      type: object
      required:
      - id
      - status
      - rowVersion
      description: |
        Элемент GET /cart/parked — Cart без items (с itemsCount, total, customer, name, parkedAt, owner; 08 §4.7.6). Поля — подмножество Cart (08 §3.8) + owner.
      properties:
        id:
          type: string
          format: uuid
        status:
          $ref: '#/components/schemas/CartStatus'
        name:
          type: string
          nullable: true
        ownerId:
          type: string
          format: uuid
        owner:
          allOf:
          - $ref: '#/components/schemas/UserRef'
          description: Владелец отложенной корзины (для scope=all).
        customer:
          allOf:
          - $ref: '#/components/schemas/Customer'
          type: object
          nullable: true
          description: Ролевое представление Customer без сумм долга (только флаги).
        warehouseId:
          type: string
          format: uuid
        priceListId:
          type: string
          format: uuid
        itemsCount:
          type: integer
          minimum: 0
        unitsCount:
          $ref: '#/components/schemas/QuantityValue'
        subtotal:
          $ref: '#/components/schemas/Money'
        discountTotal:
          $ref: '#/components/schemas/Money'
        total:
          $ref: '#/components/schemas/Money'
        restoredFromOrderId:
          type: string
          format: uuid
          nullable: true
        rowVersion:
          type: integer
        parkedAt:
          type: string
          format: date-time
          nullable: true
        expiresAt:
          type: string
          format: date-time
          nullable: true
        audit:
          $ref: '#/components/schemas/AuditMeta'
    CartPutItemRequest:
      type: object
      required:
      - quantity
      - rowVersion
      additionalProperties: false
      description: PUT /cart/items/{variantId} (08 §4.7.2). Цены (price, unitPrice) запрещены — forbidden_field.
      properties:
        quantity:
          $ref: '#/components/schemas/Quantity'
        priceSnapshot:
          allOf:
          - $ref: '#/components/schemas/Money'
          description: Цена, которую видел пользователь — только для предупреждения price_changed, не для расчёта.
        rowVersion:
          type: integer
          minimum: 0
        mode:
          type: string
          enum:
          - set
          - increment
          default: set
          description: set — установить value (0 = удалить строку); increment — прибавить value (Idempotency-Key обязателен).
    CartStatus:
      type: string
      enum:
      - active
      - parked
      - converted
      - cleared
    CartUpdateRequest:
      type: object
      required:
      - warehouseId
      - rowVersion
      additionalProperties: false
      description: PATCH /cart — единственное изменяемое поле warehouseId (08 §4.7.8).
      properties:
        warehouseId:
          type: string
          format: uuid
        rowVersion:
          type: integer
          minimum: 0
    CatalogAttributeKey:
      type: object
      required:
      - key
      - name
      - values
      description: Ось выбора варианта (08 §4.4.4).
      properties:
        key:
          type: string
          example: color
        name:
          type: string
          example: Цвет
        values:
          type: array
          items:
            type: string
          example:
          - хром
          - чёрный
    CatalogCategoriesResponse:
      type: object
      required:
      - items
      description: Ответ GET /catalog/categories (08 §4.4.1).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogCategoryNode'
        asOf:
          type: string
          format: date-time
        snapshotVersion:
          type: string
          example: cat:2026-10-18T06:30:00Z:48213
          description: Версия снимка последней успешной синхронизации сущности; основа ETag (08 §2.8).
    CatalogCategoryNode:
      description: 'Узел дерева категорий: Category + вложенные children (08 §4.4.1).'
      allOf:
      - $ref: '#/components/schemas/Category'
      - type: object
        properties:
          children:
            type: array
            items:
              $ref: '#/components/schemas/CatalogCategoryNode'
    CatalogFacetValue:
      type: object
      required:
      - value
      - count
      properties:
        value:
          type: string
          example: Grohe
        count:
          type: integer
          minimum: 0
          example: 12
    CatalogPriceList:
      type: object
      required:
      - id
      - name
      description: 'Вид цены (08 §4.4.6, §4.24 price_lists): isDefault — price_lists.is_default, visibleToRoles — price_lists.visible_to_roles (07 §5.26). Поле isDefaultForRoles прежней редакции не используется.'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Оптовая
        code:
          type: string
        currency:
          type: string
          enum:
          - KGS
        isDefault:
          type: boolean
        visibleToRoles:
          type: array
          items:
            $ref: '#/components/schemas/RoleCode'
    CatalogPriceListsResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogPriceList'
    CatalogProductFacets:
      type: object
      description: Необязательные фасеты списка товаров (08 §4.4.2).
      properties:
        brands:
          type: array
          items:
            $ref: '#/components/schemas/CatalogFacetValue'
        attrs:
          type: object
          additionalProperties:
            type: array
            items:
              $ref: '#/components/schemas/CatalogFacetValue'
          description: Ключ — код свойства (color, size …).
        priceRange:
          $ref: '#/components/schemas/MoneyRange'
    CatalogRecentProduct:
      description: ProductSummary + момент просмотра (08 §4.4.5).
      allOf:
      - $ref: '#/components/schemas/ProductSummary'
      - type: object
        required:
        - viewedAt
        properties:
          viewedAt:
            type: string
            format: date-time
    CatalogRecentProductsResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogRecentProduct'
    CatalogSyncAttribute:
      type: object
      required:
      - id
      - code
      - name
      description: Элемент entity=attributes (08 §4.24; product_attributes 07 §5.18); valueType, unitLabel, isFilterable, isVariantAxis, sortOrder — 08 §4.24.1 п. 2 (добавлены в 1.1.0).
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
          example: color
        name:
          type: string
          example: Цвет
        values:
          type: array
          items:
            type: string
        valueType:
          type: string
          enum:
          - text
          - number
          - boolean
          - list
          description: Тип значения — enum attribute_value_type (07 §6.1, product_attributes.value_type). 08 §4.24.1 п. 2; добавлено в 1.1.0.
        unitLabel:
          type: string
          description: Единица числового свойства («мм», «кг»); нет значения — поле отсутствует.
        isFilterable:
          type: boolean
        isVariantAxis:
          type: boolean
        sortOrder:
          type: integer
    CatalogSyncBarcode:
      type: object
      required:
      - barcode
      - variantId
      - type
      description: Элемент entity=barcodes (08 §4.24); id, productId — 08 §4.24.1 п. 2 (добавлены в 1.1.0).
      properties:
        id:
          type: string
          format: uuid
          description: uuid строки сервера — ключ сопоставления с deleted[] (08 §4.24.1 п. 1, FIX-EF-01).
        barcode:
          type: string
          example: '4600000000017'
        variantId:
          type: string
          format: uuid
        packagingId:
          type: string
          format: uuid
          nullable: true
        type:
          $ref: '#/components/schemas/BarcodeType'
        productId:
          type: string
          format: uuid
          description: Товар штрихкода (EQ-FEF-02).
    CatalogSyncCategory:
      description: 'Элемент entity=categories: Category + поля дерева и момент изменения (08 §4.24.1 п. 2, EQ-FEF-03; добавлено в 1.1.0). Экранные ответы GET /catalog/categories этих полей не содержат.'
      allOf:
      - $ref: '#/components/schemas/Category'
      - type: object
        properties:
          path:
            type: string
            pattern: ^(/[0-9a-f-]{36})+$
            example: /0192d1c3-0000-7000-8000-000000000001/0192d1c3-0000-7000-8000-000000000002
            description: Materialized path из id предков /{root_id}/{child_id} (07 categories.path).
          depth:
            type: integer
            minimum: 0
            maximum: 10
            description: Глубина в дереве, корень — 0 (07 categories.depth).
          isVisible:
            type: boolean
            description: Признак показа категории в каталоге (07 categories.is_visible).
          updatedAt:
            type: string
            format: date-time
            description: Момент последнего изменения строки сервера (позиция курсора выгрузки).
    CatalogSyncEntity:
      type: string
      description: Сущность офлайн-кэша каталога — ровно перечень ядра §22.7 (08 §4.24); иное → VALIDATION_FAILED rule enum. Это не SyncEntity (сущности обмена с 1С).
      enum:
      - categories
      - products
      - variants
      - units
      - packagings
      - barcodes
      - price_lists
      - prices
      - stock
      - warehouses
      - attributes
      - images
    CatalogSyncImage:
      description: 'Элемент entity=images: Image + productId/variantId; файлы — GET /images/{sha}/{size} (08 §4.24, §4.4.7); id, sortOrder — 08 §4.24.1 п. 2 (добавлены в 1.1.0).'
      allOf:
      - $ref: '#/components/schemas/Image'
      - type: object
        properties:
          id:
            type: string
            format: uuid
            description: uuid строки сервера (product_images) — ключ сопоставления с deleted[] (08 §4.24.1 п. 1, FIX-EF-01).
          productId:
            type: string
            format: uuid
          variantId:
            type: string
            format: uuid
            nullable: true
          sortOrder:
            type: integer
    CatalogSyncPackaging:
      description: 'Элемент entity=packagings: Packaging + variantId (08 §4.24); productId, sortOrder — 08 §4.24.1 п. 2 (добавлены в 1.1.0).'
      allOf:
      - $ref: '#/components/schemas/Packaging'
      - type: object
        required:
        - variantId
        properties:
          variantId:
            type: string
            format: uuid
          productId:
            type: string
            format: uuid
            description: Товар упаковки (EQ-FEF-02).
          sortOrder:
            type: integer
    CatalogSyncPrice:
      description: 'Элемент entity=prices: Price + variantId (priceListId — в Price). Только виды цен, видимые роли (price_lists.visible_to_roles); все — при catalog.prices.read.all (08 §4.24); id — 08 §4.24.1 п. 2 (добавлен в 1.1.0).'
      allOf:
      - $ref: '#/components/schemas/Price'
      - type: object
        required:
        - variantId
        properties:
          id:
            type: string
            format: uuid
            description: uuid строки сервера — ключ сопоставления с deleted[] (08 §4.24.1 п. 1, FIX-EF-01).
          variantId:
            type: string
            format: uuid
    CatalogSyncProduct:
      type: object
      required:
      - id
      - name
      description: 'Элемент entity=products: Product без вычисляемых цен и остатков (price, priceRange, stock, stockByWarehouse, prices, availableTotal) и без полей пользователя/запроса (isFavorite, matchType); варианты, упаковки и фото приходят отдельными сущностями; imageIds — ссылки на элементы entity=images (08 §4.24).'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        sku:
          type: string
        categoryId:
          type: string
          format: uuid
        brand:
          type: string
        hasVariants:
          type: boolean
        defaultVariantId:
          type: string
          format: uuid
        baseUnit:
          $ref: '#/components/schemas/Unit'
        description:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        imageIds:
          type: array
          items:
            type: string
        barcodes:
          type: array
          items:
            type: string
        minQuantity:
          type: string
          nullable: true
          allOf:
          - $ref: '#/components/schemas/QuantityValue'
        multiplicity:
          type: string
          nullable: true
          allOf:
          - $ref: '#/components/schemas/QuantityValue'
          description: Кратность продажи товара в базовых единицах; null — не ведётся (Q-021). 08 §4.24.1 п. 2; добавлено в 1.1.0.
        isSellable:
          type: boolean
          description: Признак «продаётся» (07 products.is_sellable). 08 §4.24.1 п. 2; добавлено в 1.1.0.
        onecCode:
          type: string
        deletionMark:
          type: boolean
        updatedAt:
          type: string
          format: date-time
    CatalogSyncResponse:
      type: object
      required:
      - items
      - deleted
      - nextCursor
      - hasMore
      - serverTime
      description: 'Ответ GET /catalog/sync/{entity} — ровно поля ядра §22.7 (08 §4.24). Схема элемента items по entity: categories → CatalogSyncCategory; products → CatalogSyncProduct; variants → CatalogSyncVariant; units → Unit; packagings → CatalogSyncPackaging; barcodes → CatalogSyncBarcode; price_lists → CatalogPriceList; prices → CatalogSyncPrice; stock → StockBalance (для customer — по customer_stock_display); warehouses → CatalogSyncWarehouse; attributes → CatalogSyncAttribute; images → CatalogSyncImage. Машиночитаемое соответствие — x-entity-schema (B-AR-14): клиент декодирует items в одной точке data-слоя по значению entity пути, а не по форме объекта (anyOf без дискриминатора).'
      x-entity-schema:
        categories: '#/components/schemas/CatalogSyncCategory'
        products: '#/components/schemas/CatalogSyncProduct'
        variants: '#/components/schemas/CatalogSyncVariant'
        units: '#/components/schemas/Unit'
        packagings: '#/components/schemas/CatalogSyncPackaging'
        barcodes: '#/components/schemas/CatalogSyncBarcode'
        price_lists: '#/components/schemas/CatalogPriceList'
        prices: '#/components/schemas/CatalogSyncPrice'
        stock: '#/components/schemas/StockBalance'
        warehouses: '#/components/schemas/CatalogSyncWarehouse'
        attributes: '#/components/schemas/CatalogSyncAttribute'
        images: '#/components/schemas/CatalogSyncImage'
      properties:
        items:
          type: array
          items:
            anyOf:
            - $ref: '#/components/schemas/CatalogSyncCategory'
            - $ref: '#/components/schemas/CatalogSyncProduct'
            - $ref: '#/components/schemas/CatalogSyncVariant'
            - $ref: '#/components/schemas/Unit'
            - $ref: '#/components/schemas/CatalogSyncPackaging'
            - $ref: '#/components/schemas/CatalogSyncBarcode'
            - $ref: '#/components/schemas/CatalogPriceList'
            - $ref: '#/components/schemas/CatalogSyncPrice'
            - $ref: '#/components/schemas/StockBalance'
            - $ref: '#/components/schemas/CatalogSyncWarehouse'
            - $ref: '#/components/schemas/CatalogSyncAttribute'
            - $ref: '#/components/schemas/CatalogSyncImage'
          maxItems: 200
          description: Полные карточки объектов сущности (upsert по id на клиенте).
        deleted:
          type: array
          items:
            type: string
            format: uuid
          description: id объектов, получивших deletion_mark или исчезнувших из среза после since.
        nextCursor:
          type: string
          description: 'Присутствует всегда: при hasMore=true — курсор следующей страницы; при hasMore=false — контрольная точка для следующего инкремента (sync_meta, 07 §11.2).'
        hasMore:
          type: boolean
        serverTime:
          type: string
          format: date-time
    CatalogSyncVariant:
      type: object
      required:
      - id
      - productId
      description: 'Элемент entity=variants: Variant без price/stock/stockByWarehouse, с multiplicity и unitId; фото — entity=images (08 §4.24).'
      properties:
        id:
          type: string
          format: uuid
        productId:
          type: string
          format: uuid
        isDefault:
          type: boolean
        name:
          type: string
        sku:
          type: string
        attributes:
          type: object
          additionalProperties:
            type: string
        barcodes:
          type: array
          items:
            type: string
        multiplicity:
          type: string
          nullable: true
          allOf:
          - $ref: '#/components/schemas/QuantityValue'
          description: Кратность продажи в базовых единицах; null — не ведётся (Q-021).
        unitId:
          type: string
          format: uuid
        sortOrder:
          type: integer
        deletionMark:
          type: boolean
    CatalogSyncWarehouse:
      type: object
      required:
      - id
      - name
      description: Элемент entity=warehouses (08 §4.24); shortName, isDefaultForPos, sortOrder — 08 §4.24.1 п. 2 (добавлены в 1.1.0).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        code:
          type: string
        isActive:
          type: boolean
        shortName:
          type: string
        isDefaultForPos:
          type: boolean
          description: Склад по умолчанию для новых корзин (07 warehouses.is_default_for_pos, EQ-FEF-12).
        sortOrder:
          type: integer
    CatalogUnitsResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Unit'
    CatalogVariantsResponse:
      type: object
      required:
      - items
      description: Ответ GET /catalog/products/{id}/variants (08 §4.4.4).
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Variant'
        attributeKeys:
          type: array
          items:
            $ref: '#/components/schemas/CatalogAttributeKey'
        asOf:
          type: string
          format: date-time
    CatalogWarehouse:
      type: object
      required:
      - id
      - name
      description: Склад для экранов (08 §4.4.6).
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          example: Основной
        code:
          type: string
        isActive:
          type: boolean
        isDefaultForPos:
          type: boolean
    CatalogWarehousesResponse:
      type: object
      required:
      - items
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/CatalogWarehouse'
    Category:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        parentId:
          type: string
          format: uuid
          nullable: true
        name:
          type: string
          example: Смесители
        code:
          type: string
          example: '000124'
        productCount:
          type: integer
          minimum: 0
        sortOrder:
          type: integer
        iconKey:
          type: string
          example: faucet
        imageUrl:
          type: string
          nullable: true
        hasChildren:
          type: boolean
        deletionMark:
          type: boolean
        onecRef:
          type: string
          format: uuid
    CheckoutPreview:
      type: object
      required:
      - cartId
      - cartRowVersion
      - ok
      description: Результат POST /cart/checkout-preview; ok=false с conflicts — не ошибка (08 §3.8).
      properties:
        cartId:
          type: string
          format: uuid
        cartRowVersion:
          type: integer
        ok:
          type: boolean
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/CartConflict'
        items:
          type: array
