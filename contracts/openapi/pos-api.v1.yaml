  /customers/{id}/receivables:
    get:
      operationId: customers_receivables_get
      tags:
      - customers
      summary: Долг клиента и детализация по документам (данные только из 1С)
      description: |
        08 §4.11.5 (SCR-34). Суммы — customer.receivables.read.summary (cashier, senior_seller, admin, owner); детализация include=documents — customer.receivables.read.detail; роль customer — customer.self.receivables.read, только свой при customer_links.status=confirmed, иначе 404 NOT_FOUND; seller → 403 FORBIDDEN. Step-up — ТОЛЬКО при include=documents, для всех ролей без исключений, включая customer: при первом просмотре в сессии и повторно, если с последнего step-up прошло > 15 мин (stepUp.operation = customer.receivables.read.detail). isStale=true, если now − asOf > staleAfterMinutes (60, RECEIVABLES_MAX_AGE_MIN). Параметр refresh сохранён для совместимости и подчиняется лимитам RL-RECV-REFRESH; кнопка «Обновить» вызывает POST /customers/{id}/receivables/refresh. Для клиента source=pos с onecStatus ≠ confirmed ошибка не возвращается — 200 с balance: null, reason: not_in_onec (08 §4.11.5; см. замечание в схеме Receivable корня). Аудит customer.debt_viewed (summary / detail), customer.finance.view (детализация). Ошибки: 403 STEP_UP_REQUIRED (детализация), 403 FORBIDDEN (seller), 404 NOT_FOUND (чужой для customer); общие (08 §4).
      x-permissions:
      - customer.receivables.read.summary
      - customer.receivables.read.detail
      - customer.self.receivables.read
      x-roles:
      - cashier
      - senior_seller
      - admin
      - owner
      - customer
      x-step-up: true
      x-step-up-operation:
      - customer.receivables.read.detail
      x-idempotent: false
      x-rate-limit-group: RL-READ
      security:
      - bearerAuth: []
      - bearerAuth: []
        stepUpToken: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/StepUpToken'
      - name: include
        in: query
        required: false
        description: documents — детализация по документам (customer.receivables.read.detail; step-up).
        schema:
          type: string
          enum:
          - documents
      - name: refresh
        in: query
        required: false
        description: true — синхронный запрос в 1С (таймаут 6000 мс); при недоступности — снимок + isStale. Лимиты RL-RECV-REFRESH.
        schema:
          type: boolean
      responses:
        '200':
          description: Receivable (08 §3.7); documents[] — только при include=documents со step-up.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            X-Data-As-Of:
              $ref: '#/components/headers/XDataAsOf'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receivable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        default:
          $ref: '#/components/responses/Problem'
  /customers/{id}/receivables/refresh:
    post:
      operationId: customers_receivables_refresh
      tags:
      - customers
      summary: Точечное синхронное обновление снимка долга клиента (ядро §19.2)
      description: |
        08 §4.11.8 (SCR-34 «Обновить»). Синхронно запрашивает у 1С сальдо, просрочку, лимит и (если доступна) детализацию одного клиента (OnecGateway.getReceivable), обновляет снимок receivables и asOf. Право customer.receivables.read.summary (cashier, senior_seller, admin, owner), без step-up; детализация в ответе — только при include=documents по правилам customer.receivables.read.detail со step-up; seller, customer → 403 FORBIDDEN. Single-flight: параллельный запрос по тому же клиенту получает ответ выполняемого; снимок моложе 30 с — 200 с текущим снимком и refreshed=false без обращения к 1С. Тела нет. Idempotency-Key не требуется (вне перечня 08 §2.7), допускается по общему правилу; автоповтор клиентом не выполняется. Аудит customer.debt_viewed (summary, refresh: true; при include=documents — дополнительно customer.finance.view). Ошибки: 503 ONEC_UNAVAILABLE (1С не ответила за ONEC_SYNC_CHECK_TIMEOUT_MS = 6000 мс; снимок не изменён), 422 CUSTOMER_NOT_IDENTIFIED (клиент source=pos с onecStatus ≠ confirmed), 403 STEP_UP_REQUIRED (include=documents без step-up), 403 FORBIDDEN, 404 NOT_FOUND, 429 RATE_LIMITED (retryAfter).
      x-permissions:
      - customer.receivables.read.summary
      - customer.receivables.read.detail
      x-roles:
      - cashier
      - senior_seller
      - admin
      - owner
      x-step-up: true
      x-step-up-operation:
      - customer.receivables.read.detail
      x-idempotent: true
      x-rate-limit-group: RL-RECV-REFRESH
      security:
      - bearerAuth: []
      - bearerAuth: []
        stepUpToken: []
      parameters:
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdempotencyKeyOptional'
      - $ref: '#/components/parameters/StepUpToken'
      - name: include
        in: query
        required: false
        description: documents — вернуть детализацию (customer.receivables.read.detail; step-up).
        schema:
          type: string
          enum:
          - documents
      responses:
        '200':
          description: Receivable с новым asOf, isStale=false, refreshed=true (или refreshed=false — снимок моложе 30 с).
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            X-Data-As-Of:
              $ref: '#/components/headers/XDataAsOf'
            Idempotent-Replayed:
              $ref: '#/components/headers/IdempotentReplayed'
            Cache-Control:
              $ref: '#/components/headers/CacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Receivable'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/UnprocessableEntity'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        default:
          $ref: '#/components/responses/Problem'
