      description: 'Первичная загрузка — вызовы без since страницами до hasMore=false; инкремент — since = последний сохранённый nextCursor сущности (08 §4.24, ядро §22.7). Курсор непрозрачный (base64url, HMAC) и монотонный по (updated_at, id); подделанный → 400 VALIDATION_FAILED rule cursor; старше срока хранения удалений (30 дней, 07 §11.4) → 409 VERSION_CONFLICT reason cursor_expired — клиент повторяет загрузку сущности без since. Рекомендуемый порядок: units → categories → attributes → warehouses → price_lists → products → variants → packagings → barcodes → prices → stock → images; не более 2 параллельных запросов. Права: catalog.read — все сущности; prices, price_lists — дополнительно catalog.prices.read, только виды цен из price_lists.visible_to_roles (все — при catalog.prices.read.all); stock — дополнительно inventory.read (customer — по customer_stock_display). Токен integration → 403. ETag = хэш (entity, since, nextCursor), Cache-Control: private, no-cache; If-None-Match → 304 — изменений после since нет. Повтор с тем же since → те же строки. Аудит не пишется.'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: entity
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CatalogSyncEntity'
      - name: since
        in: query
        required: false
        description: Непрозрачный курсор из nextCursor предыдущего ответа; отсутствует — выгрузка с начала.
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        required: false
        description: 1…200, по умолчанию 200; > 200 → VALIDATION_FAILED.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 200
      - name: warehouseId
        in: query
        required: false
        description: Только для entity=stock; по умолчанию — все активные склады.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Страница выгрузки сущности.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              description: Политика кэширования (08 §2.8).
              schema:
                type: string
                example: private, no-cache
            ETag:
              $ref: '#/components/headers/ETag'
            X-Data-As-Of:
              $ref: '#/components/headers/XDataAsOf'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSyncResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - catalog.read
      - catalog.prices.read
      - catalog.prices.read.all
      - inventory.read
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
