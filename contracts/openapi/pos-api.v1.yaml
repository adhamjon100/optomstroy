          minimum: 0
          description: Версия строки для PATCH /admin/users/{id} и PUT …/roles (VERSION_CONFLICT). В перечне полей AdminUser 08 §4.18.1 не названо — добавлено, т. к. тела PATCH и PUT …/roles требуют rowVersion.
    AdminUsersBlockRequest:
      type: object
      required:
      - blocked
      additionalProperties: false
      description: Тело POST /admin/users/{id}/block (08 §4.18.3).
      properties:
        blocked:
          type: boolean
          description: true — заблокировать, false — разблокировать.
        reason:
          type: string
          maxLength: 500
          example: увольнение
    AdminUsersCreateRequest:
      type: object
      required:
      - phone
      - fullName
      - roles
      additionalProperties: false
      description: Тело POST /admin/users (08 §4.18.1). discountLimitPercent, warehouseIds → VALIDATION_FAILED rule forbidden_field.
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        fullName:
          type: string
          minLength: 2
          maxLength: 150
          description: '07 users.full_name: 2…150.'
        roles:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            type: string
            enum:
            - seller
            - cashier
            - senior_seller
            - admin
            - owner
            description: 'user_invitations.role (07 §6.1.1): подмножество RoleCode без customer и integration.'
          description: 'R1: ровно одна роль — приглашение хранит одну роль (07 §5.3 user_invitations.role), активная роль пользователя одна (07 §5.7 user_roles_one_active_uq); расширение maxItems — после решения Q-005 (expand-изменение; B-AR-02). owner → 403 FORBIDDEN (owner_role_reserved, 11 SEC-040); integration — не принимается (ядро §18.2 п.4).'
    AdminUsersEmergencyLoginCodeRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      description: Тело POST /admin/users/{id}/emergency-login-code (08 §4.18.10).
      properties:
        reason:
          type: string
          enum:
          - sms_unavailable
          - sim_lost
          - other
        comment:
          type: string
          nullable: true
          minLength: 5
          maxLength: 200
          description: Обязателен при reason=other (иначе VALIDATION_FAILED).
    AdminUsersPinResetRequest:
      type: object
      required:
      - reason
      additionalProperties: false
      description: Тело DELETE /admin/users/{id}/pin (08 §4.18.9; 11 SEC-076).
      properties:
        reason:
          type: string
          minLength: 5
          maxLength: 500
          example: сотрудник забыл PIN
    AdminUsersRolesSetRequest:
      type: object
      required:
      - roles
      - rowVersion
      additionalProperties: false
      description: 'Тело PUT /admin/users/{id}/roles (08 §4.18.2): полная замена набора ролей.'
      properties:
        roles:
          type: array
          minItems: 1
          maxItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/RoleCode'
          description: 'R1: ровно одна роль (07 §5.7: одна активная роль, user_roles_one_active_uq) — больше одной → 400 VALIDATION_FAILED по схеме, а не 500 из БД; расширение maxItems — после решения Q-005 (expand-изменение; B-AR-02). Me.roles и AdminUser.roles остаются массивами. integration → 422 VALIDATION_FAILED (ядро §18.2 п.4); ограничения по owner — 11 SEC-040, ядро §21 п.3.'
        reason:
          type: string
          maxLength: 500
          example: перевод на кассу
        rowVersion:
          type: integer
          minimum: 0
    AdminUsersUpdateRequest:
      type: object
      required:
      - rowVersion
      additionalProperties: false
      description: 'Тело PATCH /admin/users/{id} (08 §4.18.1): только fullName; роли и статус — отдельными операциями.'
      properties:
        fullName:
          type: string
          minLength: 2
          maxLength: 150
        rowVersion:
          type: integer
          minimum: 0
    AuditMeta:
      type: object
      description: Встраивается в документы POS (08 §3.5).
      properties:
        createdAt:
          type: string
          format: date-time
        createdBy:
          $ref: '#/components/schemas/UserRef'
        updatedAt:
          type: string
          format: date-time
        updatedBy:
          $ref: '#/components/schemas/UserRef'
        rowVersion:
          type: integer
        deviceId:
          type: string
    AuditRow:
      type: object
      required:
      - id
      - occurredAt
      - action
      - result
      - chainOk
      description: Строка журнала аудита (08 §4.18.7; имя схемы — из 08 §8; используется также в GET /transactions/{id}, 08 §4.14.2). Для admin финансовые значения before/after маскируются ("***"), owner видит полностью (API-118, API-134, 11 SEC-083).
      properties:
        id:
          type: string
          format: uuid
        occurredAt:
          type: string
          format: date-time
        requestId:
          type: string
        actor:
          type: object
          nullable: true
          allOf:
          - $ref: '#/components/schemas/UserRef'
          description: null — системный актор (воркер, integration).
        actorRole:
          allOf:
          - $ref: '#/components/schemas/RoleCode'
          description: Роль актора на момент события.
        sessionId:
          type: string
          format: uuid
          nullable: true
        deviceId:
          type: string
          nullable: true
        ip:
          type: string
          nullable: true
        appVersion:
          type: string
          nullable: true
        action:
          type: string
          example: payment.manual_qr_confirmed
          description: Имя события — словарь 11 §7.2, §7.2.1.
        entityType:
          type: string
          nullable: true
        entityId:
          type: string
          nullable: true
        onecRef:
          type: string
          format: uuid
          nullable: true
        before:
          type: object
          nullable: true
          additionalProperties: true
        after:
          type: object
          nullable: true
          additionalProperties: true
        result:
          type: string
          enum:
          - ok
          - denied
          - error
          description: audit_logs.result (07 §6.1.1).
        stepUpMethod:
          type: string
          nullable: true
          allOf:
          - $ref: '#/components/schemas/StepUpMethod'
        reason:
          type: string
          nullable: true
        rowHash:
          type: string
        chainOk:
          type: boolean
          description: 'Результат проверки хэш-цепочки prev_hash/row_hash (07, D-36): false — нарушение целостности (ядро §19.2).'
    AuthAuthenticated:
      type: object
      required:
      - status
      - accessToken
      - refreshToken
      description: |
        Ветка authenticated (08 §4.1.2, §8; имя схемы — 08 §8). roleSource и nextStep=set_pin — только первый вход сотрудника по приглашению (ядро §24.2); для повторных входов roleSource не возвращается, nextStep — none.
      properties:
        status:
          type: string
          enum:
          - authenticated
        accessToken:
          type: string
        accessExpiresIn:
          type: integer
          example: 900
        refreshToken:
          type: string
        refreshExpiresAt:
          type: string
          format: date-time
        tokenType:
          type: string
          enum:
          - Bearer
        sid:
          type: string
          format: uuid
        user:
          $ref: '#/components/schemas/Me'
        biometricRefreshOffered:
          type: boolean
          description: true только для Android class3 / iOS; Windows и сотрудник до установки PIN — false.
        roleSource:
          type: string
          enum:
          - invitation
          description: только первый вход сотрудника по приглашению (ядро §24.2)
        nextStep:
          type: string
          enum:
          - set_pin
          - none
    AuthDeviceInfo:
      type: object
      required:
      - name
      - platform
      - appVersion
      additionalProperties: false
      description: Сведения об устройстве при входе/регистрации (08 §4.1.2, §8 OtpVerifyRequest.device).
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
          example: Samsung SM-A525F
        platform:
          $ref: '#/components/schemas/DevicePlatform'
        osVersion:
          type: string
          maxLength: 32
          example: '14'
        appVersion:
          type: string
          maxLength: 32
          example: 1.4.2+87
        biometricClass:
          type: string
          enum:
          - class3
          - class2
          - none
          - windows_hello
          description: Класс биометрии устройства (08 §4.1.2); biometricRefreshOffered=true только для Android class3 / iOS.
    AuthLogoutRequest:
      type: object
      additionalProperties: false
      description: Необязательное тело POST /auth/logout (08 §4.1.4).
      properties:
        reason:
          type: string
          maxLength: 500
          example: user
    AuthOtpChallengeIssued:
      type: object
      required:
      - challengeId
      - resendAfterSec
      - otpTtlSec
      description: '202 при отправке OTP: POST /auth/step-up (method=otp, шаг 1) и POST /me/phone/change/request (08 §4.1.7, §4.3.3).'
      properties:
        challengeId:
          type: string
          format: uuid
        resendAfterSec:
          type: integer
          minimum: 0
          example: 60
        otpTtlSec:
          type: integer
          minimum: 0
          example: 300
    AuthOtpChallengeStatus:
      type: object
      required:
      - challengeId
      - delivery
      description: 'GET /auth/otp/challenges/{challengeId} (08 §4.1.9): без ПДн и без кода ошибки провайдера.'
      properties:
        challengeId:
          type: string
          format: uuid
        delivery:
          type: string
          enum:
          - queued
          - sent
          - failed
          description: queued — в очереди/передаётся; sent — провайдер принял или DLR «доставлено»; failed — отказ провайдера или DLR «не доставлено».
        resendAfterSec:
          type: integer
          minimum: 0
          example: 42
        expiresAt:
          type: string
          format: date-time
        channel:
          type: string
          example: sms
    AuthOtpRequestRequest:
      type: object
      required:
      - phone
      - purpose
      additionalProperties: false
      description: Тело POST /auth/otp/request (08 §4.1.1, §8).
      properties:
        phone:
          $ref: '#/components/schemas/PhoneE164'
        purpose:
          type: string
          enum:
          - login_or_register
          description: Значение otp_purpose 07 §6; на этом маршруте — только login_or_register (иное → VALIDATION_FAILED rule purpose; ядро §18.2 п.7).
        locale:
          $ref: '#/components/schemas/Locale'
        attestation:
          type: string
          nullable: true
          maxLength: 8192
          description: Зарезервировано (R2, R6 §1.5); в R1 передаётся null или не передаётся.
      example:
        phone: '+996700000001'
        purpose: login_or_register
        locale: ru
        attestation: null
    AuthOtpRequestResponse:
      type: object
      required:
      - challengeId
      - resendAfterSec
      - otpTtlSec
      description: 202 POST /auth/otp/request (08 §4.1.1) — одинаков для любого номера.
      properties:
        challengeId:
          type: string
          format: uuid
        resendAfterSec:
          type: integer
          minimum: 0
          example: 60
        otpTtlSec:
          type: integer
          minimum: 0
          example: 300
        codeLength:
          type: integer
          example: 6
        phoneMasked:
          $ref: '#/components/schemas/PhoneMasked'
        deliveryHint:
          type: string
          example: sms
    AuthPendingActivation:
      type: object
      required:
      - status
      - accessToken
      - refreshToken
      description: 'Ветка pending_activation — только при CUSTOMER_SELF_SERVICE=false (08 §4.1.2, §4.2.1; имя — 08 §8). Ограниченная сессия: /me, /auth/*, SCR-07.'
      properties:
        status:
          type: string
          enum:
          - pending_activation
        accessToken:
          type: string
        refreshToken:
          type: string
        user:
          $ref: '#/components/schemas/Me'
    AuthRefreshRequest:
      type: object
      required:
      - refreshToken
