        paidAmount:
          $ref: '#/components/schemas/Money'
        isPaid:
          type: boolean
    OrdersPaymentResult:
      description: 'Ответ POST /orders/{id}/payments: Payment + order { paidAmount, isPaid } (08 §4.8.6).'
      allOf:
      - $ref: '#/components/schemas/Payment'
      - type: object
        required:
        - order
        properties:
          order:
            $ref: '#/components/schemas/OrdersPaymentOrderState'
    OrdersPaymentsListResponse:
      type: object
      required:
      - items
      description: GET /orders/{id}/payments — платежи заказа (08 §4.8.6); поле qr — только при payment.qr.show.
      properties:
        items:
          type: array
          maxItems: 500
          items:
            $ref: '#/components/schemas/Payment'
    OrdersWaybillStatus:
      type: object
