# =====================================================================================
# Optomstroy POS API — фрагмент модулей auth (/auth/*), registration (/registration/*), profile (/me*)
# RM-B-003. Источник истины: docs/specification/08_API_SPECIFICATION.md v1.9 — §2.2, §2.7, §2.9, §2.10, §2.12,
# §2.14, §3.14, §3.15, §4.1, §4.2, §4.3, §8 (скелет: OtpVerifyRequest, AuthAuthenticated, AuthPendingActivation,
# AuthRegistrationRequired), §9; права — 11 §4.3–§4.4 (x-permissions — только коды 11 §4.3); ядро R0 v1.9
# §19.2, §19.3, §22.12, §24.2 (приоритет). Общие компоненты — parts/00_root.yaml; правила — ../NOTES.md.
#
# Ключи openapi/info оставлены по постановке задачи (минимальные), чтобы фрагмент был самостоятельным YAML-документом;
# сборщик берёт из фрагмента только paths и components (NOTES §1). Ссылки — как в собранном документе (#/components/...).
#
# Не включено (R2 / не R1): POST /registration/face-scan/verify (ядро §17.4, 08 §4.2.3, 13 RM-B-003); методы step-up
# bio+pin / bio+otp и поле biometricAssertion (08 §2.12, §4.1.7; ядро §19.3); POST /me/devices/{id}/push-token (Q-036),
# /auth/phone/check, /auth/password/login, /auth/card/login, /registration/start, POST /registration/customer-match (08 §4.20).
#
# Решения автора фрагмента (зафиксированы здесь, т. к. NOTES.md вне зоны записи этой задачи):
#  A1. operationId — snake_case <tag>_<action> по 08 §8 и NOTES §3 п.2 (владелец правил генерации), а не camelCase.
#  A2. Расширение прав — x-permissions (массив) по 08 §8 / NOTES §5 п.1 (не x-permission).
#  A3. x-rate-limit-group — строка: основная группа 08 §2.9; дополнительные группы перечислены в description.
#  A4. Idempotency-Key НЕ применяется (x-idempotent: false) к операциям, выдающим секреты/токены и имеющим собственную
#      семантику повтора по карточке 08: /auth/otp/request, /auth/otp/verify, /auth/refresh, /auth/step-up, /auth/unlock,
#      /me/phone/change/request, /me/phone/change/confirm, /me/biometrics (08 §2.10 «POST без Idempotency-Key»;
#      §2.2 — refresh хранится только как SHA-256, тело ответа с токеном в idempotency_keys не сохраняется).
#      Прочие POST/PUT/PATCH — IdempotencyKeyOptional; /registration/complete — IdempotencyKey (08 §2.7 «Где обязателен»).
#  A5. Условный step-up (DELETE /auth/sessions/{sessionId} для чужого устройства, POST /me/pin — кроме первого PIN
#      сотрудника по приглашению, POST /me/consents — только отзыв personal_data): security — две альтернативы
#      [{bearerAuth, stepUpToken}, {bearerAuth}]; безусловный step-up — только [{bearerAuth, stepUpToken}].
#  A6. POST /me/phone/change/confirm — x-step-up: false: step-up проверяется на request (08 §4.3.3; таблица operation
#      08 §2.12 содержит только request); confirm привязан к челленджу, выданному после step-up.
#  A7. Ограничения длины строк, не заданные 08 (maxLength токенов, osVersion, appVersion, version согласия, кода сферы
#      деятельности), выбраны автором фрагмента как защитные верхние границы (08 §2.14 «maxLength у каждого поля»).
#  A8. x-roles публичных операций — [] (роль не определена до аутентификации; security: []).
#  A9. PUT /me/settings — строгая схема запроса MeSettingsPutRequest (полная замена, additionalProperties:false,
#      rowVersion обязателен): общая схема Settings из 00_root — схема ответа без additionalProperties:false.
#      Встроенные enum scanner/catalogView взяты из 08 §3.14 без изменений.
# =====================================================================================
openapi: 3.0.3
info:
  title: Optomstroy POS API — fragment auth / registration / profile
  version: "1.0.0"
paths:
  # ===================================================================================
  # auth (08 §4.1)
  # ===================================================================================
  /auth/otp/request:
    post:
      tags: [auth]
      operationId: auth_otp_request
      summary: Запросить одноразовый код (нейтральный ответ)
      description: >
        08 §4.1.1. Создаёт otp_challenge (purpose=login_or_register) и отправляет SMS через SmsGateway. Нейтральный ответ:
        форма, статус и время ответа одинаковы для зарегистрированного и незарегистрированного номера (D-10).
        Повтор в cooldown → 429 OTP_RATE_LIMITED; повтор после cooldown создаёт новый код и аннулирует прежний.
        Ошибки: 400 VALIDATION_FAILED (phone_e164, purpose); 423 OTP_LOCKED; 429 OTP_RATE_LIMITED (retryAfter);
        503 SMS_PROVIDER_ERROR. Rate limit: RL-OTP-SEND, RL-OTP-SEND-IP, RL-OTP-SEND-DEV, RL-OTP-GLOBAL, RL-PUBLIC-IP.
        Аудит: auth.otp.sent (без кода). Кэширование: no-store.
      security: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-OTP-SEND
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthOtpRequestRequest" }
      responses:
        "202":
          description: Код отправлен (ответ одинаков для любого номера).
          headers: &stdHeaders
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthOtpRequestResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "423": { $ref: "#/components/responses/Locked" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/otp/verify:
    post:
      tags: [auth]
      operationId: auth_otp_verify
      summary: Проверить код; ветвление «вход / сотрудник по приглашению / регистрация клиента / ожидание активации»
      description: >
        08 §4.1.2; ядро §24.2. Проверка кода (constant-time), атомарное потребление, регистрация устройства, затем ветвление:
        аккаунт active → authenticated; номер с действующим приглашением → учётная запись сотрудника и authenticated
        с roleSource=invitation, nextStep=set_pin (без регистрационной формы); нет аккаунта и приглашения →
        registration_required (регистрация клиента); pending_activation — только при CUSTOMER_SELF_SERVICE=false;
        blocked → 403 FORBIDDEN. До установки PIN сессия сотрудника по приглашению ограничена (/me*, /auth/*,
        GET /settings/public; прочее → 403 FORBIDDEN reason pin_not_set). Повторный verify того же кода → 422 OTP_EXPIRED.
        Ошибки: 400 VALIDATION_FAILED; 403 FORBIDDEN (blocked); 409 DEVICE_MISMATCH (X-Device-Id ≠ устройству челленджа);
        422 OTP_INVALID (attemptsLeft), OTP_EXPIRED; 423 OTP_LOCKED (retryAfter); 429 RATE_LIMITED.
        Rate limit: RL-OTP-VERIFY, RL-PUBLIC-IP. Аудит: auth.otp.verified / auth.otp.failed / auth.login; user.created
        (вход по приглашению). Кэширование: no-store.
      security: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-feature-flag: CUSTOMER_SELF_SERVICE
      x-rate-limit-group: RL-OTP-VERIFY
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OtpVerifyRequest" }
      responses:
        "200":
          description: "authenticated | registration_required | pending_activation (одинаковая структура верхнего уровня)."
          headers: *stdHeaders
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/AuthAuthenticated"
                  - $ref: "#/components/schemas/AuthPendingActivation"
                  - $ref: "#/components/schemas/AuthRegistrationRequired"
                discriminator:
                  propertyName: status
                  mapping:
                    authenticated: "#/components/schemas/AuthAuthenticated"
                    pending_activation: "#/components/schemas/AuthPendingActivation"
                    registration_required: "#/components/schemas/AuthRegistrationRequired"
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "423": { $ref: "#/components/responses/Locked" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/otp/challenges/{challengeId}:
    get:
      tags: [auth]
      operationId: auth_otp_challenge_get
      summary: Статус доставки SMS по челленджу (без ПДн)
      description: >
        08 §4.1.9; ядро §19.2. SCR-02: «Отправляем SMS…» / «SMS отправлено» / «Не удалось отправить SMS». Без access JWT;
        доступ только с тем же X-Device-Id, что у челленджа (иначе 404 — существование не раскрывается). Ответ не содержит
        ПДн и одинаков для любого номера. Ошибки: 400 VALIDATION_FAILED (challengeId не uuid, нет X-Device-Id);
        404 NOT_FOUND (неизвестный / чужой по X-Device-Id / истёкший более 10 мин назад); 429 RATE_LIMITED.
        Rate limit: RL-OTP-STATUS, RL-PUBLIC-IP. Аудит: не пишется. Кэширование: no-store.
      security: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-OTP-STATUS
      parameters:
        - $ref: "#/components/parameters/AuthChallengeIdPath"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Состояние доставки SMS.
          headers: *stdHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthOtpChallengeStatus" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "404": { $ref: "#/components/responses/NotFound" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: auth_refresh
      summary: Ротация пары access/refresh
      description: >
        08 §4.1.3, §2.2. Только обычная ротация по непрозрачному refresh (тело); аутентификация — по refresh и X-Device-Id.
        biometric_refresh здесь не принимается (400 VALIDATION_FAILED rule use_unlock) — только POST /auth/unlock.
        Поля kind и amr → 400 rule forbidden_field. Окно грации 30 с: повтор с предыдущим refresh возвращает ту же новую
        пару; позже — reuse → отзыв семьи + аудит session.reuse_detected.
        Ошибки: 400 VALIDATION_FAILED; 401 SESSION_REVOKED (неизвестен / отозван / просрочен / reuse / чужой deviceId /
        idle-отзыв), UNLOCK_REQUIRED (staff на Windows без действующего unlocked_until, D-48); 429 RATE_LIMITED.
        Rate limit: RL-AUTH. Кэширование: no-store (токены).
      security: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-AUTH
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthRefreshRequest" }
      responses:
        "200":
          description: Новая пара токенов.
          headers: *stdHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthTokenPair" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/logout:
    post:
      tags: [auth]
      operationId: auth_logout
      summary: Завершить текущую сессию
      description: >
        08 §4.1.4. Отзывает текущую sid (refresh всех kind этой сессии), jti access — в denylist до exp. Повтор → 204.
        Ошибки: общие (401, 403). Rate limit: RL-AUTH. Аудит: auth.logout. Кэширование: no-store.
      x-permissions: [session.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: true
      x-rate-limit-group: RL-AUTH
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthLogoutRequest" }
      responses:
        "204":
          description: Сессия завершена (повтор — тоже 204).
          headers: &idemHeaders
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/logout-all:
    post:
      tags: [auth]
      operationId: auth_logout_all
      summary: Завершить все сессии пользователя (step-up)
      description: >
        08 §4.1.5. Отзывает все sid и refresh-семьи (стандартные и биометрические), включая текущую, без увеличения
        permissionsVersion; access-токены других устройств перестают приниматься не позже чем через 60 с. Повтор → 204.
        Step-up обязателен (operation session.logout_all, 08 §2.12). Ошибки: 401; 403 STEP_UP_REQUIRED, FORBIDDEN.
        Rate limit: RL-AUTH. Аудит: auth.logout_all (stepUpMethod). Кэширование: no-store.
      security:
        - bearerAuth: []
          stepUpToken: []
      x-permissions: [session.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: true
      x-step-up-operation: [session.logout_all]
      x-idempotent: true
      x-rate-limit-group: RL-AUTH
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/StepUpToken"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      responses:
        "204":
          description: Все сессии отозваны.
          headers: *idemHeaders
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/sessions:
    get:
      tags: [auth]
      operationId: auth_sessions_list
      summary: Список активных сессий/устройств пользователя (SCR-42)
      description: >
        08 §4.1.6. Только свои сессии; без пагинации (≤ 5 устройств). Ошибки: общие (401, 403).
        Rate limit: RL-AUTH. Кэширование: no-store.
      x-permissions: [session.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-AUTH
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Активные сессии.
          headers: *stdHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthSessionList" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/sessions/{sessionId}:
    delete:
      tags: [auth]
      operationId: auth_session_revoke
      summary: Отозвать свою сессию (другого устройства — со step-up)
      description: >
        08 §4.1.6; ядро §17.2. Отзыв текущей сессии = logout (без step-up). Отзыв своей сессии на другом устройстве —
        step-up обязателен (operation session.revoke.other): X-Step-Up-Token обязателен, если sessionId ≠ текущей.
        Чужой или неизвестный sessionId → 404. Повтор → 204. Access-токены отозванной сессии отклоняются ≤ 60 с.
        Ошибки: 401; 403 STEP_UP_REQUIRED (другое устройство без токена), FORBIDDEN; 404 NOT_FOUND.
        Rate limit: RL-AUTH. Аудит: session.revoked (stepUpMethod для другой сессии). Кэширование: no-store.
      security:
        - bearerAuth: []
          stepUpToken: []
        - bearerAuth: []
      x-permissions: [session.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: true
      x-step-up-operation: [session.revoke.other]
      x-idempotent: false
      x-rate-limit-group: RL-AUTH
      parameters:
        - $ref: "#/components/parameters/AuthSessionIdPath"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/StepUpToken"
      responses:
        "204":
          description: Сессия отозвана.
          headers: *stdHeaders
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [auth]
      operationId: auth_session_rename
      summary: Переименовать устройство своей сессии
      description: >
        08 §4.1.6 (путь — ядро §17.4; приоритет could). Тело — только deviceName (1…60, без управляющих символов);
        иные поля → 400. Чужой sessionId → 404. Повтор с тем же телом → 200.
        Ошибки: 400 VALIDATION_FAILED; 401; 403; 404 NOT_FOUND. Rate limit: RL-AUTH. Аудит: не пишется. Кэширование: no-store.
      x-permissions: [session.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: true
      x-rate-limit-group: RL-AUTH
      parameters:
        - $ref: "#/components/parameters/AuthSessionIdPath"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthSessionPatchRequest" }
      responses:
        "200":
          description: Обновлённая сессия.
          headers: *idemHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Session" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/step-up:
    post:
      tags: [auth]
      operationId: auth_step_up
      summary: Получить stepUpToken для критической операции (PIN или OTP)
      description: >
        08 §4.1.7, §2.12; ядро §18.2 п.6, §19.3. operation клиент берёт из 403 STEP_UP_REQUIRED.stepUp.operation без
        изменений (иное → 400 rule operation). method=pin → 200 со stepUpToken; method=otp без challengeId → 202
        (создаёт otp_challenge purpose=step_up), с challengeId и code → 200. Токен многоразовый 15 мин в области scope.
        В R1 методы bio+pin / bio+otp отклоняются 400 VALIDATION_FAILED (rule method).
        Ошибки: 400 VALIDATION_FAILED; 401 PIN_INVALID (attemptsLeft; refresh на этот код не выполняется) и общие 401;
        403 FORBIDDEN (reason pin_not_set / operation_not_permitted); 422 OTP_INVALID, OTP_EXPIRED; 423 PIN_LOCKED,
        OTP_LOCKED; 429 OTP_RATE_LIMITED, RATE_LIMITED. Rate limit: RL-PIN, RL-OTP-SEND, RL-OTP-VERIFY.
        Аудит: auth.step_up.ok / auth.step_up.failed; auth.pin.locked; auth.otp.sent. Кэширование: no-store.
      x-permissions: [session.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-PIN
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthStepUpRequest" }
      responses:
        "200":
          description: stepUpToken выдан.
          headers: *stdHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthStepUpToken" }
        "202":
          description: "method=otp, шаг 1: код отправлен на номер пользователя (purpose=step_up)."
          headers: *stdHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthOtpChallengeIssued" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "423": { $ref: "#/components/responses/Locked" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /auth/unlock:
    post:
      tags: [auth]
      operationId: auth_unlock
      summary: Разблокировать сессию по PIN или биометрии с криптопривязкой (с ротацией refresh)
      description: >
        08 §4.1.8; ядро §18.2 п.5, §19.3; D-48. Без access JWT: субъект — refreshToken + X-Device-Id, второй фактор —
        PIN (серверная проверка) или method=biometric (biometric_refresh после системной биометрии; не Windows).
        Без method — pin. biometricInvalidated=true (с method=pin) отзывает биометрическую семью устройства и выключает
        Me.security.biometricsEnabled. Сервер устанавливает sessions.unlocked_until = now() + SESSION_IDLE_LOCK_MINUTES.
        Ротация refresh — по правилам /auth/refresh (окно грации 30 с, reuse-detection).
        Ошибки: 400 VALIDATION_FAILED; 401 PIN_INVALID (attemptsLeft; клиент не вызывает /auth/refresh), SESSION_REVOKED;
        403 FORBIDDEN (reason pin_not_set); 423 PIN_LOCKED; 429 RATE_LIMITED. Rate limit: RL-PIN, RL-AUTH.
        Аудит: auth.unlock (метод, result, deviceId; без PIN); auth.pin.locked. Кэширование: no-store.
      security: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-PIN
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/AuthUnlockRequest" }
      responses:
        "200":
          description: Сессия разблокирована, выдана новая пара токенов.
          headers: *stdHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUnlockResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "423": { $ref: "#/components/responses/Locked" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  # ===================================================================================
  # registration (08 §4.2)
  # ===================================================================================
  /registration/complete:
    post:
      tags: [registration]
      operationId: registration_complete
      summary: Завершить регистрацию клиента-покупателя по registration_token
      description: >
        08 §4.2.1; ядро §19.3, §24.2. Публичный путь (аутентификация — registrationToken в теле). Создаёт клиента-покупателя:
        роль customer при CUSTOMER_SELF_SERVICE=true (по умолчанию в R1), иначе pending_activation; для customer — поиск
        карточки 1С по телефону (customer_links). Сотрудники этой операцией не создаются; если приглашение появилось после
        выдачи registration_token — применяется оно (staff с ролями приглашения, customer_links не создаётся).
        Шаг «защита входа» обязателен: security.pin можно не передавать только при biometricsEnabled=true на устройстве
        с биометрией с криптопривязкой (Android class3 / iOS), иначе 400/422 rule login_protection_required.
        Наличие элемента в consents[] = выданное согласие; personal_data обязательно; biometrics_device — при
        biometricsEnabled=true; activity_sphere — если передан activitySphere. Повтор с тем же ключом → тот же 201.
        Скоуп Idempotency-Key здесь — (key, sha256(jti registrationToken), маршрут): пользователя до вызова нет
        (idempotency_keys.subject_key = reg:<hex>, user_id NULL; B-AR-01). Токены в хранилище идемпотентности не
        сохраняются (07 §5.56), поэтому повтор выдаёт новую пару токенов для сессии, созданной первым вызовом, на том же
        устройстве — правило предложено владельцу 08 §2.7 (contracts/openapi/NOTES.md §8).
        Ошибки: 400 VALIDATION_FAILED (pin_weak, login_protection_required, fullName, birth_year_range, неизвестный
        activitySphere или consents[].kind, idempotency_key_required); 401 REGISTRATION_TOKEN_INVALID;
        409 PHONE_ALREADY_REGISTERED, IDEMPOTENCY_IN_PROGRESS; 422 CONSENT_REQUIRED, IDEMPOTENCY_KEY_REUSED;
        429 RATE_LIMITED. Rate limit: RL-PUBLIC-IP. Аудит: user.created (roleSource invitation|self), consent.granted,
        auth.pin.set. Кэширование: no-store (токены). Статус карточки: ПРЕДВАРИТЕЛЬНО (Q-027, Q-161, Q-165).
      security: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: required
      x-feature-flag: CUSTOMER_SELF_SERVICE
      x-rate-limit-group: RL-PUBLIC-IP
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationCompleteRequest" }
      responses:
        "201":
          description: Пользователь создан; authenticated (с customerMatch) или pending_activation.
          headers: *idemHeaders
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: "#/components/schemas/RegistrationCompleteAuthenticated"
                  - $ref: "#/components/schemas/AuthPendingActivation"
                discriminator:
                  propertyName: status
                  mapping:
                    authenticated: "#/components/schemas/RegistrationCompleteAuthenticated"
                    pending_activation: "#/components/schemas/AuthPendingActivation"
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "426": { $ref: "#/components/responses/UpgradeRequired" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /registration/customer-match:
    get:
      tags: [registration]
      operationId: registration_customer_match_get
      summary: Статус привязки аккаунта к карточке клиента 1С (SCR-06)
      description: >
        08 §4.2.2. Только GET (13 RM-B-003). Любой аутентифицированный, включая user_status=pending_activation (статус,
        не роль); для staff — всегда status none. registration_token маршрут не принимает. До confirmed ответ не содержит
        customer.id, полного наименования, телефона карточки и финансовых данных (09 REG-032).
        Ошибки: только общие (401, 403). Rate limit: RL-READ. Аудит: не пишется. Кэширование: no-store.
      x-permissions: [profile.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Состояние привязки.
          headers: *stdHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationCustomerMatch" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /registration/customer-match/confirm:
    post:
      tags: [registration]
      operationId: registration_customer_match_confirm
      summary: Клиент подтверждает предложенную привязку («Да, это я»)
      description: &customerMatchResolveDescription >
        08 §4.2.4; ядро §22.12; 11 §4.3 №75, SEC-130. Только роль customer и только при CUSTOMER_SELF_SERVICE=true; только
        своя привязка (customer_links.user_id = sub) в статусе proposed, у которой подтверждённый телефон карточки 1С
        совпадает с телефоном аккаунта. Step-up не требуется (владение номером доказано OTP). Повтор для привязки, уже
        находящейся в целевом статусе, → 200 с тем же ответом.
        Ошибки: 400 VALIDATION_FAILED; 401; 403 FORBIDDEN (staff; reason self_service_disabled, nextStep wait_admin);
        404 NOT_FOUND (чужая/неизвестная привязка); 409 CUSTOMER_LINK_CONFLICT (conflict, неподтверждённый или второй
        контакт, карточка уже привязана — nextStep wait_admin). Rate limit: RL-AUTH.
        Аудит: customer.link.confirmed / customer.link.rejected (selfResolved true). Кэширование: no-store.
      x-permissions: [customer.link.self_resolve]
      x-roles: [customer]
      x-step-up: false
      x-idempotent: true
      x-feature-flag: CUSTOMER_SELF_SERVICE
      x-rate-limit-group: RL-AUTH
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationCustomerMatchResolveRequest" }
      responses:
        "200":
          description: "Привязка подтверждена: status confirmed, customer {id, displayName}, nextStep confirmed."
          headers: *idemHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationCustomerMatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /registration/customer-match/reject:
    post:
      tags: [registration]
      operationId: registration_customer_match_reject
      summary: Клиент отклоняет предложенную привязку («Это не я»)
      description: *customerMatchResolveDescription
      x-permissions: [customer.link.self_resolve]
      x-roles: [customer]
      x-step-up: false
      x-idempotent: true
      x-feature-flag: CUSTOMER_SELF_SERVICE
      x-rate-limit-group: RL-AUTH
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegistrationCustomerMatchResolveRequest" }
      responses:
        "200":
          description: "Привязка отклонена: status rejected, customer null, nextStep none (клиент работает как новый)."
          headers: *idemHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RegistrationCustomerMatch" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  # ===================================================================================
  # profile — тег me (08 §4.3)
  # ===================================================================================
  /me:
    get:
      tags: [me]
      operationId: me_get
      summary: Текущий пользователь, роли, permissions, настройки, безопасность, привязка
      description: >
        08 §4.3.1, §3.14. Источник правды клиента о ролях и правах (permissions[] — для скрытия кнопок, не защита).
        pending_activation — усечённый DTO. Клиент перечитывает после /auth/refresh с новым permissionsVersion.
        Ошибки: только общие (401, 403). Rate limit: RL-READ. Аудит: не пишется. Кэширование: no-store.
      x-permissions: [profile.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: Текущий пользователь.
          headers: *stdHeaders
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Me" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /me/profile:
    patch:
      tags: [me]
      operationId: me_profile_update
      summary: Изменить свой профиль
      description: >
        08 §4.3.2; ядро §19.3. Правила полей — как в /registration/complete (birthYear 1920…текущий−14; activitySphere —
        только при действующем согласии activity_sphere). phone, roles, status и прочие поля → 400 rule forbidden_field
        (08 §2.14). Ответ — Profile с rowVersion+1; повтор уже применённого запроса → 409 VERSION_CONFLICT с current.
        Ошибки: 400 VALIDATION_FAILED; 401; 403; 409 VERSION_CONFLICT; 422 CONSENT_REQUIRED.
        Rate limit: RL-READ (группа /me*). Аудит: profile.updated (только имена полей). Кэширование: no-store.
      x-permissions: [profile.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: true
      x-rate-limit-group: RL-READ
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IdempotencyKeyOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MeProfilePatchRequest" }
