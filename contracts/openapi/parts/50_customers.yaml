      description: >
        08 §4.11.7; ядро §22.12; 11 №32, §4.4. customer.link.resolve — только admin, всегда со step-up
        (stepUp.operation = customer.link.resolve); прочие роли → 403 FORBIDDEN. Клиент отклоняет свою привязку через
