          description: "Page<Customer(role-DTO)> + count."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    required: [count]
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Customer" }
                      count: { type: integer, minimum: 0, description: "Всего избранных клиентов (бейдж)." }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /favorites/customers/{id}:
    put:
      operationId: favorites_customers_put
      tags: [favorites]
      summary: Добавить клиента в избранное (идемпотентно)
      description: >
        08 §4.13.2. Право favorites.customers.manage — cashier, senior_seller, admin (owner — нет, 11 §4.4). Тела нет.
        Повтор → 204. Идемпотентна по семантике; Idempotency-Key допускается (08 §2.7). Аудит не пишется.
        Ошибки: 404 NOT_FOUND (клиент не существует), 403 FORBIDDEN (без права); общие (08 §4).
      x-permissions: [favorites.customers.manage]
      x-roles: [cashier, senior_seller, admin]
      x-step-up: false
      x-idempotent: true
      x-rate-limit-group: RL-READ
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/IdempotencyKeyOptional" }
      responses:
        "204":
          description: "Клиент в избранном (в т. ч. уже был)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      operationId: favorites_customers_delete
      tags: [favorites]
      summary: Удалить клиента из избранного
      description: >
        08 §4.13.2. Право favorites.customers.manage — cashier, senior_seller, admin (owner — нет, 11 §4.4).
        Отсутствующее в избранном → 204. Аудит не пишется.
        Ошибки: 404 NOT_FOUND (клиент не существует), 403 FORBIDDEN (без права); общие (08 §4).
      x-permissions: [favorites.customers.manage]
      x-roles: [cashier, senior_seller, admin]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
      responses:
        "204":
          description: "Клиента в избранном нет (в т. ч. не было)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  # -----------------------------------------------------------------------------------
  # 08 §4.14 — транзакции (read-model)
  # -----------------------------------------------------------------------------------
  /transactions:
    get:
      operationId: transactions_list
      tags: [transactions]
      summary: Журнал операций (период, клиент, статус, тип)
      description: >
        08 §4.14.1 (SCR-36). Права transactions.read.all (cashier, senior_seller, admin, owner) или
        transactions.read.own (seller — только операции по своим заказам; mine=true сервер применяет всегда).
        actorId и summary — только transactions.read.all. Роль customer → 403 FORBIDDEN. Период from…to — ≤ 366 дней
        (rule date_range). Аудит transaction.viewed_all — обязательно при выборке с чужими данными (агрегировано: раз на
        сессию и набор фильтров); выборка только своих операций не пишется.
        Ошибки: 400 VALIDATION_FAILED (date_range, неизвестный kind или status), 403 FORBIDDEN (actorId без
        transactions.read.all; customer); общие (08 §4).
      x-permissions: [transactions.read.own, transactions.read.all]
      x-roles: [seller, cashier, senior_seller, admin, owner]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: from
          in: query
          required: true
          description: "Начало периода, ISO-8601 UTC; from ≤ to; период ≤ 366 дней (08 §4.14.1, §2.14; обязателен — 08 §8)."
          schema: { type: string, format: date-time }
        - name: to
          in: query
          required: true
          description: "Конец периода, ISO-8601 UTC (08 §4.14.1; обязателен — 08 §8)."
          schema: { type: string, format: date-time }
        - name: customerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: status
          in: query
          required: false
          description: "Список через запятую значений statusGroup (08 §3.11; ядро §19.2); иное значение → 400 VALIDATION_FAILED rule enum."
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            uniqueItems: true
            items: { $ref: "#/components/schemas/TransactionStatusGroup" }
        - name: kind
          in: query
          required: false
          description: "Список через запятую значений transaction_kind (07 §6.1)."
          style: form
          explode: false
          schema:
            type: array
            maxItems: 50
            uniqueItems: true
            items: { $ref: "#/components/schemas/TransactionKind" }
        - name: source
          in: query
          required: false
          schema: { $ref: "#/components/schemas/TransactionSource" }
        - name: mine
          in: query
          required: false
          description: "true — только свои операции; у seller сервер применяет всегда."
          schema: { type: boolean }
        - name: actorId
          in: query
          required: false
          description: "Фильтр по исполнителю; только transactions.read.all, иначе 403 FORBIDDEN."
          schema: { type: string, format: uuid }
        - name: paymentMethod
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PaymentMethod" }
        - name: amountMin
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MoneyAmount" }
        - name: amountMax
          in: query
          required: false
          schema: { $ref: "#/components/schemas/MoneyAmount" }
        - name: q
          in: query
          required: false
          description: "Поиск по номеру документа."
          schema: { type: string, maxLength: 200 }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: sort
          in: query
          required: false
          description: "Сортировка (08 §4.14.1); неизвестное значение → 400 VALIDATION_FAILED rule sort_field."
          schema: { type: string, enum: ["occurredAt:desc", "amount:desc"], default: "occurredAt:desc" }
      responses:
        "200":
          description: "Page<Transaction> + summary по фильтру (только transactions.read.all)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/Transaction" }
                      summary:
                        allOf: [ { $ref: "#/components/schemas/TransactionsSummary" } ]
                        x-roles: [cashier, senior_seller, admin, owner]
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  /transactions/{id}:
    get:
      operationId: transactions_get
      tags: [transactions]
      summary: Транзакция и связанные документы
      description: >
        08 §4.14.2 (SCR-37). Права transactions.read.all (cashier, senior_seller, admin, owner) или transactions.read.own
        (seller — по своим заказам); блок audit[] — только audit.read. related[] заполнен полностью (заказ, платёж,
        заявка на возврат, документ 1С). Аудит: audit.viewed — при непустом audit[] (чтение журнала аудита, 11 SEC-073);
        иначе не пишется.
        Ошибки: 404 NOT_FOUND (чужая для seller); общие (08 §4).
      x-permissions: [transactions.read.own, transactions.read.all, audit.read]
      x-roles: [seller, cashier, senior_seller, admin, owner]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
      responses:
        "200":
          description: "Transaction с полным related[] + audit[] (только audit.read)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TransactionsDetail" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

components:
  parameters:
    CustomersLinkIdPath:
      name: linkId
      in: path
      required: true
      description: "UUID привязки customer_links (08 §4.11.7)."
      schema: { type: string, format: uuid }

  schemas:
    # ===== Тела запросов (additionalProperties: false — 08 §2.11, §3) =====
    CustomersCreateRequest:
      type: object
      additionalProperties: false
      required: [name, customerType, phones]
      description: >
        Тело POST /customers (08 §4.11.2). customerType обязателен: customers.customer_type NOT NULL без DEFAULT (07 §5.28).
        forceReason обязателен при forceCreate=true и запрещён при false (rule force_reason_required, ядро §19.2).
        Телефоны — строки E.164 (в ответе — phones[{value, verified}], 08 §3.7).
      properties:
        name:
          type: string
          minLength: 2
          maxLength: 150
          description: "ФИО / наименование: 2…150 символов (08 §4.11.2 name ≤ 150; 02 SCR-26 UI-26-004 2–150)."
          example: "Тестов Клиент"
        customerType: { $ref: "#/components/schemas/CustomerType" }
        phones:
          type: array
          minItems: 1
          maxItems: 5
          uniqueItems: true
          description: "≥ 1 телефон (08 §4.11.2); phones ≤ 5 (08 §2.14)."
          items: { $ref: "#/components/schemas/PhoneE164" }
        inn:
          type: string
          nullable: true
          pattern: '^\d{14}$'
          maxLength: 14
          description: "ИНН КР — 14 цифр [ТИПОВО: ИНН КР; Q-142]; не логируется."
          example: "12345678901234"
        address:
          type: string
          maxLength: 300
          description: "Адрес (необязательно; предзаполняет адрес доставки SCR-21 — тот же предел 300 символов, 02 SCR-21)."
        comment:
          type: string
          maxLength: 500
          description: "Комментарий (необязательно; ≤ 500 — 02 SCR-26 UI-26-010 [ТИПОВО])."
        priceListId:
          type: string
          format: uuid
          nullable: true
          description: "Вид цены (необязательно)."
        forceCreate:
          type: boolean
          default: false
          description: "Создать несмотря на CUSTOMER_DUPLICATE_SUSPECTED; только customer.create.force (cashier, senior_seller, admin; Q-025)."
        forceReason:
          type: string
          nullable: true
          minLength: 5
          maxLength: 200
          description: "Причина принудительного создания: обязательна при forceCreate=true, запрещена при false (ядро §19.2)."
    CustomersLinkConfirmRequest:
      type: object
      additionalProperties: false
      description: >
        Тело POST /customers/{id}/links/{linkId}/confirm (08 §4.11.7: { comment }). Поле force названо в строке «Ошибки»
        той же карточки (CUSTOMER_LINK_CONFLICT — «другая confirmed привязка существует и force не задан»).
      properties:
        comment:
          type: string
          maxLength: 200
          description: "Комментарий администратора (08 §2.14: comment ≤ 200)."
        force:
          type: boolean
          default: false
          description: "true — подтвердить, несмотря на другую confirmed привязку (иначе 409 CUSTOMER_LINK_CONFLICT)."
    CustomersLinkRejectRequest:
      type: object
      additionalProperties: false
      description: "Тело POST /customers/{id}/links/{linkId}/reject (08 §4.11.7: { comment })."
      properties:
        comment:
          type: string
          maxLength: 200
          description: "Комментарий / причина отказа (08 §2.14: comment ≤ 200)."

    # ===== Ответы модуля customers =====
    CustomersLinkUser:
      type: object
      required: [id, displayName]
      description: "Краткий пользователь привязки: без полного телефона (08 §4.11.1, §4.11.7)."
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string }
        phoneMasked: { $ref: "#/components/schemas/PhoneMasked" }
    CustomersLinkWithUser:
      description: "CustomerLink + user { id, displayName, phoneMasked } (08 §4.11.1, §4.11.7)."
      allOf:
        - { $ref: "#/components/schemas/CustomerLink" }
        - type: object
          required: [user]
          properties:
            user: { $ref: "#/components/schemas/CustomersLinkUser" }
    CustomersLinksResponse:
      type: object
      required: [items]
      description: "Ответ GET /customers/{id}/links (08 §4.11.7) — не страница."
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/CustomersLinkWithUser" }
    CustomersListItem:
      description: >
        Элемент GET /customers: Customer(role-DTO) без сумм долга, кроме include=receivable с правом (08 §3.7).
        При linkStatus — дополнительно links[] с user только в запрошенных статусах (08 §4.11.1; роль admin).
      allOf:
        - { $ref: "#/components/schemas/Customer" }
        - type: object
          properties:
            links:
              type: array
              x-roles: [admin]
              description: "Только при параметре linkStatus (customer.link.conflicts.read)."
              items: { $ref: "#/components/schemas/CustomersLinkWithUser" }
    CustomersHistoryEntry:
      type: object
      required: [kind, number, date, total, status, source]
      description: "Запись истории покупок: заказ POS или документ продаж 1С (08 §4.11.4; sales_history — [ТИПОВО: Q-010])."
      properties:
        kind: { type: string, enum: [order, shipment, return] }
        id: { type: string, format: uuid, nullable: true }
        number: { type: string, example: "POS-2026-000123" }
        date: { type: string, format: date-time }
        total: { $ref: "#/components/schemas/Money" }
        status: { type: string, description: "Статус документа как есть." }
        source: { type: string, enum: [pos, onec] }
        url: { type: string, nullable: true, example: "/api/v1/orders/{id}" }
    CustomersHistorySummary:
      type: object
      required: [count, total]
      description: "Итоги по фильтру периода (ядро §19.2 — CustomerHistory.summary)."
      properties:
        count: { type: integer, minimum: 0, example: 12 }
        total: { $ref: "#/components/schemas/Money" }
        lastOrderAt: { type: string, format: date-time, nullable: true }
    CustomerHistory:
      description: >
        Имя из 08 §4.11.4 (сохраняется как есть): Page записей истории + summary + historyFrom — дата, с которой в POS
        есть история продаж из 1С (граница SALES_HISTORY_MONTHS; ранние покупки могут отсутствовать; ядро §19.2).
      allOf:
        - { $ref: "#/components/schemas/Page" }
        - type: object
          required: [summary]
          properties:
            items:
              type: array
              items: { $ref: "#/components/schemas/CustomersHistoryEntry" }
            summary: { $ref: "#/components/schemas/CustomersHistorySummary" }
            historyFrom: { type: string, format: date, nullable: true, example: "2025-10-01" }
    CustomersCreditTerms:
      type: object
      required: [creditAllowed]
      description: "Условия отсрочки клиента (08 §4.11.6)."
      properties:
        creditAllowed: { type: boolean }
        paymentTermDays: { type: integer, minimum: 0, nullable: true, example: 14 }
        creditLimit:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          type: object
          nullable: true
          description: "Лимит долга — по праву на суммы долга (08 §4.11.6: «по праву»)."
          x-roles: [cashier, senior_seller, admin, owner, customer]
    CustomersDiscountsResponse:
      type: object
      required: [rules, asOf]
      description: "Ответ GET /customers/{id}/discounts (08 §4.11.6)."
      properties:
        priceList:
          allOf: [ { $ref: "#/components/schemas/PriceListRef" } ]
          type: object
          nullable: true
        customerDiscountPercent:
          allOf: [ { $ref: "#/components/schemas/Percent" } ]
          type: string
          nullable: true
          description: "Скидка клиента из 1С («Скидка: 5 %»); null — 1С не отдаёт число (07 customers.discount_percent)."
        rules:
          type: array
          items: { $ref: "#/components/schemas/DiscountRule" }
        creditTerms: { $ref: "#/components/schemas/CustomersCreditTerms" }
        manualDiscountLimitPercent:
          allOf: [ { $ref: "#/components/schemas/Percent" } ]
          description: "Лимит ручной скидки текущей роли (role_discount_limits; Q-015)."
        asOf: { type: string, format: date-time }

    # ===== Ответы модуля receivables =====
    ReceivablesOverdueItem:
      type: object
      required: [customer, balance, overdueAmount, overdueDays, asOf]
      description: "Строка просроченного долга (08 §4.12.1); customer — базовые поля клиента без сумм receivable."
      properties:
        customer: { $ref: "#/components/schemas/Customer" }
        balance: { $ref: "#/components/schemas/Money" }
        overdueAmount: { $ref: "#/components/schemas/Money" }
        overdueDays: { type: integer, minimum: 0, example: 12 }
        oldestDueDate: { type: string, format: date, nullable: true }
        asOf: { type: string, format: date-time }

    # ===== Ответы модуля discounts =====
    DiscountsRulesResponse:
      type: object
      required: [rules, manualDiscountLimitPercent]
      description: "Ответ GET /discounts/rules (08 §4.12.2); значения лимитов — [НЕ ПОДТВЕРЖДЕНО: Q-015]."
      properties:
        rules:
          type: array
          items: { $ref: "#/components/schemas/DiscountRule" }
        manualDiscountLimitPercent: { $ref: "#/components/schemas/Percent" }
        overrideRoles:
          type: array
          description: "Роли, которые могут подтвердить скидку сверх лимита (discount.approve.over_limit)."
          items: { $ref: "#/components/schemas/RoleCode" }
        limitsByRole:
          type: object
          description: "Лимит ручной скидки по ролям: ключ — RoleCode (seller, cashier, senior_seller, admin), значение — Percent."
          additionalProperties: { $ref: "#/components/schemas/Percent" }
          example: { seller: "5.00", cashier: "5.00", senior_seller: "10.00", admin: "15.00" }

    # ===== Ответы модуля transactions =====
    TransactionsSummary:
      type: object
      required: [count, sumIn, sumOut]
      description: "Итоги по фильтру GET /transactions (08 §4.14.1); только transactions.read.all."
      properties:
        count: { type: integer, minimum: 0, example: 42 }
        sumIn: { $ref: "#/components/schemas/Money" }
        sumOut: { $ref: "#/components/schemas/Money" }
    TransactionsDetail:
      description: "Ответ GET /transactions/{id} (08 §4.14.2): Transaction с полным related[] + audit[] (только audit.read)."
      allOf:
        - { $ref: "#/components/schemas/Transaction" }
        - type: object
          properties:
            audit:
              type: array
              x-roles: [admin, owner]
              description: "Записи аудита по транзакции — только audit.read (admin — без финансовых before/after, 11 SEC-083)."
              items: { $ref: "#/components/schemas/AuditRow" }
