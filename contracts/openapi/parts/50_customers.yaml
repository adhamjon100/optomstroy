          schema: { type: string, format: uuid }
        - name: cartId
          in: query
          required: false
          description: "Корзина, для которой подбираются правила."
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Правила скидок и потолок роли. Cache-Control: private, max-age=60 (08 §4.12.2)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control:
              description: "private, max-age=60 (08 §4.12.2)."
              schema: { type: string, example: "private, max-age=60" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DiscountsRulesResponse" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

