        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: minOverdueDays
          in: query
          required: false
          description: "Минимальное число дней просрочки."
          schema: { type: integer, minimum: 0 }
        - name: minAmount
          in: query
          required: false
          description: "Минимальная сумма просрочки (строка Money, rule money_format)."
          schema: { $ref: "#/components/schemas/MoneyAmount" }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: sort
          in: query
          required: false
          description: "Сортировка (08 §4.12.1); неизвестное значение → 400 VALIDATION_FAILED rule sort_field."
