        → 200 без изменений. Аудит customer.link.rejected / customer.link.conflict_resolved. Статус: ПРЕДВАРИТЕЛЬНО.
        Ошибки: 403 STEP_UP_REQUIRED, 403 FORBIDDEN (любая роль, кроме admin), 404 NOT_FOUND; общие (08 §4).
      x-permissions: [customer.link.resolve]
