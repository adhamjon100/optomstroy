      summary: Применимые правила скидок и потолок ручной скидки роли
      description: >
        08 §4.12.2. Право discount.rules.read (seller, cashier, senior_seller, admin, owner); роль customer — только
        правила своей привязанной (confirmed) карточки, иначе 403 FORBIDDEN (11 §4.4). Автоматические скидки 1С на
        backend не воспроизводятся (D-23). Значения лимитов — [НЕ ПОДТВЕРЖДЕНО: Q-015]. Аудит не пишется.
        Ошибки: 403 FORBIDDEN (customer), 404 NOT_FOUND (customerId/cartId); общие (08 §4).
      x-permissions: [discount.rules.read]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
