# =====================================================================================
# Optomstroy POS API — фрагмент модуля customers (RM-B-003): пути /customers*, /receivables/overdue,
# /discounts/rules, /favorites/*, /transactions*.
# Источник истины: docs/specification/08_API_SPECIFICATION.md v1.9 — §3.7, §3.11, §3.15, §4.11–§4.14, §9;
# права — 11 §4.3–§4.4; ядро R0 v1.9 §19.2, §22.12, §22.13 п.1, §24.2. Общие компоненты — parts/00_root.yaml,
# правила — ../NOTES.md (ссылки записаны в виде собранного документа: #/components/...).
# Ключи openapi/info — минимальные, по постановке задачи; сборщик берёт из фрагмента только paths и components.
# R2-элементы (PATCH /customers/{id}/contacts, SMS-подтверждение клиента — ядро §19.2) не включены.
# Решения автора фрагмента (расхождения постановки и ТЗ) — в комментариях «РЕШЕНИЕ:» ниже.
# =====================================================================================
openapi: 3.0.3
info:
  title: Optomstroy POS API — customers, receivables, discounts, favorites, transactions (фрагмент)
  version: "1.0.0"
paths:
  # -----------------------------------------------------------------------------------
  # 08 §4.11.1 / §4.11.2 — список клиентов, создание клиента
  # -----------------------------------------------------------------------------------
  /customers:
    get:
      operationId: customers_list
      tags: [customers]
      summary: Список и поиск клиентов (поля по роли)
      description: >
        08 §4.11.1. Право customer.read.basic (все staff; seller — ограниченный DTO CustomerViewSeller).
        Суммы долга (receivable) — только с customer.receivables.read.summary и include=receivable (ядро §22.13 п.1,
        11 SEC-031), такой ответ пишет аудит customer.debt_viewed; без них — только индикатор hasDebt/isOverdue.
        Фильтр hasDebt — только с customer.receivables.read.summary. linkStatus — только customer.link.conflicts.read
        (роль admin; иные роли, в том числе с customer.link.read, → 403 FORBIDDEN; 11 §4.4).
        Роль customer → 403 FORBIDDEN (свою карточку читает через GET /customers/{id}).
        Ошибки: 400 VALIDATION_FAILED (linkStatus вне proposed|conflict, sort_field, limit, cursor, q_too_short,
        search_scope_role); 403 FORBIDDEN (customer; hasDebt без права; linkStatus без customer.link.conflicts.read);
        общие (08 §4).
      x-permissions: [customer.read.basic, customer.receivables.read.summary, customer.link.conflicts.read]
      x-roles: [seller, cashier, senior_seller, admin, owner]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/Q" }
        - name: favorite
          in: query
          required: false
          description: "true — только избранные клиенты текущего пользователя."
          schema: { type: boolean }
        - name: hasDebt
          in: query
          required: false
          description: "Фильтр по флагу долга (без сумм); только customer.receivables.read.summary, иначе 403 FORBIDDEN."
          schema: { type: boolean }
        - name: isOverdue
          in: query
          required: false
          description: "Фильтр по флагу просрочки."
          schema: { type: boolean }
        - name: customerType
          in: query
          required: false
          schema: { $ref: "#/components/schemas/CustomerType" }
        - name: linkStatus
          in: query
          required: false
          description: >
            Список через запятую из proposed, conflict (ядро §19.2): клиенты с привязками аккаунтов в этих статусах для
            вкладки «Привязки клиентов» SCR-45. Только customer.link.conflicts.read (admin); иное значение → 400
            VALIDATION_FAILED. При параметре каждый элемент содержит links[] с user только в запрошенных статусах.
          style: form
          explode: false
          schema:
            type: array
            minItems: 1
            maxItems: 2
            uniqueItems: true
            items:
              allOf:
                - { $ref: "#/components/schemas/CustomerLinkStatus" }
                - { enum: [proposed, conflict] }
        - name: include
          in: query
          required: false
          description: "receivable — суммы долга в элементах (только customer.receivables.read.summary; без кода параметр игнорируется; аудит customer.debt_viewed)."
          schema: { type: string, enum: [receivable] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: sort
          in: query
          required: false
          description: "Сортировка; по сумме долга не поддерживается (08 §4.11.1); неизвестное значение → 400 VALIDATION_FAILED rule sort_field."
          schema: { type: string, enum: ["name:asc", "lastOrderAt:desc"] }
      responses:
        "200":
          description: "Page<Customer(role-DTO)>; поля сериализуются по allowlist роли (08 §3.7)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema:
                allOf:
                  - { $ref: "#/components/schemas/Page" }
                  - type: object
                    properties:
                      items:
                        type: array
                        items: { $ref: "#/components/schemas/CustomersListItem" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }
    post:
      operationId: customers_create
      tags: [customers]
      summary: Создать нового клиента (POS → outbox → 1С)
      description: >
        08 §4.11.2. «+ Новый клиент» (SCR-26): перед созданием сервер ищет существующую карточку 1С/POS по телефону и ИНН
        (дедупликация D-08, по локальной реплике); создаётся customers(source=pos, onecStatus=pending, onecRef=null)
        + onec_outbox(customer). Право customer.create; forceCreate=true — customer.create.force (cashier,
        senior_seller, admin; Q-025), forceReason (5…200 символов) обязателен при forceCreate=true и запрещён при
        false (rule force_reason_required). Аудит customer.created (forceCreate, forceReason, candidatesCount).
        Ошибки: 409 CUSTOMER_DUPLICATE_SUSPECTED (candidates[]: id, displayName, phoneMasked, source),
        409 IDEMPOTENCY_IN_PROGRESS; 400/422 VALIDATION_FAILED (≥ 1 телефон, inn 14 цифр, name ≤ 150,
        force_reason_required); 422 IDEMPOTENCY_KEY_REUSED; 403 FORBIDDEN (forceCreate без customer.create.force).
        ONEC_UNAVAILABLE не возвращается. Статус: ПРЕДВАРИТЕЛЬНО (Q-025).
      x-permissions: [customer.create, customer.create.force]
      x-roles: [seller, cashier, senior_seller, admin]
      x-step-up: false
      x-idempotent: required
      x-rate-limit-group: RL-FIN
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomersCreateRequest" }
      responses:
        "201":
          description: "Customer (source=pos, onecStatus=pending, onecRef=null), поля по роли (08 §3.7)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  # -----------------------------------------------------------------------------------
  # 08 §4.11.3 — карточка клиента
  # -----------------------------------------------------------------------------------
  /customers/{id}:
    get:
      operationId: customers_get
      tags: [customers]
      summary: Карточка клиента (поля по роли)
      description: >
        08 §4.11.3. Право customer.read.basic (части DTO — по customer.receivables.read.summary,
        customer.history.read); роль customer — customer.self.read, только своя карточка при
        customer_links.status=confirmed, иначе 404 NOT_FOUND. Суммы долга (receivable) — только при include=receivable
        и праве на суммы (для customer — customer.self.receivables.read); каждый ответ с суммами пишет аудит
        customer.debt_viewed (объём summary). Ролевые представления — CustomerViewSeller, CustomerViewCashier,
        CustomerViewAdmin, CustomerViewSelf (08 §3.7; поля, не разрешённые роли, отсутствуют).
        Ошибки: 404 NOT_FOUND (нет или чужой для customer); общие (08 §4).
      x-permissions: [customer.read.basic, customer.self.read, customer.receivables.read.summary, customer.self.receivables.read, customer.history.read]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: include
          in: query
          required: false
          description: >
            Список через запятую: receivable, discounts, links, contacts; каждая часть дополнительно фильтруется правами
            (receivable — суммы, только по праву на суммы долга; links — admin, owner, customer).
          style: form
          explode: false
          schema:
            type: array
            maxItems: 4
            uniqueItems: true
            items: { type: string, enum: [receivable, discounts, links, contacts] }
      responses:
        "200":
          description: "Customer(role-DTO) — таблица 08 §3.7."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Customer" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  # -----------------------------------------------------------------------------------
  # 08 §4.11.4 — история покупок
  # -----------------------------------------------------------------------------------
  /customers/{id}/orders:
    get:
      operationId: customers_orders_list
      tags: [customers]
      summary: История покупок клиента (заказы POS + документы продаж 1С)
      description: >
        08 §4.11.4 (SCR-33). Право customer.history.read (cashier, senior_seller, admin, owner); роль customer — только
        своя карточка при customer_links.status=confirmed (customer.self.read), при proposed/без привязки → 404
        NOT_FOUND; seller → 403 FORBIDDEN (видит только ordersCount в карточке). Аудит customer.debt_viewed
        (объём history, customerId, период); просмотр customer своей истории не пишется.
        Ошибки: 403 FORBIDDEN (seller), 404 NOT_FOUND, 400 VALIDATION_FAILED (date_range); общие (08 §4).
      x-permissions: [customer.history.read, customer.self.read]
      x-roles: [cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - name: source
          in: query
          required: false
          description: "Источник документов истории: pos, onec или all (08 §4.11.4)."
          schema: { type: string, enum: [pos, onec, all] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
      responses:
        "200":
          description: "CustomerHistory — Page записей истории + summary по фильтру периода + historyFrom (ядро §19.2)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerHistory" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  # -----------------------------------------------------------------------------------
  # 08 §4.11.5 — долг и детализация
  # -----------------------------------------------------------------------------------
  /customers/{id}/receivables:
    get:
      operationId: customers_receivables_get
      tags: [customers]
      summary: Долг клиента и детализация по документам (данные только из 1С)
      description: >
        08 §4.11.5 (SCR-34). Суммы — customer.receivables.read.summary (cashier, senior_seller, admin, owner);
        детализация include=documents — customer.receivables.read.detail; роль customer — customer.self.receivables.read,
        только свой при customer_links.status=confirmed, иначе 404 NOT_FOUND; seller → 403 FORBIDDEN.
        Step-up — ТОЛЬКО при include=documents, для всех ролей без исключений, включая customer: при первом просмотре
        в сессии и повторно, если с последнего step-up прошло > 15 мин (stepUp.operation = customer.receivables.read.detail).
        isStale=true, если now − asOf > staleAfterMinutes (60, RECEIVABLES_MAX_AGE_MIN). Параметр refresh сохранён для
        совместимости и подчиняется лимитам RL-RECV-REFRESH; кнопка «Обновить» вызывает POST /customers/{id}/receivables/refresh.
        Для клиента source=pos с onecStatus ≠ confirmed ошибка не возвращается — 200 с balance: null, reason: not_in_onec
        (08 §4.11.5; см. замечание в схеме Receivable корня). Аудит customer.debt_viewed (summary / detail),
        customer.finance.view (детализация).
        Ошибки: 403 STEP_UP_REQUIRED (детализация), 403 FORBIDDEN (seller), 404 NOT_FOUND (чужой для customer); общие (08 §4).
      x-permissions: [customer.receivables.read.summary, customer.receivables.read.detail, customer.self.receivables.read]
      x-roles: [cashier, senior_seller, admin, owner, customer]
      x-step-up: true
      x-step-up-operation: [customer.receivables.read.detail]
      x-idempotent: false
      x-rate-limit-group: RL-READ
      security:
        - bearerAuth: []
        - bearerAuth: []
          stepUpToken: []
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/StepUpToken" }
        - name: include
          in: query
          required: false
          description: "documents — детализация по документам (customer.receivables.read.detail; step-up)."
          schema: { type: string, enum: [documents] }
        - name: refresh
          in: query
          required: false
          description: "true — синхронный запрос в 1С (таймаут 6000 мс); при недоступности — снимок + isStale. Лимиты RL-RECV-REFRESH."
          schema: { type: boolean }
      responses:
        "200":
          description: "Receivable (08 §3.7); documents[] — только при include=documents со step-up."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            X-Data-As-Of: { $ref: "#/components/headers/XDataAsOf" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receivable" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

  # -----------------------------------------------------------------------------------
  # 08 §4.11.8 — точечное обновление снимка долга (ядро §19.2)
  # -----------------------------------------------------------------------------------
  /customers/{id}/receivables/refresh:
    post:
      operationId: customers_receivables_refresh
      tags: [customers]
      summary: Точечное синхронное обновление снимка долга клиента (ядро §19.2)
      description: >
        08 §4.11.8 (SCR-34 «Обновить»). Синхронно запрашивает у 1С сальдо, просрочку, лимит и (если доступна)
        детализацию одного клиента (OnecGateway.getReceivable), обновляет снимок receivables и asOf. Право
        customer.receivables.read.summary (cashier, senior_seller, admin, owner), без step-up; детализация в ответе —
        только при include=documents по правилам customer.receivables.read.detail со step-up; seller, customer → 403
        FORBIDDEN. Single-flight: параллельный запрос по тому же клиенту получает ответ выполняемого; снимок моложе 30 с —
        200 с текущим снимком и refreshed=false без обращения к 1С. Тела нет. Idempotency-Key не требуется (вне перечня
        08 §2.7), допускается по общему правилу; автоповтор клиентом не выполняется. Аудит customer.debt_viewed
        (summary, refresh: true; при include=documents — дополнительно customer.finance.view).
        Ошибки: 503 ONEC_UNAVAILABLE (1С не ответила за ONEC_SYNC_CHECK_TIMEOUT_MS = 6000 мс; снимок не изменён),
        422 CUSTOMER_NOT_IDENTIFIED (клиент source=pos с onecStatus ≠ confirmed), 403 STEP_UP_REQUIRED
        (include=documents без step-up), 403 FORBIDDEN, 404 NOT_FOUND, 429 RATE_LIMITED (retryAfter).
      x-permissions: [customer.receivables.read.summary, customer.receivables.read.detail]
      x-roles: [cashier, senior_seller, admin, owner]
      x-step-up: true
      x-step-up-operation: [customer.receivables.read.detail]
      x-idempotent: true
      x-rate-limit-group: RL-RECV-REFRESH
      security:
        - bearerAuth: []
        - bearerAuth: []
          stepUpToken: []
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/IdempotencyKeyOptional" }
        - { $ref: "#/components/parameters/StepUpToken" }
        - name: include
          in: query
          required: false
          description: "documents — вернуть детализацию (customer.receivables.read.detail; step-up)."
          schema: { type: string, enum: [documents] }
      responses:
        "200":
          description: "Receivable с новым asOf, isStale=false, refreshed=true (или refreshed=false — снимок моложе 30 с)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            X-Data-As-Of: { $ref: "#/components/headers/XDataAsOf" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Receivable" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Problem" }

  # -----------------------------------------------------------------------------------
  # 08 §4.11.6 — скидки и условия клиента
  # -----------------------------------------------------------------------------------
  /customers/{id}/discounts:
    get:
      operationId: customers_discounts_get
      tags: [customers]
      summary: Скидки и условия клиента
      description: >
