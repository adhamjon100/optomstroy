  /customers/{id}/links/{linkId}/confirm:
    post:
      operationId: customers_links_confirm
      tags: [customers]
      summary: Подтвердить привязку аккаунта к клиенту (proposed или conflict) — только admin со step-up
      description: >
        08 §4.11.7; ядро §22.12; 11 №32, §4.4. customer.link.resolve — только admin, всегда со step-up
        (stepUp.operation = customer.link.resolve); cashier, senior_seller, owner, seller, customer → 403 FORBIDDEN.
        Клиент подтверждает свою привязку через POST /registration/customer-match/confirm (08 §4.2.4), не этим путём.
        Подтверждение привязки, уже находящейся в целевом статусе, → 200 без изменений. Аудит customer.link.confirmed /
        customer.link.conflict_resolved. Статус: ПРЕДВАРИТЕЛЬНО.
        Ошибки: 409 CUSTOMER_LINK_CONFLICT (другая confirmed привязка существует и force не задан),
        403 STEP_UP_REQUIRED (без X-Step-Up-Token), 403 FORBIDDEN (любая роль, кроме admin), 404 NOT_FOUND; общие (08 §4).
      x-permissions: [customer.link.resolve]
      x-roles: [admin]
      x-step-up: true
      x-step-up-operation: [customer.link.resolve]
      x-idempotent: true
      x-rate-limit-group: RL-ADMIN
      security:
        - bearerAuth: []
          stepUpToken: []
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/CustomersLinkIdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/IdempotencyKeyOptional" }
        - { $ref: "#/components/parameters/StepUpToken" }
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CustomersLinkConfirmRequest" }
      responses:
        "200":
          description: "CustomerLink в статусе confirmed."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CustomerLink" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "429": { $ref: "#/components/responses/TooManyRequests" }
        default: { $ref: "#/components/responses/Problem" }

