  /catalog/sync/{entity}:
    get:
      operationId: catalog_sync_get
      tags:
      - catalog
      summary: Выгрузка и инкремент офлайн-кэша каталога
      description: 'Первичная загрузка — вызовы без since страницами до hasMore=false; инкремент — since = последний сохранённый nextCursor сущности
        (08 §4.24, ядро §22.7). Курсор непрозрачный (base64url, HMAC) и монотонный по (updated_at, id); подделанный → 400 VALIDATION_FAILED rule
        cursor; старше срока хранения удалений (30 дней, 07 §11.4) → 409 VERSION_CONFLICT reason cursor_expired — клиент повторяет загрузку сущности
        без since. Рекомендуемый порядок: units → categories → attributes → warehouses → price_lists → products → variants → packagings → barcodes
        → prices → stock → images; не более 2 параллельных запросов. Права: catalog.read — все сущности; prices, price_lists — дополнительно catalog.prices.read,
        только виды цен из price_lists.visible_to_roles (все — при catalog.prices.read.all); stock — дополнительно inventory.read (customer —
        по customer_stock_display). Токен integration → 403. ETag = хэш (entity, since, nextCursor), Cache-Control: private, no-cache; If-None-Match
        → 304 — изменений после since нет. Повтор с тем же since → те же строки. Аудит не пишется.'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: entity
        in: path
        required: true
        schema:
          $ref: '#/components/schemas/CatalogSyncEntity'
      - name: since
        in: query
        required: false
        description: Непрозрачный курсор из nextCursor предыдущего ответа; отсутствует — выгрузка с начала.
        schema:
          type: string
          maxLength: 2048
      - name: limit
        in: query
        required: false
        description: 1…200, по умолчанию 200; > 200 → VALIDATION_FAILED.
        schema:
          type: integer
          minimum: 1
          maximum: 200
          default: 200
      - name: warehouseId
        in: query
        required: false
        description: Только для entity=stock; по умолчанию — все активные склады.
        schema:
          type: string
          format: uuid
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Страница выгрузки сущности.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              description: Политика кэширования (08 §2.8).
              schema:
                type: string
                example: private, no-cache
            ETag:
              $ref: '#/components/headers/ETag'
            X-Data-As-Of:
              $ref: '#/components/headers/XDataAsOf'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogSyncResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - catalog.read
      - catalog.prices.read
      - catalog.prices.read.all
      - inventory.read
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
  /images/{sha}/{size}:
    get:
      operationId: catalog_images_get
      tags:
      - catalog
      summary: Файл изображения (через pos-proxy)
      description: 'Контент-адресуемое фото WebP: sha — SHA-256 исходника (64 hex), size ∈ thumb (160), card (400), full (1200) (D-30). В R1 —
        без Bearer (URL непредсказуем, данные не ПДн; 08 §2.2, §3.15, 11 SEC-013). Отдаётся Caddy из images/{sha}/{size}.webp; pos-api — только
        fallback-генерация размера. Rate limit — на уровне Caddy, не API. Коды 08 §2.4 не применяются; 404 — не problem+json. Подписанные URL
        (?exp=&sig=) — R2, в контракт R1 не входят. Заголовки X-Device-Id, X-App-Version, X-Platform не требуются: проверку выполняет не pos-api,
        а pos-proxy, и ответ VALIDATION_FAILED здесь невозможен (08 §4.4.7).'
      security: []
      parameters:
      - name: sha
        in: path
        required: true
        schema:
          type: string
          pattern: ^[0-9a-f]{64}$
      - name: size
        in: path
        required: true
        schema:
          type: string
          enum:
          - thumb
          - card
          - full
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Изображение WebP.
          headers:
            Cache-Control:
              description: Неизменяемый контент-адресуемый ресурс (08 §2.8).
              schema:
                type: string
                example: public, max-age=31536000, immutable
            ETag:
              description: '"<sha>-<size>" (08 §4.4.7).'
              schema:
                type: string
                example: '"<sha>-thumb"'
          content:
            image/webp:
              schema:
                type: string
                format: binary
        '304':
          description: If-None-Match совпал с ETag; тела нет.
          headers:
            ETag:
              schema:
                type: string
        '404':
          $ref: '#/components/responses/CatalogImageNotFound'
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
