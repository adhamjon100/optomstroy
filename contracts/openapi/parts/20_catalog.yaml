# =====================================================================================
# Optomstroy POS API — фрагмент модулей catalog, search, inventory, images, settings (RM-B-003)
# Пути: /catalog/* (включая §4.24 /catalog/sync/{entity}), /search/*, /inventory/*, /images/{sha}/{size},
# /settings/public — относительно servers (/api/v1).
# Источник: 08_API_SPECIFICATION.md v1.9 §2, §3.6, §3.15, §4.4–§4.6, §4.23, §4.24, §8, §9; права — 11 §4.3–§4.4;
# ядро R0 v1.9 §19.2, §22.7, §24.2 (приоритет). Правила оформления — ../NOTES.md.
# Файл сгенерирован детерминированно; ссылки $ref — на компоненты собранного документа (00_root.yaml + фрагменты).
#
# Решения автора фрагмента (записаны здесь: задача разрешает писать только этот файл; перенести в NOTES.md при сборке):
#  1. Ключи openapi/info оставлены по постановке задачи («openapi: 3.0.3, info (минимальный)»); NOTES §1 считает
#     фрагмент без них — сборщик берёт из фрагмента только paths и components.
#  2. operationId — <module>_<action> snake_case по тегу (08 §8 — владелец правил генерации; NOTES §3 п.2), а не camelCase
#     из постановки. Расширение прав — x-permissions (массив, NOTES §5 п.1), а не x-permission.
#  3. x-permissions перечисляет все коды 11 §4.3, которые сервер проверяет на операции (08 §3.15): первый — обязательный код
#     доступа к операции, остальные — field-level/параметры (цена по роли, prices[] и priceListId, stock в sync,
#     суммы долга в /search/customers). Условия описаны в description операции.
#  4. GET /images/{sha}/{size}: security: [], x-permissions: [], x-roles: [] (публичный, 08 §2.2, §3.15); без X-Device-Id,
#     X-App-Version, X-Platform и без default problem+json — ответ формирует pos-proxy, коды 08 §2.4 не применяются (08 §4.4.7);
#     x-rate-limit-group не задан — лимит на уровне Caddy. Тег — catalog (08 §4.4.7 входит в модуль catalog).
#  5. GET /catalog/sync/{entity}: items — anyOf двенадцати схем элементов (соответствие entity → схема — в description
#     CatalogSyncResponse); oneOf не применим — схемы элементов пересекаются по составу полей. CatalogSyncProduct и
#     CatalogSyncVariant не содержат вложенных variants/packagings/images: эти данные приходят своими сущностями (08 §4.24).
#     Версия 1.1.0 (аддитивно, ADR-097): поля выгрузки, которые сервер уже отдаёт, внесены по 08 §4.24.1 «Уточнения выгрузки»
#     п. 2 (EQ-CSYNC-02, FIX-EF-01, EQ-FEF-02, EQ-FEF-03, EQ-FEF-12); categories → CatalogSyncCategory (Category + path, depth,
#     isVisible, updatedAt) — экранная схема Category этих полей не получает.
#  6. GET /search/barcode/{value}: warnings[] — общая схема Warning (08 §2.4, NOTES §2). Значения ambiguous_barcode
#     (08 §4.5.2) нет в WarningCode (00_root) — расхождение 08 §4.5.2 ↔ §2.4: требуется добавить код в WarningCode
#     у владельца (08 §2.4) и в 00_root.yaml; до этого сервер не может вернуть это предупреждение по контракту.
#  7. GET /search/customers: matchType — поле каждого элемента (как у /search/products); элементы — Customer (надмножество
#     с x-roles) + matchType, т. к. строгие CustomerView* имеют additionalProperties: false и не допускают matchType.
#  8. POST /inventory/check: тело требует warehouseId и items (оба поля в карточке 08 §4.6.2 без пометки «необязательно»);
#     Idempotency-Key допускается (IdempotencyKeyOptional, x-idempotent: true — NOTES §3 п.5), но не нужен.
#  9. VALIDATION_FAILED по семантическим правилам (q_too_short, search_scope_role) может прийти как 422 (08 §2.4) —
#     для поиска явно перечислены и 400, и 422.
# 10. R2 не включено: подписанные URL изображений (?exp=&sig=), прочие элементы 13 §3.11.
# =====================================================================================
openapi: 3.0.3
info:
  title: Optomstroy POS API — catalog, search, inventory, images, settings (фрагмент)
  version: 1.0.0
paths:
  /catalog/categories:
    get:
      operationId: catalog_categories_list
      tags:
      - catalog
      summary: Дерево категорий со счётчиками
      description: 'Сайдбар «Категории товаров» (SCR-10, SCR-12): дерево с productCount и iconKey (Q-022). Реплика 1С, только чтение (D-28). ETag
        = sha256(snapshotVersion), Cache-Control: private, max-age=300 (08 §2.8). Аудит не пишется (08 §4.4.1).'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: parentId
        in: query
        required: false
        description: Вернуть поддерево; неизвестный → 404 NOT_FOUND.
        schema:
          type: string
          format: uuid
      - name: depth
        in: query
        required: false
        description: Глубина дерева 1…5; по умолчанию — все уровни.
        schema:
          type: integer
          minimum: 1
          maximum: 5
      - name: includeEmpty
        in: query
        required: false
        schema:
          type: boolean
          default: false
      - name: inStockOnly
        in: query
        required: false
        description: Считать только товары с available > 0.
        schema:
          type: boolean
          default: false
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Дерево категорий.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              description: Политика кэширования (08 §2.8).
              schema:
                type: string
                example: private, max-age=300
            ETag:
              $ref: '#/components/headers/ETag'
            X-Data-As-Of:
              $ref: '#/components/headers/XDataAsOf'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogCategoriesResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - catalog.read
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
  /catalog/products:
    get:
      operationId: catalog_products_list
      tags:
      - catalog
      summary: 'Список товаров: фильтры, сортировка, курсор'
      description: 'Сетка/список SCR-10/12 («Найдено: 124 товара», «Загружаем ещё…»). Товары с deletionMark=true не возвращаются; товар без цены
        в выбранном виде цены — price: null и stockLevel (в корзину нельзя — VARIANT_UNAVAILABLE). Для hasVariants=true — priceRange и суммарный
        stock по вариантам. Сортировка popularity — [НЕ ПОДТВЕРЖДЕНО, Q-023]. ETag = хэш (max(updated_at), count, priceListId, warehouseId), Cache-Control:
        private, max-age=60 (08 §2.8). Для офлайн-кэша не используется — только GET /catalog/sync/{entity} (ядро §22.7). customer (R1, ядро §24.2):
        цена — по виду цены клиента, остатки — по app_settings.customer_stock_display (status — только stockLevel, quantity — плюс available;
        08 §3.6). x-permissions: catalog.read — обязательный код операции; catalog.prices.read — цена по правилам роли; catalog.prices.read.all
        — prices[] всех видов и параметр priceListId (08 §3.15, 11 §4.3).'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/CatalogCategoryIdQuery'
      - $ref: '#/components/parameters/CatalogIncludeSubcategories'
      - $ref: '#/components/parameters/CatalogWarehouseIdQuery'
      - $ref: '#/components/parameters/CatalogPriceListIdQuery'
      - $ref: '#/components/parameters/CatalogInStock'
      - $ref: '#/components/parameters/CatalogPriceMin'
      - $ref: '#/components/parameters/CatalogPriceMax'
      - $ref: '#/components/parameters/CatalogBrand'
      - $ref: '#/components/parameters/CatalogAttr'
      - $ref: '#/components/parameters/CatalogFavorite'
      - $ref: '#/components/parameters/CatalogHasImage'
      - $ref: '#/components/parameters/CatalogProductsLimit'
      - $ref: '#/components/parameters/Cursor'
      - name: sort
        in: query
        required: false
        description: 'Сортировка (08 §4.4.2; ядро §19.2): id всегда последний ключ (добавляет сервер); available:desc — по available на складе
          запроса, товары без снимка остатка — в конце; sku:asc — по артикулу. Неизвестное значение → VALIDATION_FAILED rule sort_field; смена
          sort при cursor → rule cursor_sort_mismatch.'
        schema:
          type: string
          enum:
          - price:asc
          - price:desc
          - name:asc
          - name:desc
          - popularity:desc
          - updatedAt:desc
          - available:desc
          - sku:asc
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Страница товаров (Page<ProductSummary>) + facets; totalEstimate — точный для категории.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              description: Политика кэширования (08 §2.8).
              schema:
                type: string
                example: private, max-age=60
            ETag:
              $ref: '#/components/headers/ETag'
            X-Data-As-Of:
              $ref: '#/components/headers/XDataAsOf'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/Page'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/ProductSummary'
                    facets:
                      $ref: '#/components/schemas/CatalogProductFacets'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - catalog.read
      - catalog.prices.read
      - catalog.prices.read.all
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
  /catalog/products/recent:
    get:
      operationId: catalog_products_recent_list
      tags:
      - catalog
      summary: Недавние товары пользователя
      description: 'Блок «Недавние товары» (SCR-10); только собственный список (recent_products). Cache-Control: no-store. Аудит не пишется (08
        §4.4.5).'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - name: limit
        in: query
        required: false
        description: 1…50, по умолчанию 20.
        schema:
          type: integer
          minimum: 1
          maximum: 50
          default: 20
      responses:
        '200':
          description: Недавние товары.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              description: Политика кэширования (08 §2.8).
              schema:
                type: string
                example: no-store
            X-Data-As-Of:
              $ref: '#/components/headers/XDataAsOf'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogRecentProductsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - catalog.read
      - catalog.prices.read
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
    delete:
      operationId: catalog_products_recent_clear
      tags:
      - catalog
      summary: Очистить недавние товары
      description: 'Кнопка «Очистить» (SCR-10; ядро §17.4). Идемпотентен по семантике: повтор → 204. Аудит не пишется (08 §4.4.5).'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      responses:
        '204':
          description: Список очищен.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              description: Политика кэширования (08 §2.8).
              schema:
                type: string
                example: no-store
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - catalog.read
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
  /catalog/products/{id}:
    get:
      operationId: catalog_products_get
      tags:
      - catalog
      summary: Карточка товара
      description: 'SCR-14: фото, описание, характеристики (Q-021), варианты, упаковки, штрихкоды, цены по роли, остатки по складам, минимальная
        партия. Для customer товар с deletionMark → 404; staff получает его с deletionMark=true. Побочный эффект — асинхронная запись в recent_products
        (не аудит). ETag, Cache-Control: private, max-age=60 (08 §2.8). customer (R1, ядро §24.2): цена — по виду цены клиента, остатки — по app_settings.customer_stock_display
        (status — только stockLevel, quantity — плюс available; 08 §3.6). x-permissions: catalog.read — обязательный код операции; catalog.prices.read
        — цена по правилам роли; catalog.prices.read.all — prices[] всех видов и параметр priceListId (08 §3.15, 11 §4.3).'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/CatalogWarehouseIdQuery'
      - $ref: '#/components/parameters/CatalogPriceListIdQuery'
      - name: include
        in: query
        required: false
        description: Состав карточки через запятую; по умолчанию все блоки (08 §4.4.3).
        style: form
        explode: false
        schema:
          type: array
          items:
            type: string
            enum:
            - variants
            - prices
            - stockByWarehouse
            - images
          maxItems: 4
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Карточка товара.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              description: Политика кэширования (08 §2.8).
              schema:
                type: string
                example: private, max-age=60
            ETag:
              $ref: '#/components/headers/ETag'
            X-Data-As-Of:
              $ref: '#/components/headers/XDataAsOf'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Product'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - catalog.read
      - catalog.prices.read
      - catalog.prices.read.all
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
  /catalog/products/{id}/variants:
    get:
      operationId: catalog_products_variants_list
      tags:
      - catalog
      summary: Варианты товара с ценами и остатками
      description: 'SCR-15 VariantSelector: варианты, остаток и цена каждого на выбранном складе; характеристики 1С — [ТИПОВО, Q-021]. Товар отсутствует
        или снят (для customer) → 404. ETag, Cache-Control: private, max-age=60 (08 §2.8). customer (R1, ядро §24.2): цена — по виду цены клиента,
        остатки — по app_settings.customer_stock_display (status — только stockLevel, quantity — плюс available; 08 §3.6). x-permissions: catalog.read
        — обязательный код операции; catalog.prices.read — цена по правилам роли; catalog.prices.read.all — prices[] всех видов и параметр priceListId
        (08 §3.15, 11 §4.3).'
      parameters:
      - $ref: '#/components/parameters/DeviceId'
      - $ref: '#/components/parameters/AppVersion'
      - $ref: '#/components/parameters/Platform'
      - $ref: '#/components/parameters/RequestId'
      - $ref: '#/components/parameters/AcceptLanguage'
      - $ref: '#/components/parameters/IdPath'
      - $ref: '#/components/parameters/CatalogWarehouseIdQuery'
      - $ref: '#/components/parameters/CatalogPriceListIdQuery'
      - name: inStockOnly
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/IfNoneMatch'
      responses:
        '200':
          description: Варианты и оси выбора.
          headers:
            X-Request-Id:
              $ref: '#/components/headers/XRequestId'
            X-Min-App-Version:
              $ref: '#/components/headers/XMinAppVersion'
            X-Recommended-App-Version:
              $ref: '#/components/headers/XRecommendedAppVersion'
            Cache-Control:
              description: Политика кэширования (08 §2.8).
              schema:
                type: string
                example: private, max-age=60
            ETag:
              $ref: '#/components/headers/ETag'
            X-Data-As-Of:
              $ref: '#/components/headers/XDataAsOf'
            X-RateLimit-Limit:
              $ref: '#/components/headers/XRateLimitLimit'
            X-RateLimit-Remaining:
              $ref: '#/components/headers/XRateLimitRemaining'
            X-RateLimit-Reset:
              $ref: '#/components/headers/XRateLimitReset'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CatalogVariantsResponse'
        '304':
          $ref: '#/components/responses/NotModified'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        default:
          $ref: '#/components/responses/Problem'
      x-permissions:
      - catalog.read
      - catalog.prices.read
      - catalog.prices.read.all
      x-roles:
      - seller
      - cashier
      - senior_seller
      - admin
      - owner
      - customer
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
  /catalog/units:
    get:
      operationId: catalog_units_list
      tags:
