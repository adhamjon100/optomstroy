        default:
          $ref: "#/components/responses/Problem"

  /returns/{id}/accept:
    post:
      tags: [returns]
      operationId: returns_accept
      summary: Согласовать заявку на возврат в POS (только RETURNS_FROM_POS_ENABLED=false; step-up)
      description: >
        08 §4.15.6 (ядро §22.11, §23 п.8): submitted → accepted — заявка согласована старшим в POS, когда передача в 1С
        через outbox выключена (RETURNS_FROM_POS_ENABLED=false, по умолчанию): заявка печатается и оформляется в 1С вручную,
        completed придёт проекцией документа возврата 1С. При RETURNS_FROM_POS_ENABLED=true accepted ставит только 1С →
        409 ORDER_STATE_INVALID (reason: already_in_onec). Не submitted → 409 ORDER_STATE_INVALID (reason: invalid_transition).
        Только return.approve (senior_seller, admin); cashier, owner, seller, customer → 403 FORBIDDEN. Ошибки также
        403 STEP_UP_REQUIRED, 409 VERSION_CONFLICT, 404 NOT_FOUND. Модуль в целом — по returns_enabled (RET-012).
        Аудит return.status_changed (submitted → accepted, stepUpMethod). Cache-Control: no-store.
      security:
        - bearerAuth: []
          stepUpToken: []
      x-permissions: [return.approve]
      x-roles: [senior_seller, admin]
      x-step-up: true
      x-step-up-operation: [return.approve]
      x-idempotent: required
      x-feature-flag: RETURNS_FROM_POS_ENABLED=false
      x-rate-limit-group: RL-FIN
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReturnsAcceptRequest" }
      responses:
        "200":
          description: "ReturnRequest (status=accepted)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ReturnRequest" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"

components:
  schemas:
    # ===== payments: запросы (08 §4.9) =====
    PaymentsAllocationInput:
      type: object
      required: [documentNumber, amount]
      additionalProperties: false
      description: "Строка распределения оплаты долга по документу 1С (08 §4.9.1; ответная форма — PaymentAllocation)."
      properties:
        documentNumber: { type: string, minLength: 1, maxLength: 64, example: "УТ-000123" }
        amount: { $ref: "#/components/schemas/Money" }
    PaymentsCreateRequest:
      type: object
      required: [customerId, method]
      additionalProperties: false
      description: >
        Тело POST /payments (08 §4.9.1). Сумму платежа формирует сервер: из allocation[] (allocationMode=explicit) или
        из amountRequested (allocationMode=fifo — распределение FIFO по сроку / решает 1С, Q-177). amountRequested не может
        превышать receivable.balance (иначе 422 VALIDATION_FAILED, rule exceeds_balance; переплата/аванс — Q-012).
        Клиент не указан или «Розничный покупатель» → 422 CUSTOMER_NOT_IDENTIFIED; снимок долга старше 60 мин и 1С
        недоступна → 422 RECEIVABLES_STALE (fail-closed, POS-063).
      properties:
        customerId: { type: string, format: uuid }
        method:
          allOf: [ { $ref: "#/components/schemas/PaymentMethod" } ]
          description: "Только cash или qr_bakai; credit → 400 VALIDATION_FAILED (08 §4.9.1)."
        allocation:
          type: array
          nullable: true
          maxItems: 500
          description: "Явное распределение по документам 1С; null — FIFO (решение 1С, ядро §22.8)."
          items: { $ref: "#/components/schemas/PaymentsAllocationInput" }
        amountRequested:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          description: "Сумма оплаты долга при распределении FIFO; только для платежа по долгу (не по заказу)."
        allocationMode:
          type: string
          enum: [explicit, fifo]
          description: "Режим распределения (08 §4.9.1)."
        receivedAmount:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          description: "Полученные наличные (для расчёта сдачи changeAmount); только method=cash."
        comment: { type: string, maxLength: 200 }
    PaymentsConfirmManualRequest:
      type: object
      required: [bankReference, receivedAmount]
      additionalProperties: false
      description: "Тело POST /payments/{id}/confirm-manual (08 §4.9.3, §8). Поля acceptMismatch и reason удалены — в теле → 400 VALIDATION_FAILED."
      properties:
        bankReference:
          type: string
          minLength: 1
          maxLength: 64
          description: "Референс / номер из выписки BAKAI Business (обязателен)."
          example: "BK-77123"
        receivedAmount:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          description: "Подтверждённая сумма по выписке; ≠ amount → 200 с manual_confirm и warnings[PAYMENT_AMOUNT_MISMATCH]."
        receivedAt: { type: string, format: date-time, example: "2026-10-18T09:20:00Z" }
        comment: { type: string, maxLength: 200, example: "выписка 09:20" }
    PaymentsVoidReasonCode:
      type: string
      enum: [cashier_error, customer_refused, duplicate, other]
      description: "Код причины ручного аннулирования (08 §4.9.4). Системное аннулирование при смене способа (void_reason=method_changed) этим маршрутом не выполняется."
    PaymentsVoidRequest:
      type: object
      required: [reason, reasonCode]
      additionalProperties: false
      description: "Тело POST /payments/{id}/void (08 §4.9.4)."
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, example: "ошибка кассира" }
        reasonCode: { $ref: "#/components/schemas/PaymentsVoidReasonCode" }

    # ===== payments: ответы =====
    PaymentsAllowedAction:
      type: string
      enum: [confirm_manual, void, reissue_qr]
      description: "Действия, доступные пользователю над платежом в текущем статусе (08 §4.9.2)."
    PaymentsGetResponse:
      description: "Ответ GET /payments/{id}: Payment + allowedActions (08 §4.9.2)."
      allOf:
        - $ref: "#/components/schemas/Payment"
        - type: object
          required: [allowedActions]
          properties:
            allowedActions:
              type: array
              items: { $ref: "#/components/schemas/PaymentsAllowedAction" }

    # ===== payments: вебхук банка (08 §6 — ПРЕДПОЛОЖЕНИЕ, Q-014; только QR_PROVIDER=bakai, R2) =====
    PaymentsQrWebhookEvent:
      type: object
      required: [eventId, eventType, reference, amount, currency]
      additionalProperties: false
      description: "Тело вебхука банка — проектное предположение 08 §6 [НЕ ПОДТВЕРЖДЕНО: Q-014]; заменяется контрактом банка (13 RM-F-014)."
      properties:
        eventId: { type: string, maxLength: 128, example: "evt-0001" }
        eventType:
          type: string
          enum: [payment.succeeded, payment.failed, payment.expired]
        reference: { type: string, maxLength: 64, description: "= payment.qr.bankReference.", example: "BK-77123" }
        merchantOrderId: { type: string, maxLength: 64, description: "Публичный номер заказа POS (сопоставление вторым ключом).", example: "POS-2026-000123" }
        amount: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string, enum: [KGS] }
        paidAt: { type: string, format: date-time, example: "2026-10-18T09:20:11Z" }
        payer:
          type: object
          additionalProperties: false
          description: "Без ПДн плательщика в логах (NFR-LOG-001)."
          properties:
            masked: { type: string, maxLength: 64 }
    PaymentsQrWebhookAck:
      type: object
      required: [received]
      description: "Быстрый ответ банку (≤ 2 с): 200 {received: true}; неизвестный референс — status=unknown_reference + запись сверки (08 §6)."
      properties:
        received: { type: boolean, enum: [true] }
        status:
          type: string
          enum: [unknown_reference]
          description: "Присутствует только когда платёж не сопоставлен (запись в payment_webhook_events, отчёт qr-reconciliation со status=unmatched)."

    # ===== pos: дашборд кассира (08 §4.10.1) =====
    PosDashboardTotals:
      type: object
      required: [cash, qr, credit, ordersCount, paymentsCount]
      description: "Суммы за день по способам оплаты и счётчики (UI-30-014)."
      properties:
        cash: { $ref: "#/components/schemas/Money" }
        qr: { $ref: "#/components/schemas/Money" }
        credit: { $ref: "#/components/schemas/Money" }
        ordersCount: { type: integer, minimum: 0 }
        paymentsCount: { type: integer, minimum: 0 }
    PosDashboardOverdueItem:
      type: object
      required: [customer, overdueAmount, overdueDays, asOf]
      description: "Строка «Топ просрочек» — суммы из снимка 1С с датой (D-24)."
      properties:
        customer:
          allOf: [ { $ref: "#/components/schemas/Customer" } ]
          description: "Ролевое представление Customer (08 §3.7)."
        overdueAmount: { $ref: "#/components/schemas/Money" }
        overdueDays: { type: integer, minimum: 0, example: 12 }
        asOf: { type: string, format: date-time }
    PosDashboardSync:
      type: object
      required: [overall]
      description: "Свежесть финансовых данных 1С (SRC-C-112) и общий статус обмена; детали — GET /sync/status."
      properties:
        receivablesAsOf: { type: string, format: date-time, nullable: true }
        stockAsOf: { type: string, format: date-time, nullable: true }
        overall: { type: string, enum: [ok, degraded, failed] }
    PosDashboard:
      type: object
      required: [date, totals, awaitingPayment, recentTransactions, sync, notificationsUnread, qrPendingCount, manualConfirmCount]
      description: >
        Ответ GET /pos/dashboard (08 §4.10.1). Поля с x-roles сериализуются только ролям из списка (allowlist 11 SEC-031,
        12 T-SEC-017); неразрешённое поле отсутствует, а не равно null.
      properties:
        date: { type: string, format: date, example: "2026-10-18" }
        totals: { $ref: "#/components/schemas/PosDashboardTotals" }
        awaitingPayment:
          type: array
          maxItems: 20
          description: "Заказы submitting, pending_approval, approved, awaiting_payment с открытым платежом (ядро §22.5, §23 п.7). OrderSummary — схема фрагмента orders (08 §4.8.2)."
          items: { $ref: "#/components/schemas/OrderSummary" }
        qrPending:
          type: array
          description: "QR-платежи в ожидании; только при payment.read.all."
          items: { $ref: "#/components/schemas/Payment" }
          x-roles: [cashier, senior_seller, owner]
        manualConfirm:
          type: array
          description: "Платежи manual_confirm, ожидающие разбора (ядро §22.2); только при payment.read.all."
          items: { $ref: "#/components/schemas/Payment" }
          x-roles: [cashier, senior_seller, owner]
        qrPendingCount: { type: integer, minimum: 0 }
        manualConfirmCount: { type: integer, minimum: 0 }
        overdue:
          type: array
          maxItems: 10
          description: "Топ просрочек; только при customer.receivables.read.summary; при непустом — аудит receivables.overdue_viewed."
          items: { $ref: "#/components/schemas/PosDashboardOverdueItem" }
          x-roles: [cashier, senior_seller, admin, owner]
        favoriteCustomers:
          type: array
          maxItems: 12
          description: "Избранные клиенты (≤ 12, ядро §19.2) — DTO без сумм долга (флаги hasDebt/isOverdue); только при favorites.customers.manage."
          items: { $ref: "#/components/schemas/Customer" }
          x-roles: [cashier, senior_seller, admin]
        recentTransactions:
          type: array
          maxItems: 10
          description: "Последние операции за день; платёжные поля (externalRef, суммы платежей) — только при payment.read.all."
          items: { $ref: "#/components/schemas/Transaction" }
        sync: { $ref: "#/components/schemas/PosDashboardSync" }
        notificationsUnread: { type: integer, minimum: 0 }

    # ===== returns: запросы (08 §4.15) =====
    ReturnsItemInput:
      type: object
      required: [orderLineNo, quantity]
      additionalProperties: false
      description: "Строка заявки: номер строки заказа и количество (≤ отгружено − возвращено, POS-080; иначе 422 RETURN_QTY_EXCEEDED). Сумму считает сервер."
      properties:
        orderLineNo: { type: integer, minimum: 1 }
        quantity: { $ref: "#/components/schemas/Quantity" }
    ReturnsCreateRequest:
      type: object
      required: [orderId, reasonCode, items]
      additionalProperties: false
      description: "Тело POST /returns (08 §4.15.1); суммы клиент не передаёт."
      properties:
        orderId: { type: string, format: uuid }
        reasonCode: { $ref: "#/components/schemas/ReturnReason" }
        reasonComment:
          type: string
          maxLength: 500
          description: "Обязателен при reasonCode=other (иначе 400 VALIDATION_FAILED)."
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/ReturnsItemInput" }
        refundKind:
          type: string
          nullable: true
          allOf: [ { $ref: "#/components/schemas/PaymentMethod" } ]
          description: "Пожелание способа возврата; credit — зачёт в счёт долга; null — не указано."
    ReturnsUpdateRequest:
      type: object
      required: [rowVersion]
      additionalProperties: false
      description: "Тело PATCH /returns/{id} (08 §4.15.2) — только для status=draft; передаются изменяемые поля и rowVersion."
      properties:
        reasonCode: { $ref: "#/components/schemas/ReturnReason" }
        reasonComment:
          type: string
          maxLength: 500
          description: "Обязателен при reasonCode=other."
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/ReturnsItemInput" }
        refundKind:
          type: string
          nullable: true
          allOf: [ { $ref: "#/components/schemas/PaymentMethod" } ]
        rowVersion: { type: integer }
    ReturnsSubmitRequest:
      type: object
      required: [rowVersion]
      additionalProperties: false
      description: "Тело POST /returns/{id}/submit (08 §4.15.3)."
      properties:
        rowVersion: { type: integer, example: 2 }
        comment: { type: string, maxLength: 200 }
    ReturnsRejectRequest:
      type: object
      required: [reason, rowVersion]
      additionalProperties: false
      description: "Тело POST /returns/{id}/reject (08 §4.15.5); причина обязательна (SEC-076)."
      properties:
        reason: { type: string, minLength: 5, maxLength: 500 }
        rowVersion: { type: integer, example: 3 }
    ReturnsAcceptRequest:
      type: object
      required: [rowVersion]
      additionalProperties: false
      description: "Тело POST /returns/{id}/accept (08 §4.15.6)."
      properties:
        comment: { type: string, maxLength: 500, nullable: true }
        rowVersion: { type: integer, example: 3 }
