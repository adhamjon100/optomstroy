      description: >
        08 §4.10.1: сводка смены — суммы за день по способам оплаты, ожидающие оплаты заказы (submitting,
        pending_approval, approved, awaiting_payment с открытым платежом — ядро §22.5, §23 п.7), QR в ожидании,
        платежи manual_confirm, просроченные долги (топ), избранные клиенты, последние операции, свежесть данных 1С.
        Состав ответа — field-level по кодам (11 SEC-031, SEC-036; allowlist — поле, не разрешённое роли, ОТСУТСТВУЕТ):
        qrPending[], manualConfirm[] и платёжные поля recentTransactions[] (externalRef, суммы платежей) — только при
        payment.read.all (без него, у admin — только счётчики qrPendingCount, manualConfirmCount); overdue[] — только при
        customer.receivables.read.summary; favoriteCustomers[] — только при favorites.customers.manage (owner — нет).
        seller, customer → 403 FORBIDDEN. Клиент обновляет при открытии и каждые 60 с. Cache-Control: no-store.
        Аудит receivables.overdue_viewed — при каждом ответе с непустым overdue[] (раз на запрос).
