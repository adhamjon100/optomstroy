      summary: Отправить заявку на возврат (draft → submitted; step-up)
      description: >
        08 §4.15.3 (критическая операция, ядро §3.3): draft → submitted + onec_outbox(return_request) → «Заявка на возврат
        товаров от клиента» в 1С [ТИПОВО: УТ 11.5]; при RETURNS_FROM_POS_ENABLED=false (по умолчанию, ядро §21 п.1) элемент
        outbox не создаётся — заявка остаётся submitted и оформляется в 1С вручную. Право return.submit с object-level
        SEC-030 (г) (автор; senior_seller/admin — и чужой черновик; cashier на чужой → 404). Если сумма заявки выше
        app_settings.return_approval_threshold (по умолчанию 10 000 сом; approvalReason = return_threshold_exceeded) —
        отправку выполняет держатель return.approve (senior_seller, admin) со step-up (ядро §22.11): cashier → 403 FORBIDDEN
        (reason: return_threshold_exceeded), черновик остаётся draft. Ошибки: 409 ORDER_STATE_INVALID (resource:
        return_request, reason: not_draft), 422 RETURN_QTY_EXCEEDED (перепроверка), 403 STEP_UP_REQUIRED, 403 FORBIDDEN,
        409 VERSION_CONFLICT. Аудит return.submitted (stepUpMethod, totalAmount); транзакция refund — только при completed
        из 1С. Cache-Control: no-store.
      security:
        - bearerAuth: []
          stepUpToken: []
      x-permissions: [return.submit, return.approve]
      x-roles: [cashier, senior_seller, admin]
      x-step-up: true
      x-step-up-operation: [return.submit, return.approve]
      x-idempotent: required
      x-feature-flag: returns_enabled
