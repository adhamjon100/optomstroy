# =====================================================================================
# Optomstroy POS API — фрагмент модулей payments (/payments*), pos (/pos/dashboard), returns (/returns*)
# RM-B-003. Источник истины: 08_API_SPECIFICATION.md v1.9 — §4.9 (payments), §4.10 (pos), §4.15 (returns),
# §6 и §6.1 (вебхук банка / QR через 1С), §2.7–§2.9, §2.12, §3.15 (коды прав), §9 (матрица), §10 (реестр статусов);
# права — 11 §4.3–§4.4 (+ §4.3.1); ядро R0 v1.9 §19.2, §22.2, §22.11, §23 п.3/п.4/п.7/п.8, §24.4 (приоритет).
# Правила оформления — ../NOTES.md; общие компоненты — 00_root.yaml (ссылки пишутся как в собранном документе).
#
# Решения автора фрагмента (ТЗ/постановка неоднозначны — выбран вариант владельца словаря):
#  1. operationId — `<module>_<action>` в snake_case (владелец — 08 §8 «Правила генерации», API-122, 12 T-API-001;
#     так же NOTES §3 п.2). Постановка задачи называла camelCase; принят вариант владельца.
#  2. Расширение прав — `x-permissions: [...]` (массив; 08 §8, NOTES §5 п.1), а не `x-permission`.
#  3. Ключи `openapi` и `info` оставлены по постановке задачи (файл разбирается как самостоятельный YAML);
#     сборщик берёт из фрагмента только `paths` и `components` (NOTES §1).
#  4. Условные элементы (13 §5.4 п.5; NOTES §4):
#     - POST /payments — x-feature-flag DEBT_PAYMENTS_FROM_POS, x-status proposed (Q-152; при false → 403, 08 API-087);
#     - GET /payments/{id}/documents/receipt.pdf — часть того же условного элемента (13 RM-G-013; 08 §10:
#       при DEBT_PAYMENTS_FROM_POS=false квитанция не выдаётся) — тот же флаг, x-status proposed;
#     - POST /payments/qr/webhook — только QR_PROVIDER=bakai (R2, ядро §24.4; 13 RM-F-014 «место в контракте
#       со статусом ПРЕДВАРИТЕЛЬНО»): x-feature-flag QR_PROVIDER=bakai, x-status proposed; при onec/none → 404;
#     - /returns* — x-feature-flag returns_enabled (app_settings, Q-018; RET-012) — сам модуль не условен;
#       POST /returns/{id}/accept — x-feature-flag RETURNS_FROM_POS_ENABLED=false (08 §4.15.6).
#  5. `awaitingPayment[]` дашборда — `OrderSummary` (имя 08 §4.8.2, определяет фрагмент orders; NOTES §3 п.8 —
#     имена 08 сохраняются). В этом файле схема НЕ определяется, чтобы не было двойного определения при сборке.
#  6. `GET /returns` — `Page<ReturnRequest>`: отдельной схемы «ReturnRequest(summary)» в 08 нет (NOTES §2: XxxPage не создаются).
#  7. Подмножества enum (`method` ∈ cash|qr_bakai в POST /payments) не копируются (NOTES §2): `$ref PaymentMethod`,
#     ограничение — в description (иное значение → 400 VALIDATION_FAILED).
#  8. `maxLength` там, где 08 не задаёт длину: `allocation[].documentNumber` — 64 (как `bankReference` 08 §8),
#     `comment` — 200, `reason`/`reasonComment` — 500 (08 §2.14 «Строки»).
#  9. `POST /payments/{id}/void`: `reason` и `reasonCode` обязательны (07 §5.40: ручная отмена — с причиной;
#     значения `reasonCode` — карточка 08 §4.9.4, владелец DTO; в 07 `void_reason` — text, не enum).
# 10. Вебхук: тело — ПРЕДПОЛОЖЕНИЕ 08 §6 (Q-014); `X-Timestamp` — вариант (а) §6, `required: false` до контракта банка.
#     Заголовки X-Device-Id / X-App-Version / X-Platform / X-Request-Id / Accept-Language к вебхуку не применяются.
# =====================================================================================
openapi: 3.0.3
info:
  title: Optomstroy POS API — фрагмент payments, pos, returns
  version: "1.0.0"
paths:
  # ===================================================================================
  # payments (08 §4.9, §6)
  # ===================================================================================
  /payments:
    post:
      tags: [payments]
      operationId: payments_create
      summary: Платёж в счёт долга без заказа (условно, Q-152)
      description: >
        SCR-38 «Приём оплаты по долгу» (08 §4.9.1): кассир выбирает клиента, документы долга (или FIFO по настройке 1С)
        и способ; сумму формирует сервер из allocation[] или amountRequested (POS-056); результат — документ оплаты в 1С
        через outbox, сальдо обновляется после подтверждения 1С (D-24). Ответ 201 — Payment с orderId=null, allocation[],
        qr (только для qr_bakai и при payment.qr.show — у ролей этой операции оно есть).
        QR: при QR_PROVIDER=onec недоступность 1С — 201 с платежом qr_pending без qr + warnings[QR_UNAVAILABLE]
        (далее ручное подтверждение, ядро §24.4; QR через 1С для платежа без заказа передаёт customerExternalId);
        503 QR_UNAVAILABLE — только QR_PROVIDER=bakai (R2). Повтор с тем же Idempotency-Key возвращает текущее
        представление платежа (с QR, выданным после COMMIT; B-AR-04).
        Условный элемент R1: при DEBT_PAYMENTS_FROM_POS=false → 403 FORBIDDEN (08 API-087, §10; заглушка-guard 13 §5.4 п.5).
        После перезапуска приложения не повторяется автоматически — только по решению кассира после проверки статуса
        (ядро §19.2, §22.6). Аудит payment.received; транзакция payment_received. Cache-Control: no-store.
      security:
        - bearerAuth: []
      x-permissions: [payment.debt.receive]
      x-roles: [cashier, senior_seller]
      x-step-up: false
      x-idempotent: required
      x-feature-flag: DEBT_PAYMENTS_FROM_POS
      x-status: proposed
      x-rate-limit-group: RL-FIN
      parameters:
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentsCreateRequest" }
      responses:
        "201":
          description: "Платёж создан (Payment: orderId=null, allocation[], qr для QR; warnings[QR_UNAVAILABLE] при недоступности 1С и QR_PROVIDER=onec)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        "503":
          $ref: "#/components/responses/ServiceUnavailable"
        default:
          $ref: "#/components/responses/Problem"

  /payments/{id}:
    get:
      tags: [payments]
      operationId: payments_get
      summary: Платёж (с допустимыми действиями; опрос статуса QR)
      description: >
        08 §4.9.2. payment.read.all (cashier, senior_seller, owner) — любой платёж; payment.read.own — seller (платёж
        своего заказа, без externalRef) и customer (свой платёж). admin → 403 FORBIDDEN (11 §4.4, SEC-036). Чужой платёж
        при payment.read.own → 404 NOT_FOUND. Поле qr сериализуется только при payment.qr.show (08 §3.15).
        refreshStatus=true — для qr_shown/qr_expired синхронно опросить провайдера QR: при QR_PROVIDER=onec — метод 1С
        GET /pos/v1/payments/{externalId}/status (таймаут ONEC_SYNC_CHECK_TIMEOUT_MS; при недоступности 1С — текущее
        состояние + warnings[STALE_DATA], ядро §24.4); при bakai (R2) — [НЕ ПОДТВЕРЖДЕНО: Q-014].
        Для qr_shown клиент опрашивает каждые 3 с до expiresAt либо long-polling ?wait=25 (сервер держит запрос до N с и
        отвечает при смене статуса; необходимость — Q-167). Cache-Control: no-store. Аудит не пишется.
      security:
        - bearerAuth: []
      x-permissions: [payment.read.all, payment.read.own]
      x-roles: [seller, cashier, senior_seller, owner, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - name: refreshStatus
          in: query
          required: false
          description: "true — для qr_shown/qr_expired синхронно опросить провайдера QR (08 §4.9.2, §6.1)."
          schema: { type: boolean, default: false }
        - name: wait
          in: query
          required: false
          description: "Long-polling, секунды 1…25 (ядро §17.4; Q-167): не более одного ожидающего запроса на платёж и пользователя; вне диапазона → 400 VALIDATION_FAILED."
          schema: { type: integer, minimum: 1, maximum: 25 }
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
      responses:
        "200":
          description: "Payment + allowedActions (08 §4.9.2)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentsGetResponse" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"

  /payments/{id}/confirm-manual:
    post:
      tags: [payments]
      operationId: payments_confirm_manual
      summary: Ручное подтверждение QR-оплаты кассиром (step-up, аудит)
      description: >
        08 §4.9.3 (D-21): обязательный путь при QR_PROVIDER=none, запасной при QR_PROVIDER=onec (ядро §24.4), разбор
        платежей manual_confirm. Переходы — только по ядру §22.2 и §23 п.4: из qr_shown — qr_shown → manual_confirm →
        received в одной транзакции (reviewReason=no_webhook); из manual_confirm — manual_confirm → received. Переход в
        received — только если receivedAmount = amount; иначе тоже 200: платёж в manual_confirm, reviewReason=amount_mismatch,
        bankAmount = receivedAmount, warnings[PAYMENT_AMOUNT_MISMATCH], заказ не закрывается (POS-054); выход — повтор
        с полной суммой (новый Idempotency-Key) или void со step-up. Из qr_expired ручного перехода нет — 409
        PAYMENT_STATE_INVALID (reason: qr_expired_reissue_required); received, voided, credit, refunded, cash_pending,
        qr_pending → 409 PAYMENT_STATE_INVALID. Поля acceptMismatch и reason прежней редакции → 400 VALIDATION_FAILED.
        Обязателен в R1 независимо от Q-014 и QR_PROVIDER. Аудит payment.manual_qr_confirmed; транзакция manual_qr_confirm.
        Ключ — только в памяти клиента, после перезапуска автоповтора нет (ядро §22.6). Cache-Control: no-store.
      security:
        - bearerAuth: []
          stepUpToken: []
      x-permissions: [payment.qr.confirm_manual]
      x-roles: [cashier, senior_seller]
      x-step-up: true
      x-step-up-operation: [payment.qr.confirm_manual]
      x-idempotent: required
      x-rate-limit-group: RL-FIN
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentsConfirmManualRequest" }
      responses:
        "200":
          description: "Payment: received (confirmationKind=manual, confirmedBy, bankAmount) либо manual_confirm с reviewReason=amount_mismatch и warnings[PAYMENT_AMOUNT_MISMATCH] (ядро §22.2, 07 §6.4 п.6)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"

  /payments/{id}/void:
    post:
      tags: [payments]
      operationId: payments_void
      summary: Аннулировать неполученный платёж (ручная отмена, step-up)
      description: >
        08 §4.9.4: отмена платежа до получения денег по ядру §22.2 — cash_pending, qr_pending, qr_shown, qr_expired,
        manual_confirm → voided; не возврат денег (возврат — документом 1С, D-25). received (любой способ, включая
        наличные), credit, refunded, voided → 409 PAYMENT_STATE_INVALID («оформите исправление/возврат в 1С»; ядро §19.2,
        §22.2). Ручная отмена пользователем — всегда step-up; системное аннулирование при смене способа оплаты выполняется
        в POST /orders/{id}/payments без step-up (ядро §23 п.3). Object-level ограничения «своя смена» в R1 нет.
        admin → 403 (ядро §17.2). Повтор для уже voided с тем же ключом → сохранённый ответ. Аудит payment.voided;
        транзакция payment_voided. Cache-Control: no-store.
      security:
        - bearerAuth: []
          stepUpToken: []
      x-permissions: [payment.void]
      x-roles: [cashier, senior_seller]
      x-step-up: true
      x-step-up-operation: [payment.void]
      x-idempotent: required
      x-rate-limit-group: RL-FIN
      parameters:
        - $ref: "#/components/parameters/IdPath"
        - $ref: "#/components/parameters/DeviceId"
        - $ref: "#/components/parameters/AppVersion"
        - $ref: "#/components/parameters/Platform"
        - $ref: "#/components/parameters/RequestId"
        - $ref: "#/components/parameters/AcceptLanguage"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/StepUpToken"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentsVoidRequest" }
      responses:
        "200":
          description: "Payment (status=voided)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Payment" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/UnprocessableEntity"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"

  /payments/qr/webhook:
    post:
      tags: [payments]
      operationId: payments_qr_webhook
      summary: Вебхук банка о зачислении — только QR_PROVIDER=bakai (R2; контракт банка НЕ ПОДТВЕРЖДЁН, Q-014)
      description: >
        08 §4.9.5, §6. Маршрут регистрируется только при QR_PROVIDER=bakai (R2, ядро §24.4) и QR_WEBHOOK_ENABLED=true
        (ядро §17.7; 13 RM-F-014); при QR_PROVIDER=onec (основной R1) и none → 404 NOT_FOUND, оплату подтверждает 1С
        (§6.1) или кассир (POST /payments/{id}/confirm-manual). Вызывает только банк: пользовательских ролей нет,
        Authorization: Bearer не используется; аутентификация — подпись тела X-Signature = HMAC-SHA256(secret,
        timestamp + "." + rawBody) + X-Timestamp (±5 мин) — ИЛИ mTLS, ИЛИ Basic/API-key + allowlist IP, по возможностям
        банка (секрет — QR_WEBHOOK_SECRET_FILE). Провал подписи → 401 WEBHOOK_SIGNATURE_INVALID (минимальное тело);
        IP вне QR_WEBHOOK_ALLOWED_IPS → 403 FORBIDDEN (обязательная проверка в pos-api, ядро §18.2 п.13); 429 RATE_LIMITED;
        5xx — только при недоступной БД (банк повторит). Бизнес-расхождения ошибкой не являются: 200, платёж → manual_confirm
        с reviewReason (amount_mismatch, unknown_reference, late_payment) или запись сверки. Идемпотентность — по
        (reference, eventId) в payment_webhook_events: повтор → 200 без побочных эффектов (заголовок Idempotency-Key не
        применяется). Ответ всегда быстрый (≤ 2 с), обработка — в фоне. Тело — ПРЕДПОЛОЖЕНИЕ для проектирования.
        Аудит payment.webhook_rejected / payment.webhook_received / payment.received (confirmationKind=webhook).
      security:
        - webhookSignature: []
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-feature-flag: QR_PROVIDER=bakai
      x-status: proposed
      x-rate-limit-group: RL-WEBHOOK
      parameters:
        - name: X-Timestamp
          in: header
          required: false
          description: "Метка времени подписи (вариант (а) 08 §6, допуск ±5 мин — защита от replay). [НЕ ПОДТВЕРЖДЕНО: контракт банка, Q-014]"
          schema: { type: string, maxLength: 64 }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PaymentsQrWebhookEvent" }
      responses:
        "200":
          description: "Принято (идемпотентно), включая неизвестный референс и расхождение суммы."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PaymentsQrWebhookAck" }
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"
        default:
          $ref: "#/components/responses/Problem"

  /payments/{id}/documents/receipt.pdf:
    get:
      tags: [payments]
      operationId: payments_receipt_get
      summary: Квитанция об оплате долга без заказа (PDF, нефискальная)
      description: >
        08 §4.9.6 (путь — ядро §19.2): квитанция о принятом платеже в счёт долга (orderId = null) — клиент, сумма,
        способ, allocation[], принял, дата/время, «Нефискальный документ» (D-26, PAY-043); PdfRenderer, вид документа
        payment_receipt. Право: order.documents.print И доступ к платежу (payment.read.all / payment.read.own; 11 §4.3.1);
        по 11 §4.4 — cashier, senior_seller, owner; customer, admin, seller → 403 FORBIDDEN. Нет платежа или чужой при
        payment.read.own → 404. Платёж не received → 409 PAYMENT_STATE_INVALID (ядро §19.4); платёж с orderId ≠ null →
        409 PAYMENT_STATE_INVALID (reason: order_payment — печатать чек заказа GET /orders/{id}/documents/receipt.pdf).
        Условный элемент вместе с POST /payments: при DEBT_PAYMENTS_FROM_POS=false квитанция не выдаётся (08 §10, 13 RM-G-013).
        Cache-Control: private, no-cache + ETag (SHA-256 содержимого) — исключение из правила /payments* (08 §2.8).
        Аудит не пишется; факт рендера — print_jobs.
      security:
        - bearerAuth: []
      x-permissions: [order.documents.print, payment.read.all, payment.read.own]
      x-roles: [cashier, senior_seller, owner]
      x-step-up: false
      x-idempotent: false
      x-feature-flag: DEBT_PAYMENTS_FROM_POS
      x-status: proposed
      x-rate-limit-group: RL-PDF
