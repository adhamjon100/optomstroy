      description: >
        08 §4.15.5 (ядро §22.11): submitted или accepted → rejected, пока заявка не передана в 1С: при
        RETURNS_FROM_POS_ENABLED=false — submitted и accepted (согласована старшим в POS); при true — submitted с элементом
        outbox return_request в pending/failed/dead (элемент → cancelled, ядро §22.1). Заявка, уже переданная в 1С (outbox
        sending/sent/confirmed, а также accepted из 1С) → 409 ORDER_STATE_INVALID (reason: already_in_onec). draft, completed,
        rejected → 409 ORDER_STATE_INVALID (reason: invalid_transition); черновик удаляется DELETE /returns/{id}.
        Только return.approve (senior_seller, admin — в собственной сессии, CASH-007); cashier, owner, seller, customer →
        403 FORBIDDEN. Ошибки также 403 STEP_UP_REQUIRED, 409 VERSION_CONFLICT, 400 VALIDATION_FAILED (reason), 404 NOT_FOUND.
        Аудит return.status_changed (from → rejected, reason, stepUpMethod). Cache-Control: no-store.
