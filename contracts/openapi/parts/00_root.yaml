# =====================================================================================
# Optomstroy POS API — корень и общие компоненты (RM-B-003, часть 1)
# Источник истины: docs/specification/08_API_SPECIFICATION.md v1.9 §2 (конвенции), §3 (общие схемы),
# §8 (скелет OpenAPI); словари — 07 §6 (enum), 11 §4.3 (permissions), 08 §2.4 (коды ошибок),
# 08 §2.12 (значения operation step-up). Ядро R0 v1.9 (§24) имеет приоритет.
# Пути (paths) добавляют авторы модулей в parts/NN_<module>.yaml — правила в ../NOTES.md.
# Имена схем — PascalCase как в 08; поля — camelCase; enum-значения — snake_case ровно как 07 §6.
# =====================================================================================
openapi: 3.0.3
info:
  title: Optomstroy POS API
  version: "1.2.0"
  description: >
    REST/JSON API pos-api (NestJS) для pos-app (Flutter: Android, Windows, iOS) — сотрудники и (R1, ядро §24.2)
    клиенты-покупатели, а также входящий обмен 1С (вариант C-2) и вебхук банка (только QR_PROVIDER=bakai, R2).
    Ошибки — RFC 9457 application/problem+json с машинным полем code (закрытый перечень 08 §2.4).
    Деньги — строки с 2 знаками + currency KGS; количества — строки с точностью единицы (≤ 3 знаков);
    время — UTC ISO-8601 с суффиксом Z; идентификаторы — UUID в нижнем регистре.
    Клиент никогда не передаёт цены, суммы и итоги (08 §2.14). Права проверяются сервером (deny by default).
  contact:
    name: Optomstroy POS team
servers:
  - url: https://api.{domain}/api/v1
    description: production (домен — плейсхолдер <домен>, ядро §16 п.1, Q-032)
    variables:
      domain:
        default: "<домен>"
        description: домен заказчика (Q-032)
  - url: https://api-test.{domain}/api/v1
    description: test (домен — плейсхолдер <домен>, Q-032)
    variables:
      domain:
        default: "<домен>"
        description: домен заказчика (Q-032)
security:
  - bearerAuth: []
tags:
  - name: auth
    description: "Вход по OTP, refresh, сессии, step-up, unlock (08 §4.1). Модуль D-06: auth."
    x-module: auth
  - name: registration
    description: "Регистрация по registration_token, привязка к клиенту 1С (08 §4.2). Модуль D-06: registration."
    x-module: registration
  - name: me
    description: "Профиль, настройки, PIN, биометрия, согласия — /me* (08 §4.3). Модуль D-06: profile."
    x-module: profile
  - name: catalog
    description: "Категории, товары, варианты, справочники, изображения, офлайн-выгрузка (08 §4.4, §4.24). Модуль D-06: catalog."
    x-module: catalog
  - name: search
    description: "Поиск товаров, штрихкодов, подсказки, поиск клиентов (08 §4.5). Модуль D-06: catalog (+search)."
    x-module: catalog
  - name: inventory
    description: "Остатки и пакетная проверка доступности (08 §4.6). Модуль D-06: catalog (+inventory)."
    x-module: catalog
  - name: cart
    description: "Активная и отложенные корзины, скидка, checkout-preview (08 §4.7). Модуль D-06: cart."
    x-module: cart
  - name: orders
    description: "Заказы, отмена, печатные формы, платежи заказа, привязка к 1С (08 §4.8). Модуль D-06: orders."
    x-module: orders
  - name: payments
    description: "Платежи, ручное подтверждение QR, аннулирование, вебхук банка (08 §4.9, §6). Модуль D-06: payments."
    x-module: payments
  - name: pos
    description: "Дашборд кассира /pos/dashboard (08 §4.10). Модуль D-06: payments (11 §4.3 №39)."
    x-module: payments
  - name: customers
    description: "Клиенты, история, долг, скидки клиента, привязки (08 §4.11). Модуль D-06: customers."
    x-module: customers
  - name: receivables
    description: "Просроченные долги (08 §4.12.1). Модуль D-06: customers (+receivables)."
    x-module: customers
  - name: discounts
    description: "Правила скидок и потолок роли (08 §4.12.2). Модуль D-06: customers (+discounts)."
    x-module: customers
  - name: favorites
    description: "Избранные товары и клиенты (08 §4.13). Модуль D-06: customers (+favorites)."
    x-module: customers
  - name: transactions
    description: "Журнал операций, read-model (08 §4.14). Модуль D-06: transactions."
    x-module: transactions
  - name: returns
    description: "Заявки на возврат (08 §4.15). Модуль D-06: returns."
    x-module: returns
  - name: notifications
    description: "Центр in-app уведомлений (08 §4.16). Модуль D-06: notifications."
    x-module: notifications
  - name: sync
    description: "Статус синхронизации, ручной запуск, очередь outbox (08 §4.17). Модуль D-06: sync."
    x-module: sync
  - name: admin
    description: "Пользователи, роли, приглашения, лимиты скидок, настройки, аудит, отчёты (08 §4.18). Модуль D-06: admin."
    x-module: admin
  - name: health
    description: "Liveness/readiness и /openapi.json (08 §4.19). Модуль D-06: health."
    x-module: health
  - name: integrations
    description: "Входящий обмен 1С /integrations/onec/* (вариант C-2, 08 §4.21) и push-DLR SMSPro (08 §4.22). Модули D-06: sync, auth."
    x-module: sync
  - name: settings
    description: "Публичные настройки и флаги функций /settings/public (08 §4.23). Модуль D-06: admin (settings)."
    x-module: admin
paths: {}
components:
  # -----------------------------------------------------------------------------------
  # Схемы безопасности (08 §2.2, §8, §4.21)
  # -----------------------------------------------------------------------------------
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        Access JWT (EdDSA/ES256, kid; TTL 15 мин для всех ролей; iss=optomstroy-pos, aud=optomstroy-api).
        Нет/невалиден → 401 UNAUTHENTICATED; отозванная сессия → 401 SESSION_REVOKED; устаревшие права → 401 TOKEN_STALE (08 §2.2).
    stepUpToken:
      type: apiKey
      in: header
      name: X-Step-Up-Token
      description: >
        stepUpToken из POST /auth/step-up (JWT 15 мин, purpose=step_up, привязан к sid и deviceId; многоразовый в своей
        области scope). Отсутствие/просрочка/чужая область → 403 STEP_UP_REQUIRED (08 §2.12).
    integrationToken:
      type: http
      scheme: bearer
      description: >
        Непрозрачный технический токен роли integration (256 бит, только таблица integration_tokens; выпуск — скриптом
        bin/issue_integration_token). Только для /integrations/onec/*; пользовательский JWT там → 403 FORBIDDEN (08 §4.21).
    webhookSignature:
      type: apiKey
      in: header
      name: X-Signature
      description: "Подпись банка для POST /payments/qr/webhook — только QR_PROVIDER=bakai (R2). [НЕ ПОДТВЕРЖДЕНО: контракт банка, Q-014]"

  # -----------------------------------------------------------------------------------
  # Параметры (08 §2.3, §2.5, §2.6, §2.7, §2.8, §2.13)
  # -----------------------------------------------------------------------------------
  parameters:
    DeviceId:
      name: X-Device-Id
      in: header
      required: true
      description: "UUID устройства из secure storage; обязателен на всех запросах, кроме /health* и вебхука (08 §2.3); иной формат → VALIDATION_FAILED rule uuid."
      schema: { type: string, format: uuid }
    AppVersion:
      name: X-App-Version
      in: header
      required: false
      description: "Семантическая версия сборки; обязателен с R2, в R1 — мягкий режим (08 §2.11, Q-153). Не применяется к вебхуку и /integrations/onec/*."
      schema: { type: string, example: "1.4.2+87" }
    Platform:
      name: X-Platform
      in: header
      required: false
      description: "Платформа клиента; обязателен с R2, в R1 — мягкий режим (08 §2.11, Q-153); иное значение → VALIDATION_FAILED rule platform."
      schema: { $ref: "#/components/schemas/DevicePlatform" }
    RequestId:
      name: X-Request-Id
      in: header
      required: false
      description: "Сквозной UUID запроса; сервер возвращает эхом, иначе генерирует UUIDv7 (08 §2.3)."
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: >
        UUID v4; ОБЯЗАТЕЛЕН для операций единственного перечня 08 §2.7 «Где обязателен» (отсутствие → 400 VALIDATION_FAILED
        rule idempotency_key_required). Повтор с тем же ключом и телом → тот же ответ + Idempotent-Replayed: true (24 ч);
        другое тело → 422 IDEMPOTENCY_KEY_REUSED; параллельный повтор → 409 IDEMPOTENCY_IN_PROGRESS + Retry-After: 2.
        Скоуп ключа — (key, субъект, маршрут): субъект — пользователь access-токена; у публичного
        POST /registration/complete, где пользователя ещё нет, — SHA-256 от jti registrationToken (B-AR-01; БД —
        idempotency_keys.subject_key). Операции с шагом после COMMIT (формирование QR: POST /orders, POST /orders/{id}/payments,
        POST /payments) при повторе возвращают ТЕКУЩЕЕ представление созданного ресурса (по сохранённому идентификатору) с
        тем же HTTP-статусом и Idempotent-Replayed: true, а не снимок на момент COMMIT — иначе повтор показал бы платёж
        без QR, выданного после COMMIT (B-AR-04). Правила — предложение владельцу 08 §2.7 (contracts/openapi/NOTES.md §8).
      schema: { $ref: "#/components/schemas/IdempotencyKeyValue" }
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: "UUID v4; допускается на любом другом POST/PUT/PATCH (08 §2.7 «Где допускается»), при наличии — та же обработка."
      schema: { $ref: "#/components/schemas/IdempotencyKeyValue" }
    StepUpToken:
      name: X-Step-Up-Token
      in: header
      required: false
      description: >
        stepUpToken из POST /auth/step-up для критических операций 08 §2.12. В схеме required: false, потому что на части
        операций заголовок нужен не во всех ветках (только чужая сессия, только include=documents, только override); там,
        где карточка 08 называет его обязательным (x-step-up: true без условия в description), запрос без заголовка или
        с просроченным/чужим токеном получает 403 STEP_UP_REQUIRED (stepUp.operation из x-step-up-operation,
        allowedMethods) — обязательность выражена этим ответом, а не валидацией схемы (B-AR-16). Клиент получает
        токен заранее по x-step-up-operation.
      schema: { type: string }
    AcceptLanguage:
      name: Accept-Language
      in: header
      required: false
      description: "Язык title/detail/errors[].message; в R1 локализован только ru (08 §2.13, D-38); неизвестный → ru."
      schema: { $ref: "#/components/schemas/Locale" }
    IfNoneMatch:
      name: If-None-Match
      in: header
      required: false
      description: "Значение ETag предыдущего ответа; совпадение → 304 Not Modified без тела (08 §2.8)."
      schema: { type: string }
    Limit:
      name: limit
      in: query
      required: false
      description: "Размер страницы 1…200 (максимум 200 для всех списков, ядро §19.2); по умолчанию 50 (для /catalog/products — 40, для /catalog/sync/{entity} — 200 — задаётся в карточке); > 200 → VALIDATION_FAILED."
      schema: { type: integer, minimum: 1, maximum: 200, default: 50 }
    Cursor:
      name: cursor
      in: query
      required: false
      description: "Непрозрачный курсор keyset-пагинации (base64url, HMAC) из nextCursor; подделанный → VALIDATION_FAILED rule cursor; при смене sort — rule cursor_sort_mismatch (08 §2.5)."
      schema: { type: string }
    Sort:
      name: sort
      in: query
      required: false
      description: "Сортировка field:dir через запятую; допустимые поля — в карточке эндпоинта; неизвестное поле → VALIDATION_FAILED rule sort_field; последний ключ — id (08 §2.6)."
      schema: { type: string, example: "price:asc,id:asc" }
    Q:
      name: q
      in: query
      required: false
      description: "Поиск внутри списка: минимум 2 символа (для штрихкода/артикула — любой) (08 §2.6)."
      schema: { type: string, maxLength: 200 }
    From:
      name: from
      in: query
      required: false
      description: "Начало периода, ISO-8601 UTC; from ≤ to; период ≤ 366 дней (rule date_range, 08 §2.14)."
      schema: { type: string, format: date-time }
    To:
      name: to
      in: query
      required: false
      description: "Конец периода, ISO-8601 UTC (08 §2.6, §2.14)."
      schema: { type: string, format: date-time }
    IdPath:
      name: id
      in: path
      required: true
      description: "UUID ресурса (v7, нижний регистр)."
      schema: { type: string, format: uuid }

  # -----------------------------------------------------------------------------------
  # Заголовки ответов (08 §2.3, §2.7–§2.9, §2.11)
  # -----------------------------------------------------------------------------------
  headers:
    XRequestId:
      description: "Сквозной идентификатор запроса; всегда в ответе; = instance в problem+json (08 §2.3)."
      schema: { type: string, format: uuid }
    RetryAfter:
      description: "Секунды до повтора; при 429, 503 и 409 IDEMPOTENCY_IN_PROGRESS (08 §2.3)."
      schema: { type: integer, minimum: 0 }
    IdempotentReplayed:
      description: >
        true — ответ на повтор по Idempotency-Key (08 §2.7): тело — сохранённый ответ, а для операций с шагом после COMMIT
        (формирование QR) — текущее представление того же ресурса (B-AR-04; см. параметр Idempotency-Key).
      schema: { type: boolean }
    XDataAsOf:
      description: "Момент снимка данных 1С (onec_snapshot_at, UTC) на /inventory/*, /customers/{id}/receivables, /catalog/products* (08 §2.3)."
      schema: { type: string, format: date-time }
    XMinAppVersion:
      description: "Минимальная версия клиента, platform=semver через запятую; на КАЖДОМ ответе, включая ошибки и 426 (ядро §18.2 п.12; 08 §2.11)."
      schema: { type: string, example: "android=1.2.0,windows=1.2.0,ios=1.2.0" }
    XRecommendedAppVersion:
      description: "Рекомендуемая версия клиента (мягкий баннер, D-46), тот же формат; на каждом ответе, если задана (08 §2.11)."
      schema: { type: string, example: "android=1.3.0,windows=1.3.0" }
    ETag:
      description: "Тег версии представления для условных запросов If-None-Match → 304 (08 §2.8)."
      schema: { type: string }
    CacheControl:
      description: "По умолчанию no-store; явно кэшируемые ресурсы — по 08 §2.8."
      schema: { type: string, example: "no-store" }
    ContentLanguage:
      description: "Фактический язык сообщений (08 §2.3, §2.13)."
      schema: { $ref: "#/components/schemas/Locale" }
    Location:
      description: "URI созданного/принятого ресурса (например, 202 POST /orders, 202 POST /sync/runs)."
      schema: { type: string }
    XRateLimitLimit:
      description: "Информационный: лимит группы (08 §2.9); клиент не обязан читать."
      schema: { type: integer }
    XRateLimitRemaining:
      description: "Информационный: остаток запросов в окне (08 §2.9)."
      schema: { type: integer }
    XRateLimitReset:
      description: "Информационный: секунды до сброса окна (08 §2.9)."
      schema: { type: integer }

  # -----------------------------------------------------------------------------------
  # Стандартные ответы: problem+json по HTTP-классам 08 §2.4 + 304
  # -----------------------------------------------------------------------------------
  responses:
    Problem:
      description: "Ошибка (RFC 9457 problem+json, поле code — 08 §2.4). Общий ответ для любого HTTP-статуса ошибки."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        Content-Language: { $ref: "#/components/headers/ContentLanguage" }
        X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
        X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    BadRequest:
      description: "400 — VALIDATION_FAILED (синтаксис/схема, лишние поля, forbidden_field, limit>200, idempotency_key_required)."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
        X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Unauthorized:
      description: "401 — UNAUTHENTICATED, TOKEN_STALE, SESSION_REVOKED, REGISTRATION_TOKEN_INVALID, PIN_INVALID, UNLOCK_REQUIRED (reason: idle_lock | refresh_replay | emergency_code — 08 §2.4), WEBHOOK_SIGNATURE_INVALID."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
        X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Forbidden:
      description: "403 — FORBIDDEN (нет permission, чужой объект, роль не допускает поле/действие) или STEP_UP_REQUIRED (stepUp.operation, stepUp.allowedMethods)."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
        X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotFound:
      description: "404 — NOT_FOUND (ресурс отсутствует или недоступен по владению; выключенный маршрут — например, вебхук при QR_PROVIDER≠bakai)."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
        X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    MethodNotAllowed:
      description: "405 — METHOD_NOT_ALLOWED (метод вне allowlist маршрута; заголовок Allow)."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Allow:
          description: "Допустимые методы маршрута."
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Conflict:
      description: "409 — VERSION_CONFLICT, IDEMPOTENCY_IN_PROGRESS (Retry-After), ORDER_STATE_INVALID, PAYMENT_STATE_INVALID, PHONE_ALREADY_REGISTERED, DEVICE_MISMATCH, CUSTOMER_LINK_CONFLICT, CUSTOMER_DUPLICATE_SUSPECTED, SYNC_ALREADY_RUNNING."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
        X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    PayloadTooLarge:
      description: "413 — PAYLOAD_TOO_LARGE (тело > 1 MB; /integrations/onec/* — > 10 MB)."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnsupportedMediaType:
      description: "415 — UNSUPPORTED_MEDIA_TYPE (Content-Type ≠ application/json)."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UnprocessableEntity:
      description: "422 — бизнес-валидация: VALIDATION_FAILED (семантика), OTP_INVALID, OTP_EXPIRED, IDEMPOTENCY_KEY_REUSED, PRICE_CHANGED, STOCK_INSUFFICIENT, VARIANT_UNAVAILABLE, QTY_NOT_MULTIPLE, QTY_BELOW_MIN, DISCOUNT_LIMIT_EXCEEDED, CREDIT_BLOCKED, CREDIT_LIMIT_EXCEEDED, RECEIVABLES_STALE, ONEC_REJECTED, CUSTOMER_NOT_IDENTIFIED, CART_EMPTY, RETURN_QTY_EXCEEDED, CONSENT_REQUIRED."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
        X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    Locked:
      description: "423 — OTP_LOCKED, PIN_LOCKED (retryAfter — до разблокировки; PIN_LOCKED несёт until — 08 §2.4)."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    UpgradeRequired:
      description: "426 — APP_UPDATE_REQUIRED (X-App-Version ниже минимальной для X-Platform; проверка до аутентификации; minVersion, storeUrl)."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
        X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    TooManyRequests:
      description: "429 — RATE_LIMITED (группа 08 §2.9) или OTP_RATE_LIMITED (RL-OTP-SEND*); Retry-After обязателен."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-RateLimit-Limit: { $ref: "#/components/headers/XRateLimitLimit" }
        X-RateLimit-Remaining: { $ref: "#/components/headers/XRateLimitRemaining" }
        X-RateLimit-Reset: { $ref: "#/components/headers/XRateLimitReset" }
        X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: "500 — INTERNAL (detail: «Внутренняя ошибка. Код обращения: <requestId>»; без стек-трейсов)."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    ServiceUnavailable:
      description: "503 — SMS_PROVIDER_ERROR, ONEC_UNAVAILABLE, QR_UNAVAILABLE (только bakai, R2), APP_READ_ONLY; Retry-After при наличии."
      headers:
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }
        Retry-After: { $ref: "#/components/headers/RetryAfter" }
        X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    NotModified:
      description: "304 Not Modified — If-None-Match совпал с ETag; тела нет (08 §2.8)."
      headers:
        ETag: { $ref: "#/components/headers/ETag" }
        X-Request-Id: { $ref: "#/components/headers/XRequestId" }

  # -----------------------------------------------------------------------------------
  # Схемы
  # -----------------------------------------------------------------------------------
  schemas:
    # ===== Примитивы (08 §2.1, §2.14, §3.1, §3.2) =====
    MoneyAmount:
      type: string
      pattern: '^-?\d{1,12}\.\d{2}$'
      description: "Денежная сумма строкой, 2 знака (rule money_format, 08 §2.14). Используется в query (priceMin/priceMax) и как amount в Money."
      example: "16007.50"
    QuantityValue:
      type: string
      pattern: '^\d{1,11}(\.\d{1,3})?$'
      description: "Количество строкой, ≤ 3 знаков после точки (08 §2.14; точность ≤ unit.qtyPrecision)."
      example: "124.000"
    Percent:
      type: string
      pattern: '^(\d{1,2}(\.\d{1,2})?|100\.00)$'
      description: "Процент 0…100 строкой (rule percent_range, 08 §2.14)."
      example: "5.00"
    PhoneE164:
      type: string
      pattern: '^\+996\d{9}$'
      description: "Телефон E.164 КР (rule phone_e164, 08 §2.14)."
      example: "+996700000001"
    PhoneMasked:
      type: string
      description: "Маскированный номер: первая цифра абонентского номера и две последние, остальное * (ядро §19.2; 08 §2.14)."
      example: "+996 7** *** *01"
    IdempotencyKeyValue:
      type: string
      format: uuid
      pattern: '^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'
      description: "UUID v4 в нижнем регистре (rule idempotency_key_format, 08 §2.7)."
    SemVerByPlatform:
      type: string
      description: "Версии клиента по платформам: platform=semver через запятую (08 §2.3, §2.11)."
      example: "android=1.2.0,windows=1.2.0"

    # ===== Деньги, количество (08 §3.1, §3.2) =====
    Money:
      type: object
      required: [amount, currency]
      additionalProperties: false
      description: "Деньги (D-19): HALF_UP до 0.01 на сервере; клиент хранит int тыйынов."
      properties:
        amount: { $ref: "#/components/schemas/MoneyAmount" }
        currency: { type: string, enum: [KGS] }
      example: { amount: "16007.50", currency: KGS }
    Quantity:
      type: object
      required: [value, unitId]
      additionalProperties: false
      description: "Количество в единицах выбранной упаковки; baseValue = value × packaging.factor считает сервер (POS-004); клиент хранит int milli-units (D-19)."
      properties:
        value: { $ref: "#/components/schemas/QuantityValue" }
        unitId: { type: string, format: uuid }
        packagingId: { type: string, format: uuid, nullable: true }
        baseValue:
          allOf: [ { $ref: "#/components/schemas/QuantityValue" } ]
          readOnly: true

    # ===== Ошибки, предупреждения (08 §2.4, §3.3) =====
    ProblemCode:
      type: string
      description: >
        Машинный код ошибки — ПОЛНЫЙ закрытый перечень 08 §2.4 (ядро §7, §16 п.4, §17.4, §18.2 п.5 + [НОВОЕ ИМЯ]
        RETURN_QTY_EXCEEDED, WEBHOOK_SIGNATURE_INVALID, QR_UNAVAILABLE). Клиент ветвится только по code и status;
        неизвестный code обрабатывается как INTERNAL того же HTTP-класса (совместимость вперёд).
      enum:
        - VALIDATION_FAILED
        - OTP_INVALID
        - OTP_EXPIRED
        - OTP_LOCKED
        - OTP_RATE_LIMITED
        - SMS_PROVIDER_ERROR
        - REGISTRATION_TOKEN_INVALID
        - PHONE_ALREADY_REGISTERED
        - UNAUTHENTICATED
        - TOKEN_STALE
        - SESSION_REVOKED
        - DEVICE_MISMATCH
        - STEP_UP_REQUIRED
        - FORBIDDEN
        - VERSION_CONFLICT
        - IDEMPOTENCY_KEY_REUSED
        - IDEMPOTENCY_IN_PROGRESS
        - PRICE_CHANGED
        - STOCK_INSUFFICIENT
        - VARIANT_UNAVAILABLE
        - QTY_NOT_MULTIPLE
        - QTY_BELOW_MIN
        - DISCOUNT_LIMIT_EXCEEDED
        - CREDIT_BLOCKED
        - CREDIT_LIMIT_EXCEEDED
        - RECEIVABLES_STALE
        - ONEC_UNAVAILABLE
        - ONEC_REJECTED
        - ORDER_STATE_INVALID
        - PAYMENT_STATE_INVALID
        - CUSTOMER_LINK_CONFLICT
        - CUSTOMER_DUPLICATE_SUSPECTED
        - SYNC_ALREADY_RUNNING
        - NOT_FOUND
        - RATE_LIMITED
        - INTERNAL
        - APP_UPDATE_REQUIRED
        - PAYLOAD_TOO_LARGE
        - UNSUPPORTED_MEDIA_TYPE
        - METHOD_NOT_ALLOWED
        - CUSTOMER_NOT_IDENTIFIED
        - CART_EMPTY
        - PIN_INVALID
        - PIN_LOCKED
        - UNLOCK_REQUIRED
        - RETURN_QTY_EXCEEDED
        - WEBHOOK_SIGNATURE_INVALID
        - QR_UNAVAILABLE
        - CONSENT_REQUIRED
        - APP_READ_ONLY
    ProblemFieldError:
      type: object
      required: [field, message, rule]
      properties:
        field: { type: string, description: "JSON-pointer-подобный путь (items[1].quantity)." }
        message: { type: string, description: "Локализовано по Accept-Language." }
        rule: { type: string, description: "Машинное правило (money_format, qty_multiple, forbidden_field, …); не локализуется." }
        params:
          type: object
          additionalProperties: true
          description: "Параметры правила (например, { factor: \"6\" })."
    Problem:
      type: object
      required: [type, title, status, code, requestId]
      description: >
        RFC 9457 problem+json (08 §2.4, §3.3). type — https://api.<домен>/problems/<code-kebab>; instance — urn:request:<requestId>.
        errors[] — только VALIDATION_FAILED и бизнес-валидации; conflicts[] — только PRICE_CHANGED/STOCK_INSUFFICIENT/VARIANT_UNAVAILABLE.
        Стек-трейсы, SQL, имена таблиц — никогда. Прочие поля — по коду ошибки (08 §2.4).
      properties:
        type: { type: string, format: uri, description: "URI вида https://api.<домен>/problems/<code-kebab> (например, …/problems/price-changed); может не резолвиться — это идентификатор (08 §2.4)." }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        detail: { type: string }
        instance: { type: string, example: "urn:request:0192f3a1-6c3e-7a1b-9f00-2b7c1d3e4f55" }
        code: { $ref: "#/components/schemas/ProblemCode" }
        requestId: { type: string }
        errors:
          type: array
          items: { $ref: "#/components/schemas/ProblemFieldError" }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/CartConflict" }
        retryAfter: { type: integer, minimum: 0, description: "Дублирует заголовок Retry-After." }
        attemptsLeft: { type: integer, minimum: 0, description: "OTP_INVALID, PIN_INVALID." }
        stepUp:
          type: object
          description: "STEP_UP_REQUIRED: клиент передаёт operation в POST /auth/step-up без изменений (08 §2.12)."
          properties:
            operation: { $ref: "#/components/schemas/StepUpOperation" }
            allowedMethods:
              type: array
              description: "В R1 — только pin, otp (ядро §19.3); biometric добавится в R2 аддитивно."
              items: { type: string, enum: [pin, otp] }
        current:
          type: object
          additionalProperties: true
          description: "VERSION_CONFLICT: текущее состояние объекта."
        currentStatus: { type: string, description: "ORDER_STATE_INVALID / PAYMENT_STATE_INVALID." }
        allowedActions:
          type: array
          items: { type: string }
        resource: { $ref: "#/components/schemas/ProblemResource" }
        reason:
          type: string
          description: >
            Машинная причина (cancel_already_requested, possible_duplicate, open_payment_exists, owner_role_reserved, cursor_expired, …).
            Для 422 PRICE_CHANGED по previewToken — preview_token_invalid, preview_cart_changed, preview_payment_method_changed,
            preview_total_changed (08 §2.4 «Уточнения … этапа F» п. 1); для 503 ONEC_UNAVAILABLE корзины — catalog_not_loaded
            (08 §4.7.1 «Уточнения» п. 2). Значения перечислены справочно (с 1.2.0); поле остаётся строкой.
            Для 401 UNLOCK_REQUIRED (08 §2.4, «Расширения Problem по реализации»; 09 §8.3, §8.8, §6.13): idle_lock — idle-блокировка
            staff на Windows; refresh_replay — поздний повтор refresh у пользователя с PIN (standard-сессия; пользователю без PIN
            приходит 401 SESSION_REVOKED с reason refresh_replay и сессия отзывается, 09 §8.3); emergency_code — сессия аварийного кода
            (первый запрос до разблокировки PIN). Клиент на любое значение показывает SCR-08 и вызывает POST /auth/unlock;
            неизвестное значение обрабатывается так же (совместимость вперёд). Список — x-unlock-required-reasons.
          x-unlock-required-reasons: [idle_lock, refresh_replay, emergency_code]
        until:
          type: string
          format: date-time
          description: "423 PIN_LOCKED: момент снятия блокировки PIN (ISO-8601); до него вход только по OTP (08 §2.4, «Расширения Problem по реализации»; 09 §9.6). Добавлено в 1.1.0."
        possibleDuplicateOrderId: { type: string, format: uuid }
        possibleDuplicatePublicNumber:
          type: string
          example: "POS-2026-000122"
          description: >
            409 ORDER_STATE_INVALID reason=possible_duplicate: номер POS похожего заказа для текста UI-21-029 (08 §4.8.1
            «Уточнения POST /orders» п. 4; FQ-CHK-04). Сервер передаёт вместе с possibleDuplicateOrderId; поле
            необязательное — при его отсутствии клиент получает номер чтением заказа или опускает. Добавлено в 1.2.0.
        possibleDuplicateCreatedAt:
          type: string
          format: date-time
          description: >
            409 ORDER_STATE_INVALID reason=possible_duplicate: момент создания похожего заказа («N минут назад», UI-21-029;
            08 §4.8.1 «Уточнения POST /orders» п. 4; FQ-CHK-04). Необязательно (см. possibleDuplicatePublicNumber). Добавлено в 1.2.0.
        previewTotal:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          description: >
            422 PRICE_CHANGED при несовпадении с previewToken (08 §2.4 «Уточнения кодов ошибок по реализации этапа F» п. 1,
            §4.8.1 п. 2; FIX-F-03, ADR-100): итог, подписанный в previewToken предпросмотра. Передаётся вместе с total только при
            reason=preview_total_changed; при preview_token_invalid (токен не прочитан), preview_cart_changed и
            preview_payment_method_changed полей previewTotal/total нет. conflicts[] при этом пуст, если цены строк не
            расходятся. Добавлено в 1.2.0; уточнено по реализации (ревью закрытия F, RS-3).
        total:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          description: >
            422 PRICE_CHANGED при несовпадении с previewToken: итог по текущему серверному пересчёту корзины (08 §2.4
            «Уточнения кодов ошибок по реализации этапа F» п. 1; FIX-F-03). Только при reason=preview_total_changed, вместе с
            previewTotal. Добавлено в 1.2.0.
        openPaymentId: { type: string, format: uuid }
        limitPercent: { $ref: "#/components/schemas/Percent" }
        requiresRole: { $ref: "#/components/schemas/RoleCode" }
        creditReason: { $ref: "#/components/schemas/CreditReason" }
        limitRemaining: { $ref: "#/components/schemas/Money" }
        overdueAmount: { $ref: "#/components/schemas/Money" }
        asOf: { type: string, format: date-time, nullable: true, description: "Момент снимка долга (CREDIT_*, RECEIVABLES_STALE)." }
        candidates:
          type: array
          description: "CUSTOMER_DUPLICATE_SUSPECTED: кандидаты с ограниченным набором полей."
          items: { type: object, additionalProperties: true }
        runId: { type: string, format: uuid, description: "SYNC_ALREADY_RUNNING." }
        minVersion: { type: string, description: "APP_UPDATE_REQUIRED (дублирует X-Min-App-Version)." }
        storeUrl: { type: string }
        onec:
          type: object
          description: "ONEC_REJECTED: ответ 1С без внутренних данных."
          properties:
            code: { type: string }
            message: { type: string }
    ProblemResource:
      type: string
      enum: [order, cart, return_request, outbox_item]
      description: "ORDER_STATE_INVALID: чьё состояние не допускает действие (08 §2.4)."
    WarningCode:
      type: string
      enum: [STALE_DATA, QR_UNAVAILABLE, PAYMENT_AMOUNT_MISMATCH]
      description: "Коды предупреждений успешного ответа — НЕ входят в ProblemCode (08 §2.4)."
    Warning:
      type: object
      required: [code, message]
      description: "Предупреждение в warnings[] успешного ответа 200/201/202: операция применена, клиент её не повторяет."
      properties:
        code: { $ref: "#/components/schemas/WarningCode" }
        message: { type: string }
    SyncErrorCode:
      type: string
      description: >
        Коды журнала синхронизации (sync_errors.error_code / onec_outbox.last_error_code), 15 значений; НЕ значения Problem.code
        (08 §2.4, 07 §6.1.1). QR_PAID_AFTER_VOID — оплата QR после аннулирования платежа (05 §6.7.3, SYNC-078; 07 §5.53 FIX-F-06),
        добавлен в 1.2.0 вместе с expand CHECK (migrations/0013); сервер пишет этот код. Записи прежних версий с
        error_code=OTHER и payload.code=QR_PAID_AFTER_VOID остаются допустимыми (миграция 0013 — expand-only, ADR-103).
      enum: [DUPLICATE_SUSPECTED, OUTBOX_UNCONFIRMED, BARCODE_CONFLICT, PAYMENT_DOC_VOIDED, ORDER_MATCH_AMBIGUOUS, NO_WRITE_CHANNEL, QR_PAID_AFTER_VOID, NOT_FOUND_LOCAL, VALIDATION, ONEC_REJECTED, ONEC_UNAVAILABLE, IMAGE_DOWNLOAD, HASH_MISMATCH, COUNT_MISMATCH, OTHER]

    # ===== Пагинация, аудит (08 §2.5, §3.4, §3.5) =====
    Page:
      type: object
      required: [items, nextCursor, hasMore]
      description: >
        Page<T> (курсорная пагинация, 08 §2.5). Конкретизация в модулях:
        allOf: [ {$ref: Page}, {type: object, properties: {items: {type: array, items: {$ref: T}}}} ].
      properties:
        items:
          type: array
          items: {}
        nextCursor: { type: string, nullable: true }
        hasMore: { type: boolean }
        totalEstimate: { type: integer, nullable: true }
        isEstimate: { type: boolean }
        asOf: { type: string, format: date-time, nullable: true }
    UserRef:
      type: object
      required: [id, displayName]
      description: "Ссылка на пользователя без телефона (минимизация ПДн, 08 §3.5)."
      properties:
        id: { type: string, format: uuid }
        displayName: { type: string, example: "Продавец 1" }
        role: { $ref: "#/components/schemas/RoleCode" }
    AuditMeta:
      type: object
      description: "Встраивается в документы POS (08 §3.5)."
      properties:
        createdAt: { type: string, format: date-time }
        createdBy: { $ref: "#/components/schemas/UserRef" }
        updatedAt: { type: string, format: date-time }
        updatedBy: { $ref: "#/components/schemas/UserRef" }
        rowVersion: { type: integer }
        deviceId: { type: string }

    # ===== Enum-ы (владелец значений — 07 §6.1 / §6.1.1; 08 §3) =====
    UserKind: { type: string, enum: [staff, customer] }
    UserStatus: { type: string, enum: [pending, pending_activation, active, blocked, deleted] }
    RoleCode: { type: string, enum: [seller, cashier, senior_seller, admin, owner, customer, integration] }
    CustomerLinkStatus: { type: string, enum: [proposed, confirmed, rejected, conflict] }
    CartStatus: { type: string, enum: [active, parked, converted, cleared] }
    OrderStatus:
      type: string
      enum: [draft, submitting, submit_failed, pending_approval, awaiting_payment, approved, awaiting_shipment, shipped, partially_returned, closed, cancelled]
    DeliveryMethod: { type: string, enum: [pickup, delivery] }
    ReceiverKind: { type: string, enum: [customer, other_person] }
    PaymentMethod: { type: string, enum: [cash, qr_bakai, credit] }
    PaymentStatus:
      type: string
      enum: [initiated, cash_pending, qr_pending, qr_shown, qr_expired, manual_confirm, credit, received, voided, refunded]
    ReturnRequestStatus: { type: string, enum: [draft, submitted, accepted, rejected, completed] }
    TransactionKind:
      type: string
      enum: [order_created, order_cancelled, payment_received, payment_voided, refund, discount_override, credit_sale_approved, manual_qr_confirm, return_requested]
    TransactionSource: { type: string, enum: [pos, onec] }
    TransactionStatusGroup:
      type: string
      enum: [received, pending, voided, returned, onec_error]
      description: "Группа статуса транзакции для фильтра GET /transactions?status= (ядро §19.2; 08 §3.11)."
    SyncEntity:
      type: string
      enum: [categories, products, variants, attributes, units, barcodes, images, warehouses, stock, prices, customers, receivables, sales_history, order_status, discounts, payment_docs, return_docs]
    SyncMode: { type: string, enum: [full, incremental, manual, reconcile] }
    SyncRunStatus: { type: string, enum: [queued, running, success, partial, failed] }
    SyncTrigger: { type: string, enum: [schedule, manual, retry, dependency] }
    OutboxStatus: { type: string, enum: [pending, sending, sent, confirmed, failed, dead, cancelled] }
    OutboxAggregate: { type: string, enum: [order, payment, customer, return_request] }
    OutboxOperation: { type: string, enum: [create, cancel] }
    NotificationKind:
      type: string
      enum: [sync_error, order_status, cart_price_changed, cart_stock_changed, credit_blocked, system, payment_status, return_status]
    NotificationSeverity: { type: string, enum: [info, warning, error] }
    InvitationStatus: { type: string, enum: [pending, accepted, revoked, expired] }
    DevicePlatform: { type: string, enum: [android, ios, windows] }
    SessionKind: { type: string, enum: [standard, biometric] }
    StepUpMethod:
      type: string
      enum: [pin, biometric, otp]
      description: "step_up_method 07; в R1 биометрия как метод step-up не принимается (ядро §19.3)."
    OtpPurpose:
      type: string
      enum: [login_or_register, step_up, phone_change_old, phone_change_new, customer_link]
    ConsentKind:
      type: string
      enum: [personal_data, sms, biometrics_device, activity_sphere, face_scan]
      description: "consent_kind 07; face_scan — R2."
    CustomerSource: { type: string, enum: [onec, pos] }
    CustomerType: { type: string, enum: [individual, entrepreneur, legal] }
    CustomerOnecStatus: { type: string, enum: [n_a, pending, confirmed, rejected, duplicate] }
    ContactKind: { type: string, enum: [phone, address, email, other] }
    LinkMatchMethod: { type: string, enum: [phone, manual_admin, onec_created] }
    DiscountSource: { type: string, enum: [onec, pos] }
    DiscountKind: { type: string, enum: [percent, fixed_amount, price_list] }
    StatusChangeSource: { type: string, enum: [pos_user, pos_system, onec_sync, onec_response] }
    ReturnReason: { type: string, enum: [defect, wrong_item, not_suitable, surplus, seller_error, other] }
    OnecSyncState: { type: string, enum: [unknown, pending, linked, missing, ambiguous] }
    PrintDocumentKind: { type: string, enum: [invoice, waybill, receipt] }
    PrintPaper:
      type: string
      enum: [a4, thermal80]
      description: "print_jobs.paper 07; Settings.printer.defaultFormat и параметр format печатных форм."
    BarcodeType: { type: string, enum: [EAN13, EAN8, UPC, CODE128, CODE39, QR, other] }
    ReviewReason:
      type: string
      enum: [amount_mismatch, unknown_reference, no_webhook, late_payment]
      description: "payments.review_reason — причина входа в manual_confirm (ядро §22.2, §23 п.4)."
    CancelReasonCode: { type: string, enum: [customer_refused, duplicate, error, other] }
    RefundIntent: { type: string, enum: [none, refund, advance] }
    ReceivableDocumentKind: { type: string, enum: [invoice, payment, return, discount, adjustment] }
    ReceivableDocumentStatus: { type: string, enum: [posted, not_posted, due] }
    QrProvider:
      type: string
      enum: [onec, bakai, elqr_static, none]
      description: "QrInfo.provider — свойство показанного QR; env QR_PROVIDER = none|onec|bakai (ядро §24.4)."
    QrProviderMode:
      type: string
      enum: [none, onec, bakai]
      description: "Значение env QR_PROVIDER (ядро §17.7, §24.4; 07 payments.qr_provider): onec — основной R1, none — запасной, bakai — R2."
