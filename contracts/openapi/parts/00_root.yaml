    # ===== Каталог (08 §3.6) =====
    Category:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        parentId: { type: string, format: uuid, nullable: true }
        name: { type: string, example: "Смесители" }
        code: { type: string, example: "000124" }
        productCount: { type: integer, minimum: 0 }
        sortOrder: { type: integer }
        iconKey: { type: string, example: "faucet" }
        imageUrl: { type: string, nullable: true }
        hasChildren: { type: boolean }
        deletionMark: { type: boolean }
        onecRef: { type: string, format: uuid }
    Unit:
      type: object
      required: [id, name, qtyPrecision]
      properties:
        id: { type: string, format: uuid }
        code: { type: string, example: "796" }
        name: { type: string, example: "шт" }
        shortName: { type: string, example: "шт" }
        qtyPrecision: { type: integer, minimum: 0, maximum: 3 }
    Packaging:
      type: object
      required: [id, unitId, factor]
      properties:
        id: { type: string, format: uuid }
        unitId: { type: string, format: uuid }
        name: { type: string, example: "кор 6 шт" }
        factor: { $ref: "#/components/schemas/QuantityValue" }
        isDefault: { type: boolean }
        allowFraction: { type: boolean }
        barcode: { type: string, nullable: true, example: "4607012345678" }
    Price:
      type: object
      required: [priceListId, price]
      description: "Цену выбирает сервер по правилу 08 §3.6 (вид цены клиента → is_default → розничный); prices[] всех видов — только cashier, senior_seller, admin, owner."
      properties:
        priceListId: { type: string, format: uuid }
        priceListName: { type: string, example: "Оптовая" }
        packagingId: { type: string, format: uuid, nullable: true }
        price: { $ref: "#/components/schemas/Money" }
        validFrom: { type: string, format: date-time }
        asOf: { type: string, format: date-time }
    StockBalance:
      type: object
      required: [variantId, warehouseId, stockLevel]
      description: >
        Остаток (available считает 1С/backend, никогда клиент — D-22). Для роли customer поля количеств
        отсутствуют (а не null) при customer_stock_display=status; при quantity — только available
        (quantity и reserved видят только staff) (08 §3.6, ядро §24.2).
      properties:
        variantId: { type: string, format: uuid }
        warehouseId: { type: string, format: uuid }
        warehouseName: { type: string, example: "Основной" }
        quantity:
          allOf: [ { $ref: "#/components/schemas/QuantityValue" } ]
          x-roles: [seller, cashier, senior_seller, admin, owner]
        reserved:
          allOf: [ { $ref: "#/components/schemas/QuantityValue" } ]
          x-roles: [seller, cashier, senior_seller, admin, owner]
        available:
          type: string
          pattern: '^-?\d{1,11}(\.\d{1,3})?$'
          description: "Доступно (может быть ≤ 0 → stockLevel=out). customer — только при customer_stock_display=quantity."
          example: "124.000"
        unitId: { type: string, format: uuid }
        asOf: { type: string, format: date-time }
        stockLevel: { $ref: "#/components/schemas/StockLevel" }
    Image:
      type: object
      required: [sha256]
      description: "Фото отсутствует → images: [] (заглушка на клиенте; никогда фото другого товара, D-30)."
      properties:
        sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        thumbUrl: { type: string, example: "/images/{sha}/thumb", description: "Путь фото через pos-proxy (Caddy), не под /api/v1 (08 §4.4.7, 16 §4.5; EQ-IMG-06)." }
        cardUrl: { type: string, example: "/images/{sha}/card" }
        fullUrl: { type: string, example: "/images/{sha}/full" }
        isPrimary: { type: boolean }
        width: { type: integer }
        height: { type: integer }
    MoneyRange:
      type: object
      required: [min, max]
      properties:
        min: { $ref: "#/components/schemas/Money" }
        max: { $ref: "#/components/schemas/Money" }
    ProductSummary:
      type: object
      required: [id, name]
      description: "Карточка в списке/сетке (SCR-10/11/12)."
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Смеситель для кухни Grohe Eurosmart" }
        sku: { type: string, example: "GR-33281" }
        categoryId: { type: string, format: uuid }
        brand: { type: string, example: "Grohe" }
        hasVariants: { type: boolean }
        defaultVariantId: { type: string, format: uuid }
        baseUnit: { $ref: "#/components/schemas/Unit" }
        primaryImage: { $ref: "#/components/schemas/Image" }
        price: { $ref: "#/components/schemas/Price" }
        priceRange: { $ref: "#/components/schemas/MoneyRange" }
        stock: { $ref: "#/components/schemas/StockBalance" }
        isFavorite: { type: boolean }
        matchType: { type: string, enum: [barcode, sku, fts, trgm, null], nullable: true }
        updatedAt: { type: string, format: date-time }
    Product:
      description: "Карточка товара (SCR-14): ProductSummary + детали."
      allOf:
        - $ref: "#/components/schemas/ProductSummary"
        - type: object
          properties:
            description: { type: string }
            attributes:
              type: object
              additionalProperties: { type: string }
              example: { "Материал": "латунь", "Гарантия": "5 лет" }
            images:
              type: array
              items: { $ref: "#/components/schemas/Image" }
            variants:
              type: array
              items: { $ref: "#/components/schemas/Variant" }
            packagings:
              type: array
              items: { $ref: "#/components/schemas/Packaging" }
            barcodes:
              type: array
              items: { type: string }
            stockByWarehouse:
              type: array
              items: { $ref: "#/components/schemas/StockBalance" }
            prices:
              type: array
              description: "Все виды цен — только cashier, senior_seller, admin, owner (catalog.prices.read.all)."
              items: { $ref: "#/components/schemas/Price" }
              x-roles: [cashier, senior_seller, admin, owner]
            availableTotal:
              type: string
              nullable: true
              pattern: '^-?\d{1,11}(\.\d{1,3})?$'
              description: "Сумма available по складам, доступным роли, считает сервер; null — нет снимка (ядро §19.2)."
            minQuantity:
              allOf: [ { $ref: "#/components/schemas/QuantityValue" } ]
              type: string
              nullable: true
            onecCode: { type: string, example: "00001234" }
            deletionMark: { type: boolean }
    Variant:
      type: object
      required: [id, productId]
      properties:
        id: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        isDefault: { type: boolean }
        name: { type: string, example: "Хром, 35 мм" }
        sku: { type: string, example: "GR-33281-CH" }
        attributes:
          type: object
          additionalProperties: { type: string }
        price: { $ref: "#/components/schemas/Price" }
        stock: { $ref: "#/components/schemas/StockBalance" }
        stockByWarehouse:
          type: array
          items: { $ref: "#/components/schemas/StockBalance" }
        barcodes:
          type: array
          items: { type: string }
        images:
          type: array
          items: { $ref: "#/components/schemas/Image" }
        multiplicity:
          allOf: [ { $ref: "#/components/schemas/QuantityValue" } ]
          type: string
          nullable: true
          description: "Кратность продажи в базовых единицах; null — не ведётся (Q-021; ядро §19.2)."
        sortOrder: { type: integer }
        deletionMark: { type: boolean }

    # ===== Клиенты (08 §3.7) — ролевые представления =====
    CustomerPhone:
      type: object
      required: [value, verified]
      properties:
        value: { $ref: "#/components/schemas/PhoneE164" }
        verified: { type: boolean }
    CustomerContact:
      type: object
      required: [kind, value]
      properties:
        kind: { $ref: "#/components/schemas/ContactKind" }
        value: { type: string }
        name: { type: string }
    PriceListRef:
      type: object
      required: [id, name]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, example: "Оптовая" }
    ReceivableBadge:
      type: object
      required: [hasDebt, isOverdue]
      description: "Индикатор долга без сумм — для поиска и списков всех ролей (ядро §22.13 п.1; 08 §3.7)."
      properties:
        hasDebt: { type: boolean }
        isOverdue: { type: boolean }
    ReceivableSummary:
      type: object
      required: [balance, asOf]
      description: "Суммы долга в Customer.receivable — только GET /customers/{id}?include=receivable (аудит customer.debt_viewed)."
      properties:
        balance: { $ref: "#/components/schemas/Money" }
        overdueAmount: { $ref: "#/components/schemas/Money" }
        creditLimit: { $ref: "#/components/schemas/Money" }
        limitRemaining: { $ref: "#/components/schemas/Money" }
        asOf: { type: string, format: date-time }
    Customer:
      type: object
      required: [id, name]
      description: >
        Клиент — НАДМНОЖЕСТВО полей (08 §3.7). Сервер сериализует по allowlist роли (field-level, ASVS 8.2.3):
        поля, не разрешённые роли, ОТСУТСТВУЮТ (а не null). Разрешённые роли поля — расширение x-roles; отсутствие
        x-roles — поле видят все роли. Строгие представления по ролям — CustomerViewSeller, CustomerViewCashier,
        CustomerViewAdmin, CustomerViewSelf. В списках (GET /customers, /search/customers, /favorites/customers,
        Cart.customer, Order.customer) receivable не отдаётся — только флаги hasDebt/isOverdue.
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayName: { type: string }
        customerType: { $ref: "#/components/schemas/CustomerType" }
        onecCode: { type: string }
        isRetailDefault: { type: boolean }
        phoneMasked:
          allOf: [ { $ref: "#/components/schemas/PhoneMasked" } ]
          x-roles: [seller]
        phones:
          type: array
          items: { $ref: "#/components/schemas/CustomerPhone" }
          x-roles: [cashier, senior_seller, admin, owner, customer]
        inn:
          type: string
          x-roles: [cashier, senior_seller, admin, owner, customer]
        priceList: { $ref: "#/components/schemas/PriceListRef" }
        discountPercent: { $ref: "#/components/schemas/Percent" }
        creditAllowed: { type: boolean }
        hasDebt: { type: boolean }
        isOverdue: { type: boolean }
        receivable:
          allOf: [ { $ref: "#/components/schemas/ReceivableSummary" } ]
          x-roles: [cashier, senior_seller, admin, owner, customer]
        ordersCount: { type: integer, minimum: 0 }
        lastOrderAt: { type: string, format: date-time, nullable: true }
        discounts:
          allOf: [ { $ref: "#/components/schemas/CustomersDiscountsResponse" } ]
          description: "Только при include=discounts и праве discount.rules.read (customer — своя карточка): тот же состав, что ответ GET /customers/{id}/discounts (08 §4.11.6, SCR-35) — B-AR-06, предложение владельцу 08 §3.7."
        addresses:
          type: array
          items: { type: string }
          x-roles: [cashier, senior_seller, admin, owner, customer]
        contacts:
          type: array
          items: { $ref: "#/components/schemas/CustomerContact" }
          x-roles: [cashier, senior_seller, admin, owner, customer]
        links:
          type: array
          items: { $ref: "#/components/schemas/CustomerLink" }
          x-roles: [admin, owner, customer]
        isFavorite:
          type: boolean
          x-roles: [cashier, senior_seller, admin, owner]
        source:
          allOf: [ { $ref: "#/components/schemas/CustomerSource" } ]
          x-roles: [seller, cashier, senior_seller, admin, owner]
        onecStatus:
          allOf: [ { $ref: "#/components/schemas/CustomerOnecStatus" } ]
          x-roles: [seller, cashier, senior_seller, admin, owner]
        onecRef:
          type: string
          format: uuid
          nullable: true
          x-roles: [seller, cashier, senior_seller, admin, owner]
        syncedAt:
          type: string
          format: date-time
          nullable: true
          x-roles: [seller, cashier, senior_seller, admin, owner]
    CustomerViewSeller:
      type: object
      additionalProperties: false
      required: [id, name]
      description: "Customer для роли seller (08 §3.7): маскированный телефон, только флаги долга; allowlist (лишних полей нет)."
      x-roles: [seller]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayName: { type: string }
        customerType: { $ref: "#/components/schemas/CustomerType" }
        onecCode: { type: string }
        isRetailDefault: { type: boolean }
        phoneMasked: { $ref: "#/components/schemas/PhoneMasked" }
        priceList: { $ref: "#/components/schemas/PriceListRef" }
        discountPercent: { $ref: "#/components/schemas/Percent" }
        creditAllowed: { type: boolean }
        hasDebt: { type: boolean }
        isOverdue: { type: boolean }
        ordersCount: { type: integer, minimum: 0 }
        lastOrderAt: { type: string, format: date-time, nullable: true }
        discounts: { $ref: "#/components/schemas/CustomersDiscountsResponse" }
        source: { $ref: "#/components/schemas/CustomerSource" }
        onecStatus: { $ref: "#/components/schemas/CustomerOnecStatus" }
        onecRef: { type: string, format: uuid, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }
    CustomerViewCashier:
      type: object
      additionalProperties: false
      required: [id, name]
      description: "Customer для ролей cashier, senior_seller (08 §3.7): полные телефоны, ИНН, адреса, контакты, избранное; receivable — только при include=receivable (детализация — через /receivables со step-up)."
      x-roles: [cashier, senior_seller]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayName: { type: string }
        customerType: { $ref: "#/components/schemas/CustomerType" }
        onecCode: { type: string }
        isRetailDefault: { type: boolean }
        phones:
          type: array
          items: { $ref: "#/components/schemas/CustomerPhone" }
        inn: { type: string }
        priceList: { $ref: "#/components/schemas/PriceListRef" }
        discountPercent: { $ref: "#/components/schemas/Percent" }
        creditAllowed: { type: boolean }
        hasDebt: { type: boolean }
        isOverdue: { type: boolean }
        receivable: { $ref: "#/components/schemas/ReceivableSummary" }
        ordersCount: { type: integer, minimum: 0 }
        lastOrderAt: { type: string, format: date-time, nullable: true }
        discounts: { $ref: "#/components/schemas/CustomersDiscountsResponse" }
        addresses:
          type: array
          items: { type: string }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/CustomerContact" }
        isFavorite: { type: boolean }
        source: { $ref: "#/components/schemas/CustomerSource" }
        onecStatus: { $ref: "#/components/schemas/CustomerOnecStatus" }
        onecRef: { type: string, format: uuid, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }
    CustomerViewAdmin:
      type: object
      additionalProperties: false
      required: [id, name]
      description: "Customer для ролей admin, owner (08 §3.7): как cashier + привязки links[]."
      x-roles: [admin, owner]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayName: { type: string }
        customerType: { $ref: "#/components/schemas/CustomerType" }
        onecCode: { type: string }
        isRetailDefault: { type: boolean }
        phones:
          type: array
          items: { $ref: "#/components/schemas/CustomerPhone" }
        inn: { type: string }
        priceList: { $ref: "#/components/schemas/PriceListRef" }
        discountPercent: { $ref: "#/components/schemas/Percent" }
        creditAllowed: { type: boolean }
        hasDebt: { type: boolean }
        isOverdue: { type: boolean }
        receivable: { $ref: "#/components/schemas/ReceivableSummary" }
        ordersCount: { type: integer, minimum: 0 }
        lastOrderAt: { type: string, format: date-time, nullable: true }
        discounts: { $ref: "#/components/schemas/CustomersDiscountsResponse" }
        addresses:
          type: array
          items: { type: string }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/CustomerContact" }
        links:
          type: array
          items: { $ref: "#/components/schemas/CustomerLink" }
        isFavorite: { type: boolean }
        source: { $ref: "#/components/schemas/CustomerSource" }
        onecStatus: { $ref: "#/components/schemas/CustomerOnecStatus" }
        onecRef: { type: string, format: uuid, nullable: true }
        syncedAt: { type: string, format: date-time, nullable: true }
    CustomerViewSelf:
      type: object
      additionalProperties: false
      required: [id, name]
      description: "Customer для роли customer — только своя карточка при customer_links.status=confirmed (08 §3.7, ядро §24.2); без source/onecStatus/onecRef/syncedAt и isFavorite."
      x-roles: [customer]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        displayName: { type: string }
        customerType: { $ref: "#/components/schemas/CustomerType" }
        onecCode: { type: string }
        isRetailDefault: { type: boolean }
        phones:
          type: array
          items: { $ref: "#/components/schemas/CustomerPhone" }
        inn: { type: string }
        priceList: { $ref: "#/components/schemas/PriceListRef" }
        discountPercent: { $ref: "#/components/schemas/Percent" }
        creditAllowed: { type: boolean }
        hasDebt: { type: boolean }
        isOverdue: { type: boolean }
        receivable: { $ref: "#/components/schemas/ReceivableSummary" }
        ordersCount: { type: integer, minimum: 0 }
        lastOrderAt: { type: string, format: date-time, nullable: true }
        discounts: { $ref: "#/components/schemas/CustomersDiscountsResponse" }
        addresses:
          type: array
          items: { type: string }
        contacts:
          type: array
          items: { $ref: "#/components/schemas/CustomerContact" }
        links:
          type: array
          items: { $ref: "#/components/schemas/CustomerLink" }
    CustomerLink:
      type: object
      required: [id, customerId, status]
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        customerId: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/CustomerLinkStatus" }
        matchedBy: { $ref: "#/components/schemas/LinkMatchMethod" }
        createdAt: { type: string, format: date-time }
        resolvedBy:
          allOf: [ { $ref: "#/components/schemas/UserRef" } ]
          type: object
          nullable: true
        resolvedAt: { type: string, format: date-time, nullable: true }
    ReceivableDocument:
      type: object
      required: [kind, status, amount]
      description: "Строка детализации долга (только из 1С; состав — [ТИПОВО: Q-010])."
      properties:
        kind: { $ref: "#/components/schemas/ReceivableDocumentKind" }
        status: { $ref: "#/components/schemas/ReceivableDocumentStatus" }
        number: { type: string, example: "УТ-000123" }
        date: { type: string, format: date }
        amount: { $ref: "#/components/schemas/Money" }
        paid: { $ref: "#/components/schemas/Money" }
        remaining: { $ref: "#/components/schemas/Money" }
        dueDate: { type: string, format: date, nullable: true }
        overdueDays: { type: integer, minimum: 0 }
        onecRef: { type: string, format: uuid }
    Receivable:
      type: object
      required: [customerId, balance, asOf]
      description: >
        Сальдо и детализация — только из 1С, с asOf (D-24); backend долг не вычисляет. documents[] — только
        ?include=documents со step-up. Клиент source=pos, ещё не созданный в 1С (onecStatus ≠ confirmed): 200 с
        balance: null, asOf: null и reason: not_in_onec (08 §4.11.5) — снимка нет, прочие суммы не передаются (B-AR-06).
        Клиент 1С, по которому снимка долга ещё нет: 200 с balance: null, overdueAmount: null, asOf: null, isStale: true
        без reason (08 §3.7 «Уточнения», DEBT-009 — «Нет данных из 1С», не 0 сом).
      properties:
        customerId: { type: string, format: uuid }
        balance:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          type: object
          nullable: true
          description: "null — при reason=not_in_onec (08 §4.11.5) или когда снимка 1С по клиенту ещё нет (reason отсутствует, isStale: true; 08 §3.7)."
        reason:
          type: string
          nullable: true
          enum: [not_in_onec, null]
          description: "Причина отсутствия сальдо: not_in_onec — клиент source=pos ещё не создан в 1С (08 §4.11.5); иначе поле отсутствует или null."
        overdueAmount:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          type: object
          nullable: true
          description: "null — просрочка неизвестна (неполный снимок, шаг (3) ядра §22.4)."
        overdueDays: { type: integer, minimum: 0 }
        creditLimit: { $ref: "#/components/schemas/Money" }
        openOrdersAmount: { $ref: "#/components/schemas/Money" }
        limitRemaining: { $ref: "#/components/schemas/Money" }
        creditAllowed: { type: boolean }
        paymentTermDays: { type: integer, minimum: 0 }
        asOf: { type: string, format: date-time, nullable: true, description: "Дата снимка 1С; null — при reason=not_in_onec или когда снимка 1С ещё нет (08 §3.7)." }
        isStale: { type: boolean }
        staleAfterMinutes: { type: integer, example: 60 }
        refreshed: { type: boolean, description: "Только в ответе POST /customers/{id}/receivables/refresh (§4.11.8)." }
        documents:
          type: array
          items: { $ref: "#/components/schemas/ReceivableDocument" }
    DiscountRule:
      type: object
      required: [id, source, kind]
      properties:
        id: { type: string, format: uuid }
        source: { $ref: "#/components/schemas/DiscountSource" }
        name: { type: string, example: "Скидка клиента 5%" }
        kind: { $ref: "#/components/schemas/DiscountKind" }
        value: { type: string, example: "5.00" }
        requiresApproval: { type: boolean }
        isActive: { type: boolean }
        conditions:
          type: object
          properties:
            minTotal:
              allOf: [ { $ref: "#/components/schemas/Money" } ]
              type: object
              nullable: true
            categoryIds:
              type: array
              items: { type: string, format: uuid }
            customerIds:
              type: array
              items: { type: string, format: uuid }

    # ===== Корзина (08 §3.8) =====
    CartItemWarning:
      type: string
      enum: [price_changed, stock_insufficient, variant_unavailable, qty_not_multiple]
    CartItem:
      type: object
      required: [variantId, quantity]
      properties:
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string }
        variantName: { type: string }
        sku: { type: string }
        image: { $ref: "#/components/schemas/Image" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        packaging: { $ref: "#/components/schemas/Packaging" }
        unitPrice: { $ref: "#/components/schemas/Money" }
        priceSnapshot: { $ref: "#/components/schemas/Money" }
        lineTotal: { $ref: "#/components/schemas/Money" }
        lineDiscount: { $ref: "#/components/schemas/Money" }
        available:
          type: string
          pattern: '^-?\d{1,11}(\.\d{1,3})?$'
          description: "Для customer при customer_stock_display=status отсутствует (08 §3.6)."
        remainingAvailable:
          allOf: [ { $ref: "#/components/schemas/QuantityValue" } ]
          type: string
          nullable: true
          description: "Сколько ещё базовых единиц можно добавить (available − quantity.baseValue, ≥ 0); null — остаток неизвестен, добавление запрещено (ядро §19.2)."
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CartItemWarning" }
        addedAt: { type: string, format: date-time }
    CartConflict:
      type: object
      required: [variantId, kind]
      properties:
        variantId: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/CartConflictKind" }
        oldPrice:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          type: object
          nullable: true
        newPrice:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          type: object
          nullable: true
        requested:
          allOf: [ { $ref: "#/components/schemas/Quantity" } ]
          type: object
          nullable: true
        available:
          type: string
          nullable: true
          description: "Для customer при customer_stock_display=status отсутствует; присутствует stockLevel (08 §3.6)."
        stockLevel: { $ref: "#/components/schemas/StockLevel" }
        factor: { type: string, nullable: true }
    Cart:
      type: object
      required: [id, status, items, rowVersion]
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/CartStatus" }
        name: { type: string, nullable: true }
        ownerId: { type: string, format: uuid }
        customer:
          allOf: [ { $ref: "#/components/schemas/Customer" } ]
          type: object
          nullable: true
          description: "Ролевое представление Customer без сумм долга (только флаги)."
        receiver: { $ref: "#/components/schemas/Receiver" }
        warehouseId: { type: string, format: uuid }
        priceListId: { type: string, format: uuid }
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/CartItem" }
        itemsCount: { type: integer, minimum: 0 }
        unitsCount: { $ref: "#/components/schemas/QuantityValue" }
        subtotal: { $ref: "#/components/schemas/Money" }
        requestedDiscountPercent: { $ref: "#/components/schemas/Percent" }
        appliedDiscountPercent: { $ref: "#/components/schemas/Percent" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        customerDiscountPercent: { $ref: "#/components/schemas/Percent" }
        total: { $ref: "#/components/schemas/Money" }
        discountLimitPercent: { $ref: "#/components/schemas/Percent" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/CartConflict" }
        restoredFromOrderId: { type: string, format: uuid, nullable: true }
        restoredFromOrder:
          type: object
          nullable: true
          required: [number]
          description: >
            Заказ, из которого восстановлена корзина (отказ 1С, 10 ORD-027), для баннера cart_banner_restored_from_order
            (02 §7): номер и причина отказа 1С (08 §3.8 «Уточнения CheckoutPreview и Cart» п. 4; FQ-CART-05 (fe)).
            Сервер передаёт, если корзина восстановлена из заказа и номер известен (иначе null); поле необязательное — при его
            отсутствии клиент берёт номер из Cart.name и опускает причину. Добавлено в 1.2.0.
          properties:
            number: { type: string, example: "POS-2026-000123", description: "Номер заказа POS (publicNumber)." }
            reason: { type: string, nullable: true, description: "Причина отказа 1С (текст без внутренних данных 1С); null — неизвестна." }
        rowVersion: { type: integer }
        parkedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        audit: { $ref: "#/components/schemas/AuditMeta" }
    CheckoutPreview:
      type: object
      required: [cartId, cartRowVersion, ok]
      description: "Результат POST /cart/checkout-preview; ok=false с conflicts — не ошибка (08 §3.8)."
      properties:
        cartId: { type: string, format: uuid }
        cartRowVersion: { type: integer }
        ok: { type: boolean }
        conflicts:
          type: array
          items: { $ref: "#/components/schemas/CartConflict" }
        items:
          type: array
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotal: { $ref: "#/components/schemas/Money" }
        discountPercent: { $ref: "#/components/schemas/Percent" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        customerDiscountTotal: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        cashRounding: { type: string, pattern: '^-?\d{1,12}\.\d{2}$', default: "0.00", description: "Округление наличных (Q-016)." }
        totalToPay: { $ref: "#/components/schemas/Money" }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        paymentChecks:
          type: object
          properties:
            creditAllowed: { type: boolean }
            creditReason:
              allOf: [ { $ref: "#/components/schemas/CreditReason" } ]
              type: string
              nullable: true
              description: "Только при paymentMethod=credit; null при creditAllowed=true."
            limitRemaining: { $ref: "#/components/schemas/Money" }
            receivablesAsOf: { type: string, format: date-time, nullable: true }
            receivablesStale: { type: boolean }
        permissions:
          type: object
          properties:
            canCreateOrder: { type: boolean }
            canApplyDiscount: { type: boolean }
            discountLimitPercent: { $ref: "#/components/schemas/Percent" }
            canSellOnCredit: { type: boolean }
            needsOverride:
              type: array
              items: { type: string }
            allowedPaymentMethods:
              type: array
              items: { $ref: "#/components/schemas/PaymentMethod" }
        onecCheck:
          type: object
          properties:
            performed: { type: boolean }
            at: { type: string, format: date-time, nullable: true }
            result: { type: string, enum: [ok, unavailable, rejected] }
        validUntil: { type: string, format: date-time }
        previewToken:
          type: string
          description: >
            Непрозрачный для клиента токен: HMAC от cartRowVersion + итогов + validUntil (5 мин, 08 §3.8); передаётся в
            POST /orders. Предложение владельцу 08 §3.8 (B-AR-07): включить в подпись onecCheck.at и хэш результата onecCheck,
            чтобы POST /orders в пределах 60 с (05 SYNC-071) использовал тот же результат /check; клиентский контракт не меняется.
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }

    # ===== Заказ (08 §3.9) =====
    OrderItem:
      type: object
      required: [lineNo, variantId, quantity]
      properties:
        lineNo: { type: integer, minimum: 1 }
        variantId: { type: string, format: uuid }
        productId: { type: string, format: uuid }
        productName: { type: string, description: "snapshot" }
        variantName: { type: string, description: "snapshot" }
        sku: { type: string, description: "snapshot" }
        quantity: { $ref: "#/components/schemas/Quantity" }
        baseQuantity: { $ref: "#/components/schemas/QuantityValue" }
        unitPrice: { $ref: "#/components/schemas/Money" }
        discountPercent: { $ref: "#/components/schemas/Percent" }
        discountAmount: { $ref: "#/components/schemas/Money" }
        lineTotal: { $ref: "#/components/schemas/Money" }
        shippedQuantity:
          allOf: [ { $ref: "#/components/schemas/QuantityValue" } ]
          type: string
          nullable: true
        returnedQuantity:
          allOf: [ { $ref: "#/components/schemas/QuantityValue" } ]
          type: string
          nullable: true
    Delivery:
      type: object
      required: [method]
      additionalProperties: false
      description: "Используется в запросах (POST /orders, checkout-preview) и ответах. geo («Выбрать на карте») — R2 (Q-178): в R1 в теле → VALIDATION_FAILED rule forbidden_field (ядро §19.4)."
      properties:
        method: { $ref: "#/components/schemas/DeliveryMethod" }
        address: { type: string, maxLength: 300 }
        recipientPhone: { $ref: "#/components/schemas/PhoneE164" }
        courierComment: { type: string, maxLength: 200 }
        desiredDate: { type: string, format: date }
        timeFrom: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: "14:00" }
        timeTo: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: "18:00" }
    Receiver:
      type: object
      required: [kind]
      additionalProperties: false
      description: "Получатель; ПДн получателя клиент не сохраняет в checkout_draft (ядро §19.4)."
      properties:
        kind: { $ref: "#/components/schemas/ReceiverKind" }
        name: { type: string, maxLength: 150, nullable: true }
        phone:
          allOf: [ { $ref: "#/components/schemas/PhoneE164" } ]
          type: string
          nullable: true
    PrintOptions:
      type: object
      additionalProperties: false
      properties:
        invoice: { type: boolean }
        waybill: { type: boolean }
        receipt: { type: boolean }
    OrderOnecInfo:
      type: object
      description: "Проекция документа 1С (D-20)."
      properties:
        number: { type: string, nullable: true, example: "УТ-0001234" }
        date: { type: string, format: date-time, nullable: true }
        ref: { type: string, format: uuid, nullable: true }
        status: { type: string, nullable: true, example: "Не согласован" }
        lastSyncAt: { type: string, format: date-time, nullable: true }
    OrderDocumentAvailability:
      type: object
      required: [available]
      properties:
        available: { type: boolean }
        reason: { type: string, example: "waybill_from_onec" }
    OrderDocuments:
      type: object
      properties:
        invoice: { type: string, nullable: true, example: "/api/v1/orders/{id}/documents/invoice.pdf" }
        receipt: { type: string, nullable: true }
        waybill: { $ref: "#/components/schemas/OrderDocumentAvailability" }
    OrderStatusHistoryEntry:
      type: object
      required: [status, at, source]
      properties:
        status: { $ref: "#/components/schemas/OrderStatus" }
        at: { type: string, format: date-time }
        by:
          allOf: [ { $ref: "#/components/schemas/UserRef" } ]
          type: object
          nullable: true
        source: { $ref: "#/components/schemas/StatusChangeSource" }
    Order:
      type: object
      required: [id, publicNumber, status, items, total, paymentMethod]
      description: "Статусы — проекция 1С (D-20); isPaid/paidAmount — флаг платежа, не статус (08 §3.9)."
      properties:
        id: { type: string, format: uuid }
        publicNumber: { type: string, example: "POS-2026-000123" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        onec: { $ref: "#/components/schemas/OrderOnecInfo" }
        onecSyncState: { $ref: "#/components/schemas/OnecSyncState" }
        onecTotal:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          type: object
          nullable: true
        totalsDiffer: { type: boolean }
        customer:
          allOf: [ { $ref: "#/components/schemas/Customer" } ]
          type: object
          nullable: true
          description: "Ролевое представление Customer без сумм долга (только флаги)."
        receiver: { $ref: "#/components/schemas/Receiver" }
        delivery: { $ref: "#/components/schemas/Delivery" }
        warehouseId: { type: string, format: uuid }
        priceListId: { type: string, format: uuid }
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/OrderItem" }
        subtotal: { $ref: "#/components/schemas/Money" }
        discountPercent: { $ref: "#/components/schemas/Percent" }
        customerDiscountTotal: { $ref: "#/components/schemas/Money" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        cashRounding: { type: string, pattern: '^-?\d{1,12}\.\d{2}$', default: "0.00" }
        totalToPay: { $ref: "#/components/schemas/Money" }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        isPaid: { type: boolean }
        paymentDueDate: { type: string, format: date, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        payments:
          type: array
          items: { $ref: "#/components/schemas/Payment" }
        documents: { $ref: "#/components/schemas/OrderDocuments" }
        printOptions: { $ref: "#/components/schemas/PrintOptions" }
        comment: { type: string }
        cancelReason: { type: string, nullable: true }
        cancelReasonCode:
          allOf: [ { $ref: "#/components/schemas/CancelReasonCode" } ]
          type: string
          nullable: true
        refundIntent:
          allOf: [ { $ref: "#/components/schemas/RefundIntent" } ]
          type: string
          nullable: true
        cancelRequested: { type: boolean }
        cancelRequestedAt: { type: string, format: date-time, nullable: true }
        submitError:
          type: object
          nullable: true
          properties:
            code: { type: string, example: "ONEC_REJECTED" }
            message: { type: string }
        history:
          type: array
          items: { $ref: "#/components/schemas/OrderStatusHistoryEntry" }
        createdFromCartId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        audit: { $ref: "#/components/schemas/AuditMeta" }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }

    # ===== Платёж (08 §3.10) =====
    QrInfo:
      type: object
      required: [provider, issuedAt, autoConfirm]
      description: "Сериализуется только при payment.qr.show (08 §3.15). provider=onec — QR от 1С (основной R1); elqr_static — без суммы и срока; none — ручное подтверждение."
      properties:
        provider: { $ref: "#/components/schemas/QrProvider" }
        payload: { type: string, nullable: true, description: "EMVCo/ELQR payload." }
        imageUrl: { type: string, nullable: true }
        bankReference: { type: string, nullable: true }
        amount: { $ref: "#/components/schemas/Money" }
        expiresAt: { type: string, format: date-time, nullable: true }
        issuedAt: { type: string, format: date-time }
        autoConfirm: { type: boolean }
    PaymentAllocation:
      type: object
      required: [documentNumber, amount]
      properties:
        documentNumber: { type: string, example: "УТ-000123" }
        amount: { $ref: "#/components/schemas/Money" }
    PaymentOnecInfo:
      type: object
      properties:
        ref: { type: string, format: uuid, nullable: true }
        docType:
          type: string
          nullable: true
          description: "[ТИПОВО: УТ 11.5, Q-012]"
          enum: [ПриходныйКассовыйОрдер, ПоступлениеБезналичныхДенежныхСредств, null]
        status: { $ref: "#/components/schemas/OutboxStatus" }
    Payment:
      type: object
      required: [id, method, status, amount]
      description: "amount формирует сервер; клиент сумму платежа по заказу не передаёт. Автомат payment_status — 07 §6.4, ядро §22.2."
      properties:
        id: { type: string, format: uuid }
        orderId: { type: string, format: uuid, nullable: true }
        customerId: { type: string, format: uuid, nullable: true }
        method: { $ref: "#/components/schemas/PaymentMethod" }
        status: { $ref: "#/components/schemas/PaymentStatus" }
        amount: { $ref: "#/components/schemas/Money" }
        receivedAmount:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          type: object
          nullable: true
        changeAmount:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          type: object
          nullable: true
        qr:
          allOf: [ { $ref: "#/components/schemas/QrInfo" } ]
          type: object
          nullable: true
        externalRef:
          type: string
          nullable: true
          description: "Не отдаётся по payment.read.own (11 §4.3 №64)."
        confirmedBy:
          allOf: [ { $ref: "#/components/schemas/UserRef" } ]
          type: object
          nullable: true
        confirmedAt: { type: string, format: date-time, nullable: true }
        confirmationKind: { type: string, enum: [webhook, manual, cash, null], nullable: true }
        reviewReason:
          allOf: [ { $ref: "#/components/schemas/ReviewReason" } ]
          type: string
          nullable: true
        bankAmount:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          type: object
          nullable: true
        voidReason: { type: string, nullable: true }
        warnings:
          type: array
          items: { $ref: "#/components/schemas/Warning" }
        allocation:
          type: array
          items: { $ref: "#/components/schemas/PaymentAllocation" }
        onec: { $ref: "#/components/schemas/PaymentOnecInfo" }
        idempotencyKey: { type: string, format: uuid }
        transactionId:
          type: string
          format: uuid
          nullable: true
          description: >
            Транзакция журнала, связанная с платежом, — переход UI-24-008 к SCR-37 (08 §3.10 «Уточнения Payment по реализации»;
            02 SCR-24 «Уточнения» п. 5; FQ-FEORD-12). Необязательно: до правки реализации (вместе с SCR-37, этап G) сервер
            поле не передаёт — клиент переход не показывает. Добавлено в 1.2.0.
        audit: { $ref: "#/components/schemas/AuditMeta" }

    # ===== Транзакция (08 §3.11) =====
    TransactionRelated:
      type: object
      required: [type]
      properties:
        type: { type: string, enum: [order, payment, return_request, onec_document] }
        id: { type: string, format: uuid, nullable: true }
        number: { type: string }
        url: { type: string, example: "/api/v1/orders/{id}" }
    Transaction:
      type: object
      required: [id, kind, number, occurredAt, amount, status, related]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/TransactionKind" }
        number: { type: string, example: "POS-2026-000123 / УТ-0001234" }
        occurredAt: { type: string, format: date-time }
        amount: { $ref: "#/components/schemas/Money" }
        sign: { type: string, enum: ["+", "-"] }
        status: { type: string, description: "Статус связанного документа как есть." }
        statusGroup: { $ref: "#/components/schemas/TransactionStatusGroup" }
        customer:
          type: object
          nullable: true
          properties:
            id: { type: string, format: uuid }
            displayName: { type: string }
        actor: { $ref: "#/components/schemas/UserRef" }
        source: { $ref: "#/components/schemas/TransactionSource" }
        related:
          type: array
          items: { $ref: "#/components/schemas/TransactionRelated" }

    # ===== Возврат (08 §3.12) =====
    ReturnRequestItem:
      type: object
      required: [orderLineNo, variantId, quantity]
      properties:
        orderLineNo: { type: integer, minimum: 1 }
        variantId: { type: string, format: uuid }
        quantity: { $ref: "#/components/schemas/Quantity" }
        maxReturnable: { $ref: "#/components/schemas/QuantityValue" }
        amount: { $ref: "#/components/schemas/Money" }
    ReturnRequest:
      type: object
      required: [id, status, orderId, items, rowVersion]
      description: "Заявка на возврат; документ возврата и деньги — в 1С (D-25). Автомат — ядро §22.11."
      properties:
        id: { type: string, format: uuid }
        publicNumber: { type: string, example: "RET-2026-000012" }
        status: { $ref: "#/components/schemas/ReturnRequestStatus" }
        orderId: { type: string, format: uuid }
        shipmentRef: { type: string, format: uuid, nullable: true }
        shipmentNumber: { type: string, example: "УТ-0001234" }
        customerId: { type: string, format: uuid }
        reasonCode: { $ref: "#/components/schemas/ReturnReason" }
        reasonComment: { type: string, maxLength: 500 }
        items:
          type: array
          maxItems: 200
          items: { $ref: "#/components/schemas/ReturnRequestItem" }
        totalAmount: { $ref: "#/components/schemas/Money" }
        refundKind:
          allOf: [ { $ref: "#/components/schemas/PaymentMethod" } ]
          type: string
          nullable: true
          description: "Пожелание способа возврата; credit — зачёт в счёт долга."
        approvalReason: { type: string, enum: [return_threshold_exceeded, null], nullable: true }
        onec:
          type: object
          properties:
            ref: { type: string, format: uuid, nullable: true }
            status: { type: string, nullable: true }
        rowVersion: { type: integer }
        audit: { $ref: "#/components/schemas/AuditMeta" }

    # ===== Уведомления, синхронизация (08 §3.13) =====
    Notification:
      type: object
      required: [id, kind, title, createdAt, severity]
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/NotificationKind" }
        title: { type: string }
        body: { type: string }
        payload:
          type: object
          additionalProperties: true
          properties:
            orderId: { type: string, format: uuid }
            target:
              type: string
              nullable: true
              enum: [sessions, profile, customer_link, update, cart_parked, null]
              description: >
                Цель перехода для kind=system (ядро §19.2); null — без перехода. cart_parked — истечение отложенной корзины,
                переход SCR-44 → SCR-23 по cartId (08 §3.13 «Ключи Notification.payload»; 02 §8 п. 27; FQ-NOTIF-07; с 1.2.0).
                Других значений сервер не передаёт: переход уведомлений kind=sync_error строится по kind (SCR-44 → SCR-43),
                а не по target (08 §3.13; ревью закрытия F, RS-2).
            paymentId: { type: string, format: uuid, description: "kind=payment_status (08 §3.13 «Ключи Notification.payload»; FQ-FND-09). С 1.2.0." }
            status:
              type: string
              description: >
                Статус объекта уведомления для StatusChip (08 §3.13; FQ-NOTIF-06): kind=order_status — OrderStatus заказа;
                kind=payment_status — только вместе с task=refund_or_advance: OrderStatus заказа (cancelled — заказ отклонён 1С
                после получения денег, 10 ORD-035); в остальных уведомлениях payment_status ключа нет — состояние платежа клиент
                читает GET /payments/{id} по paymentId. Уведомления синхронизации ключ не содержат. Строка: набор зависит от kind,
                неизвестное значение клиент игнорирует (08 §2.11). С 1.2.0; уточнено по реализации (ревью закрытия F, RS-1).
            cartId: { type: string, format: uuid, description: "Уведомления корзины, в т. ч. target=cart_parked (08 §3.13). С 1.2.0." }
            entity: { $ref: "#/components/schemas/SyncEntity" }
            runId: { type: string, format: uuid, description: "Уведомления синхронизации: прогон (08 §3.13). С 1.2.0." }
            task:
              type: string
              description: >
                Задача для получателя: refund_or_advance — «деньги: возврат / аванс» (10 ORD-035; 08 §3.13; FIX-F-09). Набор
                значений расширяемый — неизвестное значение клиент игнорирует (08 §2.11). С 1.2.0.
            outboxId: { type: string, format: uuid, description: "Элемент outbox 1С, к которому относится уведомление (08 §3.13). С 1.2.0." }
        createdAt: { type: string, format: date-time }
        readAt: { type: string, format: date-time, nullable: true }
        severity: { $ref: "#/components/schemas/NotificationSeverity" }
    SyncCounts:
      type: object
      properties:
        fetched: { type: integer, minimum: 0 }
        upserted: { type: integer, minimum: 0 }
        deleted: { type: integer, minimum: 0 }
        errors: { type: integer, minimum: 0 }
        sourceTotal: { type: integer, minimum: 0 }
    SyncEntityStatus:
      type: object
      required: [entity]
      description: "lastErrorAt, paused — только в полном ответе (sync.runs.read); consecutiveErrors — и в кратком (sync.status.read)."
      properties:
        entity: { $ref: "#/components/schemas/SyncEntity" }
        lastSuccessAt: { type: string, format: date-time, nullable: true }
        lastRunAt: { type: string, format: date-time, nullable: true }
        running: { type: boolean }
        runId: { type: string, format: uuid, nullable: true }
        consecutiveErrors: { type: integer, minimum: 0 }
        lastErrorAt: { type: string, format: date-time, nullable: true }
        paused: { type: boolean }
        nextRunAt: { type: string, format: date-time, nullable: true }
        intervalSec: { type: integer, minimum: 0 }
        ageSec: { type: integer, minimum: 0 }
        isStale: { type: boolean }
        counts: { $ref: "#/components/schemas/SyncCounts" }
    SyncStatus:
      type: object
      required: [onecReachable, checkedAt, overall]
      properties:
        onecReachable: { type: boolean }
        checkedAt: { type: string, format: date-time }
        overall: { type: string, enum: [ok, degraded, failed] }
        entities:
          type: array
          items: { $ref: "#/components/schemas/SyncEntityStatus" }
        outbox:
          type: object
          properties:
            pending: { type: integer, minimum: 0 }
            failed: { type: integer, minimum: 0 }
            dead: { type: integer, minimum: 0 }
        pendingManualOrders:
          type: object
          description: "Только полный ответ (sync.runs.read); slaMin = MANUAL_ORDER_SLA_MIN."
          properties:
            count: { type: integer, minimum: 0 }
            oldestAt: { type: string, format: date-time, nullable: true }
            slaMin: { type: integer, minimum: 0 }
            overSla: { type: boolean }
    SyncRun:
      type: object
      required: [id, entity, mode, trigger, status]
      properties:
        id: { type: string, format: uuid }
        entity: { $ref: "#/components/schemas/SyncEntity" }
        mode: { $ref: "#/components/schemas/SyncMode" }
        trigger: { $ref: "#/components/schemas/SyncTrigger" }
        status: { $ref: "#/components/schemas/SyncRunStatus" }
        startedAt: { type: string, format: date-time, nullable: true }
        finishedAt: { type: string, format: date-time, nullable: true }
        triggeredBy:
          allOf: [ { $ref: "#/components/schemas/UserRef" } ]
          type: object
          nullable: true
        counts: { $ref: "#/components/schemas/SyncCounts" }
        errorSummary: { type: string, nullable: true }
    OutboxItem:
      type: object
      required: [id, aggregateType, aggregateId, status, operation]
      description: "Автомат outbox_status — 07 §6.5, ядро §22.1; ручной повтор — только failed/dead → pending."
      properties:
        id: { type: string, format: uuid }
        aggregateType: { $ref: "#/components/schemas/OutboxAggregate" }
        aggregateId: { type: string, format: uuid }
        publicNumber: { type: string, example: "POS-2026-000123" }
        status: { $ref: "#/components/schemas/OutboxStatus" }
        attempts: { type: integer, minimum: 0 }
        nextAttemptAt: { type: string, format: date-time, nullable: true }
        lastErrorCode:
          allOf: [ { $ref: "#/components/schemas/SyncErrorCode" } ]
          type: string
          nullable: true
        lastError: { type: string, nullable: true }
        onecResponse:
          type: object
          nullable: true
          properties:
            ref: { type: string, format: uuid }
            number: { type: string }
        createdAt: { type: string, format: date-time }
        sentAt: { type: string, format: date-time, nullable: true }
        operation: { $ref: "#/components/schemas/OutboxOperation" }

    # ===== Пользователь и профиль (08 §3.14, §2.11) =====
    Profile:
      type: object
      properties:
        fullName: { type: string, example: "Тестов Тест" }
        phone: { $ref: "#/components/schemas/PhoneE164" }
        birthYear: { type: integer, minimum: 1920, maximum: 2100, nullable: true, description: "07 user_profiles.birth_year CHECK 1920…2100; запись — 1920…текущий−14 (rule birth_year_range)." }
        activitySphere: { type: string, nullable: true, description: "Код справочника сфер деятельности." }
        avatarUrl: { type: string, nullable: true }
        rowVersion: { type: integer }
    Settings:
      type: object
      description: "Настройки интерфейса пользователя (PUT /me/settings; проекция user_profiles.settings 07)."
      properties:
        locale: { $ref: "#/components/schemas/Locale" }
        scanner:
          type: object
          properties:
            mode: { type: string, enum: [hid, camera] }
            suffix: { type: string, enum: [enter, tab, none] }
        scanAddsToCart: { type: boolean, description: "По умолчанию cashier — true, seller — false." }
        printer:
          type: object
          properties:
            defaultFormat: { $ref: "#/components/schemas/PrintPaper" }
            autoPrint: { type: boolean }
        catalogView: { type: string, enum: [grid, list, compact] }
        defaultWarehouseId: { type: string, format: uuid, nullable: true }
        idleLockMinutes: { type: integer, minimum: 1, example: 30 }
        rowVersion: { type: integer }
    Consent:
      type: object
      required: [kind, version, granted]
      properties:
        kind: { $ref: "#/components/schemas/ConsentKind" }
        version: { type: string, example: "2026-10-01" }
        granted: { type: boolean }
        grantedAt: { type: string, format: date-time, nullable: true }
        revokedAt: { type: string, format: date-time, nullable: true }
    Session:
      type: object
      required: [id, deviceId, platform, kind, isCurrent]
      properties:
        id: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
        deviceName: { type: string, maxLength: 60, example: "Samsung SM-A525F" }
        platform: { $ref: "#/components/schemas/DevicePlatform" }
        appVersion: { type: string, example: "1.4.2+87" }
        kind: { $ref: "#/components/schemas/SessionKind" }
        createdAt: { type: string, format: date-time }
        lastUsedAt: { type: string, format: date-time }
        ipLast: { type: string, example: "212.***.***.12" }
        isCurrent: { type: boolean }
    MeCustomerLink:
      type: object
      required: [status]
      description: "До confirmed — только linkId, status, displayNameMasked; customerId и displayName — только при confirmed (09 REG-032)."
      properties:
        linkId: { type: string, format: uuid, nullable: true }
        status: { type: string, enum: [none, proposed, confirmed, rejected, conflict] }
        displayNameMasked: { type: string, example: "ОсОО «Стр***»" }
        customerId: { type: string, format: uuid }
        displayName: { type: string }
    Me:
      type: object
      required: [id, kind, status, roles, permissions, permissionsVersion]
      description: "GET /me — источник правды клиента о ролях и правах; permissions[] — для скрытия кнопок, НЕ защита (SRC-C-133)."
      properties:
        id: { type: string, format: uuid }
        kind: { $ref: "#/components/schemas/UserKind" }
        status: { $ref: "#/components/schemas/UserStatus" }
        roles:
          type: array
          items: { $ref: "#/components/schemas/RoleCode" }
        permissions:
          type: array
          items: { $ref: "#/components/schemas/PermissionCode" }
        permissionsVersion: { type: integer, minimum: 0 }
        discountLimitPercent: { $ref: "#/components/schemas/Percent" }
        profile: { $ref: "#/components/schemas/Profile" }
        customerLink: { $ref: "#/components/schemas/MeCustomerLink" }
        settings: { $ref: "#/components/schemas/Settings" }
        security:
          type: object
          properties:
            pinSet: { type: boolean }
            biometricsEnabled: { type: boolean }
            biometricsPlatform: { type: string, enum: [android_class3, ios, windows_hello_gate, none] }
        consents:
          type: array
          items: { $ref: "#/components/schemas/Consent" }
        session:
          type: object
          properties:
            sid: { type: string, format: uuid }
            deviceId: { type: string, format: uuid }
            deviceName: { type: string, example: "Касса-2 (Windows)" }
            createdAt: { type: string, format: date-time }
            amr:
              type: array
              items: { type: string, enum: [sms, bio, pin] }
            expiresAt: { type: string, format: date-time }
        appVersion:
          type: object
          description: "[НОВОЕ ИМЯ поля] 08 §2.11: дублирует X-Min-App-Version / X-Recommended-App-Version."
          properties:
            min: { type: string, example: "1.4.0" }
            recommended: { type: string, nullable: true, example: "1.5.0" }
        apiVersion: { type: string, example: "1.0" }
        serverTime: { type: string, format: date-time }

    # ===== Приглашения, публичные настройки (08 §4.18.4, §4.23.1) =====
    Invitation:
      type: object
      required: [id, phoneMasked, roles, status, createdAt]
      description: "Приглашение сотрудника по телефону (D-07; 08 §4.18.4). expiresAt по умолчанию — 30 дней от создания (Q-141)."
      properties:
        id: { type: string, format: uuid }
        phoneMasked: { $ref: "#/components/schemas/PhoneMasked" }
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [seller, cashier, senior_seller, admin, owner]
            description: "user_invitations.role (07 §6.1.1)."
        status: { $ref: "#/components/schemas/InvitationStatus" }
        createdBy: { $ref: "#/components/schemas/UserRef" }
        createdAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, nullable: true }
        acceptedAt: { type: string, format: date-time, nullable: true }
        appliedToUserId: { type: string, format: uuid, nullable: true }
    DeliverySlot:
      type: object
      required: [from, to]
      properties:
        from: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: "10:00" }
        to: { type: string, pattern: '^([01]\d|2[0-3]):[0-5]\d$', example: "14:00" }
    SupportContact:
      type: object
      required: [kind, value]
      properties:
        kind: { type: string, example: "phone" }
        value: { type: string, example: "+996700000005" }
        label: { type: string, example: "Поддержка" }
    PublicSettings:
      type: object
      description: "GET /settings/public (ядро §19.2; 08 §4.23.1): несекретные настройки и флаги функций; скрытие — не защита."
      properties:
        deliverySlots:
          type: array
          items: { $ref: "#/components/schemas/DeliverySlot" }
        supportContacts:
          type: array
          items: { $ref: "#/components/schemas/SupportContact" }
        privacyContact: { type: string, nullable: true }
        lowStockThreshold: { type: integer, minimum: 0, example: 5 }
        minAppVersion: { $ref: "#/components/schemas/SemVerByPlatform" }
        recommendedAppVersion:
          allOf: [ { $ref: "#/components/schemas/SemVerByPlatform" } ]
          type: string
          nullable: true
        customerStockDisplay: { $ref: "#/components/schemas/CustomerStockDisplay" }
        features:
          type: object
          properties:
            customerSelfService: { type: boolean, description: "env CUSTOMER_SELF_SERVICE (по умолчанию true, ядро §24.2)." }
            returnsFromPos: { type: boolean, description: "app_settings.returns_enabled (Q-018)." }
            qrProvider: { $ref: "#/components/schemas/QrProviderMode" }
            qrWebhook: { type: boolean, description: "QR_PROVIDER=bakai (R2) и qr.enabled." }
            debtPaymentsFromPos: { type: boolean, description: "env DEBT_PAYMENTS_FROM_POS (Q-152)." }
