  /orders/{id}/cancel:
    post:
      tags: [orders]
      operationId: orders_cancel
      summary: Отменить заказ или запросить отмену в 1С
      description: >
        (а) Немедленная отмена → status: cancelled — заказ submitting, документ 1С ещё не создан (outbox create в pending/dead);
        неполученные платежи → voided, состав восстанавливается в корзину. (б) Запрос отмены → прежний статус +
        cancelRequested: true — outbox create в sending/sent или заказ уже в 1С (pending_approval, awaiting_payment, approved,
        awaiting_shipment); cancelled — только по ответу 1С. order.cancel.own — создатель, свой заказ в
        submitting/pending_approval/awaiting_payment без полученных платежей, без step-up (seller, cashier, senior_seller, admin,
        customer); order.cancel.request.any + step-up (operation order.cancel.request.any) — чужой заказ, approved/awaiting_shipment
        или с платежами received (cashier, senior_seller, admin). refundIntent обязателен при полученных платежах.
        Ошибки: 409 ORDER_STATE_INVALID (resource: order; reason: invalid_transition — submit_failed, shipped, closed, cancelled,
        partially_returned; cancel_already_requested; allowedActions), PAYMENT_STATE_INVALID (reason: open_payment_exists,
        openPaymentId — платёж в manual_confirm), IDEMPOTENCY_IN_PROGRESS; 404 NOT_FOUND (заказ не виден по order.read.*);
        403 FORBIDDEN, STEP_UP_REQUIRED; 422 IDEMPOTENCY_KEY_REUSED; 400 VALIDATION_FAILED (reason ≤ 500, refundIntent).
        ONEC_UNAVAILABLE не возвращается (запрос уходит в outbox). 08 §4.8.4 [ядро §22.9]; Q-012.
      security:
        - { bearerAuth: [] }
        - { bearerAuth: [], stepUpToken: [] }
      x-permissions: [order.cancel.own, order.cancel.request.any]
      x-roles: [seller, cashier, senior_seller, admin, customer]
      x-step-up: true
      x-step-up-operation: [order.cancel.request.any]
      x-idempotent: required
      x-rate-limit-group: RL-FIN
      parameters:
        - { $ref: "#/components/parameters/IdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUpToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrdersCancelRequest" }
      responses:
        "200":
          description: "Order: (а) status: cancelled; (б) прежний статус + cancelRequested: true, cancelRequestedAt."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        default: { $ref: "#/components/responses/Problem" }

