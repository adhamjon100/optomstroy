        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        "503": { $ref: "#/components/responses/ServiceUnavailable" }
        default: { $ref: "#/components/responses/Problem" }

components:
  parameters:
    CartVariantIdPath:
      name: variantId
      in: path
      required: true
      description: "UUID варианта товара (строка корзины)."
      schema: { type: string, format: uuid }
    OrdersDocumentFormat:
      name: format
      in: query
      required: false
      description: "Формат бумаги — значения print_jobs.paper 07 (a4 по умолчанию, thermal80)."
      schema:
        type: string
        allOf: [ { $ref: "#/components/schemas/PrintPaper" } ]
        default: a4
    OrdersDocumentCopy:
      name: copy
      in: query
      required: false
      description: "Пометка «Копия» на документе."
      schema: { type: boolean, default: false }

  headers:
    OrdersContentDisposition:
      description: "inline; filename=\"<kind>-<publicNumber>.pdf\" (08 §4.8.5)."
      schema: { type: string, example: "inline; filename=\"invoice-POS-2026-000123.pdf\"" }

  schemas:
    # ===== cart: тела запросов и ответы (08 §4.7) =====
    CartUpdateRequest:
      type: object
      required: [warehouseId, rowVersion]
      additionalProperties: false
      description: "PATCH /cart — единственное изменяемое поле warehouseId (08 §4.7.8)."
      properties:
        warehouseId: { type: string, format: uuid }
        rowVersion: { type: integer, minimum: 0 }
    CartPutItemRequest:
      type: object
      required: [quantity, rowVersion]
      additionalProperties: false
      description: "PUT /cart/items/{variantId} (08 §4.7.2). Цены (price, unitPrice) запрещены — forbidden_field."
      properties:
        quantity: { $ref: "#/components/schemas/Quantity" }
        priceSnapshot:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          description: "Цена, которую видел пользователь — только для предупреждения price_changed, не для расчёта."
        rowVersion: { type: integer, minimum: 0 }
        mode:
          type: string
          enum: [set, increment]
          default: set
          description: "set — установить value (0 = удалить строку); increment — прибавить value (Idempotency-Key обязателен)."
    CartCustomerSetRequest:
      type: object
      required: [customerId, rowVersion]
      additionalProperties: false
      description: "POST /cart/customer (08 §4.7.4). receiver.kind=other_person требует name и phone."
      properties:
        customerId: { type: string, format: uuid }
        receiver: { $ref: "#/components/schemas/Receiver" }
        rowVersion: { type: integer, minimum: 0 }
    CartOverride:
      type: object
      required: [reason]
      additionalProperties: false
      description: "Подтверждение сверх лимита / при блокировке долга из своей сессии со step-up: причина (08 §4.7.5, §4.8.1)."
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, example: "постоянный клиент" }
    CartDiscountRequest:
      type: object
      required: [percent, rowVersion]
      additionalProperties: false
      description: "POST /cart/discount (08 §4.7.5). override — только при discount.approve.over_limit + X-Step-Up-Token."
      properties:
        percent: { $ref: "#/components/schemas/Percent" }
        ruleId: { type: string, format: uuid, nullable: true }
        rowVersion: { type: integer, minimum: 0 }
        override:
          type: object
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CartOverride" } ]
    CartParkRequest:
      type: object
      required: [rowVersion]
      additionalProperties: false
      description: "POST /cart/park (08 §4.7.6). name — подпись отложенной корзины (07 carts.name ≤ 80; по умолчанию «Клиент · время»)."
      properties:
        name: { type: string, maxLength: 80, example: "Иван, доставка завтра" }
        rowVersion: { type: integer, minimum: 0 }
    CartParkResponse:
      type: object
      required: [parked, active]
      description: "Ответ 201 POST /cart/park (08 §4.7.6)."
      properties:
        parked:
          allOf: [ { $ref: "#/components/schemas/Cart" } ]
          description: "Отложенная корзина (status=parked)."
        active:
          allOf: [ { $ref: "#/components/schemas/Cart" } ]
          description: "Новая пустая активная корзина."
    CartParkedSummary:
      type: object
      required: [id, status, rowVersion]
      description: >
        Элемент GET /cart/parked — Cart без items (с itemsCount, total, customer, name, parkedAt, owner; 08 §4.7.6).
        Поля — подмножество Cart (08 §3.8) + owner.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: "#/components/schemas/CartStatus" }
        name: { type: string, nullable: true }
        ownerId: { type: string, format: uuid }
        owner:
          allOf: [ { $ref: "#/components/schemas/UserRef" } ]
          description: "Владелец отложенной корзины (для scope=all)."
        customer:
          allOf: [ { $ref: "#/components/schemas/Customer" } ]
          type: object
          nullable: true
          description: "Ролевое представление Customer без сумм долга (только флаги)."
        warehouseId: { type: string, format: uuid }
        priceListId: { type: string, format: uuid }
        itemsCount: { type: integer, minimum: 0 }
        unitsCount: { $ref: "#/components/schemas/QuantityValue" }
        subtotal: { $ref: "#/components/schemas/Money" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        restoredFromOrderId: { type: string, format: uuid, nullable: true }
        rowVersion: { type: integer }
        parkedAt: { type: string, format: date-time, nullable: true }
        expiresAt: { type: string, format: date-time, nullable: true }
        audit: { $ref: "#/components/schemas/AuditMeta" }
    CartParkedResumeRequest:
      type: object
      additionalProperties: false
      description: "POST /cart/parked/{id}/resume (08 §4.7.6). merge — R2 (ядро §19.2), поля нет."
      properties:
        replaceActive:
          type: boolean
          default: false
          description: "true — непустая текущая active паркуется как «Автосохранение <время>»; false — 409 active_not_empty."
    CartCheckoutPreviewRequest:
      type: object
      required: [cartId, cartRowVersion, paymentMethod, delivery, receiver]
      additionalProperties: false
      description: "POST /cart/checkout-preview (08 §4.7.7, §8). Цены и итоги клиент не передаёт (08 §2.14)."
      properties:
        cartId: { type: string, format: uuid }
        cartRowVersion: { type: integer, minimum: 0 }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        delivery: { $ref: "#/components/schemas/Delivery" }
        receiver: { $ref: "#/components/schemas/Receiver" }
        manualDiscountPercent: { $ref: "#/components/schemas/Percent" }
        creditOverride:
          type: object
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CartOverride" } ]
        syncCheckWithOnec: { type: boolean, default: true, description: "Синхронная проверка 1С (таймаут 6 с) — результат в onecCheck." }
        strict:
          type: boolean
          default: false
          description: "true — блокировки долга возвращаются строгими кодами (403/422), а не в paymentChecks.creditReason (08 §3.8)."

    # ===== orders: тела запросов и ответы (08 §4.8) =====
    OrdersCreateItem:
      type: object
      required: [variantId, quantity]
      additionalProperties: false
      properties:
        variantId: { type: string, format: uuid }
        quantity: { $ref: "#/components/schemas/Quantity" }
    OrdersCreateRequest:
      type: object
      required: [cartId, cartRowVersion, paymentMethod, delivery, receiver, items]
      additionalProperties: false
      description: >
        POST /orders (08 §4.8.1, §8). Запрещены price, unitPrice, total, subtotal, amount (→ 400 forbidden_field + аудит
        price.override_attempt); clientTotalSnapshot удалён (ядро §19.2); delivery.geo — R2. items[] обязан совпадать с
        корзиной cartRowVersion (иначе 409 VERSION_CONFLICT с current: Cart).
      properties:
        cartId: { type: string, format: uuid }
        cartRowVersion: { type: integer, minimum: 0 }
        previewToken: { type: string, maxLength: 512, description: "Из POST /cart/checkout-preview (HMAC, 5 мин); расхождение итогов → PRICE_CHANGED." }
        customerId: { type: string, format: uuid, nullable: true }
        receiver: { $ref: "#/components/schemas/Receiver" }
        delivery: { $ref: "#/components/schemas/Delivery" }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        manualDiscountPercent: { $ref: "#/components/schemas/Percent" }
        discountOverride:
          type: object
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CartOverride" } ]
          description: "discount.approve.over_limit + X-Step-Up-Token."
        creditOverride:
          type: object
          nullable: true
          allOf: [ { $ref: "#/components/schemas/CartOverride" } ]
          description: "credit.sale.approve + credit.sale.create + X-Step-Up-Token; снимает только шаг (2) ядра §22.4."
        printOptions: { $ref: "#/components/schemas/PrintOptions" }
        comment: { type: string, maxLength: 500 }
        confirmDuplicate: { type: boolean, default: false, description: "Обход мягкой защиты от дубля (409 possible_duplicate, 08 §2.7)." }
        items:
          type: array
          minItems: 1
          maxItems: 200
          items: { $ref: "#/components/schemas/OrdersCreateItem" }
    OrderSummary:
      type: object
      required: [id, publicNumber, status, total, paymentMethod]
      description: >
        Элемент GET /orders (08 §4.8.2): Order без items/history/payments, с itemsCount и paymentsSummary. Поля — подмножество
        Order (08 §3.9). Состав paymentsSummary 08 не раскрывает — открытый объект до уточнения владельцем DTO.
      properties:
        id: { type: string, format: uuid }
        publicNumber: { type: string, example: "POS-2026-000123" }
        status: { $ref: "#/components/schemas/OrderStatus" }
        onec: { $ref: "#/components/schemas/OrderOnecInfo" }
        onecSyncState: { $ref: "#/components/schemas/OnecSyncState" }
        onecTotal:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          type: object
          nullable: true
        totalsDiffer: { type: boolean }
        customer:
          allOf: [ { $ref: "#/components/schemas/Customer" } ]
          type: object
          nullable: true
          description: "Ролевое представление Customer без сумм долга (только флаги)."
        receiver: { $ref: "#/components/schemas/Receiver" }
        delivery: { $ref: "#/components/schemas/Delivery" }
        warehouseId: { type: string, format: uuid }
        priceListId: { type: string, format: uuid }
        itemsCount: { type: integer, minimum: 0 }
        subtotal: { $ref: "#/components/schemas/Money" }
        discountPercent: { $ref: "#/components/schemas/Percent" }
        customerDiscountTotal: { $ref: "#/components/schemas/Money" }
        discountTotal: { $ref: "#/components/schemas/Money" }
        total: { $ref: "#/components/schemas/Money" }
        cashRounding: { type: string, pattern: '^-?\d{1,12}\.\d{2}$', default: "0.00" }
        totalToPay: { $ref: "#/components/schemas/Money" }
        paymentMethod: { $ref: "#/components/schemas/PaymentMethod" }
        paidAmount: { $ref: "#/components/schemas/Money" }
        isPaid: { type: boolean }
        paymentDueDate: { type: string, format: date, nullable: true }
        paidAt: { type: string, format: date-time, nullable: true }
        paymentsSummary:
          type: object
          additionalProperties: true
          description: "Сводка платежей заказа (08 §4.8.2); состав полей в 08 не задан."
        documents: { $ref: "#/components/schemas/OrderDocuments" }
        printOptions: { $ref: "#/components/schemas/PrintOptions" }
        comment: { type: string }
        cancelReason: { type: string, nullable: true }
        cancelReasonCode:
          allOf: [ { $ref: "#/components/schemas/CancelReasonCode" } ]
          type: string
          nullable: true
        refundIntent:
          allOf: [ { $ref: "#/components/schemas/RefundIntent" } ]
          type: string
          nullable: true
        cancelRequested: { type: boolean }
        cancelRequestedAt: { type: string, format: date-time, nullable: true }
        submitError:
          type: object
          nullable: true
          properties:
            code: { type: string, example: "ONEC_REJECTED" }
            message: { type: string }
        createdFromCartId: { type: string, format: uuid }
        idempotencyKey: { type: string, format: uuid }
        audit: { $ref: "#/components/schemas/AuditMeta" }
    OrdersAllowedAction:
      type: string
      enum: [cancel, pay, print_invoice, print_receipt, return_request]
      description: "Действие, доступное по статусу и правам (08 §4.8.3); неизвестное значение клиент обрабатывает как unknown."
    OrdersGetResponse:
      description: "GET /orders/{id}: Order + allowedActions (08 §4.8.3)."
      allOf:
        - { $ref: "#/components/schemas/Order" }
        - type: object
          properties:
            allowedActions:
              type: array
              maxItems: 500
              items: { $ref: "#/components/schemas/OrdersAllowedAction" }
    OrdersCancelRequest:
      type: object
      required: [reason, reasonCode]
      additionalProperties: false
      description: >
        POST /orders/{id}/cancel (08 §4.8.4). refundIntent обязателен, если есть полученные платежи (проверяет сервер →
        400 VALIDATION_FAILED). Хранение — orders.cancel_reason, cancel_reason_code, refund_intent (07, ядро §22.9).
      properties:
        reason: { type: string, minLength: 1, maxLength: 500, example: "Клиент передумал" }
        reasonCode: { $ref: "#/components/schemas/CancelReasonCode" }
        refundIntent: { $ref: "#/components/schemas/RefundIntent" }
    OrdersWaybillStatus:
      type: object
      required: [available, reason]
      description: "GET /orders/{id}/documents/waybill.pdf в R1 (D-27): статус документа 1С вместо PDF (08 §4.8.5)."
      properties:
        available: { type: boolean, example: false }
        reason: { type: string, example: "waybill_from_onec" }
        onecNumber: { type: string, nullable: true, example: "УТ-0001234" }
    OrdersPaymentCreateRequest:
      type: object
      required: [method]
      additionalProperties: false
      description: >
        POST /orders/{id}/payments (08 §4.8.6). Сумму платежа клиент не передаёт (amount = totalToPay − paidAmount).
        Варианты: { method: cash, receivedAmount, comment } / { method: qr_bakai, reissueQr: true } /
        { method: qr_bakai, manualOnly: true }. method=credit → 409 ORDER_STATE_INVALID (payment_method_mismatch).
      properties:
        method: { $ref: "#/components/schemas/PaymentMethod" }
        receivedAmount:
          allOf: [ { $ref: "#/components/schemas/Money" } ]
          description: "Только для cash — получено от покупателя (для сдачи); < amount → 422 received_less_than_due."
        comment: { type: string, maxLength: 200 }
        reissueQr: { type: boolean, default: false, description: "«Обновить QR» на том же payment_id (ядро §19.2, §24.4)." }
        manualOnly: { type: boolean, default: false, description: "Запасной путь: QR без автоматического подтверждения, далее confirm-manual." }
    OrdersPaymentOrderState:
      type: object
      required: [paidAmount, isPaid]
      description: "Обновлённые после операции поля заказа (08 §4.8.6)."
      properties:
        paidAmount: { $ref: "#/components/schemas/Money" }
        isPaid: { type: boolean }
    OrdersPaymentResult:
      description: "Ответ POST /orders/{id}/payments: Payment + order { paidAmount, isPaid } (08 §4.8.6)."
      allOf:
        - { $ref: "#/components/schemas/Payment" }
        - type: object
          required: [order]
          properties:
            order: { $ref: "#/components/schemas/OrdersPaymentOrderState" }
    OrdersPaymentsListResponse:
      type: object
      required: [items]
      description: "GET /orders/{id}/payments — платежи заказа (08 §4.8.6); поле qr — только при payment.qr.show."
      properties:
        items:
          type: array
          maxItems: 500
          items: { $ref: "#/components/schemas/Payment" }
    OrdersOnecLinkRequest:
      type: object
      required: [onecNumber, reason]
      additionalProperties: false
      description: "POST /orders/{id}/onec-link (08 §4.8.7)."
      properties:
        onecNumber: { type: string, minLength: 1, maxLength: 32, example: "УТ-0001234", description: "Номер документа 1С как есть." }
        onecDate: { type: string, format: date, nullable: true, description: "Для однозначности, если номера 1С повторяются по годам." }
        reason: { type: string, minLength: 5, maxLength: 500, example: "документ оформлен вручную в 1С" }
