      description: >
        Владелец заказа (order.read.own) или order.read.all; поле qr — только при payment.qr.show (08 §3.15). Используется
        кассиром для проверки статуса перед повтором приёма денег после перезапуска (ядро §19.2, §22.6). Ошибки: 404 NOT_FOUND.
        08 §4.8.6.
      security: [ { bearerAuth: [] } ]
      x-permissions: [order.read.own, order.read.all]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
