# =====================================================================================
# Optomstroy POS API — фрагмент модулей cart и orders (RM-B-003)
# Источник истины: docs/specification/08_API_SPECIFICATION.md v1.9 — §4.7 (cart), §4.8 (orders), §2.7 (идемпотентность),
# §2.8 (кэширование), §2.9 (rate limit), §2.12 (step-up), §2.14 (валидация), §3.8–§3.10 (DTO), §3.15 (коды прав), §8 (скелет),
# §9 (матрица); права и роли — 11 §4.3–§4.4 (владелец; при расхождении с 08 §9 действует 11); ядро R0 v1.9 §19.2, §22, §23, §24.
# Общие компоненты — parts/00_root.yaml; правила фрагментов — ../NOTES.md. Ссылки пишутся как в собранном документе.
#
# Решения автора фрагмента (NOTES.md в задаче не назначен на запись — решения записаны здесь, перенос в NOTES.md — при сборке):
#  F1. Формат файла по постановке задачи: openapi + минимальный info + paths + components. По NOTES §1 фрагменты не содержат
#      openapi/info — сборщик берёт эти ключи только из 00_root.yaml; здесь они нужны лишь для самостоятельного разбора файла.
#  F2. operationId — по владельцу правил генерации 08 §8 / API-122 и NOTES §3 п.2: `<module>_<action>` в snake_case
#      (orders_create), а не camelCase из постановки. Права — `x-permissions` (массив кодов 11 §4.3), как решено в NOTES §5 п.1.
#  F3. Условный step-up (скидка с override, POST /orders с discountOverride/creditOverride, отмена по order.cancel.request.any)
#      выражен двумя альтернативами security: [ {bearerAuth}, {bearerAuth + stepUpToken} ]; безусловный (onec-link) —
#      одной парой { bearerAuth, stepUpToken } (NOTES §3 п.3).
#  F4. PUT /cart/items/{variantId}: ключ обязателен только при mode=increment (08 §2.7) — параметр IdempotencyKeyOptional,
#      x-idempotent: true, условие — в description (машинно условную обязательность OAS 3.0 не выражает).
#  F5. Печатные формы — три конкретных пути (invoice.pdf, receipt.pdf, waybill.pdf), а не шаблон {kind}.pdf: у них разные
#      права (order.documents.print vs order.read.*), роли и тип ответа (waybill в R1 — JSON).
#  F6. Ответ GET /orders/{id}/payments в 08 §4.8.6 не задан; принят объект { items: Payment[] } (OrdersPaymentsListResponse)
#      без пагинации (платежей у заказа единицы). Состав OrderSummary.paymentsSummary в 08 §4.8.2 не раскрыт — открытый объект.
#  F7. OrdersCreateRequest.comment — maxLength 500 по скелету 08 §8 и 07 orders.comment (≤ 500); правило 08 §2.14 «comment ≤ 200»
#      относится к полю макета. CartParkRequest.name — maxLength 80 (07 carts.name). Комментарий оплаты — 200 (08 §2.14).
#  F8. OrdersCancelRequest: reason и reasonCode обязательны — CHECK 07 (cancel_requested_by_user_id ⇒ cancel_reason_code)
#      не позволяет запрос отмены без кода; refundIntent — обязателен по условию (полученные платежи), проверяет сервер.
#  F9. Параметр strict для POST /cart/checkout-preview (08 §4.7.7, §3.8 — «если клиент запросил strict=true») — поле тела,
#      т. к. запрос — POST с additionalProperties:false; в скелете 08 §8 поля нет.
#  F10. POST /orders/{id}/payments: x-permissions = [payment.cash.receive, payment.qr.show]. 11 §4.3.1 дополнительно называет
#      credit.sale.create (method=credit), но 08 §4.8.6/§3.15 запрещают долг этой операцией (409 ORDER_STATE_INVALID,
#      payment_method_mismatch) — код не проверяется; поле method — PaymentMethod целиком, чтобы credit давал 409, а не 400.
#  F11. Для customer доступ к QR (payment.qr.show own) — по 11 §4.4: только при QR_PROVIDER=onec (08 пишет «≠none»; в R1 это
#      то же самое, bakai — R2). Доступ роли customer к корзине и заказам зависит от CUSTOMER_SELF_SERVICE (11 §4.4, 16 §4.3).
#  F12. DELETE /cart/customer и DELETE /cart/items/{variantId} — без rowVersion (08 задаёт rowVersion только для DELETE /cart),
#      поэтому 409 у них не перечислен. Waybill — без параметров format/copy (PDF накладной в R1 не формируется).
#  R2 не включено: merge корзин при resume (CART-032), Delivery.geo, actAs/supervisor, QR_PROVIDER=bakai-специфика (только в описаниях).
# =====================================================================================
openapi: 3.0.3
info:
  title: Optomstroy POS API — cart, orders (fragment)
  version: "1.0.0"
paths:
  # ===================================================================================
  # Модуль cart (08 §4.7). Rate limit — RL-CART для всех методов. Кэширование — no-store.
  # ===================================================================================
  /cart:
    get:
      tags: [cart]
      operationId: cart_get
      summary: Активная корзина с актуализацией цен и остатков
      description: >
        200: при отсутствии активной корзины сервер создаёт пустую `active` и возвращает её с `items: []`
        (одна `active` на пользователя). Исключение — 503 ONEC_UNAVAILABLE reason=catalog_not_loaded с Retry-After: 60,
        если реплика каталога 1С ещё не загружена (нет склада или вида цены по умолчанию; 08 §4.7.1 «Уточнения» п. 2,
        FIX-F-07; с 1.2.0). Только своя корзина. Для `customer` (R1, ядро §24.2; при CUSTOMER_SELF_SERVICE=true)
        цены — по виду цены своей `confirmed`-карточки, иначе розничный; остатки — по `customer_stock_display` (08 §3.6).
        08 §4.7.1.
      security: [ { bearerAuth: [] } ]
      x-permissions: [cart.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-CART
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: revalidate
          in: query
          required: false
          description: "Пересчитать цены/остатки по снимку и пометить warnings (по умолчанию true)."
          schema: { type: boolean, default: true }
      responses:
        "200":
          description: "Cart (полная, с warnings[])."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "503":
          description: >
            ONEC_UNAVAILABLE, reason=catalog_not_loaded: реплика каталога 1С не загружена (нет активного склада или вида цены
            по умолчанию, до первичной загрузки RM-E-011); Retry-After: 60 (08 §4.7.1 «Уточнения» п. 2; FIX-F-07). Остальные
            маршруты корзины в этом состоянии отвечают так же (ответ default). Добавлено в 1.2.0.
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            Retry-After: { $ref: "#/components/headers/RetryAfter" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/Problem" }
        default: { $ref: "#/components/responses/Problem" }
    patch:
      tags: [cart]
      operationId: cart_update
      summary: Сменить склад активной корзины с пересчётом доступности
      description: >
        Единственное изменяемое поле — `warehouseId` (иные поля → 400 VALIDATION_FAILED, rule forbidden_field). Склад должен
        быть активным. Сервер пересчитывает available/remainingAvailable/stockLevel/warnings; позиции не удаляются.
        Тот же warehouseId → 200 без изменения rowVersion. Ошибки: 409 VERSION_CONFLICT (current: Cart); 404 NOT_FOUND
        (склад не существует/неактивен); 403 FORBIDDEN (склад недоступен); 400 VALIDATION_FAILED. 08 §4.7.8 [ядро §19.2].
      security: [ { bearerAuth: [] } ]
      x-permissions: [cart.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, customer]
      x-step-up: false
      x-idempotent: true
      x-rate-limit-group: RL-CART
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/IdempotencyKeyOptional" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartUpdateRequest" }
      responses:
        "200":
          description: "Cart (новый warehouseId, rowVersion+1; конфликты — в warnings[])."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cart]
      operationId: cart_clear
      summary: Очистить активную корзину
      description: >
        200 Cart с `items: []`, `status: active`; отложенные корзины не затрагиваются. Повтор для уже пустой корзины → 200
        без проверки rowVersion. Ошибки: 409 VERSION_CONFLICT; 400 VALIDATION_FAILED. Аудит `cart.cleared`. 08 §4.7.3.
      security: [ { bearerAuth: [] } ]
      x-permissions: [cart.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-CART
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: rowVersion
          in: query
          required: true
          description: "rowVersion активной корзины (оптимистическая блокировка)."
          schema: { type: integer, minimum: 0 }
      responses:
        "200":
          description: "Cart (items: [], status: active)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }

  /cart/items/{variantId}:
    put:
      tags: [cart]
      operationId: cart_items_put
      summary: Установить или увеличить количество/упаковку позиции (0 = удалить)
      description: >
        mode=set — установить value; mode=increment — прибавить value к текущему («+ Добавить» без гонок). Idempotency-Key
        ОБЯЗАТЕЛЕН при mode=increment (08 §2.7; без ключа → 400 VALIDATION_FAILED rule idempotency_key_required), при
        mode=set — допускается. Клиент не передаёт цены: price/unitPrice → 400 forbidden_field + аудит price.override_attempt;
        priceSnapshot — цена, которую видел пользователь (только для предупреждения). Превышение остатка — не ошибка, а
        warnings: [stock_insufficient]; увеличение при неизвестном остатке → 422 STOCK_INSUFFICIENT (conflicts[].available: null,
        reason: stock_unknown). Ошибки: 409 VERSION_CONFLICT (current: Cart), IDEMPOTENCY_IN_PROGRESS; 422 VARIANT_UNAVAILABLE,
        QTY_NOT_MULTIPLE, QTY_BELOW_MIN, STOCK_INSUFFICIENT, IDEMPOTENCY_KEY_REUSED; 400 VALIDATION_FAILED (forbidden_field,
        max_items — 201-я строка, idempotency_key_required). 08 §4.7.2.
      security: [ { bearerAuth: [] } ]
      x-permissions: [cart.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, customer]
      x-step-up: false
      x-idempotent: true
      x-rate-limit-group: RL-CART
      parameters:
        - { $ref: "#/components/parameters/CartVariantIdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/IdempotencyKeyOptional" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartPutItemRequest" }
      responses:
        "200":
          description: "Cart (rowVersion+1)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cart]
      operationId: cart_items_delete
      summary: Удалить позицию корзины
      description: >
        С packagingId удаляется строка варианта с этой упаковкой; без параметра — все строки варианта [ядро §19.2].
        Удаление отсутствующей строки → 200 с текущей корзиной. Ошибки: 400 VALIDATION_FAILED (packagingId не uuid).
        08 §4.7.3.
      security: [ { bearerAuth: [] } ]
      x-permissions: [cart.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-CART
      parameters:
        - { $ref: "#/components/parameters/CartVariantIdPath" }
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: packagingId
          in: query
          required: false
          description: "Упаковка удаляемой строки; без параметра удаляются все строки варианта."
          schema: { type: string, format: uuid }
      responses:
        "200":
          description: "Cart без удалённой позиции."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Problem" }

  /cart/customer:
    post:
      tags: [cart]
      operationId: cart_customer_set
      summary: Привязать клиента к корзине (пересчёт вида цены, скидки 1С, флагов долга)
      description: >
        Цены пересчитываются по priceListId клиента; warnings при изменении цен. `customer` — только своя
        `confirmed`-карточка (чужая → 403 FORBIDDEN). Ошибки: 404 NOT_FOUND (клиент); 409 VERSION_CONFLICT;
        403 FORBIDDEN; 400 VALIDATION_FAILED (other_person без name/phone). 08 §4.7.4; «Розничный клиент» — Q-026.
      security: [ { bearerAuth: [] } ]
      x-permissions: [cart.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, customer]
      x-step-up: false
      x-idempotent: true
      x-rate-limit-group: RL-CART
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/IdempotencyKeyOptional" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartCustomerSetRequest" }
      responses:
        "200":
          description: "Cart с клиентом (ролевое представление без сумм долга)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }
        default: { $ref: "#/components/responses/Problem" }
    delete:
      tags: [cart]
      operationId: cart_customer_unset
      summary: Отвязать клиента от корзины
      description: "Идемпотентен по семантике. 08 §4.7.4 [ядро §17.4]."
      security: [ { bearerAuth: [] } ]
      x-permissions: [cart.manage.own]
      x-roles: [seller, cashier, senior_seller, admin, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-CART
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
      responses:
        "200":
          description: "Cart без клиента (customer: null), цены пересчитаны."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Cart" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        default: { $ref: "#/components/responses/Problem" }

  /cart/discount:
    post:
      tags: [cart]
      operationId: cart_discount_apply
      summary: Запросить ручную скидку на корзину
      description: >
        В пределах лимита роли — discount.apply.within_limit; сверх лимита — `override` из СВОЕЙ сессии с
        discount.approve.over_limit и X-Step-Up-Token (step-up только при override; 403 STEP_UP_REQUIRED,
        operation discount.approve.over_limit). `customer` → 403 FORBIDDEN. Ошибки: 422 DISCOUNT_LIMIT_EXCEEDED (limitPercent,
        requiresRole); 403 STEP_UP_REQUIRED / FORBIDDEN; 409 VERSION_CONFLICT; 400 VALIDATION_FAILED (percent_range).
        Аудит discount.applied, discount.over_limit_approved. 08 §4.7.5; лимиты — Q-015.
      security:
        - { bearerAuth: [] }
        - { bearerAuth: [], stepUpToken: [] }
      x-permissions: [discount.apply.within_limit, discount.approve.over_limit]
      x-roles: [seller, cashier, senior_seller, admin]
      x-step-up: true
      x-step-up-operation: [discount.approve.over_limit]
      x-idempotent: true
      x-rate-limit-group: RL-CART
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/IdempotencyKeyOptional" }
        - { $ref: "#/components/parameters/StepUpToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CartDiscountRequest" }
      responses:
        "200":
          description: "Cart (appliedDiscountPercent, discountTotal, распределение по строкам)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
