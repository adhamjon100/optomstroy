  # ===================================================================================
  # Модуль orders (08 §4.8). Кэширование — no-store (кроме PDF: private, no-cache + ETag).
  # ===================================================================================
  /orders:
    post:
      tags: [orders]
      operationId: orders_create
      summary: Создать заказ из корзины (Idempotency-Key обязателен; цены клиент не передаёт)
      description: >
        Сервер повторяет проверки checkout-preview, вне транзакции БД — синхронная проверка 1С /check (6000 мс), затем одна
        короткая транзакция (orders submitting + order_items + начальный платёж + onec_outbox pending + история + transactions +
        audit + корзина converted). Документ 1С создаёт воркер из outbox; 503 ONEC_UNAVAILABLE не возвращается.
        201 — /check выполнен; 202 — /check не выполнен (1С недоступна или вариант C-2), warnings[STALE_DATA], Location.
        Начальный платёж: cash → cash_pending; qr_bakai → qr_shown с QrInfo при payment.qr.show (QR_PROVIDER=onec — QR от 1С,
        autoConfirm: true; недоступность 1С → qr_pending без qr + warnings[QR_UNAVAILABLE]; QR_PROVIDER=none — elqr_static/none,
        autoConfirm: false), без payment.qr.show (admin; customer при QR_PROVIDER≠onec) — qr_pending без поля qr; credit → credit.
        Права по способу: credit — дополнительно credit.sale.create (иначе 403, creditReason: forbidden_role); creditOverride —
        credit.sale.approve + step-up (только senior_seller); discountOverride — discount.approve.over_limit + step-up.
        Режим клиента (customer, R1, ядро §24.2; CUSTOMER_SELF_SERVICE=true): paymentMethod cash | qr_bakai (только при
        QR_PROVIDER=onec, иначе 422 VALIDATION_FAILED rule payment_method_unavailable); credit, manualDiscountPercent ≠ "0.00",
        discountOverride, creditOverride, чужой customerId → 403 FORBIDDEN; delivery обязателен.
        Ошибки: 422 CART_EMPTY, PRICE_CHANGED / STOCK_INSUFFICIENT / VARIANT_UNAVAILABLE / QTY_NOT_MULTIPLE (conflicts[] — все
        конфликты одним ответом; корзина не конвертируется), DISCOUNT_LIMIT_EXCEEDED, CUSTOMER_NOT_IDENTIFIED, CREDIT_BLOCKED,
        CREDIT_LIMIT_EXCEEDED, RECEIVABLES_STALE, ONEC_REJECTED, IDEMPOTENCY_KEY_REUSED, VALIDATION_FAILED; 409 VERSION_CONFLICT
        (current: Cart; items не совпадают с корзиной), ORDER_STATE_INVALID (reason: possible_duplicate, possibleDuplicateOrderId;
        обход — confirmDuplicate=true), IDEMPOTENCY_IN_PROGRESS; 403 FORBIDDEN, STEP_UP_REQUIRED; 400 VALIDATION_FAILED
        (forbidden_field — price/unitPrice/total/subtotal/amount, аудит price.override_attempt). 08 §4.8.1 [ядро §22.3, §22.4, §24.4].
        Повтор с тем же Idempotency-Key (Idempotent-Replayed: true) возвращает текущее представление созданного заказа с тем
        же статусом 201/202, в том числе QR начального платежа, сформированный после COMMIT (B-AR-04).
      security:
        - { bearerAuth: [] }
        - { bearerAuth: [], stepUpToken: [] }
      x-permissions: [order.create, credit.sale.create, credit.sale.approve, discount.approve.over_limit, payment.qr.show]
      x-roles: [seller, cashier, senior_seller, admin, customer]
      x-step-up: true
      x-step-up-operation: [discount.approve.over_limit, credit.sale.approve]
      x-idempotent: required
      x-feature-flag: QR_PROVIDER
      x-rate-limit-group: RL-FIN
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - { $ref: "#/components/parameters/IdempotencyKey" }
        - { $ref: "#/components/parameters/StepUpToken" }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/OrdersCreateRequest" }
      responses:
        "201":
          description: "Order (status=submitting, onecSyncState=pending, onec.number=null; payments[0] — начальный платёж); /check выполнен."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "202":
          description: "Order (status=submitting) + warnings[STALE_DATA]: /check не выполнен, проверки по последнему снимку (D-29); клиент опрашивает GET /orders/{id} (3 с, до 60 с)."
          headers:
            X-Request-Id: { $ref: "#/components/headers/XRequestId" }
            X-Min-App-Version: { $ref: "#/components/headers/XMinAppVersion" }
            X-Recommended-App-Version: { $ref: "#/components/headers/XRecommendedAppVersion" }
            Cache-Control: { $ref: "#/components/headers/CacheControl" }
            Idempotent-Replayed: { $ref: "#/components/headers/IdempotentReplayed" }
            Location: { $ref: "#/components/headers/Location" }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Order" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
        "422": { $ref: "#/components/responses/UnprocessableEntity" }
        default: { $ref: "#/components/responses/Problem" }
    get:
      tags: [orders]
      operationId: orders_list
      summary: Список заказов
      description: >
        order.read.own — seller (созданные им), customer (созданные аккаунтом и заказы своей карточки при
        customer_links.status=confirmed); order.read.all — cashier, senior_seller, admin, owner. idempotencyKey — поиск заказа по
        ключу POST /orders после перезапуска приложения (только заказы текущего пользователя; 0 или 1 элемент; ядро §22.6).
        include=statusCounts — счётчики по order_status при всех фильтрах, кроме status, в пределах видимости роли [ядро §19.2];
        totalEstimate — точное число по фильтру. Ошибки: 400 VALIDATION_FAILED (sort_field, date_range, limit, cursor);
        403 FORBIDDEN (createdBy без order.read.all). 08 §4.8.2.
      security: [ { bearerAuth: [] } ]
      x-permissions: [order.read.own, order.read.all]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
      parameters:
        - { $ref: "#/components/parameters/DeviceId" }
        - { $ref: "#/components/parameters/AppVersion" }
        - { $ref: "#/components/parameters/Platform" }
        - { $ref: "#/components/parameters/RequestId" }
        - { $ref: "#/components/parameters/AcceptLanguage" }
        - name: status
          in: query
          required: false
          description: "Фильтр по статусам заказа (список через запятую)."
          style: form
          explode: false
          schema:
            type: array
            maxItems: 11
            items: { $ref: "#/components/schemas/OrderStatus" }
        - name: customerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: createdBy
          in: query
          required: false
          description: "Автор заказа (users.id); только при order.read.all, иначе 403 FORBIDDEN."
          schema: { type: string, format: uuid }
        - { $ref: "#/components/parameters/From" }
        - { $ref: "#/components/parameters/To" }
        - name: paymentMethod
          in: query
          required: false
          schema: { $ref: "#/components/schemas/PaymentMethod" }
        - name: isPaid
          in: query
          required: false
          schema: { type: boolean }
        - { $ref: "#/components/parameters/Q" }
        - name: idempotencyKey
          in: query
          required: false
          description: "Ключ Idempotency-Key запроса POST /orders; только заказы текущего пользователя (08 §2.7, ядро §22.6)."
          schema: { type: string, format: uuid }
        - name: include
          in: query
          required: false
          description: "statusCounts — счётчики по статусам для чипов SCR-25 [ядро §19.2]."
          schema: { type: string, enum: [statusCounts] }
        - { $ref: "#/components/parameters/Limit" }
        - { $ref: "#/components/parameters/Cursor" }
        - name: sort
          in: query
