  /integrations/smspro/dlr:
    post:
      tags: [integrations]
      operationId: integrations_smspro_dlr_receive
      summary: Отчёт о доставке SMS от SMSPro (push-DLR)
      description: '08 §4.22.1; ядро §17.4, §17.7; 09 §6.5; 11 SEC-013, SEC-026. Опционально (could): по умолчанию SMSPRO_DLR_MODE=poll — маршрут
        отвечает 404; push включается SMSPRO_DLR_MODE=push (09 §6.11 фиксирует объём R1 «только poll» — режим push остаётся выключенным, пока
        не включён флагом). Без access JWT: только IP-allowlist SMSPRO_DLR_ALLOWED_IPS (пустой список → 404). Тело — application/xml (исключение
        из правила application/json только для этого маршрута) формата 09 §6.5: report/dr[] с id и phone/report/sendTime/rcvTime; подписи у push-запроса
        нет. Ответ — 200 с пустым телом за ≤ 1 с; обработка в фоне (pg-boss); неизвестные dr/id игнорируются (метрика sms_dlr_unknown_id_total);
        повтор отчёта по тому же dr/id не меняет sms_outbox повторно. Ответ провайдеру — без деталей. Ошибки: 403 FORBIDDEN (IP вне allowlist);
        404 NOT_FOUND (push выключен); 413 PAYLOAD_TOO_LARGE (> 1 MB); 415 UNSUPPORTED_MEDIA_TYPE. Аудит в audit_logs не пишется (технический
        канал; без номеров телефонов в логах).'
      security: []
      parameters: [{$ref: '#/components/parameters/RequestId'}]
      requestBody:
        required: true
        content:
          application/xml:
            schema: {$ref: '#/components/schemas/IntegrationsSmsproDlrReport'}
      responses:
        '200':
          description: Отчёт принят (пустое тело).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        '415': {$ref: '#/components/responses/UnsupportedMediaType'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: []
      x-roles: []
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-PUBLIC-IP
      x-feature-flag: SMSPRO_DLR_MODE=push
components:
  parameters:
    IntegrationsOnecNode:
      name: X-Onec-Node
      in: header
      required: false
      description: '[НОВОЕ ИМЯ 08 §4.21] Имя узла плана обмена (для будущих нескольких баз), например POS.'
      schema:
        type: string
        maxLength: 50
        example: POS
    IntegrationsOnecExtensionVersion:
      name: X-Onec-Extension-Version
      in: header
      required: false
      description: '[НОВОЕ ИМЯ 08 §4.21] Версия расширения onec-extension; пишется в sync_runs.meta.'
      schema:
        type: string
        maxLength: 50
        example: 1.0.3
  schemas:
    NotificationsUnreadCount:
      type: object
      required: [unreadCount]
      description: Ответ POST /notifications/{id}/read и /notifications/read-all (08 §4.16.2).
      properties:
        unreadCount:
          type: integer
          minimum: 0
          example: 2
    SyncRunsCreateRequest:
      type: object
      required: [entity, mode]
      additionalProperties: false
      description: Тело POST /sync/runs (08 §4.17.2, §8).
      properties:
        entity: {$ref: '#/components/schemas/SyncEntity'}
        mode:
          type: string
          enum: [incremental, full, reconcile]
          description: 'Подмножество SyncMode (07 §6.1): значение manual присваивается прогону сервером и в теле не принимается.'
        scope:
          type: object
          nullable: true
          additionalProperties: false
          description: Точечная синхронизация (например, долг клиента перед продажей в долг); null — вся сущность.
          properties:
            customerId:
              type: string
              format: uuid
              nullable: true
            variantIds:
              type: array
              maxItems: 200
              items:
                type: string
                format: uuid
              description: variantIds ≤ 200 (08 §2.14).
    SyncRunError:
      type: object
      required: [id, entity, errorCode, message]
      description: Строка GET /sync/runs/{id}/errors (08 §4.17.2; 07 sync_errors). errorCode — код журнала синхронизации, НЕ Problem.code.
      properties:
        id:
          type: string
          format: uuid
        entity: {$ref: '#/components/schemas/SyncEntity'}
        onecRef:
          type: string
          format: uuid
          nullable: true
        onecCode:
          type: string
          nullable: true
          description: Код объекта в 1С.
        errorCode: {$ref: '#/components/schemas/SyncErrorCode'}
        message:
          type: string
        payload:
          type: object
          nullable: true
          additionalProperties: true
          description: Данные объекта без ПДн.
        resolvedAt:
          type: string
          format: date-time
          nullable: true
          readOnly: true
          description: 'Только чтение: операция «пометить решённой» — R2 (Q-219, ядро §19.2).'
    AdminUser:
      type: object
      required: [id, kind, status, roles]
      description: Пользователь в админ-разделе (08 §4.18.1; имя схемы — из 08).
      properties:
        id:
          type: string
          format: uuid
        kind: {$ref: '#/components/schemas/UserKind'}
        status: {$ref: '#/components/schemas/UserStatus'}
        phoneMasked:
          type: string
          example: +996 7** *** *01
          description: 'Телефон: маскированный (формат PhoneMasked, ядро §19.2); для admin — полный (08 §4.18.1).'
        fullName:
          type: string
        roles:
          type: array
          items: {$ref: '#/components/schemas/RoleCode'}
        permissionsVersion:
          type: integer
          minimum: 0
        discountLimitPercent:
          allOf: [{$ref: '#/components/schemas/Percent'}]
          readOnly: true
          description: 'Только чтение: лимит эффективной роли из role_discount_limits (персональных лимитов в R1 нет).'
        lastLoginAt:
          type: string
          format: date-time
          nullable: true
        devicesCount:
          type: integer
          minimum: 0
        createdAt:
          type: string
          format: date-time
        invitation:
          type: object
          nullable: true
          properties:
            status:
              type: string
              enum: [pending, accepted]
            createdAt:
              type: string
              format: date-time
        rowVersion:
          type: integer
          minimum: 0
          description: Версия строки для PATCH /admin/users/{id} и PUT …/roles (VERSION_CONFLICT). В перечне полей AdminUser 08 §4.18.1 не названо
            — добавлено, т. к. тела PATCH и PUT …/roles требуют rowVersion.
