          type: string
          example: '1.0'
        serverTime:
          type: string
          format: date-time
    HealthReadiness:
      type: object
      required: [status, checks]
      description: GET /health/ready 200 (08 §4.19.1).
      properties:
        status:
          type: string
          enum: [ok, degraded]
        checks:
          type: object
          properties:
            db:
              type: string
              example: ok
            worker:
              type: string
              example: ok
            onec:
              type: object
              properties:
                status:
                  type: string
                  enum: [ok, unreachable, degraded]
                reasons:
                  type: array
                  items:
                    type: string
                    enum: [consecutive_errors, manual_orders_sla, price_list_config, inbound_silent, api_incompatible]
                  description: consecutive_errors — consecutiveErrors ≥ 3 у сущности; manual_orders_sla — заказ фазы 0 старше MANUAL_ORDER_SLA_MIN;
                    price_list_config — роль без вида цены; inbound_silent — в C-2 нет ping дольше 2× периода; api_incompatible — несовместимая
                    версия API расширения (сущности paused).
            sync:
              type: object
              properties:
                stockAgeSec:
                  type: integer
                  minimum: 0
                stale:
                  type: boolean
            sms:
              type: string
              enum: [ok, circuit_open]
    HealthReadinessFailed:
      type: object
      required: [status]
      description: GET /health/ready 503 — не problem+json (08 §4.19.1).
      properties:
        status:
          type: string
          enum: [failed]
    IntegrationsOnecChangeObject:
      type: object
      required: [objectType, ref]
      additionalProperties: false
      description: 'Элемент objects[] пакета (08 §4.21.1; 05 §10.1): изменение — с data; удаление — type: ObjectDeletion без data. Элемент без
        data и без type: ObjectDeletion → VALIDATION_FAILED. Имена objectType — [ТИПОВО: Q-010].'
      properties:
        type:
          type: string
          enum: [ObjectDeletion]
          description: Только для удаления объекта.
        objectType:
          type: string
          maxLength: 200
          example: Catalog_Номенклатура
        ref:
          type: string
          minLength: 1
          maxLength: 150
          description: 'Ключ объекта (B-AR-05; 05 §6.2 п.1, контракт 1С ObjectDeletion.ref/BarcodeChange.ref): для справочников и документов
            (Catalog_*, Document_*) — Ref_Key, GUID в нижнем регистре (формат проверяет сервер по objectType; иное → ошибка объекта в
            sync_errors, пакет не отвергается целиком); для наборов записей регистров (InformationRegister_*, например штрихкоды) — ключ
            набора, например значение штрихкода. Хранение версий — sync_entity_versions.onec_key (07 §5.54, предложение).'
        dataVersion:
          type: string
          maxLength: 100
          example: AAAAAgAC
        deletionMark:
          type: boolean
        data:
          type: object
          additionalProperties: true
          description: Содержимое объекта по JSON-формату 05 §6.4 (владелец формата — 05).
    IntegrationsOnecChangesRequest:
      type: object
      required: [messageNumber, node, objects]
      additionalProperties: false
      description: Тело POST /integrations/onec/changes — канонический формат 05 §10.1 (ядро §18.1).
      properties:
        messageNumber:
          type: integer
          format: int64
          minimum: 0
          example: 1042
        node:
          type: string
          maxLength: 50
          example: POS
        objects:
          type: array
          maxItems: 1000
          items: {$ref: '#/components/schemas/IntegrationsOnecChangeObject'}
          description: ≤ 1000 (как limit метода /pos/v1/changes, 05 §6.3).
        generatedAt:
          type: string
          format: date-time
    IntegrationsOnecChangesAccepted:
      type: object
      required: [messageNumber, accepted, runId]
      description: Ответ 202 (подтверждение приёма пакета; итог применения — в sync_runs/sync_errors по runId).
      properties:
        messageNumber:
          type: integer
          format: int64
          minimum: 0
        accepted:
          type: boolean
          description: false — повтор уже принятого номера (объекты повторно не применяются).
        runId:
          type: string
          format: uuid
    IntegrationsOnecOutboxItem:
      type: object
      required: [outboxId, kind, operation, externalId, payload]
      properties:
        outboxId:
          type: string
          format: uuid
        kind: {$ref: '#/components/schemas/OutboxAggregate'}
        operation: {$ref: '#/components/schemas/OutboxOperation'}
        externalId:
          type: string
          format: uuid
          description: UUID агрегата = onec_outbox.external_id — ключ идемпотентности для 1С (08 §2.7).
        publicNumber:
          type: string
          example: POS-2026-000123
          description: Только отображаемый реквизит, ключом не является.
        attempt:
          type: integer
          minimum: 1
        createdAt:
          type: string
          format: date-time
        payload:
          type: object
          additionalProperties: true
          description: Команда по JSON-формату 05 §6.4 (например, CreateOrderCmd).
    IntegrationsOnecOutboxResponse:
      type: object
      required: [items, leaseUntil]
      properties:
        items:
          type: array
          items: {$ref: '#/components/schemas/IntegrationsOnecOutboxItem'}
        leaseUntil:
          type: string
          format: date-time
          description: Окончание аренды выданных элементов (now + 10 мин).
    IntegrationsOnecOutboxAckRequest:
      type: object
      required: [result]
      additionalProperties: false
      description: Тело POST /integrations/onec/outbox/{outboxId}/ack — состав 05 §10.1; коды POS_E_* — 05 §6.5 [ТИПОВО].
      properties:
        result:
          type: string
          enum: [confirmed, rejected, retry]
        onecRef:
          type: string
          format: uuid
          description: Обязателен при confirmed.
        onecNumber:
          type: string
          maxLength: 50
          example: УТ-000123
          description: Обязателен при confirmed.
        onecDate:
          type: string
          format: date-time
        status:
          type: string
          maxLength: 100
          example: Не согласован
          description: Статус документа в 1С как есть.
        posted:
          type: boolean
          description: Признак проведения документа.
        recalculated:
          type: boolean
        totals:
          type: object
          nullable: true
          additionalProperties: false
          description: Обязателен при recalculated=true.
          required: [subtotal, discountTotal, total]
          properties:
            subtotal: {$ref: '#/components/schemas/MoneyAmount'}
            discountTotal: {$ref: '#/components/schemas/MoneyAmount'}
            total: {$ref: '#/components/schemas/MoneyAmount'}
        error:
          type: object
          nullable: true
          additionalProperties: false
          properties:
            code:
              type: string
              maxLength: 50
              example: POS_E_VALIDATION
            message:
              type: string
              maxLength: 2000
            details:
              type: object
              additionalProperties: true
    IntegrationsOnecOutboxAckResponse:
      type: object
      required: [outboxId, status]
      properties:
        outboxId:
          type: string
          format: uuid
        status:
          allOf: [{$ref: '#/components/schemas/OutboxStatus'}]
          description: confirmed → sent; rejected → failed; retry → pending (или dead при исчерпании попыток).
    IntegrationsOnecOrderStatusItem:
      type: object
      required: [onecRef, onecStatus, changedAt]
      additionalProperties: false
      description: 'Сырые статусы и признаки документа 1С — набор 05 §10.1, ONEC-068; значения — как в 1С ([ТИПОВО: Q-010]). Поле status не принимается.'
      properties:
        onecRef:
          type: string
          format: uuid
        externalId:
          type: string
          format: uuid
          nullable: true
          description: UUID заказа POS (orders.id).
        onecStatus:
          type: string
          maxLength: 100
          example: К выполнению
        approved:
          type: boolean
        fulfillmentState:
          type: string
          nullable: true
          maxLength: 100
        shipmentRef:
          type: string
          format: uuid
          nullable: true
        shippedAt:
          type: string
          format: date-time
          nullable: true
        deletionMark:
          type: boolean
        changedAt:
          type: string
          format: date-time
    IntegrationsOnecOrderStatusRequest:
      type: object
      required: [items]
      additionalProperties: false
      properties:
        items:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/IntegrationsOnecOrderStatusItem'}
    IntegrationsOnecOrderStatusResponse:
      type: object
      required: [applied, skipped, unknown]
      properties:
        applied:
          type: integer
          minimum: 0
        skipped:
          type: integer
          minimum: 0
        unknown:
          type: array
          items:
            type: string
            format: uuid
          description: Заказы, которых нет в POS (созданы в 1С напрямую — в R1 не импортируются).
    IntegrationsOnecPingResponse:
      type: object
      required: [ok, serverTime]
      properties:
        ok:
          type: boolean
        serverTime:
          type: string
          format: date-time
        lastMessageNumber:
          type: integer
          format: int64
          minimum: 0
        pendingOutbox:
          type: integer
          minimum: 0
        apiVersion:
          type: string
          example: '1.0'
    IntegrationsOnecSnapshotRequest:
      type: object
      required: [snapshotAt, page, pages, hasMore, rows]
      additionalProperties: false
      description: 'Тело POST /integrations/onec/snapshots/{entity} (08 §4.21.6; 05 §10.1, ONEC-062). Имена полей строк — [ТИПОВО: Q-010].'
      properties:
        snapshotAt:
          type: string
          format: date-time
        page:
          type: integer
          minimum: 1
        pages:
          type: integer
          minimum: 1
        hasMore:
          type: boolean
        rows:
          type: array
          maxItems: 1000
          items:
            type: object
            additionalProperties: true
          description: 'Строки среза по JSON-формату 05 §6.4; ≤ 1000 на страницу (как пример 08 «received: 1000» и limit /changes); тело ≤ 10
            MB.'
    IntegrationsOnecSnapshotResponse:
      type: object
      required: [entity, snapshotAt, page, received, applied, runId]
      properties:
        entity:
          type: string
          enum: [stock, prices, receivables]
        snapshotAt:
          type: string
          format: date-time
        page:
          type: integer
          minimum: 1
        received:
          type: integer
          minimum: 0
        applied:
          type: boolean
          description: true — только на последней странице (срез применён атомарно).
        runId:
          type: string
          format: uuid
        counts:
          allOf: [{$ref: '#/components/schemas/SyncCounts'}]
          description: Только на последней странице.
    IntegrationsSmsproDlrPhone:
      type: object
      xml:
        name: phone
      properties:
        number:
          type: string
          example: '996550123456'
        report:
          type: integer
          minimum: 0
          maximum: 7
          description: 'Код отчёта SMSPro (09 §6.5): 3 → DELIVERED; 2/4/5/7 → FAILED; 0/1/6 → PENDING.'
        sendTime:
          type: string
          description: YYYYMMDDhhmmss или пустая строка.
        rcvTime:
          type: string
          description: YYYYMMDDhhmmss или пустая строка.
    IntegrationsSmsproDlrEntry:
      type: object
      xml:
        name: dr
      properties:
        id:
          type: string
          example: A881726
          description: Идентификатор транзакции SMSPro = sms_outbox.provider_message_id; неизвестные игнорируются.
        phone:
          type: array
          items: {$ref: '#/components/schemas/IntegrationsSmsproDlrPhone'}
          xml:
            wrapped: false
    IntegrationsSmsproDlrReport:
      type: object
      description: 'Push-DLR SMSPro, формат 09 §6.5 [ПОДТВЕРЖДЕНО: R2 §4.2]: один XML может содержать несколько dr и несколько phone. Формат задаёт
        провайдер, поэтому строгая проверка лишних элементов не применяется (ответ провайдеру — всегда 200, 08 §4.22.1).'
      xml:
        name: report
        namespace: http://Giper.mobi/schema/DeliveryReport
      properties:
        dr:
          type: array
          maxItems: 500
          items: {$ref: '#/components/schemas/IntegrationsSmsproDlrEntry'}
          xml:
            wrapped: false
