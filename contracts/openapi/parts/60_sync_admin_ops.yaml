  /integrations/onec/outbox:
    get:
      tags: [integrations]
      operationId: integrations_onec_outbox_list
      summary: 1С забирает исходящие документы POS
      description: '08 §4.21.2; 05 §6.3, §6.4, §10.1 (ONEC-063); ядро §22.1. Зеркало POST /pos/v1/orders|payments|customers|returns. Отдаёт элементы
        onec_outbox в статусе pending и переводит их в sending с арендой leaseUntil = now + 10 мин; без ack по истечении аренды → pending; cancelled
        не выдаются. Порядок FIFO по created_at; зависимые элементы (платёж после заказа, заказ после нового клиента) не выдаются раньше родителя.
        Повторный GET до ack возвращает те же элементы тому же токену. Отмена заказа — kind=order, operation=cancel. Ошибки: 400 VALIDATION_FAILED
        (limit, неизвестный kinds). Аудит не пишется (аренда фиксируется в onec_outbox). Префикс /integrations/onec/* (08 §4.21 «Общее», ядро
        §16 п.5, §17.4): только вариант C-2 (ONEC_INBOUND_ENABLED=true; иначе 404 NOT_FOUND на всех путях префикса); статус ПРЕДВАРИТЕЛЬНО (Q-031,
        Q-010, Q-011). Аутентификация — непрозрачный технический токен роли integration (таблица integration_tokens; выпуск и отзыв — скриптом
        bin/issue_integration_token, срок 180 дней); пользовательский JWT → 403 FORBIDDEN; integration-токен на других путях → 403. allowlist
        IP магазина обязателен при статическом IP (Q-030). X-Device-Id, X-App-Version, X-Platform не требуются. Тело ≤ 10 MB, иначе 413. Ошибки
        префикса: 401 UNAUTHENTICATED; 403 FORBIDDEN; 404 NOT_FOUND (C-2 выключен); 409 VERSION_CONFLICT, SYNC_ALREADY_RUNNING; 413 PAYLOAD_TOO_LARGE.
        Неудачная аутентификация — аудит integration.auth_failed. Cache-Control: no-store.'
      security:
      - integrationToken: []
      parameters:
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/IntegrationsOnecNode'}
      - {$ref: '#/components/parameters/IntegrationsOnecExtensionVersion'}
      - name: kinds
        in: query
        required: false
        description: Типы элементов через запятую (outbox_aggregate 07 §6.1); по умолчанию все.
        style: form
        explode: false
        schema:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/OutboxAggregate'}
      - {$ref: '#/components/parameters/Limit'}
      responses:
        '200':
          description: Элементы outbox под арендой.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationsOnecOutboxResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [sync.exchange]
      x-roles: [integration]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-INTEGRATION
      x-feature-flag: ONEC_INBOUND_ENABLED
      x-status: proposed
  /integrations/onec/outbox/{outboxId}/ack:
    post:
      tags: [integrations]
      operationId: integrations_onec_outbox_ack
      summary: 1С подтверждает или отклоняет документ из outbox
      description: '08 §4.21.3; 05 §10.1 (ONEC-063), SYNC-045, ONEC-039; ядро §22.1. result=confirmed → onec_outbox.status=sent (confirmed — только
        после чтения документа через /changes или /order-status), заказ получает onec_ref/номер/дату; recalculated=true + totals → orders.onec_total,
        totalsDiffer и уведомление автора; result=rejected → failed + orders.status=submit_failed + уведомление sync_error; result=retry → pending
        с attempts+1 и nextAttemptAt по графику 1, 2, 5, 15, 60 мин (далее каждые 60 мин); при исчерпании OUTBOX_MAX_ATTEMPTS (20) или OUTBOX_MAX_AGE_HOURS
        (24) → dead + алерт; POS_E_DUPLICATE по тому же externalId — как confirmed → sent. Идемпотентность: повтор ack с тем же result для элемента
        в финальном статусе → 200 без изменений; ack с другим onecRef для элемента не в sending/pending → 409 VERSION_CONFLICT + запись sync_errors.
        Ошибки: 400 VALIDATION_FAILED (схема); 404 NOT_FOUND (неизвестный outboxId); 409 VERSION_CONFLICT (противоречивый ack); 422 VALIDATION_FAILED
        (confirmed без onecRef/onecNumber; recalculated=true без totals). Аудит outbox.confirmed / outbox.rejected, outbox.dead; для return_request
        — также return.status_changed. Префикс /integrations/onec/* (08 §4.21 «Общее», ядро §16 п.5, §17.4): только вариант C-2 (ONEC_INBOUND_ENABLED=true;
        иначе 404 NOT_FOUND на всех путях префикса); статус ПРЕДВАРИТЕЛЬНО (Q-031, Q-010, Q-011). Аутентификация — непрозрачный технический токен
        роли integration (таблица integration_tokens; выпуск и отзыв — скриптом bin/issue_integration_token, срок 180 дней); пользовательский
        JWT → 403 FORBIDDEN; integration-токен на других путях → 403. allowlist IP магазина обязателен при статическом IP (Q-030). X-Device-Id,
        X-App-Version, X-Platform не требуются. Тело ≤ 10 MB, иначе 413. Ошибки префикса: 401 UNAUTHENTICATED; 403 FORBIDDEN; 404 NOT_FOUND (C-2
        выключен); 409 VERSION_CONFLICT, SYNC_ALREADY_RUNNING; 413 PAYLOAD_TOO_LARGE. Неудачная аутентификация — аудит integration.auth_failed.
        Cache-Control: no-store.'
      security:
      - integrationToken: []
      parameters:
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/IntegrationsOnecNode'}
      - {$ref: '#/components/parameters/IntegrationsOnecExtensionVersion'}
      - name: outboxId
        in: path
        required: true
        description: Идентификатор элемента очереди onec_outbox.id (в 1С ключом не является; ключ — externalId, 08 §2.7).
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationsOnecOutboxAckRequest'}
      responses:
        '200':
          description: Новый статус элемента outbox.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationsOnecOutboxAckResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [sync.exchange]
      x-roles: [integration]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-INTEGRATION
      x-feature-flag: ONEC_INBOUND_ENABLED
      x-status: proposed
  /integrations/onec/order-status:
    post:
      tags: [integrations]
      operationId: integrations_onec_order_status_push
      summary: 1С приносит сырые статусы заказов и отгрузок
      description: '08 §4.21.4; 05 §5.1b, §10.1 (ONEC-068), ONEC-021; ядро §22.8. Зеркало GET /pos/v1/orders/{uuid}/status для пакета заказов:
        1С приносит сырые статусы и признаки документа, проекцию в order_status (D-20) по таблице 05 §5.1b выполняет backend; далее order_status_history
        (source=onec_sync), уведомление order_status создателю заказа; элемент outbox заказа sent → confirmed при сопоставлении по externalId.
        Поле status (готовое значение order_status) в теле не принимается (rule forbidden_field). Комбинация, не покрытая 05 §5.1b, → объект пропускается
        с записью sync_errors. Идемпотентность по (onecRef, changedAt). Ошибки: 400 VALIDATION_FAILED (схема, > 500 элементов, forbidden_field).
        Аудит order.status_changed (actor = integration). Префикс /integrations/onec/* (08 §4.21 «Общее», ядро §16 п.5, §17.4): только вариант
        C-2 (ONEC_INBOUND_ENABLED=true; иначе 404 NOT_FOUND на всех путях префикса); статус ПРЕДВАРИТЕЛЬНО (Q-031, Q-010, Q-011). Аутентификация
        — непрозрачный технический токен роли integration (таблица integration_tokens; выпуск и отзыв — скриптом bin/issue_integration_token,
        срок 180 дней); пользовательский JWT → 403 FORBIDDEN; integration-токен на других путях → 403. allowlist IP магазина обязателен при статическом
        IP (Q-030). X-Device-Id, X-App-Version, X-Platform не требуются. Тело ≤ 10 MB, иначе 413. Ошибки префикса: 401 UNAUTHENTICATED; 403 FORBIDDEN;
        404 NOT_FOUND (C-2 выключен); 409 VERSION_CONFLICT, SYNC_ALREADY_RUNNING; 413 PAYLOAD_TOO_LARGE. Неудачная аутентификация — аудит integration.auth_failed.
        Cache-Control: no-store.'
      security:
      - integrationToken: []
      parameters:
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/IntegrationsOnecNode'}
      - {$ref: '#/components/parameters/IntegrationsOnecExtensionVersion'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/IntegrationsOnecOrderStatusRequest'}
      responses:
        '200':
          description: Результат применения пакета.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/IntegrationsOnecOrderStatusResponse'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        '413': {$ref: '#/components/responses/PayloadTooLarge'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [sync.exchange]
      x-roles: [integration]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-INTEGRATION
      x-feature-flag: ONEC_INBOUND_ENABLED
      x-status: proposed
  /integrations/onec/ping:
    get:
      tags: [integrations]
      operationId: integrations_onec_ping
      summary: Проверка токена, часов и совместимости версий
      description: '08 §4.21.5; 05 §10.1 (ONEC-064), SYNC-064, ONEC-095; ядро §22.8. 1С сообщает своё состояние query-параметрами (без ПДн; неизвестные
        параметры игнорируются); backend обновляет sync_node_state, сверяет совместимость apiVersion (при несовместимости сущности paused, /health/ready
        → degraded) и возвращает serverTime для контроля расхождения часов (пакеты с generatedAt, отличающимся более чем на 5 мин, принимаются
        с предупреждением в sync_errors). В C-2 заменяет GET /pos/v1/health для /health/ready. Ошибки: 401 UNAUTHENTICATED / 403 FORBIDDEN при
        неверном токене (аудит integration.auth_failed); успешный вызов не аудируется. Префикс /integrations/onec/* (08 §4.21 «Общее», ядро §16
        п.5, §17.4): только вариант C-2 (ONEC_INBOUND_ENABLED=true; иначе 404 NOT_FOUND на всех путях префикса); статус ПРЕДВАРИТЕЛЬНО (Q-031,
        Q-010, Q-011). Аутентификация — непрозрачный технический токен роли integration (таблица integration_tokens; выпуск и отзыв — скриптом
        bin/issue_integration_token, срок 180 дней); пользовательский JWT → 403 FORBIDDEN; integration-токен на других путях → 403. allowlist
        IP магазина обязателен при статическом IP (Q-030). X-Device-Id, X-App-Version, X-Platform не требуются. Тело ≤ 10 MB, иначе 413. Ошибки
        префикса: 401 UNAUTHENTICATED; 403 FORBIDDEN; 404 NOT_FOUND (C-2 выключен); 409 VERSION_CONFLICT, SYNC_ALREADY_RUNNING; 413 PAYLOAD_TOO_LARGE.
        Неудачная аутентификация — аудит integration.auth_failed. Cache-Control: no-store.'
      security:
      - integrationToken: []
      parameters:
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/IntegrationsOnecNode'}
      - {$ref: '#/components/parameters/IntegrationsOnecExtensionVersion'}
      - name: extensionVersion
        in: query
        required: false
        description: Версия расширения onec-extension.
        schema:
          type: string
          maxLength: 50
      - name: apiVersion
        in: query
        required: false
        description: Версия API расширения (сверка совместимости, 05 ONEC-095).
        schema:
          type: string
          maxLength: 20
      - name: platformVersion
        in: query
        required: false
        description: Версия платформы 1С.
        schema:
          type: string
          maxLength: 50
      - name: configVersion
        in: query
        required: false
        description: Версия конфигурации 1С.
        schema:
          type: string
          maxLength: 50
      - name: serverTime
        in: query
        required: false
        description: Время сервера 1С (UTC).
        schema:
          type: string
          format: date-time
      - name: registrationBacklog
        in: query
        required: false
        description: Число незарегистрированных к отправке изменений плана обмена.
        schema:
          type: integer
          minimum: 0
      - name: lastMessageNumber
        in: query
