      summary: 1С присылает страницу полного среза остатков, цен или долгов
      description: '08 §4.21.6; 05 §10.1 (ONEC-062), SYNC-014…016; ядро §17.4. Зеркало полной выгрузки (fetchAll/reconcile) для C-2: срез применяется
        атомарно после последней страницы; неполный срез не меняет текущий снимок; не все страницы за 30 мин → прогон partial, прежний снимок
        сохраняется. Идемпотентность по (entity, snapshotAt, page): повтор страницы → 200 с тем же результатом без повторного учёта. Ошибки: 400
        VALIDATION_FAILED (схема, entity вне stock|prices|receivables); 409 VERSION_CONFLICT (страница среза старше уже применённого snapshotAt);
        413 (> 10 MB); 422 VALIDATION_FAILED (страница вне 1…pages; snapshotAt в будущем более чем на 5 мин). Аудит в audit_logs не пишется; прогон
        — sync_runs (source=inbound), ошибки строк — sync_errors. Префикс /integrations/onec/* (08 §4.21 «Общее», ядро §16 п.5, §17.4): только
        вариант C-2 (ONEC_INBOUND_ENABLED=true; иначе 404 NOT_FOUND на всех путях префикса); статус ПРЕДВАРИТЕЛЬНО (Q-031, Q-010, Q-011). Аутентификация
        — непрозрачный технический токен роли integration (таблица integration_tokens; выпуск и отзыв — скриптом bin/issue_integration_token,
        срок 180 дней); пользовательский JWT → 403 FORBIDDEN; integration-токен на других путях → 403. allowlist IP магазина обязателен при статическом
        IP (Q-030). X-Device-Id, X-App-Version, X-Platform не требуются. Тело ≤ 10 MB, иначе 413. Ошибки префикса: 401 UNAUTHENTICATED; 403 FORBIDDEN;
        404 NOT_FOUND (C-2 выключен); 409 VERSION_CONFLICT, SYNC_ALREADY_RUNNING; 413 PAYLOAD_TOO_LARGE. Неудачная аутентификация — аудит integration.auth_failed.
        Cache-Control: no-store.'
      security:
      - integrationToken: []
      parameters:
      - {$ref: '#/components/parameters/RequestId'}
