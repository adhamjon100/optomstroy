# =====================================================================================
# Optomstroy POS API — фрагмент модулей: notifications, sync, admin, health, integrations (RM-B-003)
# Пути: /notifications*, /sync/*, /admin/*, /health, /health/ready, /openapi.json,
#       /integrations/onec/* (вариант C-2), /integrations/smspro/dlr. Пути — относительно /api/v1 (servers корня).
# Источник истины: 08_API_SPECIFICATION v1.9 §4.16–§4.22, §3.13, §3.15, §9; права — 11 §4.3–§4.4;
# ядро R0 v1.9 §19.2, §22, §23, §24 (приоритет). Общие компоненты — parts/00_root.yaml, правила — ../NOTES.md.
# Ссылки записаны как в собранном документе (#/components/...). Собственные схемы — с префиксом модуля
# (Notifications*, Sync*, Admin*, Health*, Integrations*), кроме имён, заданных в 08: AdminUser, AuditRow.
# R2-элементы (08 §4.20, ядро §19.2, 13 §3.11) не включены: пометка ошибки синхронизации решённой, пауза сущности,
# экспорт CSV как функция (format=csv в R1 → 403), вебхук банка (вне этого фрагмента).
#
# Решения автора фрагмента (по правилу «вариант владельца словаря»; полный перечень — в итоговом отчёте RM-B-003):
#  1. Ключи файла: openapi/info/paths/components — по постановке задачи; при сборке ключи openapi и info фрагмента
#     должны отбрасываться (NOTES §1: openapi/info собранного документа — из 00_root.yaml).
#  2. operationId — <module>_<action> в snake_case по тегу (владелец правила — 08 §8, API-122; NOTES §3 п.2),
#     а не camelCase из постановки. Права — x-permissions (массив кодов 11 §4.3, NOTES §5 п.1), а не x-permission.
#  3. Условный step-up (POST /sync/runs: только для запуска по sync.run.full) — security из двух альтернатив
#     [{bearerAuth}, {bearerAuth + stepUpToken}]; безусловный — только [{bearerAuth + stepUpToken}] (NOTES §3 п.3).
#  4. Коды ошибок операции перечислены в description операции: ответы ошибок — $ref на общие responses корня,
#     а OAS 3.0.3 не допускает своё description рядом с $ref.
#  5. /integrations/onec/*: x-feature-flag ONEC_INBOUND_ENABLED + x-status: proposed (условный элемент C-2, Q-031;
#     13 §5.4 п.5); Idempotency-Key не используется — идемпотентность по ключам 08 §4.21 (messageNumber и т. п.).
#     /integrations/smspro/dlr: x-feature-flag SMSPRO_DLR_MODE=push, без x-status (путь канонический, ядро §17.4).
#  6. AdminUser.rowVersion добавлен (тела PATCH /admin/users/{id} и PUT …/roles требуют rowVersion, в перечне
#     полей AdminUser 08 §4.18.1 его нет) — замечание владельцу 08.
#  7. POST /admin/users/{id}/emergency-login-code — без Idempotency-Key (08 §4.18.10: намеренно не идемпотентна).
# =====================================================================================
openapi: 3.0.3
info:
  title: 'Optomstroy POS API — фрагмент 60: sync, admin, notifications, health, integrations'
  version: 1.0.0
paths:
  /notifications:
    get:
      tags: [notifications]
      operationId: notifications_list
      summary: Список in-app уведомлений текущего пользователя
      description: '08 §4.16.1. Только свои уведомления (notifications.read.own — все роли, 08 §9, 11 §4.4). Клиент опрашивает при старте, при
        возврате в foreground и каждые 60 с (push — R2, Q-036). Ответ — Page<Notification> + unreadCount (бейдж колокольчика). Ошибки: 400 VALIDATION_FAILED
        (неизвестный kind, limit > 100, подделанный cursor); 401; 403 FORBIDDEN (токен integration). Аудит не пишется.'
      parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/AppVersion'}
      - {$ref: '#/components/parameters/Platform'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      - name: unread
        in: query
        required: false
        description: Только непрочитанные.
        schema:
          type: boolean
      - name: kind
        in: query
        required: false
        description: Фильтр по видам (значения notification_kind 07 §6.1) через запятую; неизвестное значение → VALIDATION_FAILED.
        style: form
        explode: false
        schema:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/NotificationKind'}
      - name: since
        in: query
        required: false
        description: Только уведомления, созданные после момента (UTC) — для инкрементального опроса.
        schema:
          type: string
          format: date-time
      - name: limit
        in: query
        required: false
        description: 'Размер страницы 1…100 (08 §4.16.1: limit ≤ 100); > 100 → VALIDATION_FAILED.'
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page<Notification> + unreadCount.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Min-App-Version: {$ref: '#/components/headers/XMinAppVersion'}
            X-Recommended-App-Version: {$ref: '#/components/headers/XRecommendedAppVersion'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Page'}
                - type: object
                  required: [unreadCount]
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/Notification'}
                    unreadCount:
                      type: integer
                      minimum: 0
                      description: Число непрочитанных уведомлений пользователя (бейдж).
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [notifications.read.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
  /notifications/{id}/read:
    post:
      tags: [notifications]
      operationId: notifications_read
      summary: Отметить уведомление прочитанным
      description: '08 §4.16.2. Повтор идемпотентен: 200 с текущим unreadCount. Тела запроса нет. Ошибки: 401; 403 FORBIDDEN (токен integration);
        404 NOT_FOUND — чужое или несуществующее уведомление. Аудит не пишется.'
      parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/AppVersion'}
      - {$ref: '#/components/parameters/Platform'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      - {$ref: '#/components/parameters/IdempotencyKeyOptional'}
      - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: Уведомление прочитано; текущее число непрочитанных.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Min-App-Version: {$ref: '#/components/headers/XMinAppVersion'}
            X-Recommended-App-Version: {$ref: '#/components/headers/XRecommendedAppVersion'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationsUnreadCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [notifications.read.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: true
      x-rate-limit-group: RL-READ
  /notifications/read-all:
    post:
      tags: [notifications]
      operationId: notifications_read_all
      summary: Отметить все уведомления прочитанными
      description: '08 §4.16.2. Повтор идемпотентен: 200 с текущим unreadCount (0). Тела запроса нет. Ошибки: 401; 403 FORBIDDEN (токен integration).
        Аудит не пишется.'
      parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/AppVersion'}
      - {$ref: '#/components/parameters/Platform'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      - {$ref: '#/components/parameters/IdempotencyKeyOptional'}
      - name: before
        in: query
        required: false
        description: >-
          Отметить прочитанными только свои непрочитанные уведомления с createdAt ≤ before (UTC ISO-8601) — «до момента»
          офлайн-действия пользователя (08 §4.16.2 «Уточнения», FQ-NOTIF-04; 07 §11.2 формат notification.read). Без параметра
          отмечаются все непрочитанные на момент обработки; неверный формат — 400 VALIDATION_FAILED. Добавлено в 1.2.0.
        schema: {type: string, format: date-time}
      responses:
        '200':
          description: Все уведомления прочитаны; текущее число непрочитанных.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Min-App-Version: {$ref: '#/components/headers/XMinAppVersion'}
            X-Recommended-App-Version: {$ref: '#/components/headers/XRecommendedAppVersion'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/NotificationsUnreadCount'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [notifications.read.own]
      x-roles: [seller, cashier, senior_seller, admin, owner, customer]
      x-step-up: false
      x-idempotent: true
      x-rate-limit-group: RL-READ
  /sync/status:
    get:
      tags: [sync]
      operationId: sync_status_get
      summary: Состояние синхронизации с 1С по сущностям
      description: '08 §4.17.1, §3.13. SCR-43 и индикатор SyncIndicator. Глубина ответа по коду права (field-level allowlist, 08 §3.13): sync.status.read
        (все staff) — краткий ответ: overall, onecReachable, checkedAt, entities[].entity/lastSuccessAt/isStale/ageSec/consecutiveErrors, outbox.failed/outbox.dead
        (баннер «Документы не дошли до 1С»; правило overall — 05 §7.6.1); sync.runs.read (senior_seller, admin, owner) — полный ответ: дополнительно
        counts, outbox.pending, pendingManualOrders, entities[].lastErrorAt/paused, lastRunAt, running, runId, nextRunAt, intervalSec. Поля, не
        разрешённые роли, отсутствуют. Ошибки: 401; 403 FORBIDDEN (customer, integration). Аудит не пишется.'
      parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/AppVersion'}
      - {$ref: '#/components/parameters/Platform'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      responses:
        '200':
          description: SyncStatus (краткий или полный — по праву).
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Min-App-Version: {$ref: '#/components/headers/XMinAppVersion'}
            X-Recommended-App-Version: {$ref: '#/components/headers/XRecommendedAppVersion'}
            Cache-Control:
              description: 'Политика кэширования операции: private, max-age=15 (08 §2.8, карточка §4).'
              schema:
                type: string
                example: private, max-age=15
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncStatus'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [sync.status.read, sync.runs.read]
      x-roles: [seller, cashier, senior_seller, admin, owner]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-READ
  /sync/runs:
    post:
      tags: [sync]
      operationId: sync_runs_create
      summary: Ручной запуск синхронизации сущности
      description: '08 §4.17.2, ядро §17.2, §22.8; 11 №42, №42a. sync.run.incremental.limited (senior_seller, admin, owner) — только mode=incremental
        для entity ∈ stock, prices, order_status, без step-up; любой иной запуск (mode ∈ full, reconcile или entity вне stock/prices/order_status,
        в т. ч. incremental для customers, receivables) — sync.run.full (admin, owner) со step-up (X-Step-Up-Token, operation sync.run.full).
        Значение mode=manual присваивается прогону сервером и в теле не принимается. Job pg-boss singleton; в режиме расширения — одно задание
        onec.changes по плану обмена (ядро §22.8). Вариант C-2 (ONEC_INBOUND_ENABLED=true): ручной запуск недоступен для любой сущности и роли
        → 422 VALIDATION_FAILED rule inbound_mode. Ошибки: 400 VALIDATION_FAILED (entity вне sync_entity, mode вне incremental|full|reconcile,
        idempotency_key_required); 401; 403 FORBIDDEN (нет права), STEP_UP_REQUIRED (любой запуск по sync.run.full без токена); 409 SYNC_ALREADY_RUNNING
        (runId), IDEMPOTENCY_IN_PROGRESS; 422 VALIDATION_FAILED rule inbound_mode, IDEMPOTENCY_KEY_REUSED; 429 RATE_LIMITED (RL-ADMIN: 10 / 10
        мин на сущность). Аудит sync.manual_started (entity, mode, scope).'
      security:
      - bearerAuth: []
      - bearerAuth: []
        stepUpToken: []
      parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/AppVersion'}
      - {$ref: '#/components/parameters/Platform'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      - {$ref: '#/components/parameters/IdempotencyKey'}
      - {$ref: '#/components/parameters/StepUpToken'}
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: '#/components/schemas/SyncRunsCreateRequest'}
      responses:
        '202':
          description: 'Прогон поставлен в очередь: SyncRun (status=queued); Location: /api/v1/sync/runs/{id}.'
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Min-App-Version: {$ref: '#/components/headers/XMinAppVersion'}
            X-Recommended-App-Version: {$ref: '#/components/headers/XRecommendedAppVersion'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
            Location: {$ref: '#/components/headers/Location'}
            Idempotent-Replayed: {$ref: '#/components/headers/IdempotentReplayed'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '409': {$ref: '#/components/responses/Conflict'}
        '422': {$ref: '#/components/responses/UnprocessableEntity'}
        '429': {$ref: '#/components/responses/TooManyRequests'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [sync.run.incremental.limited, sync.run.full]
      x-roles: [senior_seller, admin, owner]
      x-step-up: true
      x-step-up-operation: [sync.run.full]
      x-idempotent: required
      x-rate-limit-group: RL-ADMIN
      x-feature-flag: ONEC_INBOUND_ENABLED=false
    get:
      tags: [sync]
      operationId: sync_runs_list
      summary: История прогонов синхронизации
      description: '08 §4.17.2. sync.runs.read (senior_seller, admin, owner; 11 §4.4). Ответ — Page<SyncRun>. Ошибки: 400 VALIDATION_FAILED (entity/status
        вне enum, date_range, limit > 200, cursor); 401; 403 FORBIDDEN.'
      parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/AppVersion'}
      - {$ref: '#/components/parameters/Platform'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      - name: entity
        in: query
        required: false
        description: Фильтр по сущности (sync_entity 07 §6.1).
        schema: {$ref: '#/components/schemas/SyncEntity'}
      - name: status
        in: query
        required: false
        description: Фильтр по статусу прогона (sync_run_status 07 §6.1).
        schema: {$ref: '#/components/schemas/SyncRunStatus'}
      - {$ref: '#/components/parameters/From'}
      - {$ref: '#/components/parameters/To'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page<SyncRun>.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Min-App-Version: {$ref: '#/components/headers/XMinAppVersion'}
            X-Recommended-App-Version: {$ref: '#/components/headers/XRecommendedAppVersion'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Page'}
                - type: object
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/SyncRun'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [sync.runs.read]
      x-roles: [senior_seller, admin, owner]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-ADMIN
  /sync/runs/{id}:
    get:
      tags: [sync]
      operationId: sync_runs_get
      summary: Прогон синхронизации
      description: '08 §4.17.2. sync.runs.read (senior_seller, admin, owner). Ошибки: 401; 403 FORBIDDEN; 404 NOT_FOUND.'
      parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/AppVersion'}
      - {$ref: '#/components/parameters/Platform'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      - {$ref: '#/components/parameters/IdPath'}
      responses:
        '200':
          description: SyncRun.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Min-App-Version: {$ref: '#/components/headers/XMinAppVersion'}
            X-Recommended-App-Version: {$ref: '#/components/headers/XRecommendedAppVersion'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema: {$ref: '#/components/schemas/SyncRun'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [sync.runs.read]
      x-roles: [senior_seller, admin, owner]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-ADMIN
  /sync/runs/{id}/errors:
    get:
      tags: [sync]
      operationId: sync_runs_errors_list
      summary: Ошибки прогона синхронизации
      description: '08 §4.17.2, §2.4 (коды журнала синхронизации), §3.13. sync.runs.read (senior_seller, admin, owner). Ответ — Page<SyncRunError>;
        errorCode — значение sync_errors.error_code (14 кодов журнала, НЕ Problem.code). Пометка ошибки решённой и пауза сущности — R2 (Q-219,
        ядро §19.2): операций нет, resolvedAt только читается. Ошибки: 400 VALIDATION_FAILED (limit, cursor); 401; 403 FORBIDDEN; 404 NOT_FOUND
        (прогон).'
      parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/AppVersion'}
      - {$ref: '#/components/parameters/Platform'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      - {$ref: '#/components/parameters/IdPath'}
      - {$ref: '#/components/parameters/Limit'}
      - {$ref: '#/components/parameters/Cursor'}
      responses:
        '200':
          description: Page<SyncRunError>.
          headers:
            X-Request-Id: {$ref: '#/components/headers/XRequestId'}
            X-Min-App-Version: {$ref: '#/components/headers/XMinAppVersion'}
            X-Recommended-App-Version: {$ref: '#/components/headers/XRecommendedAppVersion'}
            Cache-Control: {$ref: '#/components/headers/CacheControl'}
          content:
            application/json:
              schema:
                allOf:
                - {$ref: '#/components/schemas/Page'}
                - type: object
                  properties:
                    items:
                      type: array
                      items: {$ref: '#/components/schemas/SyncRunError'}
        '400': {$ref: '#/components/responses/BadRequest'}
        '401': {$ref: '#/components/responses/Unauthorized'}
        '403': {$ref: '#/components/responses/Forbidden'}
        '404': {$ref: '#/components/responses/NotFound'}
        default: {$ref: '#/components/responses/Problem'}
      x-permissions: [sync.runs.read]
      x-roles: [senior_seller, admin, owner]
      x-step-up: false
      x-idempotent: false
      x-rate-limit-group: RL-ADMIN
  /sync/outbox:
    get:
      tags: [sync]
      operationId: sync_outbox_list
      summary: Очередь документов «в 1С» (outbox)
      description: '08 §4.17.3; ядро §22.1, §22.10 (одна торговая точка в R1, Q-274). sync.outbox.manage: admin и senior_seller — все элементы,
        фильтров «свой магазин» нет. Ответ — Page<OutboxItem>; статусы — автомат outbox_status (07 §6.5). Ошибки: 400 VALIDATION_FAILED (status/aggregateType
        вне enum, limit, cursor); 401; 403 FORBIDDEN.'
      parameters:
      - {$ref: '#/components/parameters/DeviceId'}
      - {$ref: '#/components/parameters/AppVersion'}
      - {$ref: '#/components/parameters/Platform'}
      - {$ref: '#/components/parameters/RequestId'}
      - {$ref: '#/components/parameters/AcceptLanguage'}
      - name: status
        in: query
        required: false
        description: Статусы через запятую (outbox_status 07 §6.1); по умолчанию failed,dead.
        style: form
        explode: false
        schema:
          type: array
          maxItems: 50
          items: {$ref: '#/components/schemas/OutboxStatus'}
          default: [failed, dead]
      - name: aggregateType
        in: query
        required: false
        description: Тип агрегата (outbox_aggregate 07 §6.1).
        schema: {$ref: '#/components/schemas/OutboxAggregate'}
