# constraints → role_permissions.constraint_json (07 §5.6): атрибутные ограничители ячеек матрицы 11 §4.4.
# own — только свои объекты (фильтр владельца в SQL, 11 §4.1 п.5, SEC-030); maxPercentFrom — лимит из
# role_discount_limits (SEC-034). Ограничители целей (SEC-040, SEC-043, ядро §21 п.3), conf (SEC-030 (в)) и
# флаги (CUSTOMER_SELF_SERVICE, QR_PROVIDER) проверяет код, а не seed — см. NOTES.md.
constraints:
  seller:
    order.read.own: {"own": true}
    order.cancel.own: {"own": true}
    order.documents.print: {"own": true}
    discount.apply.within_limit: {"maxPercentFrom": "role_discount_limits"}
    transactions.read.own: {"own": true}
    payment.read.own: {"own": true}
  cashier:
    order.cancel.own: {"own": true}
    discount.apply.within_limit: {"maxPercentFrom": "role_discount_limits"}
    return.create: {"own": true}
    return.submit: {"own": true}
  senior_seller:
    order.cancel.own: {"own": true}
    discount.apply.within_limit: {"maxPercentFrom": "role_discount_limits"}
    discount.approve.over_limit: {"maxPercentFrom": "role_discount_limits"}
  admin:
    order.cancel.own: {"own": true}
    discount.apply.within_limit: {"maxPercentFrom": "role_discount_limits"}
    discount.approve.over_limit: {"maxPercentFrom": "role_discount_limits"}
  owner: {}
  customer:
    order.read.own: {"own": true}
    order.cancel.own: {"own": true}
    order.documents.print: {"own": true}
    payment.qr.show: {"own": true}
    discount.rules.read: {"own": true}
    customer.self.read: {"own": true}
    customer.self.receivables.read: {"own": true}
    payment.read.own: {"own": true}
    customer.link.self_resolve: {"own": true}
  integration: {}

