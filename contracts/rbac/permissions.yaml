# RM-B-008 — матрица прав (RBAC) «Оптомстрой POS», Release 1.
# Канон: 11_SECURITY_PRIVACY §4.1–§4.4 (владелец словаря permissions и матрицы роль × право — ядро R0 §18.1);
# роли — ядро R0 §3.1, §24.2 (customer — R1), 07 §5.4 (role_code); step-up — ядро §3.3, §17.2, 11 §4.1 п.7.
# Deny by default: роль получает только перечисленные в grants коды; код без строки в grants никому не выдан.
# Файл — источник для seed pos-api/migrations/0002_rbac_seed.sql и e2e-теста матрицы (RM-B-008 п.3, этап D).
# Сверка: python -I -X utf8 scripts/check_api_permissions.py. Решения и отступления — contracts/rbac/NOTES.md.

version: 1
source:
  dictionary: "docs/specification/11_SECURITY_PRIVACY.md §4.3"
  matrix: "docs/specification/11_SECURITY_PRIVACY.md §4.4"
  step_up_scopes: "docs/specification/11_SECURITY_PRIVACY.md §4.1 п.7"
  kernel: "docs/research/R0_DECISION_KERNEL.md v1.9 (§3, §17.2, §21 п.3, §22, §23, §24.2)"
  tables: "docs/specification/07_DATA_MODEL.md §5.4–§5.7"

# roles → таблица roles (07 §5.4). sort_order — порядок значений enum role_code (07 §14.2).
roles:
  - code: seller
    name_ru: "Продавец"
    is_system: true
    is_assignable: true
    sort_order: 1
  - code: cashier
    name_ru: "Кассир"
    is_system: true
    is_assignable: true
    sort_order: 2
  - code: senior_seller
    name_ru: "Старший продавец"
    is_system: true
    is_assignable: true
    sort_order: 3
  - code: admin
    name_ru: "Администратор"
    is_system: true
    is_assignable: true
    sort_order: 4
  - code: owner
    name_ru: "Руководитель"
    is_system: true
    is_assignable: true
    sort_order: 5
  - code: customer
    name_ru: "Клиент"
    is_system: true
    is_assignable: false
    sort_order: 6
  - code: integration
    name_ru: "Интеграция"
    is_system: true
    is_assignable: false
    sort_order: 7

