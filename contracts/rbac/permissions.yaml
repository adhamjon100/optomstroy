    description: "Список клиентов с конфликтами/предложениями привязки (GET /customers?linkStatus=proposed,conflict) для разбора администратором"
    module: "customers"
    step_up: false
  - number: "74"
    code: return.approve
    description: "Согласование заявки на возврат: отправка заявки сверх return_approval_threshold (подтверждающий отправляет сам, CASH-007), отклонение заявки (POST /returns/{id}/reject), согласование в POS при RETURNS_FROM_POS_ENABLED=false (переходы — 10 RET, владелец)"
    module: "returns"
    step_up: true
    step_up_scope: returns
  - number: "75"
    code: customer.link.self_resolve
    description: "Клиент-покупатель: подтверждение или отклонение предложенной привязки своего аккаунта к карточке 1С (POST /registration/customer-match/confirm|reject, 08 §4.2.4); только при CUSTOMER_SELF_SERVICE; object-level — SEC-130"
    module: "customers"
    step_up: false
  - number: "76"
    code: users.emergency_code.issue
    description: "Выдача сотруднику аварийного одноразового кода входа при недоступности SMS (POST /admin/users/{id}/emergency-login-code, 09 SMS-035; R1 should, Q-168); ограничения цели — SEC-131, SEC-043"
    module: "admin"
    step_up: true
    step_up_scope: admin_users

