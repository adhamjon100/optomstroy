# Предложения к ревизии allow-list (ТЗ для 1С §4.2, Г.7, вопрос 18; 05 §5.3, §7.2, SYNC-002, SYNC-012).
# x-status: proposed — ждут согласования со специалистом 1С. В `collections` не входят: адаптер OData их
# не запрашивает (ODATA_ALLOWLIST в коде совпадает только с `collections`). После согласования запись
# переносится в `collections` вместе с правкой src/integrations/onec/odata-allowlist.ts.
proposedAdditions:
  collections:
    - name: Catalog_Валюты
      x-status: proposed
      kind: catalog
      requirements: [ONEC-007, ONEC-083]
      posTables: [price_lists]
      status: "[ТИПОВО]"
      access: read
      operations: [list]
      fields: [Ref_Key, Code, Description]
      reason: "Код валюты вида цены: `Catalog_ВидыЦен.ВалютаЦены_Key` → `Code` (ISO, `KGS`). Без справочника валюта вида цены по OData неизвестна и POS считает `KGS` (PriceListChange.currency: null = KGS, иная — вид цены не загружается)"
      fallback: "HS /pos/v1/changes (Catalog_ВидыЦен.currency — код валюты); без него — currency = null → KGS"
  queryOptions:
    - option: $orderby
      value: Ref_Key
      x-status: proposed
      collections: "все коллекции `collections` с полем Ref_Key"
      reason: "Устойчивое постраничное чтение `$top/$skip` и ключевая пагинация `$filter=Ref_Key gt guid'…'` (SYNC-002); пометка «не встреченных» ключей без сверки по `$count` (SYNC-012, 05 §7.2)"
      fallback: "без `$orderby` — листинг `$top/$skip`, пометка не встреченных ключей только при совпадении числа ключей с `$count` (иначе COUNT_MISMATCH, прогон partial)"

# Не публикуются (ONEC-083): всё, чего нет в `collections`. Примеры из критерия приёмки:
deniedExamples:
  - Catalog_Пользователи   # AC-ONEC-083: GET → «Entity not found»/403

# Упомянуты в 05 §5, но сознательно не входят в allow-list R1 (решение — NOTES.md §5):
excluded:
  - name: AccountingRegister_Хозрасчетный
    reason: "Только конфигурация БП (остатки — счёт 41, долги — счёт 62). Публикация регистра раскрывает весь бухгалтерский учёт (против ONEC-083). Включается отдельным решением, если `$metadata` покажет БП."

# Временный режим записи через OData (ONEC-028) — по умолчанию выключен.
temporaryWriteMode:
  requirement: ONEC-028
  enabledBy: ONEC_ODATA_WRITE_ENABLED   # по умолчанию false
  user: pos_odata_write                 # ONEC_ODATA_WRITE_USER_FILE / ONEC_ODATA_WRITE_PASSWORD_FILE
  allowed:
    - collection: Document_ЗаказКлиента
      operations: [create]
      preCheck: "GET …?$filter=Комментарий eq '<uuid>' перед созданием"
  note: Только при зафиксированном решении заказчика об отсутствии 1С-разработчика; после ядра v1.9 §24.3 специалист 1С есть — режим не планируется
