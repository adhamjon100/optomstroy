    OrderCreateRequest:
      type: object
      description: Тело `POST /pos/v1/orders` (05 §6.4)
      required: [externalId, createdAt, createdByUserCode, customer, warehouseRef, organizationRef, priceListRef, paymentMethod, paymentTerms, delivery, discountPercent, comment, lines, totals, clientChecks]
      properties:
        externalId:
          $ref: "#/components/schemas/ExternalId"
        createdAt:
          $ref: "#/components/schemas/DateTime"
        createdByUserCode:
          type: string
          description: |
            Внутренний идентификатор (UUID `users.id`) пользователя POS, оформившего заказ (продавец, кассир или
            покупатель в приложении), а **не** логин. В `Комментарий` не дублируется. Отражать ли сотрудника
            в реквизите «Менеджер» и сопоставлять ли с пользователями 1С — Q-129 (вопрос 47 ТЗ для 1С).
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        customer:
          $ref: "#/components/schemas/OrderCustomer"
        warehouseRef:
          $ref: "#/components/schemas/OnecRef"
        organizationRef:
          type: string
          nullable: true
          description: Организация; `null` — 1С подставляет организацию по умолчанию (Q-128). Сейчас POS всегда передаёт `null`
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        priceListRef:
          type: string
          nullable: true
          pattern: "^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"
        paymentMethod:
          $ref: "#/components/schemas/PaymentMethod"
        paymentTerms:
          type: string
          enum: [prepayment, credit]
          description: Условия оплаты соглашения или заказа (по Q-012)
        delivery:
          $ref: "#/components/schemas/OrderDelivery"
        discountPercent:
          description: "**Ручная** скидка продавца на документ; тот же процент POS передаёт в каждой строке. `\"0.00\"` — без скидки. Передаётся типовым механизмом ручных скидок"
          allOf:
            - $ref: "#/components/schemas/Percent"
        comment:
          type: string
          nullable: true
          maxLength: 1000
          description: |
            Комментарий документа (`x-comment-format`): `POS <полный externalId> · <номер заказа POS>`, для заявки
            покупателя из приложения — ` · заявка клиента`, затем ` · <комментарий продавца>` (если есть);
            разделитель — ` · `. Не длиннее 1000 символов (POS обрезает). 1С записывает строку в «Комментарий»
            как есть — `POS <externalId>` повторять не нужно (ONEC-040; ТЗ для 1С §6.6). Код пользователя POS
            в комментарий не пишется.
          x-comment-format: "POS <externalId> · <publicNumber>[ · заявка клиента][ · <комментарий>]"
          x-comment-pattern: "^POS [0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12} · POS-\\d{4}-\\d{6}( · .+)?$"
        lines:
          type: array
          minItems: 1
          items:
            $ref: "#/components/schemas/OrderLine"
        totals:
          description: "**Контрольные** суммы POS (`subtotal`, `discount`, `total`, `currency`); итог 1С — истина (`recalculated`, ONEC-039)"
          allOf:
            - $ref: "#/components/schemas/Totals"
        clientChecks:
          description: Время данных, по которым POS проверял корзину — только для журнала. Сейчас POS передаёт оба значения `null`
          allOf:
            - $ref: "#/components/schemas/OrderClientChecks"
    OrderCreateResponse:
      type: object
      description: Ответ `POST /pos/v1/orders` (05 §6.4); `deletionMark` — пометка удаления документа на момент ответа (AC-ONEC-059)
