            X-Request-Id:
              $ref: "#/components/headers/XRequestIdEcho"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PaymentCreateResponse"
        "201":
          description: Платёжный документ создан
          headers:
            X-POS-API-Version:
              $ref: "#/components/headers/XPosApiVersion"
