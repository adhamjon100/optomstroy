  /pos/v1/payments/qr:
    post:
      tags: [qr]
      operationId: createQrPayment
      summary: Создать динамический QR через интеграцию 1С с банком
      description: |
        05 §6.7, ONEC-075, ядро v1.9 §24.4 (`QR_PROVIDER=onec`). Вход — `externalId` платежа,
        `orderExternalId`, сумма, валюта. Ответ — `qrPayload`, `reference`, `expiresAt`.
        Документа заказа в 1С может ещё не быть: заказ в состоянии `submitting`, ядро §22.5.
        `requestedTtlSeconds` = `QR_TTL_MINUTES` × 60. Если срок у банка короче, действует `expiresAt` банка.
        Если банк отдаёт только картинку, вместо `qrPayload` приходит `qrImagePng` (base64, ответ QR-3).
        Возможность интеграции — [НЕ ПОДТВЕРЖДЕНО: Q-014, QR-3].

        **Перевыпуск (ТЗ для 1С §6.14, §7.4).** Перед перевыпуском POS синхронно вызывает
        `/qr/cancel` с `reason=reissue` (одна попытка до 6 с); если отмена вернула `paid`, новый QR не
        запрашивается. Затем — этот метод с **тем же** `externalId`. Запись `pending` с истёкшим
        `СрокДействия` считается `expired`: перед перевыпуском по ней 1С проверяет у банка, что оплаты нет
        (оплата есть — запись `paid`, ответ 409 `POS_E_STATE`). Новый выпуск получает **новый** `reference`;
        прежние референсы платежа 1С сохраняет (способ — на усмотрение 1С): если деньги придут по прежнему QR,
        статус `paid` сообщается с `reference` того QR, по которому они пришли (`QrPaymentStatus.reference`).
        Статус `paid` по этому `externalId` — 409 `POS_E_STATE`, новый QR не создаётся.
      x-onec-requirements: [ONEC-075]
      x-priority: must (при QR_PROVIDER=onec, Q-014)
      x-timeout-ms: 6000
      x-idempotency: по externalId платежа — пока QR действует, повтор → 200 с тем же QR (банк не вызывается); после expired/cancelled (в том числе pending с истёкшим сроком) — 201 с новым reference при том же externalId (перевыпуск); после paid — 409 POS_E_STATE
      x-retry: не outbox, без автоматических повторов — синхронный ответ кассиру; 503 POS_E_QR_UNAVAILABLE, 401/403, таймаут ONEC_SYNC_CHECK_TIMEOUT_MS (6 с) → /api/v1 QR_UNAVAILABLE, платёж остаётся qr_pending, кассир повторяет (тот же externalId) или меняет способ (05 §6.5)
      x-access: роль POS_ИнтеграцияPOS + X-POS-Client-Key; запись POS_ОплатыQR — только код POS_Сервер (ONEC-053); ПДн плательщика не передаются
      x-error-codes: [POS_E_BAD_REQUEST, POS_E_VALIDATION, POS_E_STATE, POS_E_QR_UNAVAILABLE, POS_E_UNAUTHORIZED, POS_E_FORBIDDEN, POS_E_INTERNAL, POS_E_MAINTENANCE]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrCreateRequest"
      responses:
        "200":
          description: QR с этим externalId ещё действует — возвращён тот же QR
          headers:
            X-POS-API-Version:
              $ref: "#/components/headers/XPosApiVersion"
            X-Request-Id:
              $ref: "#/components/headers/XRequestIdEcho"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCreateResponse"
        "201":
          description: QR создан (впервые или перевыпуск после expired/cancelled)
          headers:
            X-POS-API-Version:
              $ref: "#/components/headers/XPosApiVersion"
            X-Request-Id:
              $ref: "#/components/headers/XRequestIdEcho"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCreateResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "422":
          $ref: "#/components/responses/Validation"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

  /pos/v1/payments/{externalId}/status:
    get:
      tags: [qr]
      operationId: getQrPaymentStatus
      summary: Статус оплаты по QR
      description: |
        05 §6.7.2, ONEC-076. Возвращает `status` (`pending | paid | expired | cancelled`), сумму к оплате,
        зачисленную сумму, время оплаты, референс банка, `reference`, `expiresAt` и ссылку на документ
        поступления, если он создан. ПДн плательщика не передаются. Время ответа ≤ 1 с (p95).
        Правила обработки ответа — 05 §6.7.3. Метод только читает `POS_ОплатыQR`: запись `pending` с истёкшим
        `СрокДействия` возвращается со `status = expired` без перезаписи. При `paid` — `reference` того QR,
        по которому пришли деньги (может быть прежним, до перевыпуска). Деньги после истечения или отмены QR —
        всё равно `paid` с фактическими данными (ТЗ для 1С §6.15).
      x-onec-requirements: [ONEC-076]
      x-priority: must (при QR_PROVIDER=onec, Q-014)
