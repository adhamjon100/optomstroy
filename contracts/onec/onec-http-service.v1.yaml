      x-retry: outbox (05 §8.1, SYNC-044) — временные коды → pending с backoff; 422/409 → failed без ретрая; 401/403 → dead + алерт; 404 расширение не возвращает (заказ-основание не найден — 422 POS_E_VALIDATION), 404 платформы → failed без повтора
      x-access: роль POS_ИнтеграцияPOS + X-POS-Client-Key; создание документа — только код POS_Сервер (ONEC-053)
