        Детализация долга по документу (ONEC-047; 05 §5.3 `receivable_documents`). Передаются **только
        проведённые** документы: отдельных полей вида и статуса строки нет, POS вычисляет их сам (ТЗ для 1С §6.12).
        Статус строки в POS: `due` («к оплате») — `dueDate` не позже даты снимка (`snapshotAt`, Бишкек) и
