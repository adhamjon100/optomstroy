  /pos/v1/payments:
    post:
      tags: [payments]
      operationId: createPayment
      summary: Зарегистрировать оплату (ПКО или поступление безнала)
      description: |
        ONEC-043. Создаёт платёжный документ по Q-012: `ПриходныйКассовыйОрдер` для `cash`, документ
        поступления безнала или эквайринга для `qr_bakai`. Основание — заказ или долг клиента.
        `allocations[]` (необязательно) распределяет оплату долга по документам. Без него распределяет 1С
        типовым правилом (FIFO). `post` применяется только при `РазрешитьПроведениеПлатежей = Истина`
        (Q-124), иначе `posted=false`. Если интеграция QR уже создала документ поступления и
        зарегистрировала его с `externalId` платежа — ответ 200 «уже существует» (ONEC-077).
        Если `orderRef = null`, заказ-основание ищется по `orderExternalId` в `POS_ВнешниеИдентификаторыPOS`
        (тип `Заказ`). Заказ-основание не найден — 422 `POS_E_VALIDATION` (текст «Заказ не найден»), а не 404:
        ответа 404 у метода нет. Ошибки `allocations` (сумма больше `amount`, документ другого клиента,
        сумма больше остатка долга) — тоже 422.
        В первой версии POS метод **не вызывает** (ПКО и поступления вводятся в 1С, документ поступления по QR
        создаёт банковская интеграция; Q-012, ТЗ для 1С §1.2 п. 2, §6.13); метод остаётся в контракте и приёмке.
