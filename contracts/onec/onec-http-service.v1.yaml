    ChangesPage:
      type: object
      description: |
        Страница сообщения обмена. Требования, которые POS проверяет (ТЗ для 1С §5.2 п. 6, §6.2):
        при `hasMore=true` `cursor` — обязательно непустая строка; `messageNumber` одинаков на всех страницах
        сообщения. Нарушение — ответ не по контракту: POS откатывает всё сообщение и повторяет его с начала.
        Пустое сообщение — `items=[]`, `hasMore=false`, `cursor=null`; POS его не подтверждает.
      required: [messageNumber, hasMore, cursor, generatedAt, items]
      properties:
        messageNumber:
          type: integer
          format: int64
          minimum: 1
          description: Номер выдаваемого сообщения (`since + 1`); одинаков на всех страницах сообщения
        hasMore:
          type: boolean
          description: "`true`, пока после курсора есть элементы; последняя страница — `false`"
        cursor:
          type: string
          nullable: true
          description: Ключ продолжения для следующей страницы; при `hasMore=true` — непустая строка; `null` на последней странице
          x-pos-required-when: "hasMore = true → cursor непустой"
        generatedAt:
          $ref: "#/components/schemas/DateTime"
        items:
          type: array
          description: Не более `limit` и не более 5000 элементов; может быть пустым (пустое сообщение)
          maxItems: 5000
          items:
            $ref: "#/components/schemas/ChangeItem"
    ChangeItem:
      description: |
