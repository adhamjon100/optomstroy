        - $ref: "#/components/schemas/PartnerChange"
        - $ref: "#/components/schemas/CounterpartyChange"
        - $ref: "#/components/schemas/AgreementChange"
        - $ref: "#/components/schemas/DiscountChange"
        - $ref: "#/components/schemas/ImageFileChange"
        - $ref: "#/components/schemas/BarcodeChange"
        - $ref: "#/components/schemas/PriceSettingChange"
