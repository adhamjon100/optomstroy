openapi: 3.0.3
# RM-B-004. Контракт HTTP-сервиса расширения 1С «OptomstroyPOS» (POS_HTTPСервисPOS, корневой URL `pos`).
# Канон методов — 05_ONEC_INTEGRATION §6.3–§6.5 и §6.7 (ядро R0 v1.9 §24.3, §24.4); изложение для
# специалиста 1С — 18_ONEC_API_REQUEST §3–§5. При расхождении прав 05; решения и расхождения —
# contracts/onec/NOTES.md. Набор путей сверяет scripts/check_onec_paths.py (0 лишних, 0 недостающих).
#
# Расширения (ONEC-071, девять атрибутов контракта на каждый метод):
#   x-onec-requirements — ID требований 05;   x-priority — must | should | could (05 §6.3, §6.6);
#   x-idempotency       — правило защиты от дублей (столбец «Идемпотентность» 05 §6.3);
#   x-retry             — правило повторов backend (05 §6.5, §8.1, SYNC-029, SYNC-044, SYNC-077, SYNC-078);
#   x-access            — ограничения доступа (ONEC-052, ONEC-053, ONEC-080);
#   x-error-codes       — коды `POS_E_*`, которые метод может вернуть (05 §6.3 «Ответы», §6.5);
#   x-status            — proposed: деталь взята из 18 или выведена из словаря 05 §5.3 и ждёт канонизации в 05 §6.4.
#   x-timeout-ms        — таймаут ожидания ответа на стороне POS, мс (ТЗ для 1С §4.9; = OnecExtensionGateway).
#   x-pos-*             — как POS обрабатывает значение (описательные атрибуты; 1С по ним не проверяет вход).
info:
  title: OptomstroyPOS — HTTP-сервис расширения 1С
  version: 1.1.0
  description: |
    Контракт методов `/pos/v1/*`, которые backend «Оптомстрой POS» вызывает у расширения 1С
    «OptomstroyPOS» (фаза 1, `ONEC_MODE=extension`). Реализует специалист 1С заказчика
    по `18_ONEC_API_REQUEST.md` (ядро v1.9 §24.3); владелец содержания методов — 05 §6.

    **Общие правила (05 §6.4, ONEC-058).** Тела — `application/json; charset=utf-8` (кроме `/images`).
    UUID и ссылки 1С (`Ref_Key`) — строки в нижнем регистре. Деньги — строки `^-?\d+\.\d{2}$`,
    количества — строки `^-?\d+\.\d{3}$`. Даты — ISO 8601 со смещением `+06:00`.
    `null` допустим только у необязательных полей. Получатель игнорирует неизвестные поля
    (forward-compatibility), поэтому схемы объектов не запрещают дополнительные свойства.

    **Версия API (ONEC-033).** Версия — в пути (`v1`) и в заголовке ответа `X-POS-API-Version: 1`.
    Добавление полей обратно совместимо. Удаление, переименование и смена смысла — только через `v2`
    при параллельной поддержке `v1` не менее 6 месяцев.

    **Аутентификация (ONEC-032).** Пользователь ИБ `pos_hs` (Basic или JWT — выбор при приёмке,
    чек-лист 05 §2.2 п. 1) **и** заголовок `X-POS-Client-Key` во всех методах. Без ключа — 401
    даже при верном пароле. Секреты backend: `ONEC_HS_USER_FILE`, `ONEC_HS_PASSWORD_FILE`,
    `ONEC_HS_TOKEN_FILE`.

    **Ограничения доступа (ONEC-052, ONEC-053, ONEC-080, ONEC-081).** Роль `POS_ИнтеграцияPOS`
    назначена только `pos_hs`. Прямых прав записи у неё нет: запись выполняет только код `POS_Сервер`
    в привилегированном режиме после проверки ключа и схемы. Доступ — только из LAN магазина
    с адреса backend или из подсети WireGuard. Всегда HTTPS (TLS 1.2+).

    **Формат внешних идентификаторов (ONEC-037, ONEC-040, R0 §22.1).** `externalId` — UUID агрегата POS
    в нижнем регистре: `orders.id`, `payments.id`, `customers.id`, `return_requests.id`.
    Расширение хранит его в регистре `POS_ВнешниеИдентификаторыPOS` (`ВнешнийИд` Строка 36 +
    `ТипОбъекта` ∈ `Заказ | Платеж | Клиент | ЗаявкаНаВозврат`). В реквизит `Комментарий`
    документа его копирует в виде `POS <uuid>`. Номер заказа POS (`publicNumber`) ключом не является.

    **Журнал запросов (ONEC-054, ONEC-088).** Каждый запрос несёт `X-Request-Id` (UUID).
    1С записывает его в `POS_ЖурналЗапросовPOS` и возвращает в заголовке ответа и в `requestId`
    тела ошибки.

    **Таймауты POS (ТЗ для 1С §4.9; атрибут `x-timeout-ms` у каждой операции).** Соединение — 5 с.
    Ожидание ответа:

    | Вызов | Таймаут POS | Целевое время ответа 1С |
    |---|---|---|
    | `POST /check` | 6 с (`ONEC_SYNC_CHECK_TIMEOUT_MS`) | ≤ 3 с для корзины до 100 строк |
    | `POST /orders` | 6 с | в пределах 6 с |
    | `GET /customers?phone=`, `GET /customers/{ref}/receivables` | 6 с | в пределах 6 с |
    | `POST /payments/qr`, `POST /payments/{externalId}/qr/cancel` | 6 с | в пределах 6 с, включая банк |
    | `GET /payments/{externalId}/status` | 6 с | ≤ 1 с (p95) |
    | `GET /external-ids` при ручной привязке заказа | 6 с на все страницы (вызывающий код) | страница — быстро |
    | страница `GET /changes` | 60 с | формирование ≤ 20 с |
    | `GET /images/{ref}` | 120 с | — |
    | прочие (`/health`, `/changes/ack`, `/changes/reregister`, статусы и отмена заказа, `POST /customers`, `POST /payments`, `POST /returns`, статус заявки, `/catalog/{ref}`, `/external-ids`) | 30 с (`ONEC_TIMEOUT_MS`) | — |

    Нет ответа за таймаут — результат неизвестен: запись повторяется позже с тем же `externalId`,
    чтение — при следующем опросе.

    **Повторы POS (ТЗ для 1С §4.7; атрибут `x-retry` у операции — правило конкретного метода).**
    Два уровня, они не суммируются с повторами 1С:

    1. HTTP-клиент: только `GET` и только при временной ошибке (сеть, таймаут, 5xx, `POS_E_LOCKED`,
       `POS_E_MAINTENANCE`) — до 3 попыток с паузами 0,5 и 1 с (`x-get-retry`). `POST` клиент сразу
       не повторяет никогда.
    2. Уровень вызывающей логики:
       - запись из очереди outbox (заказ, оплата, клиент, заявка на возврат, отмена заказа) — тот же
         `externalId` через 1, 2, 5, 15, 60 мин, далее раз в час, не более `OUTBOX_MAX_ATTEMPTS` (20) попыток
         и `OUTBOX_MAX_AGE_HOURS` (24 ч), затем `dead` и тревога администратору;
       - чтение по расписанию (`/changes`, статусы, долги) — задание повторяется ещё дважды через 1 и 2 мин,
         затем следующий плановый запуск;
       - отмена QR после смены способа, аннулирования платежа или отмены заказа — через 1, 2 мин, далее
         каждые 5 мин до срока QR (срок неизвестен — не дольше 1 ч);
       - отмена QR перед перевыпуском — одна синхронная попытка до 6 с, без повторов;
       - создание QR и `/check` — без автоматических повторов;
       - 401/403 — без повторов до исправления учётных данных, тревога; следующее чтение — не раньше 15 мин.

    **Фикстуры** ответов — `contracts/onec/fixtures/*.json` (тестовые данные, поле `_note`);
    `scripts/check_onec_paths.py` проверяет их по схемам этого файла.

    **Статус `x-status: proposed` (B-AR-23).** Схемы и детали с этой пометкой (элементы `/changes`,
    кроме четырёх типов 05 §6.4, тела ответов ack, статусов, отмены, поиска клиента, долга,
    `/external-ids`; с 1.1.0 — поля-предложения ТЗ для 1С §5.6, §5.7, §6.10, §6.11, §6.20) — **предмет
    согласования** в RM-B-014, а не утверждённый канон. Специалист 1С не реализует их как окончательные
    до утверждения; POS читает поля-предложения, если они пришли, и работает без них. Расхождения
    05 ↔ 18 (contracts/onec/NOTES.md §4) закрываются по ONEC-074: сначала 05 §6, затем 18, затем этот
    контракт. Журнал версий — contracts/onec/NOTES.md §6.

    **1.1.0 (2026-10-24).** Контракт приведён к ТЗ для программиста 1С
    (`docs/integration/1C_API_requirements.md`): `customer.ref = null` для «Розничного покупателя»
    (бывшее «исключение из контракта v1», Q-026), необязательный `since` у `/external-ids`, у
    `POST /orders/status` нет ответа 404, таймауты и повторы POS, поля-предложения. Изменения
    аддитивные или ослабляющие (ONEC-033): `v1` сохраняется.
  contact:
    name: Владелец содержания — 05_ONEC_INTEGRATION §6 (роль ONEC)
  license:
    name: Проприетарная лицензия (материалы проекта «Оптомстрой POS»)
  x-canon: 05_ONEC_INTEGRATION.md §6.3 (методы), §6.4 (форматы), §6.5 (ошибки), §6.7 (QR)
  x-api-version-header: "X-POS-API-Version: 1"
  x-connect-timeout-ms: 5000
  x-get-retry:
    description: Повтор идемпотентного GET HTTP-клиентом POS при временной ошибке (ТЗ для 1С §4.7); POST не повторяется
    maxAttempts: 3
    delaysMs: [500, 1000]
servers:
  - url: https://{host1c}/{publication}/hs
    description: Публикация 1С (сегмент `hs` — [ТИПОВО]); доступ только из LAN или туннеля WireGuard (ONEC-080)
    variables:
      host1c:
        default: host-1c
        description: Адрес веб-сервера 1С в LAN или в подсети WireGuard (`ONEC_BASE_URL`)
      publication:
        default: publication
        description: Имя публикации информационной базы (`ONEC_HS_PATH` — путь до `hs`)
security:
  - basicAuth: []
    clientKey: []
  - jwtAuth: []
    clientKey: []
tags:
  - name: service
    description: Доступность и версии (ONEC-051)
  - name: exchange
    description: План обмена «POS» — сообщения изменений, подтверждение, перерегистрация (05 §6.2, ONEC-034…036)
  - name: orders
    description: Заказ клиента — создание, статус, отмена (ONEC-037…042)
  - name: payments
    description: Платёжные документы (ONEC-043)
  - name: qr
    description: QR-оплата через интеграцию 1С с банком, `QR_PROVIDER=onec` (05 §6.7, ONEC-075…078)
  - name: customers
    description: Клиенты — поиск по телефону, создание с дедупликацией, долг (ONEC-044…047)
  - name: returns
    description: Заявки на возврат (ONEC-048, ONEC-067)
  - name: catalog
    description: Проверка корзины, картинки, карточка товара (ONEC-049, ONEC-050, ONEC-057)
  - name: reconcile
    description: Восстановление связей после аварийного восстановления backend (SYNC-063)

paths:
  /pos/v1/health:
    get:
      tags: [service]
      operationId: getHealth
      summary: Проверка доступности, версии и очередь регистраций
      description: |
        Версия API и расширения, платформа, конфигурация и релиз, `registrationBacklog`,
        `lastAckMessageNumber`, `serverTime` (ONEC-051). Без аутентификации — только 401 без сведений
        о системе (версий, имени конфигурации, числа записей). Тело 401 — единый формат ошибки
        `POS_E_UNAUTHORIZED`, если отказ формирует код расширения (нет или неверен `X-POS-Client-Key`);
        если неверный пароль или JWT отклоняет платформа — тела может не быть (ТЗ для 1С §4.6, §6.1).
        Используется `/health/ready` backend, перед каждым циклом обмена и после `POS_E_ACK_OUT_OF_ORDER`.
        POS проверяет, что `apiVersion` — строка, а `lastAckMessageNumber` — число.
        Предупреждения 05 §6.2 п. 3: не подтверждённые сообщения старше 24 ч или более 100 000 записей
        регистрации.
      x-onec-requirements: [ONEC-051, ONEC-033]
      x-priority: must
      x-timeout-ms: 30000
      x-idempotency: чтение; безопасный повтор
      x-retry: pull — SYNC-029; 401/403 — алерт администратору, следующий запрос не раньше чем через 15 мин (05 §6.5)
      x-access: роль POS_ИнтеграцияPOS (пользователь pos_hs) + X-POS-Client-Key; без аутентификации — 401 без сведений о системе (тело — только Error с POS_E_UNAUTHORIZED, либо без тела, если отвечает платформа)
      x-error-codes: [POS_E_UNAUTHORIZED, POS_E_FORBIDDEN, POS_E_INTERNAL, POS_E_MAINTENANCE]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      responses:
        "200":
          description: Расширение доступно
          headers:
            X-POS-API-Version:
              $ref: "#/components/headers/XPosApiVersion"
            X-Request-Id:
              $ref: "#/components/headers/XRequestIdEcho"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

  /pos/v1/changes:
    get:
      tags: [exchange]
      operationId: getChanges
      summary: Страница сообщения обмена `since+1` плана обмена «POS»
      description: |
        05 §6.2 п. 1. Запрос **без** `cursor` начинает (или начинает заново) сообщение `N+1`:
        `ПланыОбмена.ВыбратьИзменения(УзелPOS, N+1)` нумерует **все** непронумерованные регистрации узла.
        Страницы — из таблиц регистрации узла (номер ≤ `N+1`) в устойчивом порядке.
        `cursor` — непрозрачный ключ последнего выданного элемента. `hasMore=true`, пока после курсора
        есть элементы. Объекты передаются в **текущем** состоянии. Удаление — элемент `ObjectDeletion`.
        Набор записей регистра сведений — с ключом набора в `ref`.
        Страница — не более `limit` элементов и 20 с формирования (ONEC-036).
        Повтор до ack выдаёт то же сообщение (ONEC-035). `since` должен равняться `lastAckMessageNumber`
        (`/health`); меньше или больше — 400 `POS_E_BAD_REQUEST` без изменения регистраций (ТЗ для 1С §6.2 п. 3).

        Как POS ведёт цикл (ТЗ для 1С §5.2):
        - **Пустое сообщение.** Нет регистраций — ответ 200 с `messageNumber = since+1`, `items = []`,
          `hasMore = false`, `cursor = null`. Сообщение без элементов на всех страницах POS **не подтверждает**
          (ack не отправляется) и свой номер не сдвигает; следующий цикл снова запрашивает `since`.
        - **Уже применённое сообщение.** Если пришло сообщение с `messageNumber` ≤ номера, уже применённого
          POS, данные повторно не применяются, но ack этого номера отправляется (выравнивание после сбоя ack).
        - **Ответ не по контракту** (`hasMore=true` без непустого `cursor`, разные `messageNumber` на
          страницах одного сообщения) — POS откатывает всё сообщение, ack не отправляет и в следующем цикле
          запрашивает сообщение с начала.
        - **Неизвестный тип** — предупреждение в журнале POS, элемент пропускается; тип из перечня, который
          POS пока не применяет, тоже пропускается, а ack снимает его регистрацию (ТЗ для 1С §5.3 п. 10–11).
      x-onec-requirements: [ONEC-034, ONEC-035, ONEC-036, ONEC-077]
      x-priority: must
      x-timeout-ms: 60000
      x-idempotency: повторная выдача сообщения до ack; backend применяет идемпотентно по ref (SYNC-031)
      x-retry: pull — SYNC-029 (временные коды); 400 — sync_errors без ретрая; таймаут чтения страницы 60 с (SYNC-030)
      x-access: роль POS_ИнтеграцияPOS + X-POS-Client-Key; чтение таблиц изменений — код POS_Сервер в привилегированном режиме (ONEC-053)
      x-error-codes: [POS_E_BAD_REQUEST, POS_E_UNAUTHORIZED, POS_E_FORBIDDEN, POS_E_LOCKED, POS_E_INTERNAL, POS_E_MAINTENANCE]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - name: since
          in: query
          required: true
          description: Последний подтверждённый номер сообщения `N` (`sync_node_state.last_message_number`); ответ — сообщение `N+1`
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          required: false
          description: Элементов на странице; по умолчанию 1000, максимум 5000 — большее значение расширение ограничивает до 5000 (AC-ONEC-036)
          schema:
            type: integer
            minimum: 1
            default: 1000
        - name: cursor
          in: query
          required: false
          description: Непрозрачный ключ продолжения из предыдущей страницы того же сообщения
          schema:
            type: string
      responses:
        "200":
          description: Страница сообщения
          headers:
            X-POS-API-Version:
              $ref: "#/components/headers/XPosApiVersion"
            X-Request-Id:
              $ref: "#/components/headers/XRequestIdEcho"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesPage"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

  /pos/v1/changes/ack:
    post:
      tags: [exchange]
      operationId: ackChanges
      summary: Подтверждение полного применения сообщения
      description: |
        05 §6.2 п. 2, ядро §22.8. Backend отправляет ack только после применения **всех** страниц
        сообщения (последняя — `hasMore=false`). Расширение снимает регистрацию **только по номеру**:
        `ПланыОбмена.УдалитьРегистрациюИзменений(УзелPOS, N+1)`. Снятие по отдельным объектам запрещено.
        Повтор ack уже подтверждённого номера — 200 без действий.
        Номер больше выданного — 409 `POS_E_ACK_OUT_OF_ORDER`.
        POS отправляет ack и для сообщения с номером ≤ уже применённого (данные повторно не применяются),
        но не отправляет ack для пустого сообщения (`items=[]` на всех страницах) — ТЗ для 1С §5.2 п. 4–5.
      x-onec-requirements: [ONEC-035, ONEC-036]
      x-priority: must
      x-timeout-ms: 30000
      x-idempotency: повтор ack того же (или меньшего) номера — 200 без действий
      x-retry: временные коды — повтор с тем же messageNumber (SYNC-029); 409 POS_E_ACK_OUT_OF_ORDER — backend читает /health.lastAckMessageNumber и продолжает с него
      x-access: роль POS_ИнтеграцияPOS + X-POS-Client-Key; снятие регистрации — код POS_Сервер (ONEC-053)
      x-error-codes: [POS_E_BAD_REQUEST, POS_E_ACK_OUT_OF_ORDER, POS_E_UNAUTHORIZED, POS_E_FORBIDDEN, POS_E_LOCKED, POS_E_INTERNAL, POS_E_MAINTENANCE]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangesAckRequest"
      responses:
        "200":
          description: Сообщение подтверждено (или уже было подтверждено)
          headers:
            X-POS-API-Version:
              $ref: "#/components/headers/XPosApiVersion"
            X-Request-Id:
              $ref: "#/components/headers/XRequestIdEcho"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesAckResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

