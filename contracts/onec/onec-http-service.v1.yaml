  /pos/v1/payments/{externalId}/qr/cancel:
    post:
      tags: [qr]
      operationId: cancelQrPayment
      summary: Отменить действующий QR
      description: |
        05 §6.7.2, ONEC-078, SYNC-078. Причины — смена способа оплаты, отмена платежа или заказа,
        перевыпуск. Если интеграция банка отмену не поддерживает (QR-6), QR помечается отменённым только
        в `POS_ОплатыQR`. Поздняя оплата такого QR всё равно отражается статусом `paid`.
        Если деньги уже зачислены — 200 со `status=paid` и данными оплаты.
        Отменяется текущий (последний выданный) QR платежа: поля `reference` в теле нет (отмена конкретного
        QR по референсу — Q-014, вопрос 66 ТЗ для 1С).

        Правила по состоянию записи `POS_ОплатыQR` (ТЗ для 1С §6.16):
        - нет записи — 404 `POS_E_NOT_FOUND`;
        - `paid` — ничего не отменяется, 200 `paid` с данными оплаты;
        - `pending` (в том числе с истёкшим сроком: банк мог ещё не закрыть QR) — отмена в банке, если интеграция
          умеет (QR-6), запись → `cancelled`, 200 `cancelled`;
        - `cancelled` или **`expired`** — 200 `cancelled` без действий (повторная отмена — не ошибка);
          запись `expired` остаётся `expired`.
      x-onec-requirements: [ONEC-078]
      x-priority: must (при QR_PROVIDER=onec, Q-014)
      x-timeout-ms: 6000
      x-idempotency: повтор → 200 с текущим статусом
      x-retry: не операция outbox. Перед перевыпуском (reason=reissue) — одна синхронная попытка до 6 с, без повторов; ошибка не останавливает перевыпуск (прежний reference POS сохраняет в истории и оплату по нему разбирает вручную). После аннулирования, смены способа или отмены заказа (SYNC-078) — фоном, аннулирование в POS не ждёт 1С; при временной ошибке или таймауте повтор через 1 мин, 2 мин, далее каждые 5 мин до expiresAt (срок неизвестен — не дольше 1 ч после аннулирования); 400/404/401/403 — попытки прекращаются
      x-access: роль POS_ИнтеграцияPOS + X-POS-Client-Key; запись POS_ОплатыQR — только код POS_Сервер (ONEC-053)
      x-error-codes: [POS_E_BAD_REQUEST, POS_E_NOT_FOUND, POS_E_QR_UNAVAILABLE, POS_E_UNAUTHORIZED, POS_E_FORBIDDEN, POS_E_INTERNAL, POS_E_MAINTENANCE]
      parameters:
        - $ref: "#/components/parameters/XRequestId"
        - $ref: "#/components/parameters/PaymentExternalId"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QrCancelRequest"
      responses:
        "200":
          description: QR отменён (`cancelled`) либо уже оплачен (`paid` с полями оплаты)
          headers:
            X-POS-API-Version:
              $ref: "#/components/headers/XPosApiVersion"
            X-Request-Id:
              $ref: "#/components/headers/XRequestIdEcho"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QrCancelResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "500":
          $ref: "#/components/responses/Internal"
        "503":
          $ref: "#/components/responses/Unavailable"

