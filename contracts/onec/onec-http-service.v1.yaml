        Имена типов — [ТИПОВО: УТ 11, Q-010]. Поля элемента `Catalog_Номенклатура`,
        `Document_ЗаказКлиента`, `ObjectDeletion` и `QrPaymentStatus` — по примерам 05 §6.4 и §6.7.2.
        Поля остальных типов выведены из словаря 05 §5.3 и карты §5.1 (`x-status: proposed`, NOTES.md §4).
