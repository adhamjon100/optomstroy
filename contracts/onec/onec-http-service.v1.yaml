        Реализация-основание, клиент или товар по ссылке не найдены, нет причины, не прошла проверка
        заполнения — 422 `POS_E_VALIDATION` (например, «Реализация не найдена»). Ответа 404 у метода нет
        (ТЗ для 1С §6.17, А.2). Документ «Возврат товаров от клиента» по заявке желательно вводить на основании
        заявки с комментарием `POS <externalId заявки>` — так POS свяжет его с заявкой
